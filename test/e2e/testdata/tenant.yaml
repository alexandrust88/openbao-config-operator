apiVersion: v1
kind: Namespace
metadata:
  name: e2e-tenant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obco-tenant
  namespace: e2e-tenant
---
apiVersion: core.obco.dev/v1alpha1
kind: BaoServer
metadata:
  name: openbao-e2e
spec:
  address: https://openbao-active.openbao.svc:8200
  caBundle:
    configMapRef:
      name: openbao-ca
      namespace: openbao
      key: ca.crt
  allowedNamespaces:
    matchLabels:
      kubernetes.io/metadata.name: e2e-tenant
  allowedAudiences:
    - openbao
---
apiVersion: core.obco.dev/v1alpha1
kind: BaoConnection
metadata:
  name: openbao
  namespace: e2e-tenant
spec:
  serverRef:
    name: openbao-e2e
  auth:
    kubernetes:
      role: e2e-tenant
      serviceAccountRef:
        name: obco-tenant
      audiences:
        - openbao
