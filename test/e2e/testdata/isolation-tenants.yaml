# The tenants of the isolation test, applied together: tenant-a's resources must get Ready while every tenant-b
# attempt on tenant-a, on the platform connection or outside its policy is refused. Policy names that tenant-b must
# never write anywhere are listed in deniedPolicies in isolation_test.go.
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoConnection
metadata:
  name: tenant-a
  namespace: e2e-tenant-a
spec:
  serverRef:
    name: e2e-isolation
  namespace: tenant-a
  auth:
    kubernetes:
      role: operator
      serviceAccountRef:
        name: obco-a
      audiences:
        - openbao
---
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoConnection
metadata:
  name: a-only
  namespace: e2e-tenant-a
spec:
  serverRef:
    name: e2e-isolation-tenant-a-only
  namespace: tenant-a
  auth:
    kubernetes:
      role: operator
      serviceAccountRef:
        name: obco-a
      audiences:
        - openbao
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: app
  namespace: e2e-tenant-a
spec:
  connectionRef:
    name: tenant-a
  name: app-a
  policy: |
    path "secret/data/app" {
      capabilities = ["read"]
    }
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KVSecret
metadata:
  name: app
  namespace: e2e-tenant-a
spec:
  connectionRef:
    name: tenant-a
  mountPath: secret
  path: app
  kvVersion: 2
  dataFrom:
    - secretRef:
        name: app-a
---
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoConnection
metadata:
  name: tenant-b
  namespace: e2e-tenant-b
spec:
  serverRef:
    name: e2e-isolation
  namespace: tenant-b
  auth:
    kubernetes:
      role: operator
      serviceAccountRef:
        name: obco-b
      audiences:
        - openbao
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: app
  namespace: e2e-tenant-b
spec:
  connectionRef:
    name: tenant-b
  name: app-b
  policy: |
    path "secret/data/app" {
      capabilities = ["read"]
    }
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: escalate
  namespace: e2e-tenant-b
spec:
  connectionRef:
    name: tenant-b
  name: escalate-b
  policy: |
    path "*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: cross-namespace
  namespace: e2e-tenant-b
spec:
  connectionRef:
    name: tenant-b
  namespace: tenant-a
  name: app-b-cross
  policy: |
    path "secret/data/app" {
      capabilities = ["read"]
    }
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: foreign-connection
  namespace: e2e-tenant-b
spec:
  connectionRef:
    name: tenant-a
  name: app-b-foreign
  policy: |
    path "secret/data/app" {
      capabilities = ["read"]
    }
---
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoConnection
metadata:
  name: into-tenant-a
  namespace: e2e-tenant-b
spec:
  serverRef:
    name: e2e-isolation
  namespace: tenant-a
  auth:
    kubernetes:
      role: operator
      serviceAccountRef:
        name: obco-b
      audiences:
        - openbao
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: via-into-tenant-a
  namespace: e2e-tenant-b
spec:
  connectionRef:
    name: into-tenant-a
  name: app-b-login
  policy: |
    path "secret/data/app" {
      capabilities = ["read"]
    }
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: via-platform
  namespace: e2e-tenant-b
spec:
  connectionRef:
    kind: ClusterOpenBaoConnection
    name: e2e-isolation-platform
  namespace: tenant-a
  name: app-b-platform
  policy: |
    path "secret/data/app" {
      capabilities = ["read"]
    }
---
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoConnection
metadata:
  name: a-only
  namespace: e2e-tenant-b
spec:
  serverRef:
    name: e2e-isolation-tenant-a-only
  namespace: tenant-b
  auth:
    kubernetes:
      role: operator
      serviceAccountRef:
        name: obco-b
      audiences:
        - openbao
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: via-a-only
  namespace: e2e-tenant-b
spec:
  connectionRef:
    name: a-only
  name: app-b-server
  policy: |
    path "secret/data/app" {
      capabilities = ["read"]
    }
