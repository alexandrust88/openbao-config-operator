# The example's prod levels need an OpenBao child namespace prod and its oidc auth method needs a mount; here the
# levels stay in the layout's own namespace and the fixture enables the oidc auth method. One organization and one
# role keep a change of groupAliasTemplate (not the default, which the CRD pattern gives no alternative to) to a
# single alias write.
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: AuthMount
metadata:
  name: oidc
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  creationPolicy: CreateOrAdopt
  path: oidc
  type: oidc
---
apiVersion: access.openbaoconfig.io/v1alpha1
kind: AccessLayout
metadata:
  name: platform-teams
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  managementPolicy: Manage
  authMounts:
    - oidc
  organizations:
    - acme
  groupAliasTemplate: "vault-{org}-{role}"
  paths:
    - mount: orgs
      path: "{org}/+/*"
      metadataPath: "{org}/*"
  roles:
    - name: developer
      levels:
        - namespace: ""
          level: write
