# The example mounts team-a/kv, below the path of the OpenBaoNamespace example team-a, so the two collide when
# all examples share one OpenBao namespace; the nomad example needs a registered plugin (see the Plugin exceptions).
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: obco-kv
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  path: team-a-kv
  type: kv
  description: Key-value secrets of team a
  local: false
  sealWrap: false
  externalEntropyAccess: false
  forceNoCache: false
  pluginVersion: ""
  options:
    version: "2"
  defaultLeaseTTL: 768h
  maxLeaseTTL: 768h
  listingVisibility: hidden
  auditNonHMACRequestKeys:
    - path
  auditNonHMACResponseKeys:
    - version
  passthroughRequestHeaders:
    - X-Request-Id
  allowedResponseHeaders:
    - X-Request-Id
