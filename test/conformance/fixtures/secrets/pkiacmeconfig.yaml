# The minimal PKIACMEConfig lives in the default mount pki; enabling ACME needs a cluster path, and the allowed
# issuer and roles must exist in that mount.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: obco-int-2026
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  creationPolicy: CreateOrAdopt
  mountPath: pki
  name: obco-int-2026
  type: root
  key:
    source: internal
    name: obco-int-2026-key
    type: ec
    bits: 256
  certificate:
    commonName: Conformance Root CA
    ttl: 87600h
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIRole
metadata:
  name: obco-acme
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  creationPolicy: CreateOrAdopt
  mountPath: pki
  issuer:
    issuerRef:
      name: obco-int-2026
  allowedDomains:
    - acme.openbao-config.example.com
  allowSubdomains: true
  maxTTL: 2160h
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIConfig
metadata:
  name: obco-pki-int
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  creationPolicy: CreateOrAdopt
  mountPath: pki
  cluster:
    path: https://openbao.openbao-config.example.com/v1/pki
    aiaPath: http://openbao.openbao-config.example.com/v1/pki
