# The minimal PKIRole lives in the default mount pki; its issuer reference must resolve to an issuer of that mount.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: obco-int-2026
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  creationPolicy: CreateOrAdopt
  mountPath: pki
  name: obco-int-2026
  type: root
  key:
    source: internal
    name: obco-int-2026-key
    type: ec
    bits: 256
  certificate:
    commonName: Conformance Root CA
    ttl: 87600h
