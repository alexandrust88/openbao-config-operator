fullFields:
  DatabaseConnection:
    pluginVersion: selects a version of an externally registered database plugin; the built-in plugins of OpenBao are unversioned
    privateKeySecretRef.key: private_key is read only by external key-pair plugins such as Snowflake; no built-in OpenBao database plugin uses it
    privateKeySecretRef.name: private_key is read only by external key-pair plugins such as Snowflake; no built-in OpenBao database plugin uses it
enumValues:
  DatabaseConnection:
    cassandra.tlsMinVersion:
      tls10: checking it needs a Cassandra server that still offers TLS 1.0 (deprecated by RFC 8996); without one OpenBao only maps the name through the tlsutil table that tls12 and tls13 already exercise
      tls11: checking it needs a Cassandra server that still offers TLS 1.1 (deprecated by RFC 8996); without one OpenBao only maps the name through the tlsutil table that tls12 and tls13 already exercise
    influxdb.tlsMinVersion:
      tls10: checking it needs an InfluxDB server that still offers TLS 1.0 (deprecated by RFC 8996); without one OpenBao only maps the name through the tlsutil table that tls12 and tls13 already exercise
      tls11: checking it needs an InfluxDB server that still offers TLS 1.1 (deprecated by RFC 8996); without one OpenBao only maps the name through the tlsutil table that tls12 and tls13 already exercise
  DatabaseStaticRole:
    credentialType:
      rsa_private_key: needs an external key-pair database plugin such as Snowflake; no built-in OpenBao plugin declares rsa_private_key support, and creating a static role rotates at once, which OpenBao refuses with unsupported credential_type
notReady:
  - kind: DatabaseStaticRole
    name: db-app-static-cert
    reason: needs an external database plugin that declares client_certificate support; no built-in OpenBao plugin does, and creating a static role rotates at once, which OpenBao refuses with unsupported credential_type "client_certificate"
