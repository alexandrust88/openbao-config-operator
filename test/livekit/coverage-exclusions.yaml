# These builtins have dedicated live suites because the shared dev-server overlays cannot supply their prerequisites.
# Plugin-only CRDs are classified separately from hack/chart/plugin-crds.txt and docs/kinds.md.
- kind: RaftAutopilot
  reason: The shared dev servers use in-memory storage. The dedicated scenario starts an initialized, unsealed single-node Raft server.
  file: test/integration/sys_raft_test.go
  test: TestIntegrationSysRaft
  scenario: TestIntegrationSysRaft
- kind: RabbitMQConfig
  reason: The shared overlays omit the database component containing RabbitMQ. The dedicated scenario uses verify_connection=false against the real OpenBao mount and checks lease drift and credential-input writes without contacting a RabbitMQ cluster.
  file: test/integration/secrets_credentials_test.go
  test: TestIntegrationSecretsCredentials
  scenario: testRabbitMQConfig
- kind: RabbitMQRole
  reason: The shared overlays omit the database component containing RabbitMQ. The dedicated scenario creates and reconciles a role against the real OpenBao RabbitMQ mount.
  file: test/integration/secrets_credentials_test.go
  test: TestIntegrationSecretsCredentials
  scenario: testRabbitMQRole
