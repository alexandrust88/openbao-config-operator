{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: openbaoservers.core.openbaoconfig.io
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
spec:
  group: core.openbaoconfig.io
  names:
    categories:
      - openbao
    kind: OpenBaoServer
    listKind: OpenBaoServerList
    plural: openbaoservers
    singular: openbaoserver
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .spec.address
          name: Address
          type: string
        - jsonPath: .status.version
          name: Version
          type: string
        - jsonPath: .status.sealed
          name: Sealed
          type: boolean
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "OpenBaoServer is a cluster-scoped OpenBao server that the platform team makes available to connections. It is the only place that sets the address, CA bundle, request rate and timeout the operator uses, and it decides which namespaces and token audiences tenants' OpenBaoConnections may use. It writes nothing to OpenBao; the operator probes sys/health and sys/seal-status and reports the version and seal state.\n\nExample:\n\n\tspec:\n\t  address: https://openbao.openbao.svc:8200\n\t  caBundle:\n\t    configMapRef:\n\t      namespace: openbao\n\t      name: openbao-ca\n\t  allowedNamespaces:\n\t    matchLabels:\n\t      openbao.io/tenant: \"true\"\n\t  allowedAudiences: [\"openbao\"]"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: 'Desired state of the server: address, trust, tenant allow-lists and request limits.'
              properties:
                address:
                  description: 'URL of the OpenBao API, without the /v1 suffix and without credentials (user:password@). Must be https unless allowInsecureHTTP is true. Only an OpenBaoServer sets the address the operator calls; connections reference the server. Example: https://openbao.openbao.svc:8200'
                  maxLength: 2048
                  pattern: ^https?://[^\s/?#@]+(/[^\s?#]*)?$
                  type: string
                  x-kubernetes-validations:
                    - message: address must not end with /v1
                      rule: '!self.matches(''/v1/?$'')'
                allowInsecureHTTP:
                  description: 'Allow an http:// address. Tokens, login JWTs and every secret input then cross the network in clear text: use it only for a local development server. Default: false.'
                  type: boolean
                allowedAudiences:
                  description: 'Token audiences an OpenBaoConnection may request for its ServiceAccount; every audience a connection asks for must be listed. The audiences of the Kubernetes API server are always refused, even when listed, because such a token is a Kubernetes credential. At most 16 entries. Example: ["openbao"]'
                  items:
                    maxLength: 256
                    minLength: 1
                    type: string
                  maxItems: 16
                  type: array
                  x-kubernetes-list-type: set
                allowedNamespaces:
                  description: 'Label selector over Kubernetes namespaces whose OpenBaoConnections may use this server. Unset allows no namespace; an empty selector ({}) allows every namespace. ClusterOpenBaoConnections are not restricted by it. Example: {matchLabels: {openbao.io/tenant: "true"}}'
                  properties:
                    matchExpressions:
                      description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                      items:
                        description: |-
                          A label selector requirement is a selector that contains values, a key, and an operator that
                          relates the key and values.
                        properties:
                          key:
                            description: key is the label key that the selector applies to.
                            type: string
                          operator:
                            description: |-
                              operator represents a key's relationship to a set of values.
                              Valid operators are In, NotIn, Exists and DoesNotExist.
                            type: string
                          values:
                            description: |-
                              values is an array of string values. If the operator is In or NotIn,
                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                              the values array must be empty. This array is replaced during a strategic
                              merge patch.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                          - key
                          - operator
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                        map is equivalent to an element of matchExpressions, whose key field is "key", the
                        operator is "In", and the values array contains only "value". The requirements are ANDed.
                      type: object
                  type: object
                  x-kubernetes-map-type: atomic
                caBundle:
                  description: PEM CA bundle that verifies the server's TLS certificate, from exactly one of a Secret or a ConfigMap. Unset uses the operator's system roots.
                  properties:
                    configMapRef:
                      description: ConfigMap that holds the PEM CA bundle, for example one filled by trust-manager. Mutually exclusive with secretRef.
                      properties:
                        key:
                          default: ca.crt
                          description: 'Key that holds the PEM bundle. Default: ca.crt. Example: ca.crt'
                          type: string
                        name:
                          description: 'Name of the Secret or ConfigMap. Example: openbao-ca'
                          minLength: 1
                          type: string
                        namespace:
                          description: 'Kubernetes namespace of the Secret or ConfigMap. Example: openbao'
                          minLength: 1
                          type: string
                      required:
                        - name
                        - namespace
                      type: object
                    secretRef:
                      description: Secret that holds the PEM CA bundle. Mutually exclusive with configMapRef.
                      properties:
                        key:
                          default: ca.crt
                          description: 'Key that holds the PEM bundle. Default: ca.crt. Example: ca.crt'
                          type: string
                        name:
                          description: 'Name of the Secret or ConfigMap. Example: openbao-ca'
                          minLength: 1
                          type: string
                        namespace:
                          description: 'Kubernetes namespace of the Secret or ConfigMap. Example: openbao'
                          minLength: 1
                          type: string
                      required:
                        - name
                        - namespace
                      type: object
                  type: object
                  x-kubernetes-validations:
                    - message: exactly one of the fields in [secretRef configMapRef] must be set
                      rule: '[has(self.secretRef),has(self.configMapRef)].filter(x,x==true).size() == 1'
                rateLimit:
                  description: Client-side token bucket for the requests the operator sends to this server, shared by every connection to it. Unset means no limit.
                  properties:
                    burst:
                      description: 'Number of requests that may be sent at once above the sustained rate, 1 to 100000. Default: the value of qps. Example: 100'
                      format: int32
                      maximum: 100000
                      minimum: 1
                      type: integer
                    qps:
                      description: 'Sustained number of requests per second, 1 to 100000. Example: 50'
                      format: int32
                      maximum: 100000
                      minimum: 1
                      type: integer
                  required:
                    - qps
                  type: object
                requestTimeout:
                  description: 'Maximum time one request to OpenBao may take, as a duration. Default: 60s. Example: 30s'
                  type: string
              required:
                - address
              type: object
              x-kubernetes-validations:
                - message: address must use https unless allowInsecureHTTP is true
                  rule: self.address.startsWith('https://') || (has(self.allowInsecureHTTP) && self.allowInsecureHTTP)
            status:
              description: Observed state of the server, reported by the operator's periodic probe.
              properties:
                conditions:
                  description: 'Current state as conditions: Ready is True when the server is reachable, initialized and unsealed; otherwise the reason is Unreachable, Sealed, InvalidSpec or ReferenceNotReady (CA bundle missing).'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastProbeTime:
                  description: When a probe last changed this status; probes (about every minute) that find nothing new do not update it.
                  format: date-time
                  type: string
                observedGeneration:
                  description: The metadata.generation of this server that the operator last probed against.
                  format: int64
                  type: integer
                sealed:
                  description: True when the server is sealed or not initialized; no connection to it is Ready then.
                  type: boolean
                standby:
                  description: True when the probed node is a standby rather than the active node.
                  type: boolean
                version:
                  description: 'OpenBao version reported by the server. Example: 2.7.2'
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
