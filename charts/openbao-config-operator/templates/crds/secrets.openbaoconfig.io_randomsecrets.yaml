{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: randomsecrets.secrets.openbaoconfig.io
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
      - openbao
    kind: RandomSecret
    listKind: RandomSecretList
    plural: randomsecrets
    singular: randomsecret
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "RandomSecret generates a value, such as a password, once and stores it under one key of a KV secret (`<mount>/data/<path>` on version 2). Use it for credentials nobody needs to choose; set writeSecretRef to also get the value in a Kubernetes Secret.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  mountPath: secret\n\t  path: apps/billing/db\n\t  key: password\n\t  generator:\n\t    length: 40"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                spec is the desired generated value, stored under one key of a KV secret.

                The value is generated once, when the key is absent, and kept afterwards: an existing value is adopted, and changing the generator settings does not regenerate it. Change refreshNonce to generate a new value. Other keys at the same path are kept.
              properties:
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: OpenBaoConnection
                      description: 'Kind of the connection: OpenBaoConnection (in the same Kubernetes namespace as this resource) or ClusterOpenBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: OpenBaoConnection.'
                      enum:
                        - OpenBaoConnection
                        - ClusterOpenBaoConnection
                      type: string
                    name:
                      description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                generator:
                  description: 'generator describes a value generated by the operator from a cryptographically secure source; used when passwordPolicyName is unset. Read only when a value is generated (on create and when refreshNonce changes): changing or removing it later keeps the stored value and writes nothing. Example: `{length: 40}`.'
                  properties:
                    charset:
                      default: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
                      description: 'charset lists the characters to draw from; duplicates are ignored. 10-256 characters. Defaults to ASCII letters and digits. Example: `abcdef0123456789`.'
                      maxLength: 256
                      minLength: 10
                      type: string
                    length:
                      default: 32
                      description: length is the length of the value in characters. 8-1024. Defaults to 32.
                      format: int32
                      maximum: 1024
                      minimum: 8
                      type: integer
                  type: object
                key:
                  default: password
                  description: 'key is the key of the OpenBao secret that holds the generated value. Defaults to `password`. Immutable. Example: `admin-password`.'
                  maxLength: 253
                  minLength: 1
                  pattern: ^[-._a-zA-Z0-9]+$
                  type: string
                kvVersion:
                  default: 2
                  description: 'kvVersion is the version of the KV engine at mountPath. Allowed: 1, 2. Defaults to 2. Immutable.'
                  enum:
                    - 1
                    - 2
                  format: int32
                  type: integer
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                mountPath:
                  description: 'mountPath is the path of the KV secrets engine mount, without leading or trailing slashes. Immutable. Example: `secret`.'
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                namespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                passwordPolicyName:
                  description: 'passwordPolicyName generates the value with this OpenBao password policy (`sys/policies/password/<name>/generate`), looked up in the resource''s OpenBao namespace. Unset uses generator. Read only when a value is generated (on create and when refreshNonce changes): changing or removing it later keeps the stored value and writes nothing. Example: `strong`.'
                  maxLength: 128
                  minLength: 1
                  type: string
                path:
                  description: 'path is the secret path inside the mount, without the `data/` prefix of KV version 2 (the operator adds it). Immutable. Example: `apps/billing/db`.'
                  maxLength: 512
                  minLength: 1
                  pattern: ^[^/]+(/[^/]+)*$
                  type: string
                refreshNonce:
                  description: 'refreshNonce is an arbitrary string; changing it generates a new value. Example: `2026-11-rotation`.'
                  maxLength: 253
                  type: string
                writeSecretRef:
                  description: 'writeSecretRef also stores the value under key in this Secret, which the resource then owns. The Secret is written when the value is generated or adopted and when writeSecretRef changes. The value is never stored in status. Example: `{name: db-admin}`.'
                  properties:
                    name:
                      description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
              required:
                - connectionRef
                - mountPath
                - path
              type: object
              x-kubernetes-validations:
                - message: mountPath is immutable
                  rule: self.mountPath == oldSelf.mountPath
                - message: path is immutable
                  rule: self.path == oldSelf.path
                - message: kvVersion is immutable
                  rule: has(self.kvVersion) == has(oldSelf.kvVersion) && (!has(self.kvVersion) || self.kvVersion == oldSelf.kvVersion)
                - message: key is immutable
                  rule: has(self.key) == has(oldSelf.key) && (!has(self.key) || self.key == oldSelf.key)
                - message: set at most one of passwordPolicyName and generator
                  rule: '!(has(self.passwordPolicyName) && has(self.generator))'
                - message: namespace is immutable
                  rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__) || self.__namespace__ == oldSelf.__namespace__)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: status is the observed state of the random secret (never the value).
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                namespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                pathCreated:
                  description: pathCreated is true when this resource created the KV secret rather than adding its key to an existing one; only then does a destructive delete also remove the secret's version history.
                  type: boolean
                purgeThroughVersion:
                  description: purgeThroughVersion is the persisted upper version bound for destructive KV v2 cleanup. Newer versions and metadata are retained.
                  format: int64
                  minimum: 1
                  type: integer
                refreshNonce:
                  description: refreshNonce is the spec.refreshNonce the current value was generated or adopted with.
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
