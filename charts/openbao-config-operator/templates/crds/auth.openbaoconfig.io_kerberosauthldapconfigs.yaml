{{- if and .Values.crds.install .Values.pluginKinds.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: kerberosauthldapconfigs.auth.openbaoconfig.io
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: auth.openbaoconfig.io
  names:
    categories:
      - openbao
    kind: KerberosAuthLDAPConfig
    listKind: KerberosAuthLDAPConfigList
    plural: kerberosauthldapconfigs
    singular: kerberosauthldapconfig
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "KerberosAuthLDAPConfig manages the LDAP configuration of an OpenBao Kerberos auth method at auth/<mountPath>/config/ldap. Use it to look up the LDAP groups of Kerberos users, so KerberosAuthGroup mappings apply; one per mount.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  mountPath: kerberos\n\t  url: ldaps://dc1.example.com\n\t  bindDN: cn=openbao,ou=Services,dc=example,dc=org\n\t  bindPassSecretRef: {name: ldap-bind, key: password}\n\t  userDN: ou=People,dc=example,dc=org\n\t  groupDN: ou=Groups,dc=example,dc=org\n\t  deletionPolicy: Orphan"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of the LDAP group lookup of a Kerberos auth method, written to auth/<mountPath>/config/ldap. Token fields set the defaults of tokens issued at login. deletionPolicy must be Orphan.
              properties:
                anonymousGroupSearch:
                  description: 'When true, group searches use an anonymous bind; the bind credentials are still used for the initial connection. Defaults to false. Maps to `anonymous_group_search`. Example: false'
                  type: boolean
                bindDN:
                  description: 'Distinguished name of the service account used to search for users and groups. Unset uses an anonymous bind for searches. Required by bindPassSecretRef. Maps to `binddn`. Example: cn=openbao,ou=Services,dc=example,dc=org'
                  maxLength: 1024
                  type: string
                bindPassSecretRef:
                  description: 'Secret key holding the password of bindDN. Read from this Secret key; the value is never stored in status. OpenBao never returns it, so it is compared only through status.writeOnlyHash and a Secret change forces a write. Maps to `bindpass`. Example: {name: ldap-bind, key: password}'
                  properties:
                    key:
                      description: 'Key in the Secret''s data whose value is used. Example: password'
                      maxLength: 253
                      minLength: 1
                      type: string
                    name:
                      description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - key
                    - name
                  type: object
                caseSensitiveNames:
                  description: 'When true, user and group names are compared case-sensitively when matching OpenBao groups and users. Defaults to false. Maps to `case_sensitive_names`. Example: false'
                  type: boolean
                certificate:
                  description: 'PEM-encoded CA certificate used to verify the LDAP server certificate. Unset uses the system trust store. Maps to `certificate`. Example: "-----BEGIN CERTIFICATE-----\n..."'
                  maxLength: 65536
                  type: string
                clientTLSCert:
                  description: 'PEM-encoded client certificate presented to the LDAP server for mutual TLS. Must be set together with clientTLSKeySecretRef. OpenBao does not return it, so it is compared only through status.writeOnlyHash. Maps to `client_tls_cert`. Example: "-----BEGIN CERTIFICATE-----\n..."'
                  maxLength: 65536
                  type: string
                clientTLSKeySecretRef:
                  description: 'Secret key holding the PEM private key of clientTLSCert. Read from this Secret key; the value is never stored in status. OpenBao never returns it, so it is compared only through status.writeOnlyHash. Must be set together with clientTLSCert. Maps to `client_tls_key`. Example: {name: ldap-client-tls, key: tls.key}'
                  properties:
                    key:
                      description: 'Key in the Secret''s data whose value is used. Example: password'
                      maxLength: 253
                      minLength: 1
                      type: string
                    name:
                      description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - key
                    - name
                  type: object
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: OpenBaoConnection
                      description: 'Kind of the connection: OpenBaoConnection (in the same Kubernetes namespace as this resource) or ClusterOpenBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: OpenBaoConnection.'
                      enum:
                        - OpenBaoConnection
                        - ClusterOpenBaoConnection
                      type: string
                    name:
                      description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                connectionTimeout:
                  description: 'Timeout of a connection attempt before the next URL is tried, as a duration. OpenBao defaults to 30s. Maps to `connection_timeout`. Example: 10s'
                  type: string
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                denyNullBind:
                  description: 'When true, a login with an empty password is rejected instead of being treated as an unauthenticated bind. OpenBao defaults to true. Maps to `deny_null_bind`. Example: true'
                  type: boolean
                dereferenceAliases:
                  description: 'When LDAP aliases are dereferenced on searches: never, finding, searching or always. OpenBao defaults to never. Maps to `dereference_aliases`. Example: always'
                  enum:
                    - never
                    - finding
                    - searching
                    - always
                  type: string
                discoverDN:
                  description: 'When true, an anonymous bind is used to discover the DN of the user before binding. Defaults to false. Maps to `discoverdn`. Example: true'
                  type: boolean
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                groupAttr:
                  description: 'Attribute of the entries returned by groupFilter that holds the group name, such as cn or memberOf. OpenBao defaults to cn. Maps to `groupattr`. Example: cn'
                  maxLength: 256
                  type: string
                groupDN:
                  description: 'Search base for group membership searches. Unset disables group lookups. Maps to `groupdn`. Example: ou=Groups,dc=example,dc=org'
                  maxLength: 1024
                  type: string
                groupFilter:
                  description: 'Go template for the group membership search, with {{ "{{" }}.UserDN}} and {{ "{{" }}.Username}} in scope. OpenBao defaults to (|(memberUid={{ "{{" }}.Username}})(member={{ "{{" }}.UserDN}})(uniqueMember={{ "{{" }}.UserDN}})). Maps to `groupfilter`. Example: (&(objectClass=group)(member:1.2.840.113556.1.4.1941:={{ "{{" }}.UserDN}}))'
                  maxLength: 2048
                  type: string
                insecureTLS:
                  description: 'When true, the LDAP server certificate is not verified. Insecure; do not use in production. Defaults to false. Maps to `insecure_tls`. Example: false'
                  type: boolean
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                maxPageSize:
                  description: 'Page size of paged LDAP searches, to stay under server size limits; 0 or unset disables paging. Maps to `max_page_size`. Example: 1000'
                  format: int32
                  minimum: 0
                  type: integer
                mountPath:
                  default: kerberos
                  description: 'Path of the Kerberos auth method, without the auth/ prefix. Defaults to kerberos. Immutable. Example: kerberos'
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                namespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                policyRefs:
                  description: 'Policy resources in this Kubernetes namespace whose OpenBao policy names are added to tokenPolicies. The role waits until each Policy is Ready; each Policy must use the same connectionRef and namespace as the role. Example: [{name: app-read}]'
                  items:
                    description: Reference by name to an object in the same Kubernetes namespace as this resource.
                    properties:
                      name:
                        description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                      - name
                    type: object
                  maxItems: 32
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                requestTimeout:
                  description: 'Timeout of a request to the LDAP server, as a duration. OpenBao defaults to 90s. Maps to `request_timeout`. Example: 30s'
                  type: string
                startTLS:
                  description: 'When true, a STARTTLS command is issued after connecting to an ldap:// URL. Defaults to false. Maps to `starttls`. Example: true'
                  type: boolean
                tlsMaxVersion:
                  description: 'Maximum TLS version: tls10, tls11, tls12 or tls13. OpenBao defaults to tls12. Maps to `tls_max_version`. Example: tls13'
                  enum:
                    - tls10
                    - tls11
                    - tls12
                    - tls13
                  maxLength: 5
                  type: string
                tlsMinVersion:
                  description: 'Minimum TLS version: tls10, tls11, tls12 or tls13. OpenBao defaults both versions to tls12, so tls13 also needs tlsMaxVersion; must not exceed tlsMaxVersion. Maps to `tls_min_version`. Example: tls12'
                  enum:
                    - tls10
                    - tls11
                    - tls12
                    - tls13
                  maxLength: 5
                  type: string
                tokenBoundCIDRs:
                  description: 'Client CIDR blocks or IP addresses allowed to use issued tokens. Unset allows any address. Maps to `token_bound_cidrs`. Example: [10.0.0.0/8, 192.168.1.10]'
                  items:
                    maxLength: 64
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - message: tokenBoundCIDRs entries must be CIDR blocks or IP addresses
                      rule: self.all(c, isCIDR(c) || isIP(c))
                tokenExplicitMaxTTL:
                  description: 'Hard cap on the lifetime of issued tokens that renewals cannot extend, as a duration. Unset or 0 means no explicit cap. Maps to `token_explicit_max_ttl`. Example: 24h'
                  type: string
                tokenMaxTTL:
                  description: 'Maximum lifetime of issued tokens including renewals, as a duration. Unset or 0 uses the mount or system max TTL. Maps to `token_max_ttl`. Example: 8h'
                  type: string
                tokenNoDefaultPolicy:
                  description: 'When true, the default policy is not attached to issued tokens; only the listed policies apply. Defaults to false. Maps to `token_no_default_policy`. Example: true'
                  type: boolean
                tokenNumUses:
                  description: 'Maximum number of requests an issued token may make; 0 or unset means unlimited. Maps to `token_num_uses`. Example: 10'
                  format: int32
                  minimum: 0
                  type: integer
                tokenPeriod:
                  description: 'Makes issued tokens periodic: they never expire as long as they are renewed within this duration, and each renewal resets the TTL to it. Unset or 0 means not periodic. Maps to `token_period`. Example: 1h'
                  type: string
                tokenPolicies:
                  description: 'OpenBao policy names attached to issued tokens, in addition to the default policy and the policies from policyRefs. Maps to `token_policies`. Example: [app-read, app-write]'
                  items:
                    maxLength: 128
                    minLength: 1
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: set
                tokenStrictlyBindIP:
                  description: 'When true, issued tokens can only be used from the IP address of the client that logged in. Built-in auth methods only: an external plugin built on an older OpenBao SDK ignores it and never returns it. Defaults to false. Maps to `token_strictly_bind_ip`. Example: true'
                  type: boolean
                tokenTTL:
                  description: 'Initial lifetime of issued tokens, as a duration. Unset or 0 uses the mount or system default TTL; must not exceed tokenMaxTTL. Maps to `token_ttl`. Example: 1h'
                  type: string
                tokenType:
                  description: 'Type of token to issue. One of default (the mount''s default, normally service), service (renewable, can create child tokens) or batch (lightweight, not renewable). Maps to `token_type`. Example: service'
                  enum:
                    - default
                    - service
                    - batch
                  type: string
                upnDomain:
                  description: 'Active Directory user principal name domain: users bind as <username>@<upnDomain>. Maps to `upndomain`. Example: example.org'
                  maxLength: 256
                  type: string
                url:
                  description: 'URL of the LDAP server. Several URLs separated by commas are tried in order. OpenBao stores it in lower case. Required. Maps to `url`. Example: ldaps://ldap1.example.com,ldaps://ldap2.example.com'
                  maxLength: 2048
                  minLength: 1
                  type: string
                useTokenGroups:
                  description: 'When true, group membership is resolved through the Active Directory tokenGroups attribute of the user, which includes nested groups. Defaults to false. Maps to `use_token_groups`. Example: true'
                  type: boolean
                userAttr:
                  description: 'Attribute of a user entry that holds the login name, such as cn, uid or sAMAccountName. OpenBao defaults to cn and stores it in lower case. Maps to `userattr`. Example: samaccountname'
                  maxLength: 256
                  type: string
                userDN:
                  description: 'Search base for user entries. Maps to `userdn`. Example: ou=People,dc=example,dc=org'
                  maxLength: 1024
                  type: string
                userFilter:
                  description: 'Go template for the user search filter, with {{ "{{" }}.UserAttr}} and {{ "{{" }}.Username}} in scope. OpenBao defaults to ({{ "{{" }}.UserAttr}}={{ "{{" }}.Username}}). Maps to `userfilter`. Example: (&(objectClass=person)({{ "{{" }}.UserAttr}}={{ "{{" }}.Username}}))'
                  maxLength: 2048
                  type: string
                usernameAsAlias:
                  description: 'When true, the login user name, not the user DN, becomes the entity alias name. Defaults to false. Maps to `username_as_alias`. Example: true'
                  type: boolean
              required:
                - connectionRef
                - url
              type: object
              x-kubernetes-validations:
                - message: mountPath is immutable
                  rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath) || self.mountPath == oldSelf.mountPath)
                - message: 'deletionPolicy must be Orphan: the config endpoint cannot be deleted'
                  rule: '!has(self.deletionPolicy) || self.deletionPolicy == ''Orphan'''
                - message: tokenTTL must not exceed tokenMaxTTL
                  rule: '!has(self.tokenTTL) || !has(self.tokenMaxTTL) || duration(self.tokenTTL) <= duration(self.tokenMaxTTL)'
                - message: set clientTLSCert and clientTLSKeySecretRef together
                  rule: has(self.clientTLSCert) == has(self.clientTLSKeySecretRef)
                - message: bindPassSecretRef requires bindDN
                  rule: '!has(self.bindPassSecretRef) || has(self.bindDN)'
                - message: tlsMinVersion must not exceed tlsMaxVersion
                  rule: '!has(self.tlsMinVersion) || !has(self.tlsMaxVersion) || self.tlsMinVersion <= self.tlsMaxVersion'
                - message: namespace is immutable
                  rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__) || self.__namespace__ == oldSelf.__namespace__)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: Observed state of the LDAP configuration, written by the operator.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                namespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
