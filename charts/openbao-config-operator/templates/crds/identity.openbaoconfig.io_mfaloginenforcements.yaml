{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: mfaloginenforcements.identity.openbaoconfig.io
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: identity.openbaoconfig.io
  names:
    categories:
      - openbao
    kind: MFALoginEnforcement
    listKind: MFALoginEnforcementList
    plural: mfaloginenforcements
    singular: mfaloginenforcement
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "MFALoginEnforcement requires login MFA at `identity/mfa/login-enforcement/<name>` for the selected auth mounts, auth method types, entities or groups. Use it with one or more MFAMethod objects to force a second factor on sensitive logins.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  mfaMethods:\n\t    - methodRef: {name: totp-main}\n\t  authMounts:\n\t    - mountPath: userpass"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: 'spec is the desired login MFA enforcement at `identity/mfa/login-enforcement/<name>`: logins through the selected auth mounts or by the selected identities must pass the listed MFA methods. Target lists are written as a whole; targets removed from the spec are removed in OpenBao. Set at least one of authMounts, authMethodTypes, entities and groups.'
              properties:
                authMethodTypes:
                  description: 'authMethodTypes are auth method types whose logins require MFA (`auth_method_types`). At least one mount of each type must exist. Up to 32. Example: `[userpass, oidc]`.'
                  items:
                    maxLength: 64
                    minLength: 1
                    type: string
                  maxItems: 32
                  type: array
                  x-kubernetes-list-type: set
                authMounts:
                  description: 'authMounts are the auth mounts whose logins require MFA (`auth_method_accessors`). Up to 64. Example: `[{mountPath: userpass}]`.'
                  items:
                    description: Selects auth mounts by exactly one of an accessor, a mount path, an AuthMount object or a label selector over AuthMount objects.
                    properties:
                      mountAccessor:
                        description: 'mountAccessor is the accessor of an auth mount. Example: `auth_userpass_1a2b3c4d`.'
                        maxLength: 128
                        type: string
                      mountPath:
                        description: 'mountPath is the path of an auth mount without the `auth/` prefix, resolved to its accessor through the connection. Example: `userpass`.'
                        maxLength: 256
                        type: string
                      mountRef:
                        description: 'mountRef names an AuthMount in the same namespace; it must be Ready. Example: `{name: userpass}`.'
                        properties:
                          name:
                            description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      mountSelector:
                        description: mountSelector selects every AuthMount in the same namespace that carries these labels.
                        properties:
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: 'Labels an object must carry, all of them, to be selected. Example: {team: payments}'
                            maxProperties: 16
                            minProperties: 1
                            type: object
                            x-kubernetes-validations:
                              - message: label keys must be at most 317 and values at most 63 characters
                                rule: self.all(k, size(k) <= 317 && size(self[k]) <= 63)
                        required:
                          - matchLabels
                        type: object
                    type: object
                    x-kubernetes-validations:
                      - message: set exactly one of mountAccessor, mountPath, mountRef and mountSelector
                        rule: '[has(self.mountAccessor), has(self.mountPath), has(self.mountRef), has(self.mountSelector)].filter(x, x).size() == 1'
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: atomic
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: OpenBaoConnection
                      description: 'Kind of the connection: OpenBaoConnection (in the same Kubernetes namespace as this resource) or ClusterOpenBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: OpenBaoConnection.'
                      enum:
                        - OpenBaoConnection
                        - ClusterOpenBaoConnection
                      type: string
                    name:
                      description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                entities:
                  description: 'entities are the entities whose logins require MFA (`identity_entity_ids`). Up to 256. Example: `[{entityRef: {name: alice}}]`.'
                  items:
                    description: Selects OpenBao entities by exactly one of an ID, an OpenBao name, an Entity object or a label selector over Entity objects.
                    properties:
                      entityID:
                        description: 'entityID is the OpenBao ID of an entity. Example: `0b1c6a2e-5d1f-4a7e-9b2e-3c4d5e6f7a8b`.'
                        maxLength: 128
                        type: string
                      entityName:
                        description: 'entityName is the OpenBao name of an entity, resolved to its ID through the connection. Example: `alice`.'
                        maxLength: 128
                        type: string
                      entityRef:
                        description: 'entityRef names an Entity in the same namespace; it must be Ready. Example: `{name: alice}`.'
                        properties:
                          name:
                            description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      entitySelector:
                        description: entitySelector selects every Entity in the same namespace that carries these labels.
                        properties:
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: 'Labels an object must carry, all of them, to be selected. Example: {team: payments}'
                            maxProperties: 16
                            minProperties: 1
                            type: object
                            x-kubernetes-validations:
                              - message: label keys must be at most 317 and values at most 63 characters
                                rule: self.all(k, size(k) <= 317 && size(self[k]) <= 63)
                        required:
                          - matchLabels
                        type: object
                    type: object
                    x-kubernetes-validations:
                      - message: set exactly one of entityID, entityName, entityRef and entitySelector
                        rule: '[has(self.entityID), has(self.entityName), has(self.entityRef), has(self.entitySelector)].filter(x, x).size() == 1'
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: atomic
                groups:
                  description: 'groups are identity groups whose members'' logins require MFA (`identity_group_ids`). Up to 256. Example: `[{groupName: admins}]`.'
                  items:
                    description: Selects OpenBao identity groups by exactly one of an ID, an OpenBao name, a Group object or a label selector over Group objects.
                    properties:
                      groupID:
                        description: 'groupID is the OpenBao ID of a group. Example: `5f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f`.'
                        maxLength: 128
                        type: string
                      groupName:
                        description: 'groupName is the OpenBao name of a group, resolved to its ID through the connection. Example: `billing-admins`.'
                        maxLength: 128
                        type: string
                      groupRef:
                        description: 'groupRef names a Group in the same namespace; it must be Ready. Example: `{name: billing-admins}`.'
                        properties:
                          name:
                            description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      groupSelector:
                        description: groupSelector selects every Group in the same namespace that carries these labels.
                        properties:
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: 'Labels an object must carry, all of them, to be selected. Example: {team: payments}'
                            maxProperties: 16
                            minProperties: 1
                            type: object
                            x-kubernetes-validations:
                              - message: label keys must be at most 317 and values at most 63 characters
                                rule: self.all(k, size(k) <= 317 && size(self[k]) <= 63)
                        required:
                          - matchLabels
                        type: object
                    type: object
                    x-kubernetes-validations:
                      - message: set exactly one of groupID, groupName, groupRef and groupSelector
                        rule: '[has(self.groupID), has(self.groupName), has(self.groupRef), has(self.groupSelector)].filter(x, x).size() == 1'
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: atomic
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                mfaMethods:
                  description: 'mfaMethods are the MFA methods a login must pass (`mfa_method_ids`). 1-32 entries. Example: `[{methodRef: {name: totp-main}}]`.'
                  items:
                    description: Selects login MFA methods by exactly one of a method ID, an OpenBao method name, an MFAMethod object or a label selector over MFAMethod objects.
                    properties:
                      methodID:
                        description: 'methodID is the OpenBao ID of an MFA method. Example: `a1b2c3d4-e5f6-7a8b-9c0d-e1f2a3b4c5d6`.'
                        maxLength: 64
                        type: string
                      methodName:
                        description: 'methodName is the OpenBao name of an MFA method in the same OpenBao namespace, resolved to its ID through the connection. Example: `totp-main`.'
                        maxLength: 128
                        type: string
                      methodRef:
                        description: 'methodRef names an MFAMethod in the same namespace; it must be Ready. Example: `{name: totp-main}`.'
                        properties:
                          name:
                            description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      methodSelector:
                        description: methodSelector selects every MFAMethod in the same namespace that carries these labels.
                        properties:
                          matchLabels:
                            additionalProperties:
                              type: string
                            description: 'Labels an object must carry, all of them, to be selected. Example: {team: payments}'
                            maxProperties: 16
                            minProperties: 1
                            type: object
                            x-kubernetes-validations:
                              - message: label keys must be at most 317 and values at most 63 characters
                                rule: self.all(k, size(k) <= 317 && size(self[k]) <= 63)
                        required:
                          - matchLabels
                        type: object
                    type: object
                    x-kubernetes-validations:
                      - message: set exactly one of methodID, methodName, methodRef and methodSelector
                        rule: '[has(self.methodID), has(self.methodName), has(self.methodRef), has(self.methodSelector)].filter(x, x).size() == 1'
                  maxItems: 32
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: atomic
                name:
                  description: 'name is the enforcement name in OpenBao. Defaults to metadata.name. Letters, digits, `_`, `.`, `@` and `-`. Immutable. Example: `require-totp`.'
                  maxLength: 128
                  minLength: 1
                  pattern: ^\w([\w.@-]*\w)?$
                  type: string
                namespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
              required:
                - connectionRef
                - mfaMethods
              type: object
              x-kubernetes-validations:
                - message: name is immutable
                  rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name == oldSelf.name)
                - message: set at least one of authMounts, authMethodTypes, entities and groups
                  rule: has(self.authMounts) || has(self.authMethodTypes) || has(self.entities) || has(self.groups)
                - message: namespace is immutable
                  rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__) || self.__namespace__ == oldSelf.__namespace__)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: status is the observed state of the enforcement; `id` holds the OpenBao enforcement ID.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                namespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
