{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: aclpolicies.sys.obco.dev
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: sys.obco.dev
  names:
    categories:
      - obco
      - obco-sys
    kind: ACLPolicy
    listKind: ACLPolicyList
    plural: aclpolicies
    shortNames:
      - baopol
    singular: aclpolicy
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "ACLPolicy manages an OpenBao ACL policy at sys/policies/acl/<name>, which grants capabilities on paths to the tokens it is attached to. The root and response-wrapping policies cannot be managed, and the default policy only with deletionPolicy Orphan. deletionPolicy defaults to Orphan; Delete removes the policy.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  name: app-read\n\t  policy: |\n\t    path \"secret/data/app/*\" {\n\t      capabilities = [\"read\"]\n\t    }"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of the OpenBao ACL policy.
              properties:
                accessorRefs:
                  additionalProperties:
                    description: The auth mount whose accessor replaces one placeholder. Set exactly one field.
                    properties:
                      authMountRef:
                        description: 'AuthMount in this namespace; its accessor is taken from the AuthMount status. Example: {name: kubernetes}'
                        properties:
                          name:
                            description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                          - name
                        type: object
                      mountPath:
                        description: 'Path of the auth mount in the policy''s OpenBao namespace, without the auth/ prefix; its accessor is read from sys/auth. Example: kubernetes'
                        maxLength: 256
                        pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                        type: string
                    type: object
                    x-kubernetes-validations:
                      - message: exactly one of the fields in [authMountRef mountPath] must be set
                        rule: '[has(self.authMountRef),has(self.mountPath)].filter(x,x==true).size() == 1'
                  description: 'Auth mounts whose accessors the policy uses, by placeholder name: `${accessor:<name>}` in policy becomes the accessor of the mount. The policy is rewritten when the mount is recreated with a new accessor, and waits while a mount is missing. At most 16 entries; names are 1-63 characters of [a-z0-9_-]. Example: {k8s: {authMountRef: {name: kubernetes}}}'
                  maxProperties: 16
                  type: object
                  x-kubernetes-validations:
                    - message: accessorRefs names are 1-63 characters of [a-z0-9_-]
                      rule: self.all(k, k.matches('^[a-z0-9_-]{1,63}$'))
                allowSlashesInIdentityTemplates:
                  description: 'Whether identity templates in path names may expand to values that contain a slash, which is blocked by default because it adds path segments. Maps to `allow_slashes_in_identity_templates`. Default: false. Example: false'
                  type: boolean
                allowWildcardsInIdentityTemplates:
                  description: 'Whether identity templates in path names may expand to values that contain the glob characters * and +, which would otherwise make the path match more than intended. Maps to `allow_wildcards_in_identity_templates`. Default: false. Example: false'
                  type: boolean
                casRequired:
                  description: 'Whether every change of the policy must pass the current version as check-and-set value; the operator sends it on each write. Maps to `cas_required`. Default: false. Example: true'
                  type: boolean
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: BaoConnection
                      description: 'Kind of the connection: BaoConnection (in the same Kubernetes namespace as this resource) or ClusterBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: BaoConnection.'
                      enum:
                        - BaoConnection
                        - ClusterBaoConnection
                      type: string
                    name:
                      description: 'Name of the BaoConnection or ClusterBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation obco.dev/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                name:
                  description: 'Name of the policy, the <name> in sys/policies/acl/<name>. Default: metadata.name. OpenBao lowercases and path-cleans policy names, so the name must be lowercase, without whitespace, and without a leading or trailing slash or an empty, "." or ".." segment. root and response-wrapping cannot be managed. Immutable. Example: app-read'
                  maxLength: 256
                  minLength: 1
                  pattern: ^([^/.\s\p{Lu}][^/\s\p{Lu}]*|\.[^/.\s\p{Lu}][^/\s\p{Lu}]*|\.\.[^/\s\p{Lu}]+)(/([^/.\s\p{Lu}][^/\s\p{Lu}]*|\.[^/.\s\p{Lu}][^/\s\p{Lu}]*|\.\.[^/\s\p{Lu}]+))*$
                  type: string
                openbaoNamespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                policy:
                  description: 'ACL policy document in HCL or JSON. Maps to `policy`. `${accessor:<name>}` is replaced by the accessor of the auth mount that accessorRefs names; OpenBao `{{ "{{" }}identity...}}` templates are sent unchanged. Example: path "secret/data/app/*" { capabilities = ["read"] }'
                  minLength: 1
                  type: string
              required:
                - connectionRef
                - policy
              type: object
              x-kubernetes-validations:
                - message: name is immutable
                  rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name == oldSelf.name)
                - message: openbaoNamespace is immutable
                  rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) && (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: 'Observed state reported by the operator: conditions, OpenBao path and ownership.'
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                openbaoNamespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
          x-kubernetes-validations:
            - message: the root and response-wrapping policies cannot be changed
              rule: '!((has(self.spec.name) ? self.spec.name : self.metadata.name) in [''root'', ''response-wrapping''])'
            - message: the default policy cannot be deleted; set deletionPolicy to Orphan
              rule: '(has(self.spec.name) ? self.spec.name : self.metadata.name) != ''default'' || (has(self.spec.deletionPolicy) && self.spec.deletionPolicy == ''Orphan'')'
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
