{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: sshroles.secrets.openbaoconfig.io
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
      - openbao
    kind: SSHRole
    listKind: SSHRoleList
    plural: sshroles
    singular: sshrole
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.keyType
          name: Key Type
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "SSHRole manages a role of an SSH secrets engine at `<mount>/roles/<name>`: a ca role signs SSH user or host certificates with the SSHCA, an otp role issues one-time SSH passwords. Use one role per access pattern.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  mountPath: ssh-client-signer\n\t  name: ops\n\t  keyType: ca\n\t  allowUserCertificates: true\n\t  allowedUsers: [ubuntu]\n\t  defaultExtensions: {permit-pty: \"\"}"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec is the desired role of an SSH secrets engine at `<mountPath>/roles/<name>`. A ca role signs SSH certificates; an otp role issues one-time passwords for hosts that run the OpenBao SSH helper. Certificate fields apply only to ca roles; cidrList, excludeCIDRList and port only to otp roles.
              properties:
                algorithmSigner:
                  description: 'algorithmSigner is the signature algorithm for RSA CA keys (`algorithm_signer`). Allowed: default, ssh-rsa, rsa-sha2-256, rsa-sha2-512. Defaults to default.'
                  enum:
                    - default
                    - ssh-rsa
                    - rsa-sha2-256
                    - rsa-sha2-512
                  type: string
                allowBareDomains:
                  description: allowBareDomains allows host certificates for the domains in allowedDomains themselves (`allow_bare_domains`). Defaults to false.
                  type: boolean
                allowCommasInIdentityTemplates:
                  description: allowCommasInIdentityTemplates allows commas in values substituted into identity templates. Defaults to false.
                  type: boolean
                allowEmptyPrincipals:
                  description: allowEmptyPrincipals allows certificates without valid principals (`allow_empty_principals`); leave it disabled. Defaults to false.
                  type: boolean
                allowHostCertificates:
                  description: allowHostCertificates allows signing host certificates (`allow_host_certificates`). Defaults to false.
                  type: boolean
                allowSubdomains:
                  description: allowSubdomains allows host certificates for subdomains of allowedDomains (`allow_subdomains`). Defaults to false.
                  type: boolean
                allowUserCertificates:
                  description: allowUserCertificates allows signing user certificates (`allow_user_certificates`). A ca role needs this or allowHostCertificates. Defaults to false.
                  type: boolean
                allowUserKeyIDs:
                  description: allowUserKeyIDs lets the request choose the key ID of the certificate (`allow_user_key_ids`). Defaults to false.
                  type: boolean
                allowWildcardsInIdentityTemplates:
                  description: allowWildcardsInIdentityTemplates allows wildcards in values substituted into identity templates. Defaults to false.
                  type: boolean
                allowedCriticalOptions:
                  description: 'allowedCriticalOptions are the critical options a certificate request may set (`allowed_critical_options`); empty allows any. Up to 64. Example: `[force-command]`.'
                  items:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[^,]+$
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: atomic
                allowedDomains:
                  description: 'allowedDomains are the domains host certificates may be signed for (`allowed_domains`). Up to 256. Example: `[example.com]`.'
                  items:
                    maxLength: 256
                    minLength: 1
                    pattern: ^[^,]+$
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: atomic
                allowedDomainsTemplate:
                  description: allowedDomainsTemplate allows identity templates in allowedDomains (`allowed_domains_template`). Defaults to false.
                  type: boolean
                allowedExtensions:
                  description: 'allowedExtensions are the extensions a certificate request may set (`allowed_extensions`); `*` allows any, empty allows none. Up to 64. Example: `[permit-pty, permit-port-forwarding]`.'
                  items:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[^,]+$
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: atomic
                allowedUserKeyLengths:
                  additionalProperties:
                    items:
                      format: int32
                      type: integer
                    type: array
                  description: 'allowedUserKeyLengths maps a key type (rsa, ec, ed25519 or an OpenSSH type) to the allowed key lengths (`allowed_user_key_lengths`). Up to 16 types. Example: `{rsa: [3072, 4096]}`.'
                  maxProperties: 16
                  type: object
                allowedUsers:
                  description: 'allowedUsers are the users a credential may be issued for (`allowed_users`); `*` allows any. For ca roles an empty list allows none. Up to 256. Example: `[ubuntu, ops]`.'
                  items:
                    maxLength: 256
                    minLength: 1
                    pattern: ^[^,]+$
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: atomic
                allowedUsersTemplate:
                  description: allowedUsersTemplate allows identity templates in allowedUsers (`allowed_users_template`). Defaults to false.
                  type: boolean
                cidrList:
                  description: 'cidrList are the CIDR blocks of the hosts an otp role applies to (`cidr_list`). Up to 256. Example: `[10.0.0.0/16]`.'
                  items:
                    maxLength: 64
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: atomic
                  x-kubernetes-validations:
                    - message: cidrList entries must be CIDR blocks
                      rule: self.all(c, isCIDR(c))
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: OpenBaoConnection
                      description: 'Kind of the connection: OpenBaoConnection (in the same Kubernetes namespace as this resource) or ClusterOpenBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: OpenBaoConnection.'
                      enum:
                        - OpenBaoConnection
                        - ClusterOpenBaoConnection
                      type: string
                    name:
                      description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                defaultCriticalOptions:
                  additionalProperties:
                    type: string
                  description: 'defaultCriticalOptions are added to certificates whose request sets none (`default_critical_options`). Up to 64. Example: `{force-command: /usr/bin/uptime}`.'
                  maxProperties: 64
                  type: object
                defaultExtensions:
                  additionalProperties:
                    type: string
                  description: 'defaultExtensions are added to certificates whose request sets none (`default_extensions`). Up to 64. Example: `{permit-pty: ""}`.'
                  maxProperties: 64
                  type: object
                defaultExtensionsTemplate:
                  description: defaultExtensionsTemplate allows identity templates in defaultExtensions values (`default_extensions_template`). Defaults to false.
                  type: boolean
                defaultUser:
                  description: 'defaultUser is the user a credential is issued for when the request names none (`default_user`). Required for otp roles. Example: `ubuntu`.'
                  maxLength: 256
                  type: string
                defaultUserTemplate:
                  description: defaultUserTemplate allows identity templates in defaultUser (`default_user_template`). Defaults to false.
                  type: boolean
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data holders such as mounts, namespaces and KV data are removed only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                excludeCIDRList:
                  description: 'excludeCIDRList are CIDR blocks excluded from cidrList (`exclude_cidr_list`). Up to 256. Example: `[10.0.5.0/24]`.'
                  items:
                    maxLength: 64
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: atomic
                  x-kubernetes-validations:
                    - message: excludeCIDRList entries must be CIDR blocks
                      rule: self.all(c, isCIDR(c))
                issuerRef:
                  description: 'issuerRef is the name or ID of the issuer that signs for this role (`issuer_ref`). Defaults to `default`. Example: `default`.'
                  maxLength: 128
                  type: string
                keyIDFormat:
                  description: 'keyIDFormat is the key ID format (`key_id_format`), with `{{ "{{" }}token_display_name}}`, `{{ "{{" }}role_name}}` and `{{ "{{" }}public_key_hash}}`. Example: `vault-{{ "{{" }}role_name}}-{{ "{{" }}token_display_name}}`.'
                  maxLength: 512
                  type: string
                keyType:
                  description: keyType is `ca` for certificate signing or `otp` for one-time passwords (`key_type`). Required.
                  enum:
                    - ca
                    - otp
                  type: string
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                maxTTL:
                  description: 'maxTTL is the maximum lifetime of signed certificates (`max_ttl`), a duration. Defaults to the mount''s max lease TTL. Example: `24h`.'
                  pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                  type: string
                mountPath:
                  default: ssh
                  description: 'mountPath is the path of the SSH secrets engine mount. Defaults to `ssh`. Immutable. Example: `ssh-client-signer`.'
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                name:
                  description: 'name is the role name in OpenBao. Defaults to metadata.name. Immutable. Example: `ops`.'
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9_.@-]+$
                  type: string
                namespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                notBeforeDuration:
                  description: notBeforeDuration backdates certificates by this duration (`not_before_duration`). Defaults to `30s`.
                  pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                  type: string
                port:
                  description: port is the SSH port returned to otp clients (`port`). 1-65535. Defaults to 22.
                  format: int32
                  maximum: 65535
                  minimum: 1
                  type: integer
                ttl:
                  description: 'ttl is the default lifetime of signed certificates (`ttl`), a duration. Must not exceed maxTTL. Defaults to maxTTL. Example: `30m`.'
                  pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                  type: string
              required:
                - connectionRef
                - keyType
              type: object
              x-kubernetes-validations:
                - message: mountPath is immutable
                  rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath) || self.mountPath == oldSelf.mountPath)
                - message: name is immutable
                  rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name == oldSelf.name)
                - message: a ca role needs allowUserCertificates or allowHostCertificates
                  rule: self.keyType != 'ca' || (has(self.allowUserCertificates) && self.allowUserCertificates) || (has(self.allowHostCertificates) && self.allowHostCertificates)
                - message: an otp role needs defaultUser
                  rule: self.keyType != 'otp' || has(self.defaultUser)
                - message: cidrList, excludeCIDRList and port apply only to otp roles
                  rule: self.keyType == 'otp' || (!has(self.cidrList) && !has(self.excludeCIDRList) && !has(self.port))
                - message: certificate fields apply only to ca roles
                  rule: self.keyType == 'ca' || (!has(self.defaultUserTemplate) && !has(self.allowedUsersTemplate) && !has(self.allowedDomains) && !has(self.allowedDomainsTemplate) && !has(self.ttl) && !has(self.maxTTL) && !has(self.allowedCriticalOptions) && !has(self.allowedExtensions) && !has(self.defaultCriticalOptions) && !has(self.defaultExtensions) && !has(self.defaultExtensionsTemplate) && !has(self.allowUserCertificates) && !has(self.allowHostCertificates) && !has(self.allowBareDomains) && !has(self.allowSubdomains) && !has(self.allowUserKeyIDs) && !has(self.allowEmptyPrincipals) && !has(self.allowCommasInIdentityTemplates) && !has(self.allowWildcardsInIdentityTemplates) && !has(self.keyIDFormat) && !has(self.allowedUserKeyLengths) && !has(self.algorithmSigner) && !has(self.notBeforeDuration) && !has(self.issuerRef))
                - message: ttl must not exceed maxTTL
                  rule: '!has(self.ttl) || !has(self.maxTTL) || duration(self.maxTTL) == duration(''0s'') || duration(self.ttl) <= duration(self.maxTTL)'
                - message: namespace is immutable
                  rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__) || self.__namespace__ == oldSelf.__namespace__)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: status is the observed state of the SSH role.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                namespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
