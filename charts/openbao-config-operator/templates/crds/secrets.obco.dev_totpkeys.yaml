{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: totpkeys.secrets.obco.dev
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: secrets.obco.dev
  names:
    categories:
      - obco
      - obco-secrets
    kind: TOTPKey
    listKind: TOTPKeyList
    plural: totpkeys
    singular: totpkey
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "TOTPKey manages a key of a TOTP secrets engine at `<mount>/keys/<name>`, either generated by OpenBao or imported from a Secret. Use it to issue or validate time-based one-time passwords; a generated key's URL and QR code are written once to writeSecretRef.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  name: alice\n\t  issuer: Example Corp\n\t  accountName: alice@example.com\n\t  generate:\n\t    writeSecretRef:\n\t      name: alice-totp"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec is the desired key of a TOTP secrets engine at `<mountPath>/keys/<name>`. Set exactly one of generate (OpenBao generates the key), keySecretRef (import a base32 key) or urlSecretRef (import an otpauth URL).
              properties:
                accountName:
                  description: 'accountName is the account the key belongs to (`account_name`). Required with generate; immutable then. Example: `alice@example.com`.'
                  maxLength: 256
                  minLength: 1
                  type: string
                algorithm:
                  description: 'algorithm is the hash algorithm of the code (`algorithm`). Allowed: SHA1, SHA256, SHA512. Defaults to SHA1. Immutable for a generated key.'
                  enum:
                    - SHA1
                    - SHA256
                    - SHA512
                  type: string
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: BaoConnection
                      description: 'Kind of the connection: BaoConnection (in the same Kubernetes namespace as this resource) or ClusterBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: BaoConnection.'
                      enum:
                        - BaoConnection
                        - ClusterBaoConnection
                      type: string
                    name:
                      description: 'Name of the BaoConnection or ClusterBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation obco.dev/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                digits:
                  description: 'digits is the length of the code (`digits`). Allowed: 6, 8. Defaults to 6. Immutable for a generated key.'
                  enum:
                    - 6
                    - 8
                  format: int32
                  type: integer
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                generate:
                  description: 'generate makes OpenBao generate the key once (`generate=true`). Its settings cannot change afterwards: a new write would replace the key and break every enrolled authenticator.'
                  properties:
                    exported:
                      description: exported returns the otpauth URL and QR code once, at creation (`exported`). Defaults to true.
                      type: boolean
                    keySize:
                      description: keySize is the size of the generated key in bytes (`key_size`). 1-256. Defaults to 20.
                      format: int32
                      maximum: 256
                      minimum: 1
                      type: integer
                    qrSize:
                      description: qrSize is the pixel size of the QR code; 0 returns none (`qr_size`). 0-2048. Defaults to 200.
                      format: int32
                      maximum: 2048
                      minimum: 0
                      type: integer
                    writeSecretRef:
                      description: 'writeSecretRef names the Secret, owned by this resource, that receives the otpauth URL (key `url`) and the base64 PNG QR code (key `barcode`) once, when the key is generated. OpenBao never returns them again; they are never stored in status. Example: `{name: alice-totp}`.'
                      properties:
                        name:
                          description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                        - name
                      type: object
                  type: object
                  x-kubernetes-validations:
                    - message: writeSecretRef is required unless exported is false
                      rule: (has(self.exported) && !self.exported) || has(self.writeSecretRef)
                issuer:
                  description: 'issuer is the name of the issuing organisation (`issuer`). Required with generate; immutable then. Example: `Example Corp`.'
                  maxLength: 256
                  minLength: 1
                  type: string
                keySecretRef:
                  description: 'keySecretRef selects the Secret key holding the base32 shared key to import (`key`). Read from a Secret key; never stored in status. Write-only. Example: `{name: alice-totp, key: seed}`.'
                  properties:
                    key:
                      description: 'Key in the Secret''s data whose value is used. Example: password'
                      maxLength: 253
                      minLength: 1
                      type: string
                    name:
                      description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - key
                    - name
                  type: object
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                mountPath:
                  default: totp
                  description: 'mountPath is the path of the TOTP secrets engine mount. Defaults to `totp`. Immutable. Example: `totp`.'
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                name:
                  description: 'name is the key name in OpenBao. Defaults to metadata.name. Immutable. Example: `alice`.'
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9_.@-]+$
                  type: string
                openbaoNamespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                period:
                  description: period is the time step of the code (`period`), a duration. Defaults to `30s`. Immutable for a generated key.
                  pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                  type: string
                skew:
                  description: 'skew is the number of periods of clock drift accepted when validating a code (`skew`). Allowed: 0, 1. Defaults to 1. Immutable for a generated key.'
                  format: int32
                  maximum: 1
                  minimum: 0
                  type: integer
                urlSecretRef:
                  description: 'urlSecretRef selects the Secret key holding an `otpauth://` URL to import (`url`); issuer, account and code settings come from the URL. Read from a Secret key; never stored in status. Write-only. Example: `{name: alice-totp, key: url}`.'
                  properties:
                    key:
                      description: 'Key in the Secret''s data whose value is used. Example: password'
                      maxLength: 253
                      minLength: 1
                      type: string
                    name:
                      description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - key
                    - name
                  type: object
              required:
                - connectionRef
              type: object
              x-kubernetes-validations:
                - message: mountPath is immutable
                  rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath) || self.mountPath == oldSelf.mountPath)
                - message: name is immutable
                  rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name == oldSelf.name)
                - message: set exactly one of generate, keySecretRef and urlSecretRef
                  rule: '(has(self.generate) ? 1 : 0) + (has(self.keySecretRef) ? 1 : 0) + (has(self.urlSecretRef) ? 1 : 0) == 1'
                - message: switching between a generated and an imported key is not allowed
                  rule: has(self.generate) == has(oldSelf.generate)
                - message: generate is immutable
                  rule: '!has(oldSelf.generate) || (has(self.generate) && self.generate == oldSelf.generate)'
                - message: issuer and accountName of a generated key are immutable
                  rule: '!has(oldSelf.generate) || (has(self.issuer) == has(oldSelf.issuer) && (!has(self.issuer) || self.issuer == oldSelf.issuer) && has(self.accountName) == has(oldSelf.accountName) && (!has(self.accountName) || self.accountName == oldSelf.accountName))'
                - message: period, algorithm, digits and skew of a generated key are immutable
                  rule: '!has(oldSelf.generate) || (has(self.period) == has(oldSelf.period) && (!has(self.period) || self.period == oldSelf.period) && has(self.algorithm) == has(oldSelf.algorithm) && (!has(self.algorithm) || self.algorithm == oldSelf.algorithm) && has(self.digits) == has(oldSelf.digits) && (!has(self.digits) || self.digits == oldSelf.digits) && has(self.skew) == has(oldSelf.skew) && (!has(self.skew) || self.skew == oldSelf.skew))'
                - message: a generated key needs issuer and accountName
                  rule: '!has(self.generate) || (has(self.issuer) && has(self.accountName))'
                - message: issuer, accountName, period, algorithm and digits come from the URL with urlSecretRef
                  rule: '!has(self.urlSecretRef) || (!has(self.issuer) && !has(self.accountName) && !has(self.period) && !has(self.algorithm) && !has(self.digits))'
                - message: openbaoNamespace is immutable
                  rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) && (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: status is the observed state of the TOTP key.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                openbaoNamespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
