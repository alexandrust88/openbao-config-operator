{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: pkiissuers.secrets.openbaoconfig.io
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
      - openbao
    kind: PKIIssuer
    listKind: PKIIssuerList
    plural: pkiissuers
    singular: pkiissuer
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "PKIIssuer manages a root or intermediate CA issuer of a PKI secrets engine at `<mount>/issuer/<name>`. A root is self-signed; an intermediate is signed by another issuer, possibly in another mount. The certificate is created once; rotate a CA with a new PKIIssuer.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  mountPath: pki-int\n\t  name: int-2026\n\t  type: intermediate\n\t  certificate:\n\t    commonName: Example Intermediate CA 2026\n\t    ttl: 43800h\n\t  signer:\n\t    issuerRef: {name: root-2026}"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec is the desired CA issuer of a PKI secrets engine at `<mountPath>/issuer/<name>`. A root issuer is generated and self-signed. An intermediate issuer gets a CSR generated in its mount, signed by the signer issuer, and the signed certificate imported back. The certificate is created once; afterwards only the issuer settings (usage, chain, URLs and so on) are reconciled.
              properties:
                certificate:
                  description: 'certificate holds the subject and constraints of the issuer certificate. Immutable: create a new PKIIssuer to rotate the CA.'
                  properties:
                    addBasicConstraints:
                      description: addBasicConstraints adds a CA basic constraints extension to the CSR of an intermediate (`add_basic_constraints`), for compatibility with Active Directory Certificate Services. Intermediate only. Defaults to false.
                      type: boolean
                    altNames:
                      description: 'altNames are DNS names and email addresses added as subject alternative names (`alt_names`). Example: `[ca.example.com]`.'
                      items:
                        maxLength: 256
                        pattern: ^[^,]+$
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: atomic
                    commonName:
                      description: 'commonName is the common name of the issuer certificate (`common_name`). Example: `Example Intermediate CA 2026`.'
                      maxLength: 256
                      minLength: 1
                      type: string
                    country:
                      description: 'country is the country of the subject (`country`). Example: `[DE]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    excludeCNFromSANs:
                      description: excludeCNFromSANs keeps the common name out of the subject alternative names (`exclude_cn_from_sans`). Defaults to false.
                      type: boolean
                    ipSANs:
                      description: 'ipSANs are IP addresses added as subject alternative names (`ip_sans`). Example: `[10.0.0.10]`.'
                      items:
                        maxLength: 64
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: atomic
                    locality:
                      description: 'locality is the locality (city) of the subject (`locality`). Example: `[Berlin]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    maxPathLength:
                      description: 'maxPathLength limits the number of intermediate CAs below this one (`max_path_length`); -1 means no limit. Defaults to -1. Example: `0`.'
                      format: int32
                      minimum: -1
                      type: integer
                    notAfter:
                      description: 'notAfter sets the expiry of the certificate as a UTC timestamp (`not_after`). Example: `2036-01-01T00:00:00Z`.'
                      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
                      type: string
                    notBeforeDuration:
                      description: notBeforeDuration backdates the certificate's not-before time (`not_before_duration`), a duration. Defaults to `30s`.
                      pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                      type: string
                    organization:
                      description: 'organization is the organization of the subject (`organization`). Example: `[Example Corp]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    otherSANs:
                      description: 'otherSANs are custom subject alternative names in the form `<oid>;<type>:<value>` (`other_sans`). Example: `["1.3.6.1.4.1.311.20.2.3;UTF8:ca@example.com"]`.'
                      items:
                        maxLength: 512
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: atomic
                    ou:
                      description: 'ou is the organizational unit of the subject (`ou`). Example: `[Platform]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    permittedDNSDomains:
                      description: 'permittedDNSDomains restricts the DNS names of certificates issued below this CA (`permitted_dns_domains`). Example: `[example.com]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: atomic
                    postalCode:
                      description: 'postalCode is the postal code of the subject (`postal_code`). Example: `["10115"]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    province:
                      description: 'province is the province (state) of the subject (`province`). Example: `[Berlin]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    serialNumber:
                      description: 'serialNumber is the subject''s serialNumber attribute, not the certificate serial number (`serial_number`). Example: `CA-0001`.'
                      maxLength: 256
                      type: string
                    signatureBits:
                      description: 'signatureBits selects the hash of the self-signature (root) or the CSR signature (intermediate) (`signature_bits`). Allowed: 256, 384, 512. Unset lets OpenBao pick one from the key.'
                      enum:
                        - 256
                        - 384
                        - 512
                      format: int32
                      type: integer
                    streetAddress:
                      description: 'streetAddress is the street address of the subject (`street_address`). Example: `[Main Street 1]`.'
                      items:
                        maxLength: 256
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    ttl:
                      description: 'ttl is the validity period of the certificate (`ttl`), a duration bounded by the mount''s max lease TTL. Example: `43800h`.'
                      pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                      type: string
                    uriSANs:
                      description: 'uriSANs are URIs added as subject alternative names (`uri_sans`). Example: `[spiffe://example.com/ca]`.'
                      items:
                        maxLength: 512
                        type: string
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: atomic
                    usePSS:
                      description: usePSS signs with RSASSA-PSS instead of PKCS#1 v1.5 for rsa keys (`use_pss`). Defaults to false.
                      type: boolean
                  required:
                    - commonName
                  type: object
                  x-kubernetes-validations:
                    - message: set at most one of ttl and notAfter
                      rule: '!has(self.ttl) || !has(self.notAfter)'
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: OpenBaoConnection
                      description: 'Kind of the connection: OpenBaoConnection (in the same Kubernetes namespace as this resource) or ClusterOpenBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: OpenBaoConnection.'
                      enum:
                        - OpenBaoConnection
                        - ClusterOpenBaoConnection
                      type: string
                    name:
                      description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                crlDistributionPoints:
                  description: 'crlDistributionPoints are the CRL URLs of this issuer (`crl_distribution_points`), overriding the mount''s config. Example: `[https://openbao.example.com/v1/pki-int/issuer/int-2026/crl/der]`.'
                  items:
                    maxLength: 1024
                    type: string
                  maxItems: 16
                  type: array
                  x-kubernetes-list-type: atomic
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                enableAIAURLTemplating:
                  description: enableAIAURLTemplating allows `{{ "{{" }}cluster_path}}`, `{{ "{{" }}cluster_aia_path}}` and `{{ "{{" }}issuer_id}}` in the URLs above (`enable_aia_url_templating`); requires at least one of them, because OpenBao keeps it only with an AIA URL. Defaults to false.
                  type: boolean
                issuingCertificates:
                  description: 'issuingCertificates are the AIA URLs of this issuer''s certificate (`issuing_certificates`), overriding the mount''s config. Example: `[https://openbao.example.com/v1/pki-int/issuer/int-2026/der]`.'
                  items:
                    maxLength: 1024
                    type: string
                  maxItems: 16
                  type: array
                  x-kubernetes-list-type: atomic
                key:
                  description: key describes the issuer's private key. Defaults to a new internal rsa key. Immutable.
                  properties:
                    bits:
                      description: 'bits is the size of a newly created key (`key_bits`): 2048, 3072, 4096 or 8192 for rsa; 224, 256, 384 or 521 for ec; 44, 65 or 87 for mldsa; unused for ed25519. Defaults to 2048 for rsa and 256 for ec. Example: `384`.'
                      enum:
                        - 44
                        - 65
                        - 87
                        - 224
                        - 256
                        - 384
                        - 521
                        - 2048
                        - 3072
                        - 4096
                        - 8192
                      format: int32
                      type: integer
                    existing:
                      description: 'existing selects the stored key to reuse when source is existing (`key_ref`). Example: `{keyRef: {name: int-2026}}`.'
                      properties:
                        keyName:
                          description: 'keyName is the name or ID of the key in OpenBao. Example: `int-2026`.'
                          maxLength: 128
                          minLength: 1
                          type: string
                        keyRef:
                          description: 'keyRef names a PKIKey in the same namespace and PKI mount; it must be Ready. Example: `{name: int-2026}`.'
                          properties:
                            name:
                              description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                            - name
                          type: object
                      type: object
                      x-kubernetes-validations:
                        - message: set exactly one of keyName and keyRef
                          rule: has(self.keyName) != has(self.keyRef)
                    externalKeyRef:
                      description: 'externalKeyRef is the OpenBao external key used when source is kms; required there and allowed only there. Example: `hsm-pki-key`.'
                      maxLength: 512
                      minLength: 1
                      type: string
                    name:
                      description: 'name is given to a newly created key in OpenBao (`key_name`). Not allowed with source existing. Example: `int-2026`.'
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_]([A-Za-z0-9_.-]*[A-Za-z0-9_])?$
                      type: string
                    privateKeyFormat:
                      description: 'privateKeyFormat is the format of an exported key (`private_key_format`): `der` writes a PKCS#1 or SEC1 PEM key, `pkcs8` a PKCS#8 PEM key. Source exported only. Defaults to der.'
                      enum:
                        - der
                        - pkcs8
                      type: string
                    source:
                      default: internal
                      description: source is `internal` (the key never leaves OpenBao), `exported` (also written once to writeSecretRef), `existing` (a key already stored in the mount) or `kms` (an OpenBao external key). Defaults to internal.
                      enum:
                        - internal
                        - exported
                        - existing
                        - kms
                      type: string
                    type:
                      description: 'type is the algorithm of a newly created key (`key_type`). Allowed: rsa, ec, ed25519, mldsa. Defaults to rsa. Example: `ec`.'
                      enum:
                        - rsa
                        - ec
                        - ed25519
                        - mldsa
                      type: string
                  type: object
                  x-kubernetes-validations:
                    - message: existing is required with source existing and excludes name, type and bits
                      rule: 'self.?source.orValue(''internal'') == ''existing'' ? (has(self.existing) && !has(self.name) && !has(self.type) && !has(self.bits)) : !has(self.existing)'
                    - message: externalKeyRef is required with source kms and allowed only there
                      rule: (self.?source.orValue('internal') == 'kms') == has(self.externalKeyRef)
                    - message: type and bits come from the external key with source kms
                      rule: self.?source.orValue('internal') != 'kms' || (!has(self.type) && !has(self.bits))
                    - message: privateKeyFormat applies only to source exported
                      rule: '!has(self.privateKeyFormat) || self.?source.orValue(''internal'') == ''exported'''
                leafNotAfterBehavior:
                  description: 'leafNotAfterBehavior controls a leaf whose expiry would exceed the issuer''s (`leaf_not_after_behavior`): `err` rejects it, `truncate` shortens it, `permit` allows it. Defaults to err.'
                  enum:
                    - err
                    - truncate
                    - permit
                  type: string
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                manualChain:
                  description: 'manualChain overrides the computed CA chain with issuer names or IDs (`manual_chain`); the first entry must be this issuer. Example: `[int-2026, root-2026]`.'
                  items:
                    maxLength: 128
                    minLength: 1
                    type: string
                  maxItems: 16
                  type: array
                  x-kubernetes-list-type: atomic
                mountPath:
                  default: pki
                  description: 'mountPath is the path of the PKI secrets engine mount. Defaults to `pki`. Immutable. Example: `pki-int`.'
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                name:
                  description: 'name is the issuer name in OpenBao (`issuer_name`). Defaults to metadata.name; `default` is reserved. Immutable. Example: `int-2026`.'
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9_]([A-Za-z0-9_.-]*[A-Za-z0-9_])?$
                  type: string
                namespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                ocspServers:
                  description: 'ocspServers are the OCSP URLs of this issuer (`ocsp_servers`), overriding the mount''s config. Example: `[https://openbao.example.com/v1/pki-int/ocsp]`.'
                  items:
                    maxLength: 1024
                    type: string
                  maxItems: 16
                  type: array
                  x-kubernetes-list-type: atomic
                revocationSignatureAlgorithm:
                  description: 'revocationSignatureAlgorithm is the signature algorithm for CRLs and OCSP responses (`revocation_signature_algorithm`). Unset derives it from the key. Example: `ECDSAWithSHA384`.'
                  enum:
                    - SHA256WithRSA
                    - SHA384WithRSA
                    - SHA512WithRSA
                    - ECDSAWithSHA256
                    - ECDSAWithSHA384
                    - ECDSAWithSHA512
                    - SHA256WithRSAPSS
                    - SHA384WithRSAPSS
                    - SHA512WithRSAPSS
                    - Ed25519
                    - MLDSA44
                    - MLDSA65
                    - MLDSA87
                  type: string
                signer:
                  description: signer selects the issuer that signs an intermediate; it may be in another PKI mount. Required for an intermediate, not allowed for a root. Immutable.
                  properties:
                    issuerName:
                      description: 'issuerName is the name or ID of the signing issuer in OpenBao. Example: `root-2026`.'
                      maxLength: 128
                      minLength: 1
                      type: string
                    issuerRef:
                      description: 'issuerRef names a PKIIssuer in the same namespace that signs this intermediate; it must be Ready. Its mount is taken from it. Example: `{name: root-2026}`.'
                      properties:
                        name:
                          description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                        - name
                      type: object
                    mountPath:
                      description: 'mountPath is the PKI mount that holds the signing issuer named by issuerName. Defaults to the mount of this issuer; not allowed with issuerRef. Example: `pki-root`.'
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                      type: string
                  type: object
                  x-kubernetes-validations:
                    - message: set exactly one of issuerName and issuerRef
                      rule: has(self.issuerName) != has(self.issuerRef)
                    - message: mountPath applies only to issuerName; issuerRef takes the mount from the PKIIssuer
                      rule: '!has(self.mountPath) || has(self.issuerName)'
                type:
                  description: type is `root` for a self-signed CA or `intermediate` for a CA signed by another issuer. Immutable.
                  enum:
                    - root
                    - intermediate
                  type: string
                usage:
                  description: 'usage lists what the issuer may do (`usage`): read-only, issuing-certificates, crl-signing, ocsp-signing; read-only is always added. Defaults to every usage. Example: `[issuing-certificates, crl-signing]`.'
                  items:
                    enum:
                      - read-only
                      - issuing-certificates
                      - crl-signing
                      - ocsp-signing
                    type: string
                  maxItems: 4
                  type: array
                  x-kubernetes-list-type: set
                writeSecretRef:
                  description: 'writeSecretRef names the Secret that receives the private key once, when key.source is exported; required there and allowed only there. The Secret is owned by this resource and holds the keys `private_key` and `private_key_type`; never stored in status. Example: `{name: int-ca-key}`.'
                  properties:
                    name:
                      description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
              required:
                - certificate
                - connectionRef
                - type
              type: object
              x-kubernetes-validations:
                - message: mountPath is immutable
                  rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath) || self.mountPath == oldSelf.mountPath)
                - message: name is immutable
                  rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name == oldSelf.name)
                - message: type is immutable
                  rule: self.type == oldSelf.type
                - message: key is immutable
                  rule: has(self.key) == has(oldSelf.key) && (!has(self.key) || self.key == oldSelf.key)
                - message: certificate is immutable; create a new PKIIssuer to rotate the CA
                  rule: self.certificate == oldSelf.certificate
                - message: signer is immutable
                  rule: has(self.signer) == has(oldSelf.signer) && (!has(self.signer) || self.signer == oldSelf.signer)
                - message: signer is required for an intermediate and not allowed for a root
                  rule: (self.type == 'intermediate') == has(self.signer)
                - message: certificate.addBasicConstraints applies only to an intermediate
                  rule: self.type == 'intermediate' || !has(self.certificate.addBasicConstraints)
                - message: writeSecretRef is required with key source exported and allowed only there
                  rule: (has(self.key) && self.key.?source.orValue('') == 'exported') == has(self.writeSecretRef)
                - message: default is a reserved issuer name
                  rule: self.?name.orValue('') != 'default'
                - message: 'revocationSignatureAlgorithm must match key.type (rsa by default): an RSA algorithm for rsa, ECDSA for ec, Ed25519 for ed25519, MLDSA for mldsa'
                  rule: '!has(self.revocationSignatureAlgorithm) || self.?key.?source.orValue(''internal'') in [''existing'', ''kms''] || (self.?key.?type.orValue(''rsa'') == ''rsa'' ? self.revocationSignatureAlgorithm.contains(''RSA'') : self.?key.?type.orValue(''rsa'') == ''ec'' ? self.revocationSignatureAlgorithm.startsWith(''ECDSA'') : self.?key.?type.orValue(''rsa'') == ''ed25519'' ? self.revocationSignatureAlgorithm == ''Ed25519'' : self.revocationSignatureAlgorithm.startsWith(''MLDSA''))'
                - message: enableAIAURLTemplating requires at least one of issuingCertificates, crlDistributionPoints and ocspServers; OpenBao drops it otherwise
                  rule: '!self.?enableAIAURLTemplating.orValue(false) || has(self.issuingCertificates) || has(self.crlDistributionPoints) || has(self.ocspServers)'
                - message: namespace is immutable
                  rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__) || self.__namespace__ == oldSelf.__namespace__)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: status is the observed state of the issuer; `id` holds the OpenBao issuer ID.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                csr:
                  description: csr is the PEM certificate signing request of an intermediate while it waits to be signed.
                  type: string
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                keyID:
                  description: keyID is the OpenBao ID of the issuer's private key.
                  type: string
                namespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
