{{- if and .Values.crds.install .Values.pluginKinds.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: awsauthconfigs.auth.obco.dev
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: auth.obco.dev
  names:
    categories:
      - obco
      - obco-auth
    kind: AWSAuthConfig
    listKind: AWSAuthConfigList
    plural: awsauthconfigs
    singular: awsauthconfig
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "AWSAuthConfig manages the AWS client configuration of an OpenBao AWS auth method at auth/<mountPath>/config/client. Use it to give OpenBao the credentials and endpoints it uses to verify iam and ec2 logins; without credentials OpenBao uses its environment (instance profile, IRSA). The AWS auth plugin must be enabled at mountPath (AuthMount). Deleting it leaves the settings in OpenBao.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  mountPath: aws\n\t  accessKeySecretRef: {name: aws-auth, key: access-key}\n\t  secretKeySecretRef: {name: aws-auth, key: secret-key}\n\t  iamServerIDHeaderValue: openbao.example.com"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: Desired AWS client configuration of an AWS auth method, written to auth/<mountPath>/config/client. Set both or neither of accessKeySecretRef and secretKeySecretRef; deletionPolicy must be Orphan.
              properties:
                accessKeySecretRef:
                  description: 'Secret key holding the AWS access key ID OpenBao uses to call AWS APIs. Read from this Secret key; the value is never stored in status. Requires secretKeySecretRef. Unset makes OpenBao use the credentials of its environment, such as an instance profile. Maps to `access_key`. Example: {name: aws-auth, key: access-key}'
                  properties:
                    key:
                      description: 'Key in the Secret''s data whose value is used. Example: password'
                      maxLength: 253
                      minLength: 1
                      type: string
                    name:
                      description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - key
                    - name
                  type: object
                allowedSTSHeaderValues:
                  description: 'Extra header names allowed in the signed STS request of an iam login. Maps to `allowed_sts_header_values`. Example: [X-Custom-Header]'
                  items:
                    maxLength: 512
                    minLength: 1
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: BaoConnection
                      description: 'Kind of the connection: BaoConnection (in the same Kubernetes namespace as this resource) or ClusterBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: BaoConnection.'
                      enum:
                        - BaoConnection
                        - ClusterBaoConnection
                      type: string
                    name:
                      description: 'Name of the BaoConnection or ClusterBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation obco.dev/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                ec2Endpoint:
                  description: 'URL that overrides the endpoint used for EC2 API calls, for example a VPC endpoint. Maps to `endpoint`. Example: https://ec2.eu-central-1.amazonaws.com'
                  maxLength: 2048
                  type: string
                iamEndpoint:
                  description: 'URL that overrides the endpoint used for IAM API calls. Maps to `iam_endpoint`. Example: https://iam.amazonaws.com'
                  maxLength: 2048
                  type: string
                iamServerIDHeaderValue:
                  description: 'Value that iam logins must sign in the X-Vault-AWS-IAM-Server-ID header, which stops a signed login request from being replayed against another server. Unset disables the check. Maps to `iam_server_id_header_value`. Example: openbao.example.com'
                  maxLength: 1024
                  type: string
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                maxRetries:
                  description: 'Number of retries for recoverable AWS API errors; -1 uses the AWS SDK default. OpenBao defaults to -1. Maps to `max_retries`. Example: 5'
                  format: int32
                  minimum: -1
                  type: integer
                mountPath:
                  default: aws
                  description: 'Path of the AWS auth method, without the auth/ prefix. Defaults to aws. Immutable. Example: aws'
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                openbaoNamespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                secretKeySecretRef:
                  description: 'Secret key holding the AWS secret access key that belongs to the access key. Read from this Secret key; the value is never stored in status. Write-only: OpenBao never returns it, so only a hash of it is tracked and a change of the Secret triggers a rewrite. Maps to `secret_key`. Example: {name: aws-auth, key: secret-key}'
                  properties:
                    key:
                      description: 'Key in the Secret''s data whose value is used. Example: password'
                      maxLength: 253
                      minLength: 1
                      type: string
                    name:
                      description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - key
                    - name
                  type: object
                stsEndpoint:
                  description: 'URL that overrides the endpoint used for STS API calls, such as a regional STS endpoint. Maps to `sts_endpoint`. Example: https://sts.eu-central-1.amazonaws.com'
                  maxLength: 2048
                  type: string
                stsRegion:
                  description: 'AWS region used to sign STS API calls to stsEndpoint; requires stsEndpoint. Maps to `sts_region`. Example: eu-central-1'
                  maxLength: 64
                  type: string
                useSTSRegionFromClient:
                  description: 'When true, STS calls use the region from the client''s signed login request instead of stsRegion. Defaults to false. Maps to `use_sts_region_from_client`. Example: true'
                  type: boolean
              required:
                - connectionRef
              type: object
              x-kubernetes-validations:
                - message: mountPath is immutable
                  rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath) || self.mountPath == oldSelf.mountPath)
                - message: 'deletionPolicy must be Orphan: an auth method config has no delete operation'
                  rule: '!has(self.deletionPolicy) || self.deletionPolicy == ''Orphan'''
                - message: set both or neither of accessKeySecretRef and secretKeySecretRef
                  rule: has(self.accessKeySecretRef) == has(self.secretKeySecretRef)
                - message: stsRegion requires stsEndpoint
                  rule: '!has(self.stsRegion) || has(self.stsEndpoint)'
                - message: openbaoNamespace is immutable
                  rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) && (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: Observed state of the client configuration, written by the operator.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                openbaoNamespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
