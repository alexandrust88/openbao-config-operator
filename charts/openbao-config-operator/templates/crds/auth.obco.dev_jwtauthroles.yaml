{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: jwtauthroles.auth.obco.dev
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: auth.obco.dev
  names:
    categories:
      - obco
      - obco-auth
    kind: JWTAuthRole
    listKind: JWTAuthRoleList
    plural: jwtauthroles
    shortNames:
      - baojwtr
    singular: jwtauthrole
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "JWTAuthRole manages a role of an OpenBao JWT/OIDC auth method at auth/<mountPath>/role/<name>. Use it to map JWT claims (CI jobs, workload identities) or OIDC browser logins to tokens with the listed policies.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  mountPath: jwt\n\t  userClaim: sub\n\t  boundAudiences: [openbao]\n\t  boundClaims: {project_path: [iam/vault-stack]}\n\t  tokenPolicies: [ci-read]\n\t  tokenTTL: 15m"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: Desired state of a JWT/OIDC auth role, written to auth/<mountPath>/role/<name>. An oidc role needs allowedRedirectURIs; a jwt role needs at least one of boundAudiences, boundSubject, boundClaims and tokenBoundCIDRs.
              properties:
                allowedRedirectURIs:
                  description: 'Redirect URIs accepted during the OIDC flow, for example the OpenBao UI and CLI callbacks. Required for an oidc role. Maps to `allowed_redirect_uris`. Example: [https://openbao.example.com/ui/vault/auth/oidc/oidc/callback, http://localhost:8250/oidc/callback]'
                  items:
                    maxLength: 2048
                    type: string
                  maxItems: 64
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: set
                boundAudiences:
                  description: 'Values accepted in the aud claim; a login matching any of them is allowed. Maps to `bound_audiences`. Example: [openbao]'
                  items:
                    maxLength: 512
                    type: string
                  maxItems: 64
                  minItems: 1
                  type: array
                  x-kubernetes-list-type: set
                boundClaims:
                  additionalProperties:
                    items:
                      type: string
                    type: array
                  description: 'Claims a login must carry, each mapped to its accepted values: every claim must match, and any one of its values is enough. Maps to `bound_claims`. Example: {groups: [platform-admins], project_path: [iam/*]}'
                  maxProperties: 64
                  minProperties: 1
                  type: object
                boundClaimsType:
                  default: string
                  description: 'How boundClaims values are matched: string (exact) or glob (* wildcards). Defaults to string. Maps to `bound_claims_type`. Example: glob'
                  enum:
                    - string
                    - glob
                  type: string
                boundSubject:
                  description: 'Value the sub claim must equal. Unset skips the subject check. Maps to `bound_subject`. Example: system:serviceaccount:ci:runner'
                  maxLength: 512
                  minLength: 1
                  type: string
                callbackMode:
                  default: client
                  description: 'OIDC callback flow: client (the browser redirects to the client), direct (the provider calls OpenBao) or device (device authorization flow). Defaults to client. Maps to `callback_mode`. Example: device'
                  enum:
                    - client
                    - direct
                    - device
                  type: string
                claimMappings:
                  additionalProperties:
                    type: string
                  description: 'Claims copied into the entity alias metadata, as claim name to metadata key. Maps to `claim_mappings`. Example: {email: email, preferred_username: username}'
                  maxProperties: 64
                  type: object
                clockSkewLeeway:
                  anyOf:
                    - type: integer
                    - type: string
                  description: 'Clock skew allowed on every time-based claim (iat, exp, nbf): a number of seconds, a duration such as 30s or 2m, or -1 to disable it. 0 or unset uses the OpenBao default of 60 seconds. Maps to `clock_skew_leeway`. Example: 60'
                  x-kubernetes-int-or-string: true
                  x-kubernetes-validations:
                    - message: must be -1, a number of seconds or a duration such as 30s
                      rule: 'type(self) == int ? self >= -1 : self.matches(''^([0-9]+(s|m|h))+$'')'
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: BaoConnection
                      description: 'Kind of the connection: BaoConnection (in the same Kubernetes namespace as this resource) or ClusterBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: BaoConnection.'
                      enum:
                        - BaoConnection
                        - ClusterBaoConnection
                      type: string
                    name:
                      description: 'Name of the BaoConnection or ClusterBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data and key holders (mounts, namespaces, KV data, audit devices, endpoints, transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed only while the resource carries the annotation obco.dev/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                expirationLeeway:
                  anyOf:
                    - type: integer
                    - type: string
                  description: 'Clock skew allowed when checking the exp claim: a number of seconds, a duration such as 30s or 2m, or -1 to disable the check. 0 or unset uses the OpenBao default of 150 seconds. Maps to `expiration_leeway`. Example: 30s'
                  x-kubernetes-int-or-string: true
                  x-kubernetes-validations:
                    - message: must be -1, a number of seconds or a duration such as 30s
                      rule: 'type(self) == int ? self >= -1 : self.matches(''^([0-9]+(s|m|h))+$'')'
                groupsClaim:
                  description: 'Claim holding the group names used as external identity group aliases. Unset disables group aliases. Maps to `groups_claim`. Example: groups'
                  maxLength: 256
                  type: string
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                maxAge:
                  description: 'Maximum time allowed since the user last authenticated with the OIDC provider, as a duration; older sessions must re-authenticate. Unset disables the check. Maps to `max_age`. Example: 1h'
                  type: string
                mountPath:
                  default: jwt
                  description: 'Path of the JWT/OIDC auth method, without the auth/ prefix. Defaults to jwt. Immutable. Example: oidc'
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                name:
                  description: 'Name of the role in OpenBao, used in the login request. Defaults to metadata.name. Immutable. Example: developers'
                  maxLength: 128
                  minLength: 1
                  pattern: ^[a-z0-9_]([a-z0-9_.-]*[a-z0-9_])?$
                  type: string
                notBeforeLeeway:
                  anyOf:
                    - type: integer
                    - type: string
                  description: 'Clock skew allowed when checking the nbf claim: a number of seconds, a duration such as 30s or 2m, or -1 to disable the check. 0 or unset uses the OpenBao default of 150 seconds. Maps to `not_before_leeway`. Example: 30s'
                  x-kubernetes-int-or-string: true
                  x-kubernetes-validations:
                    - message: must be -1, a number of seconds or a duration such as 30s
                      rule: 'type(self) == int ? self >= -1 : self.matches(''^([0-9]+(s|m|h))+$'')'
                oauth2Metadata:
                  description: 'OAuth2 tokens copied into the token metadata: any of access_token, id_token and refresh_token. Maps to `oauth2_metadata`. Example: [id_token]'
                  items:
                    description: 'OAuth2 token that OpenBao copies into the token metadata: access_token, id_token or refresh_token.'
                    enum:
                      - access_token
                      - id_token
                      - refresh_token
                    type: string
                  maxItems: 3
                  type: array
                  x-kubernetes-list-type: set
                oidcDisableConfirmation:
                  description: 'When true, the OpenBao confirmation page of the OIDC flow is skipped. OpenBao only (not Vault). Defaults to false. Maps to `oidc_disable_confirmation`. Example: true'
                  type: boolean
                oidcScopes:
                  description: 'OIDC scopes requested in addition to openid during the OIDC flow. Maps to `oidc_scopes`. Example: [profile, email, groups]'
                  items:
                    maxLength: 256
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                openbaoNamespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                policyRefs:
                  description: 'ACLPolicy resources in this Kubernetes namespace whose OpenBao policy names are added to tokenPolicies. The role waits until each ACLPolicy is Ready; each ACLPolicy must use the same connectionRef and namespace as the role. Example: [{name: app-read}]'
                  items:
                    description: Reference by name to an object in the same Kubernetes namespace as this resource.
                    properties:
                      name:
                        description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                      - name
                    type: object
                  maxItems: 32
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                pollInterval:
                  description: 'Polling interval in seconds for the device and direct callback flows. Unset uses the provider''s value for the device flow, otherwise 5. Maps to `poll_interval`. Example: 5'
                  format: int32
                  minimum: 1
                  type: integer
                roleType:
                  default: jwt
                  description: 'Login flow of the role: jwt (the client presents a JWT) or oidc (browser-based OIDC flow). Defaults to jwt. Maps to `role_type`. Example: oidc'
                  enum:
                    - jwt
                    - oidc
                  type: string
                tokenBoundCIDRs:
                  description: 'Client CIDR blocks or IP addresses allowed to use issued tokens. Unset allows any address. Maps to `token_bound_cidrs`. Example: [10.0.0.0/8, 192.168.1.10]'
                  items:
                    maxLength: 64
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - message: tokenBoundCIDRs entries must be CIDR blocks or IP addresses
                      rule: self.all(c, isCIDR(c) || isIP(c))
                tokenExplicitMaxTTL:
                  description: 'Hard cap on the lifetime of issued tokens that renewals cannot extend, as a duration. Unset or 0 means no explicit cap. Maps to `token_explicit_max_ttl`. Example: 24h'
                  type: string
                tokenMaxTTL:
                  description: 'Maximum lifetime of issued tokens including renewals, as a duration. Unset or 0 uses the mount or system max TTL. Maps to `token_max_ttl`. Example: 8h'
                  type: string
                tokenNoDefaultPolicy:
                  description: 'When true, the default policy is not attached to issued tokens; only the listed policies apply. Defaults to false. Maps to `token_no_default_policy`. Example: true'
                  type: boolean
                tokenNumUses:
                  description: 'Maximum number of requests an issued token may make; 0 or unset means unlimited. Maps to `token_num_uses`. Example: 10'
                  format: int32
                  minimum: 0
                  type: integer
                tokenPeriod:
                  description: 'Makes issued tokens periodic: they never expire as long as they are renewed within this duration, and each renewal resets the TTL to it. Unset or 0 means not periodic. Maps to `token_period`. Example: 1h'
                  type: string
                tokenPolicies:
                  description: 'OpenBao policy names attached to issued tokens, in addition to the default policy and the policies from policyRefs. Maps to `token_policies`. Example: [app-read, app-write]'
                  items:
                    maxLength: 128
                    minLength: 1
                    type: string
                  maxItems: 256
                  type: array
                  x-kubernetes-list-type: set
                tokenPoliciesTemplateClaims:
                  description: 'When true, tokenPolicies entries are rendered as templates over the JWT claims, for example a policy per group. Defaults to false. Maps to `token_policies_template_claims`. Example: true'
                  type: boolean
                tokenStrictlyBindIP:
                  description: 'When true, issued tokens can only be used from the IP address of the client that logged in. Built-in auth methods only: an external plugin built on an older OpenBao SDK ignores it and never returns it. Defaults to false. Maps to `token_strictly_bind_ip`. Example: true'
                  type: boolean
                tokenTTL:
                  description: 'Initial lifetime of issued tokens, as a duration. Unset or 0 uses the mount or system default TTL; must not exceed tokenMaxTTL. Maps to `token_ttl`. Example: 1h'
                  type: string
                tokenType:
                  description: 'Type of token to issue. One of default (the mount''s default, normally service), service (renewable, can create child tokens) or batch (lightweight, not renewable). Maps to `token_type`. Example: service'
                  enum:
                    - default
                    - service
                    - batch
                  type: string
                userClaim:
                  description: 'Claim whose value becomes the entity alias name of a login. Required. Maps to `user_claim`. Example: sub'
                  maxLength: 256
                  minLength: 1
                  type: string
                userClaimJSONPointer:
                  description: 'When true, userClaim is read as a JSON pointer, to reach nested claims. Defaults to false. Maps to `user_claim_json_pointer`. Example: true'
                  type: boolean
                verboseOIDCLogging:
                  description: 'When true, OpenBao logs received OIDC tokens and claims at debug level. May leak sensitive data; not for production. Defaults to false. Maps to `verbose_oidc_logging`. Example: false'
                  type: boolean
              required:
                - connectionRef
                - userClaim
              type: object
              x-kubernetes-validations:
                - message: mountPath is immutable
                  rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath) || self.mountPath == oldSelf.mountPath)
                - message: name is immutable
                  rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name == oldSelf.name)
                - message: allowedRedirectURIs is required for an oidc role
                  rule: '!has(self.roleType) || self.roleType != ''oidc'' || has(self.allowedRedirectURIs)'
                - message: a jwt role needs at least one of boundAudiences, boundSubject, boundClaims and tokenBoundCIDRs
                  rule: (has(self.roleType) && self.roleType == 'oidc') || has(self.boundAudiences) || has(self.boundSubject) || has(self.boundClaims) || has(self.tokenBoundCIDRs)
                - message: tokenTTL must not exceed tokenMaxTTL
                  rule: '!has(self.tokenTTL) || !has(self.tokenMaxTTL) || duration(self.tokenTTL) <= duration(self.tokenMaxTTL)'
                - message: openbaoNamespace is immutable
                  rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) && (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: Observed state of the role, written by the operator.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                openbaoNamespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
