{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- with include "openbao-config-operator.crdAnnotations" . }}
    {{- . | nindent 4 }}
    {{- end }}
  name: baoconnections.core.obco.dev
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- with .Values.crds.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  group: core.obco.dev
  names:
    categories:
      - obco
      - obco-core
    kind: BaoConnection
    listKind: BaoConnectionList
    plural: baoconnections
    shortNames:
      - baoconn
    singular: baoconnection
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .spec.serverRef.name
          name: Server
          type: string
        - jsonPath: .status.version
          name: Version
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "BaoConnection is a tenant's login to a BaoServer, usable only by resources in its own Kubernetes namespace through spec.connectionRef. The server must allow this namespace and every requested token audience. It writes nothing to OpenBao: the operator logs in once, caches and renews the token, and reports Ready when login and auth/token/lookup-self succeed. What the connection may configure is bounded by the OpenBao policy of its login role.\n\nExample:\n\n\tspec:\n\t  serverRef:\n\t    name: openbao\n\t  namespace: team-a\n\t  auth:\n\t    kubernetes:\n\t      role: team-a-operator\n\t      serviceAccountRef:\n\t        name: openbao-config\n\t      audiences: [\"openbao\"]"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: 'Desired state of the connection: which server, which OpenBao namespace and how to log in.'
              properties:
                auth:
                  description: 'How the operator logs in to OpenBao for this connection: set exactly one of token, kubernetes, appRole and jwt. Every referenced Secret or ServiceAccount is in this connection''s namespace.'
                  properties:
                    appRole:
                      description: Log in to an OpenBao approle auth mount (auth/<mountPath>/login) with a role ID and secret ID read from Secrets.
                      properties:
                        mountPath:
                          default: approle
                          description: 'Path of the approle auth mount, without the auth/ prefix. Default: approle. Example: approle'
                          maxLength: 128
                          pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                          type: string
                        roleIDSecretRef:
                          description: Secret key that holds the AppRole role ID (the login `role_id` parameter). Read at each login; never stored in status.
                          properties:
                            key:
                              description: 'Key in the Secret''s data whose value is used. Example: password'
                              maxLength: 253
                              minLength: 1
                              type: string
                            name:
                              description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                            - key
                            - name
                          type: object
                        secretIDSecretRef:
                          description: Secret key that holds the AppRole secret ID (the login `secret_id` parameter). Read at each login, so rotation needs no restart; never stored in status.
                          properties:
                            key:
                              description: 'Key in the Secret''s data whose value is used. Example: password'
                              maxLength: 253
                              minLength: 1
                              type: string
                            name:
                              description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                            - key
                            - name
                          type: object
                      required:
                        - roleIDSecretRef
                        - secretIDSecretRef
                      type: object
                    jwt:
                      description: Log in to an OpenBao jwt auth mount (auth/<mountPath>/login) with a short-lived token of a ServiceAccount in this namespace.
                      properties:
                        audiences:
                          description: 'Audiences of the requested token; they must match the jwt role''s bound_audiences and be listed in the server''s allowedAudiences. Required, so the token is never valid against the Kubernetes API server. 1 to 16 entries. Example: ["openbao"]'
                          items:
                            maxLength: 256
                            minLength: 1
                            type: string
                          maxItems: 16
                          minItems: 1
                          type: array
                        mountPath:
                          default: jwt
                          description: 'Path of the jwt auth mount, without the auth/ prefix. Default: jwt. Example: jwt-k8s'
                          maxLength: 128
                          pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                          type: string
                        role:
                          description: 'Name of the OpenBao jwt auth role to log in with (the login `role` parameter). Example: team-a-operator'
                          minLength: 1
                          type: string
                        serviceAccountRef:
                          description: 'ServiceAccount in this namespace whose short-lived token (TokenRequest) is presented as the JWT. Required: a namespaced connection never logs in as the operator itself.'
                          properties:
                            name:
                              description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                            - name
                          type: object
                      required:
                        - role
                      type: object
                      x-kubernetes-validations:
                        - message: 'serviceAccountRef is required: a namespaced connection never logs in as the operator'
                          rule: has(self.serviceAccountRef)
                        - message: 'audiences is required: a token for the API server audience is a Kubernetes credential and must not be sent to OpenBao'
                          rule: has(self.audiences) && size(self.audiences) > 0
                    kubernetes:
                      description: Log in to an OpenBao kubernetes auth mount (auth/<mountPath>/login) with a short-lived token of a ServiceAccount in this namespace.
                      properties:
                        audiences:
                          description: 'Audiences of the requested token; they must match the OpenBao role''s audience and be listed in the server''s allowedAudiences. Required, so the token is never valid against the Kubernetes API server. 1 to 16 entries. Example: ["openbao"]'
                          items:
                            maxLength: 256
                            minLength: 1
                            type: string
                          maxItems: 16
                          minItems: 1
                          type: array
                        mountPath:
                          default: kubernetes
                          description: 'Path of the kubernetes auth mount, without the auth/ prefix. Default: kubernetes. Example: kubernetes-tenants'
                          maxLength: 128
                          pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                          type: string
                        role:
                          description: 'Name of the OpenBao kubernetes auth role to log in with (the login `role` parameter). Example: team-a-operator'
                          minLength: 1
                          type: string
                        serviceAccountRef:
                          description: 'ServiceAccount in this namespace whose short-lived token (TokenRequest) is presented. Required: a namespaced connection never logs in as the operator itself.'
                          properties:
                            name:
                              description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                            - name
                          type: object
                      required:
                        - role
                      type: object
                      x-kubernetes-validations:
                        - message: 'serviceAccountRef is required: a namespaced connection never logs in as the operator'
                          rule: has(self.serviceAccountRef)
                        - message: 'audiences is required: a token for the API server audience is a Kubernetes credential and must not be sent to OpenBao'
                          rule: has(self.audiences) && size(self.audiences) > 0
                    token:
                      description: Use an existing OpenBao token stored in a Secret. Prefer kubernetes or jwt, which need no long-lived credential.
                      properties:
                        secretRef:
                          description: Secret key that holds the OpenBao token. Read at each login, so rotation needs no restart; never stored in status.
                          properties:
                            key:
                              description: 'Key in the Secret''s data whose value is used. Example: password'
                              maxLength: 253
                              minLength: 1
                              type: string
                            name:
                              description: 'Name of the Kubernetes Secret, in the same namespace as this resource. Example: openbao-credentials'
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                            - key
                            - name
                          type: object
                      required:
                        - secretRef
                      type: object
                  type: object
                  x-kubernetes-validations:
                    - message: set exactly one of token, kubernetes, appRole and jwt
                      rule: '[has(self.token), has(self.kubernetes), has(self.appRole), has(self.jwt)].filter(x, x).size() == 1'
                openbaoAuthNamespace:
                  description: 'Absolute OpenBao namespace that holds the auth mount used to log in. Unset: log in in the connection''s namespace. "": log in at the root namespace and operate in the child namespace set by openbaoNamespace. Example: team-a'
                  maxLength: 256
                  pattern: ^$|^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                openbaoNamespace:
                  description: 'Base OpenBao namespace for every request made through this connection; a resource''s own openbaoNamespace field is relative to it. Empty means the root namespace. Example: team-a'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                serverRef:
                  description: BaoServer to connect to; it supplies the address, CA bundle and limits, and must allow this connection's namespace and token audiences.
                  properties:
                    name:
                      description: 'Name of the cluster-scoped BaoServer. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
              required:
                - auth
                - serverRef
              type: object
            status:
              description: 'Observed state of the connection: server health copied from the BaoServer and the login result.'
              properties:
                authenticated:
                  description: True when the last login and token lookup (auth/token/lookup-self) succeeded.
                  type: boolean
                conditions:
                  description: 'Current state as conditions: Ready is True when the server is Ready and login succeeded; otherwise the reason is, for example, ServerNotReady, Sealed, Unreachable, AuthenticationFailed, CredentialsNotFound or ConnectionDenied.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                lastProbeTime:
                  description: When a check last changed this status; checks (about every minute) that find nothing new do not update it.
                  format: date-time
                  type: string
                observedGeneration:
                  description: The metadata.generation of this connection that the operator last checked.
                  format: int64
                  type: integer
                sealed:
                  description: True when the server is sealed or not initialized, copied from the BaoServer status.
                  type: boolean
                standby:
                  description: True when the probed node is a standby, copied from the BaoServer status.
                  type: boolean
                version:
                  description: 'OpenBao version, copied from the BaoServer status. Example: 2.7.2'
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
