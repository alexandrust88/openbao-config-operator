{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: approlesecretids.auth.openbaoconfig.io
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
spec:
  group: auth.openbaoconfig.io
  names:
    categories:
      - openbao
    kind: AppRoleSecretID
    listKind: AppRoleSecretIDList
    plural: approlesecretids
    singular: approlesecretid
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Synced")].status
          name: Synced
          type: string
        - jsonPath: .status.expirationTime
          name: Expires
          type: date
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: "AppRoleSecretID generates a secret ID for an OpenBao AppRole role at auth/<mountPath>/role/<role>/secret-id and writes it, with the role ID, to a Kubernetes Secret. Use it to hand AppRole credentials to a workload; the operator rotates the secret ID before it expires.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t  roleRef:\n\t    name: ci-deploy\n\t  ttl: 720h\n\t  writeSecretRef:\n\t    name: ci-deploy-approle"
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: 'Desired state of a secret ID of an AppRole role. Set exactly one of roleName and roleRef. The secret ID is written to the Secret named by writeSecretRef and never stored in status. A secret ID cannot be adopted: use creationPolicy Create or CreateOrAdopt.'
              properties:
                cidrList:
                  description: 'CIDR blocks or IP addresses allowed to log in with this secret ID; must be a subset of the role''s secretIDBoundCIDRs. Immutable. Maps to `cidr_list`. Example: [10.20.1.0/24]'
                  items:
                    maxLength: 64
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - message: cidrList entries must be CIDR blocks or IP addresses
                      rule: self.all(c, isCIDR(c) || isIP(c))
                connectionRef:
                  description: Connection used to reach and log in to OpenBao. Immutable.
                  properties:
                    kind:
                      default: OpenBaoConnection
                      description: 'Kind of the connection: OpenBaoConnection (in the same Kubernetes namespace as this resource) or ClusterOpenBaoConnection (cluster-scoped; its allowedNamespaces must select this namespace). Default: OpenBaoConnection.'
                      enum:
                        - OpenBaoConnection
                        - ClusterOpenBaoConnection
                      type: string
                    name:
                      description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection. Example: openbao'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                creationPolicy:
                  default: Create
                  description: 'How an object that already exists in OpenBao, and is not yet owned by this resource, is treated. Create (default): create the object; an existing one is refused with reason Conflict. Adopt: take over an existing object and never create one. CreateOrAdopt: create it, or take over an existing one. Settings that always exist in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                  enum:
                    - Create
                    - Adopt
                    - CreateOrAdopt
                  type: string
                deletionPolicy:
                  default: Orphan
                  description: 'What happens in OpenBao when this resource is deleted. Orphan (default): the OpenBao object stays. Delete: the object is removed (a configuration singleton is reset to its defaults); data holders such as mounts, namespaces and KV data are removed only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete: "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                  enum:
                    - Delete
                    - Orphan
                  type: string
                driftDetection:
                  default: Enabled
                  description: 'Whether OpenBao is re-read periodically to detect and repair out-of-band changes. Enabled (default): re-read every driftInterval. Disabled: write only when the spec or a referenced Secret changes.'
                  enum:
                    - Enabled
                    - Disabled
                  type: string
                driftInterval:
                  description: 'How often OpenBao is re-read for drift, as a duration of at least 30s. Default: the operator''s interval for the kind (15m for kinds that grant access such as policies, auth mounts and roles, 1h for the rest), with jitter. Example: 30m'
                  maxLength: 32
                  type: string
                  x-kubernetes-validations:
                    - message: driftInterval must be at least 30s
                      rule: duration(self) >= duration('30s')
                managementPolicy:
                  default: Manage
                  description: 'Whether the operator writes to OpenBao. Manage (default): converge OpenBao to the spec, create and delete as the policies say. Observe: only read the object and report drift in the conditions; never write or delete.'
                  enum:
                    - Manage
                    - Observe
                  type: string
                metadata:
                  additionalProperties:
                    type: string
                  description: 'Key-value metadata attached to the secret ID and to tokens issued with it. At most 32 entries. Immutable. Maps to `metadata` (sent as a JSON string). Example: {team: platform}'
                  maxProperties: 32
                  type: object
                mountPath:
                  description: 'Path of the AppRole auth method, without the auth/ prefix. Only used with roleName; defaults to approle. With roleRef the mount comes from the AppRole. Immutable. Example: approle'
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                  type: string
                namespace:
                  description: 'OpenBao namespace of the object, relative to the connection''s base namespace; empty means the connection namespace itself. Segments are separated by "/", without leading or trailing slash. Immutable: it cannot be added, changed or removed after creation. Example: team-a/apps'
                  maxLength: 256
                  pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                  type: string
                numUses:
                  description: 'Number of logins the secret ID allows. Must not exceed the role''s secretIDNumUses; defaults to it. 0 means unlimited. Immutable. Maps to `num_uses`. Example: 5'
                  format: int32
                  minimum: 0
                  type: integer
                roleName:
                  description: 'Name of the AppRole role in OpenBao. Set exactly one of roleName and roleRef. Immutable. Example: ci-deploy'
                  maxLength: 128
                  minLength: 1
                  pattern: ^[a-z0-9_]([a-z0-9_.-]*[a-z0-9_])?$
                  type: string
                roleRef:
                  description: 'AppRole resource in this Kubernetes namespace whose mount and role name are used. The AppRole must be Ready and use the same connectionRef and namespace. Set exactly one of roleName and roleRef. Immutable. Example: {name: ci-deploy}'
                  properties:
                    name:
                      description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                rotation:
                  description: 'Automatic replacement of the secret ID before it expires. Enabled by default; only applies to secret IDs with a TTL. Example: {renewBefore: 24h}'
                  properties:
                    enabled:
                      default: true
                      description: 'Turns rotation on or off. Defaults to true. Example: false'
                      type: boolean
                    renewBefore:
                      description: 'How long before expiry a new secret ID is generated: a duration or a percentage (1-99%) of the TTL. Defaults to a third of the TTL. Expiry is checked every drift interval, so keep this longer than the drift interval. The old secret ID is destroyed once the Secret holds the new one. Example: 25%'
                      maxLength: 32
                      pattern: ^(([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+|[1-9][0-9]?%)$
                      type: string
                  type: object
                tokenBoundCIDRs:
                  description: 'CIDR blocks or IP addresses allowed to use tokens issued with this secret ID; must be a subset of the role''s tokenBoundCIDRs. Immutable. Maps to `token_bound_cidrs`. Example: [10.20.1.0/24]'
                  items:
                    maxLength: 64
                    type: string
                  maxItems: 64
                  type: array
                  x-kubernetes-list-type: set
                  x-kubernetes-validations:
                    - message: tokenBoundCIDRs entries must be CIDR blocks or IP addresses
                      rule: self.all(c, isCIDR(c) || isIP(c))
                ttl:
                  description: 'Lifetime of the secret ID, as a duration. Must not exceed the role''s secretIDTTL; defaults to it. Immutable. Maps to `ttl`. Example: 168h'
                  type: string
                writeSecretRef:
                  description: 'Secret in this Kubernetes namespace, owned by this resource, that receives the keys role_id, secret_id and secret_id_accessor. A missing Secret or an empty secret_id key makes the operator generate a new secret ID. Required. Immutable. Example: {name: ci-deploy-approle}'
                  properties:
                    name:
                      description: 'Name of the referenced object, in the same namespace as this resource. Example: my-app'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
              required:
                - connectionRef
                - writeSecretRef
              type: object
              x-kubernetes-validations:
                - message: set exactly one of roleName and roleRef
                  rule: has(self.roleName) != has(self.roleRef)
                - message: mountPath is only used with roleName; with roleRef the mount is taken from the AppRole
                  rule: '!has(self.mountPath) || has(self.roleName)'
                - message: a secret ID cannot be adopted; use Create or CreateOrAdopt
                  rule: '!has(self.creationPolicy) || self.creationPolicy != ''Adopt'''
                - message: mountPath is immutable
                  rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath) || self.mountPath == oldSelf.mountPath)
                - message: roleName is immutable
                  rule: has(self.roleName) == has(oldSelf.roleName) && (!has(self.roleName) || self.roleName == oldSelf.roleName)
                - message: roleRef is immutable
                  rule: has(self.roleRef) == has(oldSelf.roleRef) && (!has(self.roleRef) || self.roleRef == oldSelf.roleRef)
                - message: metadata is immutable
                  rule: has(self.metadata) == has(oldSelf.metadata) && (!has(self.metadata) || self.metadata == oldSelf.metadata)
                - message: cidrList is immutable
                  rule: has(self.cidrList) == has(oldSelf.cidrList) && (!has(self.cidrList) || self.cidrList == oldSelf.cidrList)
                - message: tokenBoundCIDRs is immutable
                  rule: has(self.tokenBoundCIDRs) == has(oldSelf.tokenBoundCIDRs) && (!has(self.tokenBoundCIDRs) || self.tokenBoundCIDRs == oldSelf.tokenBoundCIDRs)
                - message: ttl is immutable
                  rule: has(self.ttl) == has(oldSelf.ttl) && (!has(self.ttl) || self.ttl == oldSelf.ttl)
                - message: numUses is immutable
                  rule: has(self.numUses) == has(oldSelf.numUses) && (!has(self.numUses) || self.numUses == oldSelf.numUses)
                - message: writeSecretRef is immutable
                  rule: self.writeSecretRef == oldSelf.writeSecretRef
                - message: namespace is immutable
                  rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__) || self.__namespace__ == oldSelf.__namespace__)
                - message: connectionRef is immutable
                  rule: self.connectionRef == oldSelf.connectionRef
            status:
              description: Observed state of the secret ID, written by the operator. status.id holds the secret ID accessor, never the secret ID.
              properties:
                acquired:
                  description: 'How the operator came to own the object: Created (it created it) or Adopted (it took over an existing one). Empty until owned.'
                  type: string
                conditions:
                  description: 'Current state as conditions: Ready (the OpenBao object matches the spec) and Synced (the last reconcile succeeded), each with a reason such as Available, Drifted, Conflict, ConnectionNotReady or PermissionDenied, and the generation it describes.'
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                expirationTime:
                  description: 'Time the current secret ID expires; unset when it does not expire. Example: "2026-12-14T10:00:00Z"'
                  format: date-time
                  type: string
                id:
                  description: 'Identifier OpenBao generated for the object (an entity, group or alias ID, or a mount accessor), for kinds that have one; other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                  type: string
                namespace:
                  description: 'Absolute OpenBao namespace the object was written in; empty means the root namespace. If it later differs from the spec, reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                  type: string
                observedGeneration:
                  description: The metadata.generation of this resource that the operator last reconciled.
                  format: int64
                  type: integer
                path:
                  description: 'Full OpenBao API path of the object, including its namespace, as last written; deletion uses it even after the spec changed. Example: team-a/sys/policies/acl/app-read'
                  type: string
                retiredAccessors:
                  description: 'Accessors of replaced secret IDs, destroyed once the Secret holds the new secret ID. Example: [6f1c2e7a-0b9d-4c55-9a51-2f0e8f3d1b2c]'
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                rolePath:
                  description: 'OpenBao path of the role the secret ID belongs to, relative to the OpenBao namespace. Example: auth/approle/role/ci-deploy'
                  type: string
                rotationNonce:
                  description: Value of the resource's rotation nonce when one-time inputs, such as a root credential that OpenBao rotates afterwards, were last sent; changing the nonce in the spec sends them again.
                  type: string
                serverID:
                  description: 'Cluster ID of the OpenBao server the object was acquired on. If the connection later reaches another server, reconciling stops with reason ServerChanged and nothing is written or deleted. Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                  type: string
                writeOnlyHash:
                  description: Keyed hash (HMAC-SHA256) of the write-only inputs, such as passwords read from Secrets; a change forces a write. It never contains or reveals the values.
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
