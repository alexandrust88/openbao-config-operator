{{- if .Values.rbac.userRoles }}
{{- $plurals := list }}
{{- range (include "openbao-config-operator.crdResources" . | fromYamlArray) }}
{{- $plurals = append $plurals .plural }}
{{- end }}
{{- /* a plural that matches no CRD would silently exclude nothing */}}
{{- range .Values.rbac.tenantEditor.excludeKinds }}
{{- if not (has . $plurals) }}
{{- fail (printf "rbac.tenantEditor.excludeKinds: %q is not the plural of a kind of this chart" .) }}
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-tenant-editor
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- if .Values.rbac.aggregate.admin }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    {{- end }}
    {{- if .Values.rbac.aggregate.edit }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    {{- end }}
{{- /* connections choose the OpenBao identity, so only the platform team manages them */}}
rules:
  {{- include "openbao-config-operator.userRules" (dict "root" . "verbs" (list "create" "delete" "deletecollection" "get" "list" "patch" "update" "watch") "excludePlurals" (concat (list "baoconnections" "clusterbaoconnections") .Values.rbac.tenantEditor.excludeKinds) "namespacedOnly" true) | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-viewer
  labels:
    {{- include "openbao-config-operator.labels" . | nindent 4 }}
    {{- if .Values.rbac.aggregate.view }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    {{- end }}
rules:
  {{- include "openbao-config-operator.userRules" (dict "root" . "verbs" (list "get" "list" "watch") "excludePlurals" (list "baoservers" "clusterbaoconnections") "namespacedOnly" false) | indent 2 }}
{{- end }}
