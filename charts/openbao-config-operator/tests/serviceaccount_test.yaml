suite: serviceaccount and names
templates:
  - templates/serviceaccount.yaml
release:
  name: obc
  namespace: openbao-system
tests:
  - it: names the ServiceAccount after the release and chart
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: obc-openbao-config-operator
      - equal:
          path: metadata.namespace
          value: openbao-system
      - notExists:
          path: metadata.annotations

  - it: creates no ServiceAccount when serviceAccount.create is false
    set:
      serviceAccount.create: false
      serviceAccount.name: platform-operator
    asserts:
      - hasDocuments:
          count: 0

  - it: uses serviceAccount.name and serviceAccount.annotations
    set:
      serviceAccount.name: openbao-operator
      serviceAccount.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.name
          value: openbao-operator
      - equal:
          path: metadata.annotations
          value: {example.com/owner: platform}

  - it: uses fullnameOverride
    set:
      fullnameOverride: obco
    asserts:
      - equal:
          path: metadata.name
          value: obco

  - it: uses nameOverride in the full name and the name label
    set:
      nameOverride: bao-config
    asserts:
      - equal:
          path: metadata.name
          value: obc-bao-config
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: bao-config

  - it: does not repeat the chart name when the release name contains it
    release:
      name: openbao-config-operator-prod
    asserts:
      - equal:
          path: metadata.name
          value: openbao-config-operator-prod
