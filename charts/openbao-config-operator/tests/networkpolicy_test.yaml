suite: networkpolicy
templates:
  - templates/networkpolicy.yaml
release:
  name: obc
  namespace: openbao-system
tests:
  - it: selects the manager pods and leaves egress open by destination by default
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: openbao-config-operator
            app.kubernetes.io/instance: obc
      - equal:
          path: spec.egress[1].ports
          value: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]
      - equal:
          path: spec.egress[2].ports
          value: [{port: 8200, protocol: TCP}]
      - notExists:
          path: spec.egress[2].to
      - lengthEqual:
          path: spec.egress
          count: 3

  - it: renders no NetworkPolicy when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: allows no ingress without metrics
    set:
      metrics.enabled: false
    asserts:
      - isNullOrEmpty:
          path: spec.ingress
      - contains:
          path: spec.policyTypes
          content: Ingress

  - it: allows only the release namespace to scrape when monitoringNamespace is empty
    set:
      networkPolicy.metrics.monitoringNamespace: ""
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: openbao-system}

  - it: lists the release namespace once when it is also the monitoring namespace
    set:
      networkPolicy.metrics.monitoringNamespace: openbao-system
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 1

  - it: allows DNS to any destination when dns.to is empty
    set:
      networkPolicy.dns.to: []
    asserts:
      - notExists:
          path: spec.egress[0].to
      - equal:
          path: spec.egress[0].ports
          value: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]

  - it: allows only NodeLocal DNSCache when dns.to is empty and it is enabled
    set:
      networkPolicy.dns.to: []
      networkPolicy.dns.nodeLocalDNS.enabled: true
      networkPolicy.dns.nodeLocalDNS.address: 169.254.0.10
    asserts:
      - equal:
          path: spec.egress[0].to
          value: [{ipBlock: {cidr: 169.254.0.10/32}}]

  - it: uses custom API server and OpenBao ports
    set:
      networkPolicy.apiServer.ports: [8443]
      networkPolicy.openbao.ports: [443, 8200]
    asserts:
      - equal:
          path: spec.egress[1].ports
          value: [{port: 8443, protocol: TCP}]
      - equal:
          path: spec.egress[2].ports
          value: [{port: 443, protocol: TCP}, {port: 8200, protocol: TCP}]

  - it: appends extraEgress
    set:
      networkPolicy.extraEgress:
        - to:
            - ipBlock: {cidr: 192.0.2.10/32}
          ports:
            - port: 443
              protocol: TCP
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 4
      - equal:
          path: spec.egress[3].to[0].ipBlock.cidr
          value: 192.0.2.10/32

  - it: uses a custom metrics port for ingress
    set:
      metrics.port: 9443
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value: [{port: 9443, protocol: TCP}]
