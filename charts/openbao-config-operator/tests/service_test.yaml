suite: metrics service
templates:
  - templates/service.yaml
release:
  name: obc
  namespace: openbao-system
tests:
  - it: renders a ClusterIP Service that selects the manager pods
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: obc-openbao-config-operator-metrics
      - equal:
          path: metadata.namespace
          value: openbao-system
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: openbao-config-operator
            app.kubernetes.io/instance: obc
      - notExists:
          path: metadata.annotations

  - it: renders no Service without metrics
    set:
      metrics.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses metrics.port and metrics.service.annotations
    set:
      metrics.port: 9443
      metrics.service.annotations:
        example.com/scrape: "true"
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9443
      - equal:
          path: metadata.annotations
          value: {example.com/scrape: "true"}
