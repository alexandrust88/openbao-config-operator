apiVersion: v2
name: openbao-config-operator
description: Manage existing OpenBao configuration declaratively with Kubernetes custom resources and GitOps.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.31.0-0"
home: https://docs.obco.dev/
icon: https://raw.githubusercontent.com/alexandrust88/openbao-config-operator/main/docs/assets/logo.svg
sources:
  - https://github.com/alexandrust88/openbao-config-operator
keywords:
  - openbao
  - operator
  - secrets
  - secrets-management
  - kubernetes-operator
  - gitops
  - configuration-as-code
  - multi-tenancy
# Release packaging sets versions, image digests, signing metadata and release notes.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/images: |
    - name: manager
      image: ghcr.io/alexandrust88/openbao-config-operator:0.1.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.obco.dev/
    - name: Verify the release
      url: https://docs.obco.dev/security/hardening/#verify-the-release
  artifacthub.io/changes: |
    - kind: added
      description: Initial release
