name: integration lab

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Lab profile to run
        type: choice
        default: all
        options:
          - all
          - identity
          - authentik
          - zitadel
          - transit
          - eso
          - pki
          - ldap
          - db-postgresql
          - db-mysql
          - db-mariadb
          - db-cassandra
          - db-influxdb
          - db-valkey
  pull_request:
    paths:
      - '.github/workflows/lab.yml'
      - '.github/actions/setup-go/**'
      - 'hack/lab/**'
      - 'examples/apps/transit/**'
      - 'examples/recipes/**'
      - 'gitops/databases/**'
      - 'hack/e2e/**'
      - 'test/e2e/testdata/**'
      - 'api/**'
      - 'internal/**'
      - 'cmd/**'
      - 'config/**'
      - 'charts/**'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '43 4 * * 2'

permissions: {}

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lab:
    name: lab / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.profile != 'all' && format('["{0}"]', inputs.profile) || github.event_name == 'workflow_dispatch' && '["identity", "authentik", "zitadel", "transit", "eso", "pki", "ldap", "db-postgresql", "db-mysql", "db-mariadb", "db-cassandra", "db-influxdb", "db-valkey"]' || '["identity", "authentik", "zitadel", "transit", "eso", "db-postgresql", "db-mysql", "db-mariadb", "db-cassandra", "db-influxdb", "db-valkey"]') }}
    env:
      LAB_CONTEXT: kind-openbao-config-operator-lab
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - name: Install lab tools
        run: |
          make kind helm
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Deploy and exercise the selected profile
        run: |
          set -o pipefail
          {
            hack/lab/up.sh raft
            case "$PROFILE" in
              identity)
                npm ci --ignore-scripts --prefix hack/lab/browser
                hack/lab/identity-up.sh
                hack/lab/identity-test.sh
                hack/lab/identity-browser.sh
                hack/lab/keycloak-test.sh
                ;;
              authentik|zitadel)
                npm ci --ignore-scripts --prefix hack/lab/browser
                hack/lab/provider-test.sh "$PROFILE"
                ;;
              db-*)
                hack/lab/database-test.sh "${PROFILE#db-}"
                ;;
              transit)
                hack/lab/transit-test.sh
                ;;
              eso)
                make yq
                hack/lab/identity-up.sh
                hack/lab/eso-up.sh
                hack/lab/eso-test.sh
                ;;
              pki)
                hack/lab/pki-up.sh
                hack/lab/pki-test.sh
                ;;
              ldap)
                hack/lab/plugins/up.sh
                hack/lab/plugins/test.sh
                ;;
              *) exit 2 ;;
            esac
          } 2>&1 | tee "$RUNNER_TEMP/lab.log"
      - name: Pod diagnostics
        if: failure()
        run: |
          if [ -f ".tmp/lab/openbao-config-operator-lab/kubeconfig" ]; then
            kubectl --kubeconfig .tmp/lab/openbao-config-operator-lab/kubeconfig get pods -A -o wide \
              > "$RUNNER_TEMP/lab-pods.txt"
          fi
      # Never upload the lab state directory: it can contain fixture credentials and kubeconfigs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lab-${{ matrix.profile }}-results
          path: |
            ${{ runner.temp }}/lab.log
            ${{ runner.temp }}/lab-pods.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Delete the disposable cluster
        if: always()
        run: |
          if [ -x bin/kind ]; then
            bin/kind delete cluster --name openbao-config-operator-lab
          fi
