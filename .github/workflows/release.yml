name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to dry-run (vX.Y.Z). A manual run builds, scans, signs with a throwaway key and verifies everything, and publishes nothing.
        required: true
        default: v0.0.0-dryrun

permissions: {}

# One release at a time across all tags: parallel runs race on --latest and on the registry metadata pushes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

jobs:
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/e2e.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    permissions:
      contents: read

  version:
    needs: [ci, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      chart_repo: ${{ steps.version.outputs.chart_repo }}
      chart: ${{ steps.version.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" = push ]; then tag=$REF_NAME; else tag=$INPUT_VERSION; fi
          hack/release/check-version.sh "$tag"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "image=ghcr.io/${REPOSITORY,,}"
            echo "chart_repo=ghcr.io/${OWNER,,}/charts"
            echo "chart=ghcr.io/${OWNER,,}/charts/openbao-config-operator"
          } >> "$GITHUB_OUTPUT"
      - run: make helm yq
      # Helm validates the chart version itself; this fails before anything is pushed.
      - name: Package the chart with this version
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          HELM=bin/helm YQ=bin/yq hack/release/package-chart.sh "$TAG" "$IMAGE" "sha256:$(printf '0%.0s' {1..64})" \
            "$RUNNER_TEMP/chart-check" >/dev/null
      - name: Refuse to overwrite a published release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "::error::release $TAG already exists; releases are immutable, tag a new version"
            exit 1
          elif [ "$out" != "release not found" ]; then
            echo "::error::cannot check whether release $TAG exists: $out"
            exit 1
          fi

  # A manual run proves every step without publishing: OCI layout output, throwaway cosign key, local verification.
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Release dry-run
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          IMAGE: ${{ needs.version.outputs.image }}
          CHART: ${{ needs.version.outputs.chart }}
          BUILDER: ${{ steps.buildx.outputs.name }}
          REPRO_CHECK: "1"
        run: make release-dry-run
      - name: Summary
        run: cat .tmp/release-dryrun/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dryrun
          path: |
            .tmp/release-dryrun
            !.tmp/release-dryrun/oci
            !.tmp/release-dryrun/*.tar
            !.tmp/release-dryrun/keys/*.key
          retention-days: 7
          if-no-files-found: error

  image:
    if: github.event_name == 'push'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write # push the image or chart to ghcr.io
      id-token: write # keyless cosign signing and attestations
      attestations: write # store build provenance and SBOM attestations
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make crane
      - name: Refuse to overwrite a published image
        run: |
          CRANE=bin/crane hack/release/check-absent.sh "$IMAGE:$TAG"
          CRANE=bin/crane hack/release/check-absent.sh "$IMAGE:$VERSION"
      - id: source
        name: Source date
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Pushed by digest only; the tags follow once the scan gate, signature and attestations are in place.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
            CREATED=${{ steps.source.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          # Provenance and the SBOMs are attached below as signed attestations instead.
          provenance: false
          sbom: false
      - id: platforms
        name: Resolve the platform digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          platforms=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" |
            jq -c '[.manifests[] | select(.platform.os != "unknown") | {platform: "\(.platform.os)/\(.platform.architecture)", digest}]')
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
      - run: make syft grype yq kustomize
      - name: Build install.yaml and crds.yaml
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: KUSTOMIZE=bin/kustomize hack/release/installer.sh "$IMAGE@$DIGEST" dist
      - name: Generate the SBOMs
        env:
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: |
          jq -r '.[] | "\(.platform) \(.digest)"' <<<"$PLATFORMS" | while read -r platform digest; do
            arch=${platform#*/}
            bin/syft scan "registry:$IMAGE@$digest" --source-name "$IMAGE" --source-version "$TAG" --quiet \
              --output "spdx-json=sbom-$arch.spdx.json" --output "cyclonedx-json=sbom-$arch.cdx.json"
          done
      - name: Vulnerability gate
        run: GRYPE=bin/grype YQ=bin/yq hack/release/scan.sh sbom-*.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the image index and every platform image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE@$DIGEST"
      - name: Attest the SBOMs and the provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: |
          hack/release/provenance.sh > provenance.json
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$IMAGE@$DIGEST"
          jq -r '.[] | "\(.platform) \(.digest)"' <<<"$PLATFORMS" | while read -r platform digest; do
            arch=${platform#*/}
            for subject in "$IMAGE@$digest" "$IMAGE@$DIGEST"; do
              cosign attest --yes --type spdxjson --predicate "sbom-$arch.spdx.json" "$subject"
              cosign attest --yes --type cyclonedx --predicate "sbom-$arch.cdx.json" "$subject"
            done
            cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$IMAGE@$digest"
          done
          if [ "$(jq '.statements | length' hack/release/vex.openvex.json)" -gt 0 ]; then
            cosign attest --yes --type openvex --predicate hack/release/vex.openvex.json "$IMAGE@$DIGEST"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Tag the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$TAG resolves to $tagged, not $DIGEST"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: |
            sbom-*.json
            grype-db-status.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installer
          path: |
            dist/install.yaml
            dist/crds.yaml
          if-no-files-found: error

  chart:
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write # push the image or chart to ghcr.io
      id-token: write # keyless cosign signing and attestations
      attestations: write # store build provenance and SBOM attestations
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      CHART_REPO: ${{ needs.version.outputs.chart_repo }}
      CHART: ${{ needs.version.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous tag gives the Artifact Hub change log.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make helm yq oras crane
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published chart
        run: CRANE=bin/crane hack/release/check-absent.sh "$CHART:$VERSION"
      - id: package
        name: Package the chart with the image digest pinned
        run: |
          tgz=$(HELM=bin/helm YQ=bin/yq hack/release/package-chart.sh "$TAG" "$IMAGE" "$IMAGE_DIGEST" dist)
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
      - name: Chart SBOMs and provenance
        env:
          TGZ: ${{ steps.package.outputs.tgz }}
        run: |
          HELM=bin/helm YQ=bin/yq hack/release/chart-sbom.sh "$TGZ" dist/chart.cdx.json dist/chart.spdx.json
          hack/release/provenance.sh > provenance.json
      # Pushed by digest only; the version tag follows once the signatures and attestations are in place.
      - id: push
        name: Push the chart by digest
        env:
          TGZ: ${{ steps.package.outputs.tgz }}
        run: |
          digest=$(HELM=bin/helm YQ=bin/yq ORAS=bin/oras hack/release/push-chart.sh "$TGZ" "$CHART")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # The second signature uses the legacy sha256-<digest>.sig tag, the only cosign layout Artifact Hub detects.
      - name: Sign and attest the chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$CHART@$DIGEST"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$CHART@$DIGEST"
          cosign attest --yes --type spdxjson --predicate dist/chart.spdx.json "$CHART@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate dist/chart.cdx.json "$CHART@$DIGEST"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$CHART@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.version.outputs.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Tag the chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          bin/oras tag "$CHART@$DIGEST" "$VERSION"
          tagged=$(bin/oras resolve "$CHART:$VERSION")
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$CHART:$VERSION resolves to $tagged, not $DIGEST"
            exit 1
          fi
      - name: Publish the Artifact Hub repository metadata
        working-directory: .github
        run: |
          ../bin/oras push "$CHART:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: |
            dist/*.tgz
            dist/chart.cdx.json
            dist/chart.spdx.json
          if-no-files-found: error

  # The OCM component version: image and chart by digest, install.yaml, crds.yaml and the SBOMs as local blobs, for
  # air-gapped mirrors (ocm transfer --copy-resources). Immutable, signed with the same identity as the rest.
  ocm:
    needs: [version, image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write # push the OCM component version to ghcr.io
      id-token: write # keyless cosign signing and provenance of the component descriptor
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      PLATFORMS: ${{ needs.image.outputs.platforms }}
      CHART: ${{ needs.version.outputs.chart }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make ocm crane yq
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-chart
          path: dist
      - name: Check the downloaded files
        run: |
          expected=(install.yaml crds.yaml "openbao-config-operator-$VERSION.tgz" chart.cdx.json chart.spdx.json grype-db-status.json)
          mapfile -t -O "${#expected[@]}" expected < <(jq -r '.[].platform | sub(".*/"; "") | "sbom-\(.).spdx.json", "sbom-\(.).cdx.json"' <<<"$PLATFORMS")
          diff <(printf '%s\n' "${expected[@]}" | sort) <(cd dist && find . -mindepth 1 | sed 's|^\./||' | sort)
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Verify the image and chart signatures of this run
        run: |
          pin=(--certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF")
          cosign verify "${pin[@]}" "$IMAGE@$IMAGE_DIGEST" >/dev/null
          cosign verify "${pin[@]}" "$CHART@$CHART_DIGEST" >/dev/null
      - id: push
        name: Build and push the component version
        run: |
          ocm_repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ocm"
          descriptor=$(OCM=bin/ocm CRANE=bin/crane OCM_REPO="$ocm_repo" DIST=dist \
            REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" hack/ocm/component.sh ocm-ctf)
          bin/ocm get componentversions --repo ocm-ctf -o yaml > ocm-component-descriptor.yaml
          {
            echo "ocm_repo=$ocm_repo"
            echo "descriptor=$descriptor"
          } >> "$GITHUB_OUTPUT"
      - name: Sign and attest the component descriptor
        env:
          DESCRIPTOR: ${{ steps.push.outputs.descriptor }}
        run: |
          hack/release/provenance.sh > provenance.json
          cosign sign --yes "$DESCRIPTOR"
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$DESCRIPTOR"
      - name: Verify the component version
        env:
          OCM_REPO: ${{ steps.push.outputs.ocm_repo }}
        run: |
          OCM=bin/ocm CRANE=bin/crane YQ=bin/yq REPOSITORY="$GITHUB_REPOSITORY" ASSETS_DIR=dist \
            hack/ocm/verify.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ocm
          path: ocm-component-descriptor.yaml
          if-no-files-found: error

  assets:
    needs: [version, image, chart, ocm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # keyless cosign signing of the checksums
      attestations: write # build provenance for the release assets
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      PLATFORMS: ${{ needs.image.outputs.platforms }}
      CHART: ${{ needs.version.outputs.chart }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-chart
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-ocm
          path: dist
      - name: Check the downloaded files
        run: |
          expected=(install.yaml crds.yaml "openbao-config-operator-$VERSION.tgz" chart.cdx.json chart.spdx.json grype-db-status.json ocm-component-descriptor.yaml)
          mapfile -t -O "${#expected[@]}" expected < <(jq -r '.[].platform | sub(".*/"; "") | "sbom-\(.).spdx.json", "sbom-\(.).cdx.json"' <<<"$PLATFORMS")
          diff <(printf '%s\n' "${expected[@]}" | sort) <(cd dist && find . -mindepth 1 | sed 's|^\./||' | sort)
      - name: Checksums
        run: (cd dist && sha256sum -- * > sha256sums.txt)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/sha256sums.txt.sigstore.json dist/sha256sums.txt
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/sha256sums.txt
      - name: Export the provenance as a release asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > dist/openbao-config-operator.intoto.jsonl
      - name: Release notes
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p notes
          PLATFORM_DIGESTS=$(jq -r '.[] | "\(.platform) \(.digest)"' <<<"$PLATFORMS") hack/release/notes.sh > notes/release-notes.md
          cat notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist
            notes
          if-no-files-found: error

  # pages.yml rebuilds the docs site and the Helm repository index after this workflow succeeds on a tag push.
  release:
    needs: [version, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Latest only for the highest stable version, so a backport release does not take it over.
          flags=(--latest=false)
          if [[ $TAG == *-* ]]; then
            flags+=(--prerelease)
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          else
            highest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            [ "$highest" = "$TAG" ] && flags=(--latest)
            prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "$TAG^" 2>/dev/null || true)
          fi
          [ -n "$prev" ] && flags+=(--notes-start-tag "$prev")
          cd release
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file notes/release-notes.md --generate-notes "${flags[@]}" \
            dist/install.yaml dist/crds.yaml dist/*.tgz dist/*.json dist/*.intoto.jsonl dist/ocm-component-descriptor.yaml dist/sha256sums.txt
