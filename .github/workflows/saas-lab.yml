name: SaaS OIDC regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/saas-lab.yml'
      - '.github/actions/setup-go/**'
      - 'hack/lab/**'
      - 'api/**'
      - 'internal/**'
      - 'cmd/**'
      - 'config/**'
      - 'hack/e2e/**'
      - 'test/e2e/testdata/**'
      - 'Makefile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'charts/**'
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

concurrency:
  group: saas-regression
  cancel-in-progress: false

jobs:
  regression:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.SAAS_REGRESSION_ENABLED == 'true' &&
       (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    name: OIDC regression / ${{ matrix.provider }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ matrix.provider }}-lab
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [okta, auth0]
    env:
      LAB_CONTEXT: kind-openbao-config-operator-lab
      SAAS_PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - name: Install lab tools
        timeout-minutes: 6
        run: |
          make kind helm
          echo "$PWD/bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts --prefix hack/lab/browser
      - name: Load provisioning credential
        env:
          SAAS_CREDENTIALS_JSON: ${{ secrets.SAAS_CREDENTIALS_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          raw = os.environ.get("SAAS_CREDENTIALS_JSON", "")
          try:
              value = json.loads(raw)
              if not isinstance(value, dict) or not value:
                  raise ValueError()
          except (ValueError, TypeError):
              raise SystemExit("Missing SAAS_CREDENTIALS_JSON environment secret") from None
          directory = Path(os.environ["RUNNER_TEMP"]) / "saas"
          directory.mkdir(mode=0o700)
          fd = os.open(directory / "credentials.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w") as stream:
              stream.write(raw)
          PY
      - name: Provision isolated provider resources
        timeout-minutes: 6
        run: |
          python3 "hack/lab/saas/$SAAS_PROVIDER.py" \
            --credentials "$RUNNER_TEMP/saas/credentials.json" \
            --state "$RUNNER_TEMP/saas/state.json" \
            --prefix "obco-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --apply
      - name: Deploy OpenBao and reconcile operator CRDs
        id: deploy
        timeout-minutes: 18
        run: |
          hack/lab/up.sh raft
          hack/lab/saas/run.sh apply --state "$RUNNER_TEMP/saas/state.json"
      - name: Human OIDC and operator access regression
        if: always() && steps.deploy.outcome == 'success'
        timeout-minutes: 16
        run: hack/lab/saas/run.sh showcase --state "$RUNNER_TEMP/saas/state.json"
      - name: JWT discovery and JWKS access regression
        if: always() && steps.deploy.outcome == 'success'
        timeout-minutes: 12
        run: hack/lab/saas/run.sh jwt --state "$RUNNER_TEMP/saas/state.json"
      - name: Remove owned provider resources
        id: cleanup
        timeout-minutes: 8
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/saas/state.json" ]; then
            python3 "hack/lab/saas/$SAAS_PROVIDER.py" \
              --credentials "$RUNNER_TEMP/saas/credentials.json" \
              --state "$RUNNER_TEMP/saas/state.json" \
              --prefix "obco-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --cleanup
          fi
      - name: Export credential-free recovery IDs after cleanup failure
        id: recovery
        if: always() && steps.cleanup.outcome != 'success'
        timeout-minutes: 1
        run: |
          if [ -f "$RUNNER_TEMP/saas/state.json" ]; then
            python3 hack/lab/saas/recovery.py --state "$RUNNER_TEMP/saas/state.json" \
              --output "$RUNNER_TEMP/saas-recovery.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.cleanup.outcome != 'success' && steps.recovery.outcome == 'success'
        timeout-minutes: 2
        with:
          name: saas-${{ matrix.provider }}-recovery
          path: ${{ runner.temp }}/saas-recovery.json
          retention-days: 7
          if-no-files-found: warn
      # Upload only validated recovery IDs; never full state or browser artifacts.
      - name: Remove local credentials and cluster
        timeout-minutes: 2
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/saas"
          if [ -x bin/kind ]; then
            bin/kind delete cluster --name openbao-config-operator-lab
          fi
