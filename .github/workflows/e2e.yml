name: e2e

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KIND_CLUSTER: openbao-config-operator-test-e2e
      # Must match managerImage in test/e2e so the suite reuses the image loaded here.
      E2E_IMG: example.com/openbao-config-operator:v0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]

      # kind boots its node and the live kit tools install while the manager and the suite compile with the job's
      # Go build cache; the release image is still built from the Dockerfile builder stage.
      - name: Create kind cluster and build the operator image
        run: |
          { make setup-test-e2e && make helm kustomize yq; } >"$RUNNER_TEMP/setup.log" 2>&1 &
          setup_pid=$!
          make docker-build-host IMG="$E2E_IMG"
          go test -tags=e2e -run='^$' ./test/e2e/
          setup_status=0
          wait "$setup_pid" || setup_status=$?
          cat "$RUNNER_TEMP/setup.log"
          [ "$setup_status" -eq 0 ]
          bin/kind load docker-image "$E2E_IMG" --name "$KIND_CLUSTER"

      # The suite deploys OpenBao and installs the chart itself; it reuses the image loaded above.
      - name: Run e2e tests
        env:
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_KEEP: "true"
        run: make test-e2e-run

      # Reuses the OpenBao and chart that the suite keeps with E2E_KEEP.
      - name: Apply the live kit in every connection mode
        run: |
          command -v htpasswd || { sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils; }
          test/livekit/kind.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 100 || true
          for ns in openbao-config-operator openbao-config-operator-system openbao openbao-live; do
            kubectl -n "$ns" logs --all-containers --prefix --tail=200 -l app.kubernetes.io/name || true
          done

      - name: Delete kind cluster
        if: always()
        run: make cleanup-test-e2e
