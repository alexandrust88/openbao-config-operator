name: e2e

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      KIND_CLUSTER: openbao-config-operator-test-e2e
      # Build tag. The build step retags this with the image id and exports that name for the suite.
      E2E_IMG: example.com/openbao-config-operator:v0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]

      - name: Check the complete live inventory
        env:
          LIVEKIT_INVENTORY_OUT: ${{ runner.temp }}/e2e/inventory.json
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          make kustomize
          go test -tags integration ./test/livekit -run '^TestLiveInventory$' -count=1 -json \
            | tee "$RUNNER_TEMP/e2e/inventory.jsonl"
          jq -se 'any(.[]; .Test == "TestLiveInventory" and .Action == "pass")' "$RUNNER_TEMP/e2e/inventory.jsonl"

      # kind boots its node and the live kit tools install while the manager and the suite compile with the job's
      # Go build cache; the release image is still built from the Dockerfile builder stage.
      - name: Create kind cluster and build the operator image
        run: |
          { make setup-test-e2e && make helm kustomize yq; } >"$RUNNER_TEMP/setup.log" 2>&1 &
          setup_pid=$!
          make docker-build-host IMG="$E2E_IMG"
          # A fixed tag does not change the pod spec when this commit's digest does, so the rollout keeps the old manager.
          id="$(docker image inspect --format '{{.Id}}' "$E2E_IMG")"
          hex="${id#sha256:}"
          built="$E2E_IMG"
          E2E_IMG="${built%:*}:${hex:0:12}"
          docker tag "$built" "$E2E_IMG"
          echo "E2E_IMG=$E2E_IMG" >> "$GITHUB_ENV"
          go test -tags=e2e -run='^$' ./test/e2e/
          setup_status=0
          wait "$setup_pid" || setup_status=$?
          cat "$RUNNER_TEMP/setup.log"
          [ "$setup_status" -eq 0 ]
          bin/kind load docker-image "$E2E_IMG" --name "$KIND_CLUSTER"

      # The suite deploys OpenBao and installs the chart itself; it reuses the image loaded above.
      - name: Run e2e tests
        env:
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_KEEP: "true"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/e2e"
          KIND="$PWD/bin/kind" HELM="$PWD/bin/helm" go test -tags=e2e ./test/e2e/ -count=1 -timeout 40m -v -ginkgo.v \
            -ginkgo.fail-on-empty -ginkgo.fail-on-pending -ginkgo.junit-report="$RUNNER_TEMP/e2e/junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/e2e/tests.log"
          python3 - "$RUNNER_TEMP/e2e/junit.xml" <<'PYTHON'
          import sys, xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          assert cases, "no e2e cases executed"
          assert not any(c.find("skipped") is not None for c in cases), "e2e cases were skipped"
          PYTHON

      # Reuses the OpenBao and chart that the suite keeps with E2E_KEEP.
      - name: Apply the live kit in every connection mode
        env:
          LIVEKIT_OUT: ${{ runner.temp }}/e2e/livekit
          LIVEKIT_TIMEOUT: 20m
        run: |
          set -o pipefail
          command -v htpasswd || { sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils; }
          test/livekit/kind.sh 2>&1 | tee "$RUNNER_TEMP/e2e/livekit.log"

      # The quickstart gets its own cluster: the suite and the live kit leave an operator, OpenBao and CRDs owned by
      # another Helm release in the first one. Deleting that cluster first keeps the runner to one kind node, and the
      # node image and the operator image are already local, so this adds a few minutes and no rebuild.
      - name: Run the docs quickstart against the locally built image and chart
        env:
          QUICKSTART_CLUSTER: openbao-quickstart
        run: |
          set -o pipefail
          make cleanup-test-e2e KIND_CLUSTER="$KIND_CLUSTER"
          make setup-test-e2e KIND_CLUSTER="$QUICKSTART_CLUSTER"
          bin/kind load docker-image "$E2E_IMG" --name "$QUICKSTART_CLUSTER"
          PATH="$PWD/bin:$PATH" KIND_CLUSTER="$QUICKSTART_CLUSTER" SKIP_KIND_CREATE=1 \
            CHART_REF=charts/openbao-config-operator IMAGE="$E2E_IMG" \
            VERSION="$(awk '/^version:/ {print $2}' charts/openbao-config-operator/Chart.yaml)" \
            hack/docs/quickstart.sh 2>&1 | tee "$RUNNER_TEMP/e2e/quickstart.log"

      # Every command the tutorial pages show runs here, on the cluster the quickstart left.
      - name: Run the docs tutorials on the quickstart cluster
        run: |
          set -o pipefail
          PATH="$PWD/bin:$PATH" KIND_CLUSTER=openbao-quickstart SKIP_KIND_CREATE=1 \
            hack/docs/tutorials.sh 2>&1 | tee "$RUNNER_TEMP/e2e/tutorials.log"

      - name: Diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          {
            kubectl get pods -A -o wide || true
            kubectl get events -A --sort-by=.lastTimestamp | tail -n 100 || true
            for ns in openbao-config-operator openbao-config-operator-system openbao openbao-2 openbao-live postgres; do
              kubectl -n "$ns" logs --all-containers --prefix --tail=200 -l app.kubernetes.io/name || true
            done
          } 2>&1 | tee "$RUNNER_TEMP/e2e/diagnostics.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results
          path: |
            ${{ runner.temp }}/e2e
            ${{ runner.temp }}/setup.log
          retention-days: 14
          if-no-files-found: error

      - name: Delete kind clusters
        if: always()
        run: |
          make cleanup-test-e2e
          make cleanup-test-e2e KIND_CLUSTER=openbao-quickstart
