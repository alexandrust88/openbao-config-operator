name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests and pushes scan only their commits; the weekly run rescans the whole history with current rules.
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          range=
          case "$EVENT_NAME" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                range="$PUSH_BEFORE..$GITHUB_SHA"
              fi
              ;;
          esac
          args=(git . --redact --no-banner --verbose)
          if [ -n "$range" ]; then
            # gitleaks exits 0 on a bad range, so prove both ends exist first.
            git cat-file -e "${range%%..*}^{commit}"
            git cat-file -e "${range##*..}^{commit}"
            args+=("--log-opts=$range")
          fi
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE" "${args[@]}"

  report-failure:
    needs:
      - gitleaks
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/report-failure.yml # zizmor: ignore[self-repository]
    permissions:
      issues: write # open or comment on the scheduled-failure issue
