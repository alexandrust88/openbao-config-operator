name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions: {}

# Not github.workflow: a call from release would share the caller's group and wait on itself.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make fmt-check vet mod-check
      - run: go vet -tags conformance,load,docs ./test/...
      - run: make lint-config lint
      - name: Validate local lab scripts
        run: |
          shellcheck -x hack/lab/*.sh hack/lab/plugins/*.sh
          python3 - <<'PYTHON'
          import ast
          from pathlib import Path
          for path in Path("hack/lab").rglob("*.py"):
              if "node_modules" not in path.parts:
                  ast.parse(path.read_text(), filename=str(path))
          PYTHON
          node --check hack/lab/browser/oidc.mjs
          python3 -m unittest discover -s hack/lab -p test_pki.py -v
      - name: Validate external plugin fixture module
        working-directory: test/livekit/pluginfixture
        run: |
          go mod tidy -diff
          go mod verify
          go vet ./...

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make bao
      - run: make test
      - name: Coverage floor
        env:
          # Measured 39.5% on 2026-11-14 (make test with bao); raise it as coverage grows.
          COVERAGE_FLOOR: "37.5"
        run: |
          total="$(go tool cover -func=cover.out | tail -n 1 | awk '{print $NF}' | tr -d %)"
          echo "Total coverage ${total}% (floor ${COVERAGE_FLOOR}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v floor="$COVERAGE_FLOOR" 'BEGIN { exit !(total >= floor) }'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: cover.out
          retention-days: 7

  # The serial suite takes about 15 minutes; shards by top-level test name keep each under 10. The last shard
  # skips every other shard's tests, so a new top-level test always runs somewhere.
  integration-shard:
    name: integration (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # renovate: datasource=docker depName=postgres
      POSTGRES_IMAGE: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sys
            run: ^Test(Integration|IntegrationSys.*|TemplatedACL)$
          - shard: auth
            run: ^Test(IntegrationAuth.*|IntegrationBuiltinAuth|Access)$
          - shard: secrets
            run: ^TestIntegrationSecrets.*$
          - shard: pki
            run: ^TestIntegrationPKI.*$
          - shard: identity
            run: ^TestIntegrationIdentity.*$
          - shard: rest
            run: .
            skip: ^Test(Integration|IntegrationSys.*|TemplatedACL|IntegrationAuth.*|IntegrationBuiltinAuth|Access|IntegrationSecrets.*|IntegrationPKI.*|IntegrationIdentity.*)$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make bao
      - if: matrix.shard == 'secrets'
        run: docker pull "$POSTGRES_IMAGE"
      - run: make test-integration
        env:
          INTEGRATION_RUN: ${{ matrix.run }}
          INTEGRATION_SKIP: ${{ matrix.skip }}

  # The required check: one stable name however the shards change.
  integration:
    needs: integration-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.integration-shard.result }}
        run: test "$RESULT" = success

  namespaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make bao
      - run: make test-namespaces

  livekit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - name: Install htpasswd for the bcrypt input Secret
        run: command -v htpasswd || { sudo apt-get update && sudo apt-get install -y --no-install-recommends apache2-utils; }
      - run: make live-render
      - run: make bao
      - name: Run the live kit
        env:
          LIVEKIT_LOG_DIR: ${{ runner.temp }}/livekit/logs
          LIVEKIT_OUT: ${{ runner.temp }}/livekit/e2e.md
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/livekit"
          make test-livekit 2>&1 | tee "$RUNNER_TEMP/livekit/tests.log"
          test -s "$LIVEKIT_OUT"
          test -s "$LIVEKIT_OUT.coverage.json"
      - name: End-to-end summary
        if: always()
        run: if [ -f "$RUNNER_TEMP/livekit/e2e.md" ]; then cat "$RUNNER_TEMP/livekit/e2e.md" >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: livekit-results
          path: ${{ runner.temp }}/livekit
          retention-days: 14
          if-no-files-found: error

  verify-generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make verify-generated

  docs-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make docs-lint
      # go test -json becomes a JUnit report; the step fails on a test failure, a missing top-level test, no manifest
      # subtests or any skipped test.
      - name: Dry-run every manifest the docs show
        run: |
          mkdir -p "$RUNNER_TEMP/docs"
          status=0
          make test-docs TEST_DOCS_FLAGS=-json >"$RUNNER_TEMP/docs/tests.jsonl" 2>&1 || status=$?
          python3 - "$RUNNER_TEMP/docs/tests.jsonl" "$RUNNER_TEMP/docs/junit.xml" <<'PYTHON'
          import json, os, sys, xml.etree.ElementTree as ET
          results, output = {}, {}
          with open(sys.argv[1]) as f:
              for line in f:
                  try:
                      event = json.loads(line)
                  except ValueError:
                      print(line, end="")
                      continue
                  if not isinstance(event, dict) or not event.get("Test"):
                      continue
                  if event["Action"] == "output":
                      output.setdefault(event["Test"], []).append(event.get("Output", ""))
                  elif event["Action"] in ("pass", "fail", "skip"):
                      results[event["Test"]] = (event["Action"], event.get("Elapsed", 0))
          counts = {"pass": 0, "fail": 0, "skip": 0}
          suite = ET.Element("testsuite", name="docs-examples")
          for name, (action, elapsed) in sorted(results.items()):
              counts[action] += 1
              case = ET.SubElement(suite, "testcase", classname="test/docs", name=name, time=str(elapsed))
              text = "".join(output.get(name, []))
              if action == "fail":
                  ET.SubElement(case, "failure", message="failed").text = text
                  print(text, end="")
              elif action == "skip":
                  ET.SubElement(case, "skipped", message="skipped").text = text
          suite.set("tests", str(len(results)))
          suite.set("failures", str(counts["fail"]))
          suite.set("skipped", str(counts["skip"]))
          ET.ElementTree(suite).write(sys.argv[2], encoding="utf-8", xml_declaration=True)
          summary = f"docs examples: {counts['pass']} passed, {counts['fail']} failed, {counts['skip']} skipped"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          required = {"TestManifestsDryRun", "TestSnippetReferences", "TestVersionTokens", "TestNoDuplicatedManifests"}
          assert required <= results.keys(), f"top-level tests did not run: {sorted(required - results.keys())}"
          assert any(n.startswith("TestManifestsDryRun/") for n in results), "no manifest subtests ran"
          assert not counts["skip"], "docs tests were skipped"
          PYTHON
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docs-examples-results
          path: ${{ runner.temp }}/docs
          retention-days: 14
          if-no-files-found: error

  api-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make api-coverage
      - run: git diff --exit-code -- docs/api-coverage.md

  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make govulncheck

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make helm-lint
      - name: Install helm-unittest
        env:
          # renovate: datasource=github-release-attachments depName=helm-unittest/helm-unittest
          HELM_UNITTEST_VERSION: v1.0.3
          HELM_UNITTEST_SHA256: 9761f23d9509c98770c026e019e743b524b57010f4bc29175f78d2582ace0633
        run: |
          archive="$RUNNER_TEMP/helm-unittest.tgz"
          curl -fsSLo "$archive" "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION#v}.tgz"
          echo "${HELM_UNITTEST_SHA256}  ${archive}" | sha256sum -c -
          plugin_dir="$(bin/helm env HELM_PLUGINS)/unittest"
          mkdir -p "$plugin_dir"
          tar -xzf "$archive" -C "$plugin_dir" untt plugin.yaml
      - run: bin/helm unittest charts/openbao-config-operator
      - run: make validate-manifests
