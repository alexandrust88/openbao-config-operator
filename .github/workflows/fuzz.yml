name: fuzz

# Pull requests run only the seed corpora (make test); this nightly run explores new inputs. Not a required check.
on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: openbao, target: FuzzValidatePath }
          - { pkg: openbao, target: FuzzLoginPath }
          - { pkg: openbao, target: FuzzValidateNamespace }
          - { pkg: openbao, target: FuzzJoinNamespace }
          - { pkg: engine, target: FuzzDiff }
          - { pkg: engine, target: FuzzWriteOnlyHash }
          - { pkg: engine, target: FuzzAbsPath }
          - { pkg: importer, target: FuzzObjectName }
          - { pkg: importer, target: FuzzUniqueName }
          - { pkg: connection, target: FuzzJWTAudiences }
          - { pkg: connection, target: FuzzJWTAudiencesRaw }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test -run '^$' -fuzz "^${TARGET}$" -fuzztime 2m "./internal/${PKG}/"
      # A failing input is written to testdata/fuzz/<target>/; commit it to keep it as a regression seed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: internal/*/testdata/fuzz
          retention-days: 14

  report-failure:
    needs:
      - fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the scheduled-failure issue
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          title="Scheduled $GITHUB_WORKFLOW run failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --label area/ci --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $run_url"
          else
            gh issue create --title "$title" --label area/ci --label priority/important-soon --body "The scheduled run failed: $run_url"
          fi
