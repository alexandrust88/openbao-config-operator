name: conformance

# The matrix reconciles every kind against bao server -dev for over an hour: pull requests run it only when they
# touch the kinds, the engine or the bao pin, and it is not a required check.
on:
  pull_request:
    paths:
      - api/**
      - internal/controller/**
      - internal/engine/**
      - test/conformance/**
      - Makefile
      - hack/e2e/**
      - .github/workflows/conformance.yml
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-conformance-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make bao
      - run: make test-conformance
        env:
          CONF_OUT: ${{ runner.temp }}/conformance.md
      - name: Matrix summary
        if: always()
        run: cat "$RUNNER_TEMP/conformance.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance.md
          retention-days: 14

  # The whole integration suite under the race detector, unsharded: too slow for the pull request gate.
  integration-race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      # renovate: datasource=docker depName=postgres
      POSTGRES_IMAGE: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-integration-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make bao
      - run: docker pull "$POSTGRES_IMAGE"
      - run: make test-integration
        env:
          INTEGRATION_FLAGS: -race -timeout 90m

  report-failure:
    needs:
      - conformance
      - integration-race
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the scheduled-failure issue
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          title="Scheduled $GITHUB_WORKFLOW run failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --label area/ci --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $run_url"
          else
            gh issue create --title "$title" --label area/ci --label priority/important-soon --body "The scheduled run failed: $run_url"
          fi
