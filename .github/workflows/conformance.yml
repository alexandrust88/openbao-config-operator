name: conformance

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make bao
      - run: make test-conformance
        env:
          CONF_OUT: ${{ runner.temp }}/conformance.md
      - name: Matrix summary
        if: always()
        run: cat "$RUNNER_TEMP/conformance.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance.md
          retention-days: 14

  # The whole integration suite under the race detector, unsharded: too slow for the pull request gate.
  integration-race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      # renovate: datasource=docker depName=postgres
      POSTGRES_IMAGE: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go # zizmor: ignore[self-repository]
      - run: make bao
      - run: docker pull "$POSTGRES_IMAGE"
      - run: make test-integration
        env:
          INTEGRATION_FLAGS: -race -timeout 90m

  report-failure:
    needs:
      - conformance
      - integration-race
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/report-failure.yml # zizmor: ignore[self-repository]
    permissions:
      issues: write # open or comment on the scheduled-failure issue
