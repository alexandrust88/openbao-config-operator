name: vulnerabilities

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=docker depName=ghcr.io/google/osv-scanner
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde

jobs:
  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exit 1 is a finding, 127 is "no verdict" (osv.dev unreachable or the matcher failed); both fail the job.
      - name: osv-scanner
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$OSV_SCANNER_IMAGE" \
            scan source --recursive --format table .

  # ci.yml runs govulncheck on every pull request and push; this nightly run catches advisories published since.
  govulncheck-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make govulncheck

  report-failure:
    needs:
      - osv-scanner
      - govulncheck-nightly
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the scheduled-failure issue
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          title="Scheduled $GITHUB_WORKFLOW run failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --label area/ci --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $run_url"
          else
            gh issue create --title "$title" --label area/ci --label priority/important-soon --body "The scheduled run failed: $run_url"
          fi
