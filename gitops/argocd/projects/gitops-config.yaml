apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-config
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/alexandrust88/openbao-config-operator.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: obco-gitops
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: core.obco.dev
      kind: BaoConnection
    - group: sys.obco.dev
      kind: ACLPolicy
    - group: sys.obco.dev
      kind: SecretsMount
    - group: sys.obco.dev
      kind: AuthMount
    - group: sys.obco.dev
      kind: BaoNamespace
    - group: auth.obco.dev
      kind: AppRole
    - group: secrets.obco.dev
      kind: TransitKey
  clusterResourceWhitelist:
    - group: core.obco.dev
      kind: BaoServer
  orphanedResources:
    warn: false
