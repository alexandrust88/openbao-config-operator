apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-root
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/alexandrust88/openbao-config-operator.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
  clusterResourceWhitelist: []
  orphanedResources:
    warn: false
