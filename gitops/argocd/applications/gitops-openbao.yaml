apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: gitops-openbao
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 8
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.30.7
      helm:
        releaseName: openbao
        valueFiles:
          - $values/gitops/openbao/values.yaml
    - repoURL: https://github.com/alexandrust88/openbao-config-operator.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alexandrust88/openbao-config-operator.git
      targetRevision: main
      path: gitops/openbao/bootstrap
