apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-openbao-init
  namespace: openbao
data:
  init.hcl: |
    initialize "lab" {
      request "admin-policy" {
        operation = "update"
        path = "sys/policies/acl/gitops-bootstrap"
        data = {
          policy = "path \"*\" { capabilities = [\"create\", \"read\", \"update\", \"patch\", \"delete\", \"list\", \"sudo\"] }"
        }
      }
      request "admin-token" {
        operation = "update"
        path = "auth/token/create-orphan"
        data = {
          id = { eval_type = "string", eval_source = "env", env_var = "E2E_TOKEN", require_present = true }
          policies = ["gitops-bootstrap"]
        }
      }
    }
