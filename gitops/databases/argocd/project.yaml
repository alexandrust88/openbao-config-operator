apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: database-lab
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/alexandrust88/openbao-config-operator.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: obco-gitops
  namespaceResourceWhitelist:
    - {group: sys.obco.dev, kind: BaoNamespace}
    - {group: sys.obco.dev, kind: SecretsMount}
    - {group: sys.obco.dev, kind: AuthMount}
    - {group: sys.obco.dev, kind: ACLPolicy}
    - {group: auth.obco.dev, kind: KubernetesAuthConfig}
    - {group: auth.obco.dev, kind: KubernetesAuthRole}
    - {group: secrets.obco.dev, kind: DatabaseConnection}
    - {group: secrets.obco.dev, kind: DatabaseRole}
  clusterResourceWhitelist: []
