apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 1m
  releaseName: openbao
  targetNamespace: openbao
  serviceAccountName: platform-reconciler
  install:
    createNamespace: true
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: openbao
      version: 0.30.7
      sourceRef:
        kind: HelmRepository
        name: openbao-chart
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: openbao-helm-values
      valuesKey: values.yaml
