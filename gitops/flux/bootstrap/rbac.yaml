apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: platform-reconciler
      namespace: flux-system
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: config-reconciler
      namespace: flux-system
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: gitops-platform
    subjects:
      - kind: ServiceAccount
        name: platform-reconciler
        namespace: flux-system
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: gitops-config
      namespace: obco-gitops
    rules:
      - apiGroups:
          - core.openbaoconfig.io
          - sys.openbaoconfig.io
          - auth.openbaoconfig.io
          - secrets.openbaoconfig.io
        resources:
          - '*'
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      - apiGroups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: gitops-config
      namespace: obco-gitops
    subjects:
      - kind: ServiceAccount
        name: config-reconciler
        namespace: flux-system
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: gitops-config
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: gitops-server
    rules:
      - apiGroups:
          - core.openbaoconfig.io
        resources:
          - openbaoservers
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: gitops-server
    subjects:
      - kind: ServiceAccount
        name: config-reconciler
        namespace: flux-system
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: gitops-server
