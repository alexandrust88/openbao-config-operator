apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-crl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-crl
  template:
    metadata:
      labels:
        app: livekit-crl
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crl
          image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command: [/bin/busybox, httpd, -f, -p, "8080", -h, /crls]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ca.crl
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: crls
              mountPath: /crls
              readOnly: true
      volumes:
        - name: crls
          configMap:
            name: livekit-crl
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-crl
spec:
  selector:
    app: livekit-crl
  ports:
    - name: http
      port: 8080
      targetPort: http
