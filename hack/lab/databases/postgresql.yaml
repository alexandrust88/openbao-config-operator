apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: database-init
      namespace: obco-db-postgresql
    data:
      00-init.sql: |
        CREATE SCHEMA lab_root; CREATE TABLE lab_root.probe (id INTEGER PRIMARY KEY, value TEXT NOT NULL); INSERT INTO lab_root.probe VALUES (1, 'root-fixture'); REVOKE ALL ON SCHEMA lab_root FROM PUBLIC;
        CREATE SCHEMA lab_alpha; CREATE TABLE lab_alpha.probe (id INTEGER PRIMARY KEY, value TEXT NOT NULL); INSERT INTO lab_alpha.probe VALUES (1, 'alpha-fixture'); REVOKE ALL ON SCHEMA lab_alpha FROM PUBLIC;
      pg_hba.conf: |
        local all all trust
        hostssl all all 0.0.0.0/0 scram-sha-256
        hostssl all all ::/0 scram-sha-256
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: postgresql
      namespace: obco-db-postgresql
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: postgresql
      template:
        metadata:
          labels:
            app: postgresql
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgresql
              image: docker.io/library/postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
              args:
                - -c
                - ssl=on
                - -c
                - ssl_cert_file=/tls/tls.crt
                - -c
                - ssl_key_file=/tls/tls.key
                - -c
                - ssl_ca_file=/tls/ca.crt
                - -c
                - hba_file=/bootstrap/pg_hba.conf
              env:
                - name: POSTGRES_USER
                  value: openbao
                - name: POSTGRES_DB
                  value: app
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-admin
                      key: password
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              ports:
                - containerPort: 5432
              readinessProbe:
                tcpSocket:
                  port: 5432
                periodSeconds: 2
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
                - name: run
                  mountPath: /var/run/postgresql
                - name: tmp
                  mountPath: /tmp
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: init
                  mountPath: /docker-entrypoint-initdb.d
                  readOnly: true
                - name: init
                  mountPath: /bootstrap
                  readOnly: true
          volumes:
            - name: data
              emptyDir: {}
            - name: run
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: tls
              secret:
                secretName: db-tls
                defaultMode: 416
            - name: init
              configMap:
                name: database-init
  - apiVersion: v1
    kind: Service
    metadata:
      name: postgresql
      namespace: obco-db-postgresql
    spec:
      selector:
        app: postgresql
      ports:
        - port: 5432
