apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: database-init
      namespace: obco-db-mariadb
    data:
      00-init.sql: |
        CREATE DATABASE lab_root; CREATE TABLE lab_root.probe (id INTEGER PRIMARY KEY, value VARCHAR(64) NOT NULL); INSERT INTO lab_root.probe VALUES (1, 'root-fixture');
        CREATE DATABASE lab_alpha; CREATE TABLE lab_alpha.probe (id INTEGER PRIMARY KEY, value VARCHAR(64) NOT NULL); INSERT INTO lab_alpha.probe VALUES (1, 'alpha-fixture');
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mariadb
      namespace: obco-db-mariadb
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: mariadb
      template:
        metadata:
          labels:
            app: mariadb
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mariadb
              image: docker.io/library/mariadb:11.8.9@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
              args:
                - --require-secure-transport=ON
                - --ssl-ca=/tls/ca.crt
                - --ssl-cert=/tls/tls.crt
                - --ssl-key=/tls/tls.key
              env:
                - name: MARIADB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-admin
                      key: password
                - name: MARIADB_ROOT_HOST
                  value: '%'
              ports:
                - containerPort: 3306
              readinessProbe:
                tcpSocket:
                  port: 3306
                periodSeconds: 2
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /var/lib/mysql
                - name: run
                  mountPath: /var/run/mysqld
                - name: tmp
                  mountPath: /tmp
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: init
                  mountPath: /docker-entrypoint-initdb.d
                  readOnly: true
          volumes:
            - name: data
              emptyDir: {}
            - name: run
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: tls
              secret:
                secretName: db-tls
                defaultMode: 416
            - name: init
              configMap:
                name: database-init
  - apiVersion: v1
    kind: Service
    metadata:
      name: mariadb
      namespace: obco-db-mariadb
    spec:
      selector:
        app: mariadb
      ports:
        - port: 3306
