apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: database-init
      namespace: obco-db-mysql
    data:
      00-init.sql: |
        CREATE DATABASE lab_root; CREATE TABLE lab_root.probe (id INTEGER PRIMARY KEY, value VARCHAR(64) NOT NULL); INSERT INTO lab_root.probe VALUES (1, 'root-fixture');
        CREATE DATABASE lab_alpha; CREATE TABLE lab_alpha.probe (id INTEGER PRIMARY KEY, value VARCHAR(64) NOT NULL); INSERT INTO lab_alpha.probe VALUES (1, 'alpha-fixture');
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mysql
      namespace: obco-db-mysql
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: mysql
      template:
        metadata:
          labels:
            app: mysql
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: prepare-tls
              image: docker.io/library/mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
              command:
                - sh
                - -ec
                - |
                  umask 077
                  for file in ca.crt tls.crt tls.key; do
                    cp "/tls-source/$file" "/tls/$file"
                    chmod 0600 "/tls/$file"
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: tls-source
                  mountPath: /tls-source
                  readOnly: true
                - name: tls
                  mountPath: /tls
          containers:
            - name: mysql
              image: docker.io/library/mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
              args:
                - --require-secure-transport=ON
                - --ssl-ca=/etc/mysql/tls/ca.crt
                - --ssl-cert=/etc/mysql/tls/tls.crt
                - --ssl-key=/etc/mysql/tls/tls.key
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-admin
                      key: password
                - name: MYSQL_ROOT_HOST
                  value: '%'
              ports:
                - containerPort: 3306
              readinessProbe:
                tcpSocket:
                  port: 3306
                periodSeconds: 2
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /var/lib/mysql
                - name: run
                  mountPath: /var/run/mysqld
                - name: tmp
                  mountPath: /tmp
                - name: tls
                  mountPath: /etc/mysql/tls
                  readOnly: true
                - name: init
                  mountPath: /docker-entrypoint-initdb.d
                  readOnly: true
          volumes:
            - name: data
              emptyDir: {}
            - name: run
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: tls
              emptyDir:
                medium: Memory
            - name: tls-source
              secret:
                secretName: db-tls
                defaultMode: 416
            - name: init
              configMap:
                name: database-init
  - apiVersion: v1
    kind: Service
    metadata:
      name: mysql
      namespace: obco-db-mysql
    spec:
      selector:
        app: mysql
      ports:
        - port: 3306
