apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: obco-lab-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obco-lab-keycloak
  template:
    metadata:
      labels:
        app: obco-lab-keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0@sha256:5f3fb534cde6bf006d79f5912473e5d2c828c707cdfc52e16972803aca9d43dd
          args: [start-dev, --import-realm]
          env:
            - name: KC_HOSTNAME
              value: http://keycloak.obco-lab-identity.svc:8080
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          secret:
            secretName: identity-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: obco-lab-identity
spec:
  selector:
    app: obco-lab-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
