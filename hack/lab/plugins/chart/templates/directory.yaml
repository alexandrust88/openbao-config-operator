apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-ldap
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-ldap}
  template:
    metadata:
      labels: {app: lab-ldap}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: ldap
          image: {{ .Values.directory.image | quote }}
          env:
            - {name: UID, value: "1000"}
            - {name: GID, value: "1000"}
            - {name: LLDAP_LDAP_BASE_DN, value: "dc=example,dc=org"}
            - {name: LLDAP_LDAP_USER_DN, value: "admin"}
            - {name: LLDAP_LDAPS_OPTIONS__ENABLED, value: "true"}
            - {name: LLDAP_LDAPS_OPTIONS__CERT_FILE, value: /tls/tls.crt}
            - {name: LLDAP_LDAPS_OPTIONS__KEY_FILE, value: /tls/tls.key}
            - name: LLDAP_LDAP_USER_PASS
              valueFrom:
                secretKeyRef: {name: {{ .Values.directory.credentialsSecret | quote }}, key: password}
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.directory.credentialsSecret | quote }}, key: jwt}
            - name: LLDAP_KEY_SEED
              valueFrom:
                secretKeyRef: {name: {{ .Values.directory.credentialsSecret | quote }}, key: seed}
          ports:
            - {name: ldaps, containerPort: 6360}
          readinessProbe:
            tcpSocket: {port: ldaps}
            initialDelaySeconds: 5
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: tls
          secret:
            secretName: {{ .Values.directory.tlsSecret | quote }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: lab-ldap
spec:
  selector: {app: lab-ldap}
  ports:
    - {name: ldaps, port: 6360, targetPort: ldaps}
