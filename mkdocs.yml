# The GitHub organisation is not final: CI (.github/workflows/pages.yml) sets SITE_URL from actions/configure-pages
# and REPO_URL from the repository it runs in, so only local builds use the fallbacks below.
# Local build: pip install --require-hashes -r hack/docs/requirements.txt && mkdocs build (output in .tmp/site).
site_name: OpenBao Config Operator
site_description: Manage OpenBao policies, auth methods, secrets engines and identity as Kubernetes custom resources, with GitOps.
site_url: !ENV [SITE_URL, "https://alexandrust88.github.io/openbao-config-operator/"]
repo_url: !ENV [REPO_URL, "https://github.com/alexandrust88/openbao-config-operator"]
repo_name: openbao-config-operator
edit_uri: edit/main/docs/
copyright: Apache License 2.0

docs_dir: docs
site_dir: .tmp/site
strict: true

# overrides/ is the theme custom_dir; operations/runbooks.md is a GitHub-only stub for released alert links.
exclude_docs: |
  overrides/
  operations/runbooks.md

hooks:
  - hack/docs/hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  not_found: warn

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  social:
    - icon: fontawesome/brands/github
      link: !ENV [REPO_URL, "https://github.com/alexandrust88/openbao-config-operator"]
      name: Source code on GitHub

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  # Manifests and quickstart steps are included from the files CI tests; a wrong path fails the strict build.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

