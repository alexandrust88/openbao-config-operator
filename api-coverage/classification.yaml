# Classification of every writable (POST, PUT, PATCH, DELETE) path template in the OpenAPI snapshots
# api-coverage/openapi-<minor>.json. Each path has exactly one class:
#   typed: <Kind>             a CRD kind in config/crd/bases configures the object behind the path
#   endpoint-only: <reason>   configuration without a typed kind; use the OpenBaoEndpoint kind
#                             ("unreviewed" marks a path nobody has classified yet)
#   action: <reason>          a one-off operation, not configuration (login, issue, sign, rotate, ...)
# go test ./test/apicoverage/... fails on an unclassified, doubly classified or stale path and on an
# unknown kind; go run ./hack/apicoverage rewrites docs/api-coverage.md.
