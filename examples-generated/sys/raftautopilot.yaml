# RaftAutopilot (sys.openbaoconfig.io/v1alpha1)
# RaftAutopilot manages the raft autopilot settings at sys/storage/raft/autopilot/configuration: dead server cleanup,
# health thresholds and voter promotion.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/sys/#raftautopilot
# Curated example: examples/sys/raftautopilot.yaml
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: RaftAutopilot
metadata:
  name: example
  namespace: openbao-config
spec:
  cleanupDeadServers: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deadServerLastContactThreshold: 1h
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  lastContactThreshold: 1h
  managementPolicy: Manage
  maxTrailingLogs: 1
  minQuorum: 3
  serverStabilizationTime: 1h
