# KeyRotationConfig (sys.obco.dev/v1alpha1)
# KeyRotationConfig sets the automatic rotation of the barrier encryption key (the key that encrypts OpenBao storage,
# not a secret) at sys/rotate/config, a singleton of the root namespace or a sealable namespace.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/sys/#keyrotationconfig
# Curated example: examples/sys/keyrotationconfig.yaml
apiVersion: sys.obco.dev/v1alpha1
kind: KeyRotationConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  enabled: true
  interval: "0"
  managementPolicy: Manage
  maxOperations: 1000000
  openbaoNamespace: example
