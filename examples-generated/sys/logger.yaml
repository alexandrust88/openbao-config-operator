# Logger (sys.obco.dev/v1alpha1)
# Logger sets the runtime log level of one named OpenBao logger at sys/loggers/<name>, for example to debug one
# subsystem without restarting the server.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, level.
#
# Reference: https://docs.obco.dev/reference/api/sys/#logger
# Curated example: examples/sys/logger.yaml
apiVersion: sys.obco.dev/v1alpha1
kind: Logger
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  level: trace
  managementPolicy: Manage
  name: example
