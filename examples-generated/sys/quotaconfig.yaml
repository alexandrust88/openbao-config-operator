# QuotaConfig (sys.obco.dev/v1alpha1)
# QuotaConfig manages the server-wide rate-limit quota settings at sys/quotas/config: exempt paths, audit logging of
# rejections and response headers.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/sys/#quotaconfig
# Curated example: examples/sys/quotaconfig.yaml
apiVersion: sys.obco.dev/v1alpha1
kind: QuotaConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  enableRateLimitAuditLogging: true
  enableRateLimitResponseHeaders: true
  managementPolicy: Manage
  rateLimitExemptPaths:
  - example
