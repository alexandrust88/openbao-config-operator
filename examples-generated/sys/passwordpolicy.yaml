# PasswordPolicy (sys.openbaoconfig.io/v1alpha1)
# PasswordPolicy manages an OpenBao password policy at sys/policies/password/<name>: the rules secrets engines
# (database, LDAP and others) and RandomSecret use to generate passwords.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, policy.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/sys/#passwordpolicy
# Curated example: examples/sys/passwordpolicy.yaml
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: PasswordPolicy
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: example
  namespace: example
  policy: |
    path "secret/data/example/*" {
      capabilities = ["read"]
    }
