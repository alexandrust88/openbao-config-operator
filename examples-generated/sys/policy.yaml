# Policy (sys.openbaoconfig.io/v1alpha1)
# Policy manages an OpenBao ACL policy at sys/policies/acl/<name>, which grants capabilities on paths to the tokens it
# is attached to.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, policy.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/sys/#policy
# Curated example: examples/sys/policy.yaml
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: example
  namespace: openbao-config
spec:
  accessorRefs:
    example:
      authMountRef:
        name: example
  allowSlashesInIdentityTemplates: true
  allowWildcardsInIdentityTemplates: true
  casRequired: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: example
  namespace: example
  policy: |
    path "secret/data/example/*" {
      capabilities = ["read"]
    }
