# OpenBaoNamespace (sys.openbaoconfig.io/v1alpha1)
# OpenBaoNamespace creates an OpenBao namespace at sys/namespaces/<name> inside the parent namespace selected by
# namespace (the connection namespace when unset).
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/sys/#openbaonamespace
# Curated example: examples/sys/openbaonamespace.yaml
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: OpenBaoNamespace
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  customMetadata:
    example: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: example
  namespace: example
