# UIHeader (sys.openbaoconfig.io/v1alpha1)
# UIHeader manages a custom HTTP response header that OpenBao returns with its web UI, at
# sys/config/ui/headers/<name>, for example a Content-Security-Policy.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, values.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/sys/#uiheader
# Curated example: examples/sys/uiheader.yaml
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: UIHeader
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: example
  values:
  - example
