apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  allowedKubernetesNamespaceSelector: example
  allowedKubernetesNamespaces:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  extraAnnotations:
    example: example
  extraLabels:
    example: example
  kubernetesRoleType: Role
  managementPolicy: Manage
  mountPath: example
  name: example
  nameTemplate: example
  namespace: example
  serviceAccountName: example
  tokenDefaultAudiences:
  - example
  tokenDefaultTTL: 1h
  tokenMaxTTL: 1h
