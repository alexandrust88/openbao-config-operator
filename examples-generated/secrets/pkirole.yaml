apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIRole
metadata:
  name: example
  namespace: openbao-config
spec:
  allowAnyName: true
  allowBareDomains: true
  allowGlobDomains: true
  allowGlobsInIdentityTemplates: true
  allowIPSANs: true
  allowLocalhost: true
  allowSubdomains: true
  allowWildcardCertificates: true
  allowedDomains:
  - example
  allowedDomainsTemplate: true
  allowedIPSANsCIDR:
  - 10.0.0.0/8
  allowedOtherSANs:
  - example
  allowedSerialNumbers:
  - example
  allowedURISANs:
  - https://openbao.example.com:8200
  allowedURISANsTemplate: true
  allowedUserIDs:
  - example
  basicConstraintsValidForNonCA: true
  clientFlag: true
  cnValidations:
  - email
  codeSigningFlag: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  country:
  - example
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  emailProtectionFlag: true
  enforceHostnames: true
  extKeyUsage:
  - ServerAuth
  extKeyUsageOIDs:
  - 127.0.0.1
  generateLease: true
  issuer:
    issuerName: https://openbao.example.com:8200
  keyBits: 44
  keyType: mldsa
  keyUsage:
  - DigitalSignature
  locality:
  - example
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: pki
  name: example
  namespace: example
  noStore: false
  notAfter: 0000-00-00T00:00:00Z
  notAfterBound: permit
  notBefore: 0000-00-00T00:00:00Z
  notBeforeBound: permit
  notBeforeDuration: 1h
  organization:
  - example
  ou:
  - example
  policyIdentifiers:
  - 127.0.0.1
  postalCode:
  - example
  province:
  - example
  requireCN: true
  serverFlag: true
  signatureBits: 256
  streetAddress:
  - https://openbao.example.com:8200
  ttl: 1h
  useCSRCommonName: true
  useCSRSANs: true
  usePSS: true
