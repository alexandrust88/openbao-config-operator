# GCPSecretsConfig (secrets.openbaoconfig.io/v1alpha1)
# GCPSecretsConfig sets the configuration of a GCP secrets engine (external plugin) at `<mount>/config`: the service
# account credentials OpenBao uses and the lease limits.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#gcpsecretsconfig
# Curated example: examples/secrets/gcpsecretsconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: GCPSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  credentialsSecretRef:
    key: value
    name: gcpsecretsconfig-credentials-secret-ref
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: gcp
  namespace: example
  ttl: 1h
---
apiVersion: v1
kind: Secret
metadata:
  name: gcpsecretsconfig-credentials-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
