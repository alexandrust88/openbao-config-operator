apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: GCPSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  credentialsSecretRef:
    key: value
    name: gcpsecretsconfig-credentials-secret-ref
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: gcp
  namespace: example
  ttl: 1h
---
apiVersion: v1
kind: Secret
metadata:
  name: gcpsecretsconfig-credentials-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
