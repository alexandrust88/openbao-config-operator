apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsDynamicRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationLDIF: example
  creationPolicy: Create
  defaultTTL: 1h
  deletionLDIF: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: ldap
  name: example
  namespace: example
  rollbackLDIF: example
  usernameTemplate: example
