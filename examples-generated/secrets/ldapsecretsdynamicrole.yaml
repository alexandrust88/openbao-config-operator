# LDAPSecretsDynamicRole (secrets.openbaoconfig.io/v1alpha1)
# LDAPSecretsDynamicRole manages a dynamic role of an LDAP secrets plugin mount (external plugin) at
# `<mount>/role/<name>`: each request to `<mount>/creds/<name>` creates a short-lived directory account from LDIF
# templates.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, creationLDIF, deletionLDIF.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#ldapsecretsdynamicrole
# Curated example: examples/secrets/ldapsecretsdynamicrole.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsDynamicRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationLDIF: example
  creationPolicy: Create
  defaultTTL: 1h
  deletionLDIF: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: ldap
  name: example
  namespace: example
  rollbackLDIF: example
  usernameTemplate: example
