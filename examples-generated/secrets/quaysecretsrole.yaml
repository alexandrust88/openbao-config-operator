# QuaySecretsRole (secrets.obco.dev/v1alpha1)
# QuaySecretsRole manages a role of a Quay secrets plugin mount (external plugin) at `<mount>/roles/<name>`: each
# request to `<mount>/creds/<name>` creates a short-lived robot account with the listed permissions.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, namespaceName.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#quaysecretsrole
# Curated example: examples/secrets/quaysecretsrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: QuaySecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  createRepositories: true
  creationPolicy: Create
  defaultPermission: admin
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: quay
  name: example
  namespaceName: example
  namespaceType: organization
  openbaoNamespace: example
  repositories:
    example: admin
  teams:
    example: admin
  ttl: 1h
