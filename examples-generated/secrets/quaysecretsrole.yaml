apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: QuaySecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  createRepositories: true
  creationPolicy: Create
  defaultPermission: admin
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: quay
  name: example
  namespace: example
  namespaceName: example
  namespaceType: organization
  repositories:
    example: admin
  teams:
    example: admin
  ttl: 1h
