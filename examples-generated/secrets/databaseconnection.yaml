apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: example
  namespace: openbao-config
spec:
  allowedRoles:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: example
  name: example
  namespace: example
  passwordPolicy: default
  passwordSecretRef:
    key: value
    name: databaseconnection-password-secret-ref
  pluginConfig:
    example: example
  pluginName: postgresql-database-plugin
  pluginVersion: v0.0.0
  postgresql:
    connectionURL: https://openbao.example.com:8200
    disableEscaping: true
    maxConnectionLifetime: 1h
    maxIdleConnections: 1
    maxOpenConnections: 1
    passwordAuthentication: password
    username: example
    usernameTemplate: example
  privateKeySecretRef:
    key: value
    name: databaseconnection-private-key-secret-ref
  rootRotationStatements:
  - example
  rotateRootOnCreate: true
  verifyConnection: true
---
apiVersion: v1
kind: Secret
metadata:
  name: databaseconnection-password-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: databaseconnection-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
