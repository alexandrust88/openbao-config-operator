apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TerraformCloudSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  credentialType: organization
  deletionPolicy: Orphan
  description: example
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: terraform
  name: example
  namespace: example
  organization: example
  teamID: example
  ttl: 1h
