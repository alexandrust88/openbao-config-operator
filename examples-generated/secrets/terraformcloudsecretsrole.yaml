# TerraformCloudSecretsRole (secrets.openbaoconfig.io/v1alpha1)
# TerraformCloudSecretsRole manages a role of a Terraform Cloud secrets plugin mount (external plugin) at
# `<mount>/role/<name>`: which organization, team or user API tokens are issued from `<mount>/creds/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#terraformcloudsecretsrole
# Curated example: examples/secrets/terraformcloudsecretsrole.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TerraformCloudSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  credentialType: organization
  deletionPolicy: Orphan
  description: example
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: terraform
  name: example
  namespace: example
  organization: example
  teamID: example
  ttl: 1h
