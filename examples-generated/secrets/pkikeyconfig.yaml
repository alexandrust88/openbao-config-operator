# PKIKeyConfig (secrets.openbaoconfig.io/v1alpha1)
# PKIKeyConfig sets the default signing key of a PKI secrets engine at `<mountPath>/config/keys`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, defaultKey.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#pkikeyconfig
# Curated example: examples/secrets/pkikeyconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIKeyConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  defaultKey: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: pki
  namespace: example
