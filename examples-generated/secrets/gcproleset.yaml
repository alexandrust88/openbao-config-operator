apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: GCPRoleset
metadata:
  name: example
  namespace: openbao-config
spec:
  bindings:
  - resource: example
    roles:
    - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: gcp
  name: example
  namespace: example
  project: example
  secretType: access_token
  tokenScopes:
  - example
