# GCPRoleset (secrets.obco.dev/v1alpha1)
# GCPRoleset manages a roleset of a GCP secrets engine (external plugin) at `<mount>/roleset/<name>`: OpenBao creates
# a service account with the given IAM bindings and issues access tokens or keys for it.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: bindings, connectionRef, project.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#gcproleset
# Curated example: examples/secrets/gcproleset.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: GCPRoleset
metadata:
  name: example
  namespace: openbao-config
spec:
  bindings:
  - resource: example
    roles:
    - example
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: gcp
  name: example
  openbaoNamespace: example
  project: example
  secretType: access_token
  tokenScopes:
  - example
