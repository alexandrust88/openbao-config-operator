apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: AzureSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  applicationObjectID: example
  azureGroups:
  - groupName: example
    objectID: example
  azureRoles:
  - roleID: example
    roleName: example
    scope: example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  explicitMaxTTL: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: azure
  name: example
  namespace: example
  permanentlyDelete: true
  persistApp: true
  signInAudience: AzureADMyOrg
  tags:
  - example
  ttl: 1h
