# SSHCA (secrets.openbaoconfig.io/v1alpha1)
# SSHCA configures the default signing CA of an SSH secrets engine at `<mount>/config/ca`, generated by OpenBao or
# imported from a Secret.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#sshca
# Curated example: examples/secrets/sshca.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHCA
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: ssh
  namespace: example
  privateKeySecretRef:
    key: value
    name: sshca-private-key-secret-ref
  publicKey: |
    -----BEGIN PUBLIC KEY-----
    ZmFrZS1ub3QtYS1rZXk=
    -----END PUBLIC KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: sshca-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
