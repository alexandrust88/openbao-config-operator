# RandomSecret (secrets.openbaoconfig.io/v1alpha1)
# RandomSecret generates a value, such as a password, once and stores it under one key of a KV secret
# (`<mount>/data/<path>` on version 2).
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, mountPath, path.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#randomsecret
# Curated example: examples/secrets/randomsecret.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: RandomSecret
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  key: password
  kvVersion: 2
  managementPolicy: Manage
  mountPath: example
  namespace: example
  passwordPolicyName: default
  path: example
  refreshNonce: example
  writeSecretRef:
    name: randomsecret-write-secret-ref
