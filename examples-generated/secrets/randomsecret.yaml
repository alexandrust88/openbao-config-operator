apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: RandomSecret
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  key: password
  kvVersion: 2
  managementPolicy: Manage
  mountPath: example
  namespace: example
  passwordPolicyName: default
  path: example
  refreshNonce: example
  writeSecretRef:
    name: randomsecret-write-secret-ref
