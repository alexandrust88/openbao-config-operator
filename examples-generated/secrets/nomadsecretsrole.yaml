# NomadSecretsRole (secrets.obco.dev/v1alpha1)
# NomadSecretsRole manages a role of a Nomad secrets plugin mount (external plugin) at `<mount>/role/<name>`: the type
# and policies of the Nomad ACL tokens issued from `<mount>/creds/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#nomadsecretsrole
# Curated example: examples/secrets/nomadsecretsrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: NomadSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  global: true
  managementPolicy: Manage
  mountPath: nomad
  name: example
  openbaoNamespace: example
  policies:
  - default
  type: client
