# NomadSecretsConfig (secrets.obco.dev/v1alpha1)
# NomadSecretsConfig sets the cluster connection (`<mount>/config/access`) and lease limits (`<mount>/config/lease`)
# of a Nomad secrets plugin mount (external plugin), which issues Nomad ACL tokens.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: address, connectionRef,
# tokenSecretRef.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#nomadsecretsconfig
# Curated example: examples/secrets/nomadsecretsconfig.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: NomadSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  address: https://openbao.example.com:8200
  caCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  clientCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  clientKeySecretRef:
    key: value
    name: nomadsecretsconfig-client-key-secret-ref
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  maxTokenNameLength: 1
  mountPath: nomad
  openbaoNamespace: example
  tokenSecretRef:
    key: value
    name: nomadsecretsconfig-token-secret-ref
  ttl: 1h
---
apiVersion: v1
kind: Secret
metadata:
  name: nomadsecretsconfig-client-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: nomadsecretsconfig-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
