# GitHubSecretsRole (secrets.obco.dev/v1alpha1)
# GitHubSecretsRole manages a permission set of a GitHub secrets plugin mount (external plugin) at
# `<mount>/permissionset/<name>`: the repositories and permissions of the installation tokens issued from
# `<mount>/token/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#githubsecretsrole
# Curated example: examples/secrets/githubsecretsrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: GitHubSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  installationID: 1
  managementPolicy: Manage
  mountPath: github
  name: example
  openbaoNamespace: example
  organizationName: example
  permissions:
    example: example
  repositories:
  - example
  repositoryIDs:
  - 1
  skipInaccessibleRepositories: true
