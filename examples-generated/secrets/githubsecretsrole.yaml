apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: GitHubSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  installationID: 1
  managementPolicy: Manage
  mountPath: github
  name: example
  namespace: example
  organizationName: example
  permissions:
    example: example
  repositories:
  - example
  repositoryIDs:
  - 1
  skipInaccessibleRepositories: true
