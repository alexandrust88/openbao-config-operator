apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: AWSSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  accessKeySecretRef:
    key: value
    name: awssecretsconfig-access-key-secret-ref
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  iamEndpoint: https://openbao.example.com:8200
  lease: 1h
  leaseMax: 1h
  managementPolicy: Manage
  maxRetries: 1
  mountPath: aws
  namespace: example
  region: example
  secretKeySecretRef:
    key: value
    name: awssecretsconfig-secret-key-secret-ref
  stsEndpoint: https://openbao.example.com:8200
  usernameTemplate: example
---
apiVersion: v1
kind: Secret
metadata:
  name: awssecretsconfig-access-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: awssecretsconfig-secret-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
