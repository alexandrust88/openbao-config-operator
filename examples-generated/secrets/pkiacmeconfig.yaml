# PKIACMEConfig (secrets.openbaoconfig.io/v1alpha1)
# PKIACMEConfig sets the ACME server configuration of a PKI secrets engine at `<mount>/config/acme`, so ACME clients
# such as cert-manager or certbot can request certificates.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#pkiacmeconfig
# Curated example: examples/secrets/pkiacmeconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIACMEConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  allowRoleExtKeyUsage: true
  allowedIssuers:
  - https://openbao.example.com:8200
  allowedRoles:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  defaultDirectoryPolicy: forbid
  deletionPolicy: Orphan
  dnsResolver: example
  driftDetection: Enabled
  driftInterval: 1h
  eabPolicy: not-required
  enabled: true
  managementPolicy: Manage
  mountPath: pki
  namespace: example
