# DatabaseStaticRole (secrets.obco.dev/v1alpha1)
# DatabaseStaticRole manages a static role of a database secrets engine at `<mount>/static-roles/<name>`: OpenBao owns
# and rotates the password of an existing database user, served at `<mount>/static-creds/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef, dbName,
# mountPath, rotationPeriod, username.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#databasestaticrole
# Curated example: examples/secrets/databasestaticrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: DatabaseStaticRole
metadata:
  name: example
  namespace: openbao-config
spec:
  caPrivateKeySecretRef:
    key: value
    name: databasestaticrole-ca-private-key-secret-ref
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  credentialConfig:
    example: example
  credentialType: client_certificate
  dbName: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: example
  name: example
  openbaoNamespace: example
  rotationPeriod: 1h
  rotationStatements:
  - example
  username: example
---
apiVersion: v1
kind: Secret
metadata:
  name: databasestaticrole-ca-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
