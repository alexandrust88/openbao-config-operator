apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseStaticRole
metadata:
  name: example
  namespace: openbao-config
spec:
  caPrivateKeySecretRef:
    key: value
    name: databasestaticrole-ca-private-key-secret-ref
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  credentialConfig:
    example: example
  credentialType: client_certificate
  dbName: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: example
  name: example
  namespace: example
  rotationPeriod: 1h
  rotationStatements:
  - example
  username: example
---
apiVersion: v1
kind: Secret
metadata:
  name: databasestaticrole-ca-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
