# TerraformCloudSecretsConfig (secrets.obco.dev/v1alpha1)
# TerraformCloudSecretsConfig sets the instance and API token of a Terraform Cloud secrets plugin mount (external
# plugin) at `<mount>/config`, which issues HCP Terraform or Terraform Enterprise API tokens.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef,
# tokenSecretRef.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#terraformcloudsecretsconfig
# Curated example: examples/secrets/terraformcloudsecretsconfig.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: TerraformCloudSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  address: https://openbao.example.com:8200
  basePath: example
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  explicitMaxTTL: 1h
  managementPolicy: Manage
  mountPath: terraform
  openbaoNamespace: example
  tokenSecretRef:
    key: value
    name: terraformcloudsecretsconfig-token-secret-ref
---
apiVersion: v1
kind: Secret
metadata:
  name: terraformcloudsecretsconfig-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
