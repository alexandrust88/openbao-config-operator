apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TerraformCloudSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  address: https://openbao.example.com:8200
  basePath: example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  explicitMaxTTL: 1h
  managementPolicy: Manage
  mountPath: terraform
  namespace: example
  tokenSecretRef:
    key: value
    name: terraformcloudsecretsconfig-token-secret-ref
---
apiVersion: v1
kind: Secret
metadata:
  name: terraformcloudsecretsconfig-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
