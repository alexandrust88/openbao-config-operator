# DatabaseRole (secrets.obco.dev/v1alpha1)
# DatabaseRole manages a dynamic role of a database secrets engine at `<mount>/roles/<name>`: OpenBao creates a
# short-lived database user per request (`<mount>/creds/<name>`) with the creation statements.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef, dbName,
# mountPath.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#databaserole
# Curated example: examples/secrets/databaserole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: DatabaseRole
metadata:
  name: example
  namespace: openbao-config
spec:
  caPrivateKeySecretRef:
    key: value
    name: databaserole-ca-private-key-secret-ref
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  creationStatements:
  - example
  credentialConfig:
    example: example
  credentialType: client_certificate
  dbName: example
  defaultTTL: 1h
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: example
  name: example
  openbaoNamespace: example
  renewStatements:
  - example
  revocationStatements:
  - example
  rollbackStatements:
  - example
---
apiVersion: v1
kind: Secret
metadata:
  name: databaserole-ca-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
