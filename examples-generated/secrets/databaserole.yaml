apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseRole
metadata:
  name: example
  namespace: openbao-config
spec:
  caPrivateKeySecretRef:
    key: value
    name: databaserole-ca-private-key-secret-ref
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  creationStatements:
  - example
  credentialConfig:
    example: example
  credentialType: client_certificate
  dbName: example
  defaultTTL: 1h
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: example
  name: example
  namespace: example
  renewStatements:
  - example
  revocationStatements:
  - example
  rollbackStatements:
  - example
---
apiVersion: v1
kind: Secret
metadata:
  name: databaserole-ca-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
