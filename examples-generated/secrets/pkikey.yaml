# PKIKey (secrets.openbaoconfig.io/v1alpha1)
# PKIKey manages a private key of a PKI secrets engine at `<mount>/key/<name>`, generated in OpenBao, backed by an
# external key, or imported from a Secret.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#pkikey
# Curated example: examples/secrets/pkikey.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIKey
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  keyBits: 44
  keyType: rsa
  managementPolicy: Manage
  mountPath: pki
  name: example
  namespace: example
  type: internal
