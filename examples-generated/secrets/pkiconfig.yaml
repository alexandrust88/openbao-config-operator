# PKIConfig (secrets.obco.dev/v1alpha1)
# PKIConfig sets the mount-wide configuration of a PKI secrets engine: AIA URLs (`config/urls`), CRL (`config/crl`),
# cluster address (`config/cluster`) and default issuer (`config/issuers`).
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#pkiconfig
# Curated example: examples/secrets/pkiconfig.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: PKIConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  cluster:
    aiaPath: https://openbao.example.com:8200
    path: https://openbao.example.com:8200
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  crl:
    allowExpiredCertRevocation: true
    autoRebuild: true
    autoRebuildGracePeriod: 1h
    deltaRebuildInterval: 1h
    disable: true
    enableDelta: true
    expiry: 1h
    ocspDisable: true
    ocspExpiry: 1h
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  issuers:
    default:
      issuerName: https://openbao.example.com:8200
    defaultFollowsLatestIssuer: true
  managementPolicy: Manage
  mountPath: pki
  openbaoNamespace: example
  urls:
    crlDistributionPoints:
    - example
    deltaCRLDistributionPoints:
    - example
    enableTemplating: true
    issuingCertificates:
    - |
      -----BEGIN CERTIFICATE-----
      ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
      -----END CERTIFICATE-----
    ocspServers:
    - example
