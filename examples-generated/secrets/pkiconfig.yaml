apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  cluster:
    aiaPath: https://openbao.example.com:8200
    path: https://openbao.example.com:8200
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  crl:
    allowExpiredCertRevocation: true
    autoRebuild: true
    autoRebuildGracePeriod: 1h
    deltaRebuildInterval: 1h
    disable: true
    enableDelta: true
    expiry: 1h
    ocspDisable: true
    ocspExpiry: 1h
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  issuers:
    default:
      issuerName: https://openbao.example.com:8200
    defaultFollowsLatestIssuer: true
  managementPolicy: Manage
  mountPath: pki
  namespace: example
  urls:
    crlDistributionPoints:
    - example
    deltaCRLDistributionPoints:
    - example
    enableTemplating: true
    issuingCertificates:
    - |
      -----BEGIN CERTIFICATE-----
      ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
      -----END CERTIFICATE-----
    ocspServers:
    - example
