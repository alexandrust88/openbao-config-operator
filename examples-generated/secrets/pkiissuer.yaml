# PKIIssuer (secrets.openbaoconfig.io/v1alpha1)
# PKIIssuer manages a root or intermediate CA issuer of a PKI secrets engine at `<mount>/issuer/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: certificate, connectionRef, type.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#pkiissuer
# Curated example: examples/secrets/pkiissuer.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: example
  namespace: openbao-config
spec:
  certificate:
    altNames:
    - example
    commonName: example
    country:
    - example
    excludeCNFromSANs: true
    ipSANs:
    - example
    locality:
    - example
    maxPathLength: 1
    notBeforeDuration: 1h
    organization:
    - example
    otherSANs:
    - example
    ou:
    - example
    permittedDNSDomains:
    - example
    postalCode:
    - example
    province:
    - example
    serialNumber: example
    signatureBits: 256
    streetAddress:
    - https://openbao.example.com:8200
    ttl: 1h
    uriSANs:
    - https://openbao.example.com:8200
    usePSS: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  crlDistributionPoints:
  - example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  enableAIAURLTemplating: true
  issuingCertificates:
  - |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  key:
    bits: 44
    name: example
    privateKeyFormat: der
    source: exported
    type: rsa
  leafNotAfterBehavior: err
  managementPolicy: Manage
  manualChain:
  - example
  mountPath: pki
  name: example
  namespace: example
  ocspServers:
  - example
  revocationSignatureAlgorithm: SHA256WithRSA
  type: root
  usage:
  - read-only
  writeSecretRef:
    name: pkiissuer-write-secret-ref
