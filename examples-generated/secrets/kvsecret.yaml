apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KVSecret
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  data:
    example:
      secretKeyRef:
        key: value
        name: example
  dataFrom:
  - secretRef:
      name: kvsecret-secret-ref
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  kvVersion: 2
  managementPolicy: Manage
  mountPath: example
  namespace: example
  path: example
