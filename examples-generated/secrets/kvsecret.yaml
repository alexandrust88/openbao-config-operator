# KVSecret (secrets.obco.dev/v1alpha1)
# KVSecret writes a secret to a KV secrets engine at `<mount>/data/<path>` (version 2) or `<mount>/<path>` (version
# 1), with values read from Kubernetes Secrets.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, mountPath, path.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#kvsecret
# Curated example: examples/secrets/kvsecret.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: KVSecret
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  data:
    example:
      secretKeyRef:
        key: value
        name: example
  dataFrom:
  - secretRef:
      name: kvsecret-secret-ref
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  kvVersion: 2
  managementPolicy: Manage
  mountPath: example
  openbaoNamespace: example
  path: example
