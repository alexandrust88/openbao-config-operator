apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: RabbitMQConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  connectionURI: https://openbao.example.com:8200
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  lease:
    maxTTL: 1h
    ttl: 1h
  managementPolicy: Manage
  mountPath: example
  namespace: example
  passwordPolicy: default
  passwordSecretRef:
    key: value
    name: rabbitmqconfig-password-secret-ref
  username: example
  usernameTemplate: example
  verifyConnection: true
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmqconfig-password-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
