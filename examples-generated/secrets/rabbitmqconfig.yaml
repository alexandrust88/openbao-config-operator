# RabbitMQConfig (secrets.obco.dev/v1alpha1)
# RabbitMQConfig sets the connection (`<mount>/config/connection`) and lease settings (`<mount>/config/lease`) of a
# RabbitMQ secrets engine, which issues dynamic RabbitMQ users.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef, connectionURI,
# mountPath, passwordSecretRef, username.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#rabbitmqconfig
# Curated example: examples/secrets/rabbitmqconfig.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: RabbitMQConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  connectionURI: https://openbao.example.com:8200
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  lease:
    maxTTL: 1h
    ttl: 1h
  managementPolicy: Manage
  mountPath: example
  openbaoNamespace: example
  passwordPolicy: default
  passwordSecretRef:
    key: value
    name: rabbitmqconfig-password-secret-ref
  username: example
  usernameTemplate: example
  verifyConnection: true
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmqconfig-password-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
