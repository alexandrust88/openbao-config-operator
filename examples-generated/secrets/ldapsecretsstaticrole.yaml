apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsStaticRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  dn: cn=example,dc=example,dc=com
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: ldap
  name: example
  namespace: example
  rotationPeriod: 1h
  skipImportRotation: true
  username: example
