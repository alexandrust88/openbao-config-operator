# LDAPSecretsStaticRole (secrets.openbaoconfig.io/v1alpha1)
# LDAPSecretsStaticRole manages a static role of an LDAP secrets plugin mount (external plugin) at
# `<mount>/static-role/<name>`: OpenBao owns and rotates the password of an existing directory account, served at
# `<mount>/static-cred/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, rotationPeriod, username.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#ldapsecretsstaticrole
# Curated example: examples/secrets/ldapsecretsstaticrole.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsStaticRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  dn: cn=example,dc=example,dc=com
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: ldap
  name: example
  namespace: example
  rotationPeriod: 1h
  skipImportRotation: true
  username: example
