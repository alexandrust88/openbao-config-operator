# QuaySecretsConfig (secrets.openbaoconfig.io/v1alpha1)
# QuaySecretsConfig sets the Quay instance of a Quay secrets plugin mount (external plugin) at `<mount>/config`, in
# which OpenBao creates robot accounts.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef,
# tokenSecretRef, url.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#quaysecretsconfig
# Curated example: examples/secrets/quaysecretsconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: QuaySecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  caCertificate: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  disableSSLVerification: true
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: quay
  namespace: example
  tokenSecretRef:
    key: value
    name: quaysecretsconfig-token-secret-ref
  url: https://openbao.example.com:8200
---
apiVersion: v1
kind: Secret
metadata:
  name: quaysecretsconfig-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
