apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: QuaySecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  caCertificate: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  disableSSLVerification: true
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: quay
  namespace: example
  tokenSecretRef:
    key: value
    name: quaysecretsconfig-token-secret-ref
  url: https://openbao.example.com:8200
---
apiVersion: v1
kind: Secret
metadata:
  name: quaysecretsconfig-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
