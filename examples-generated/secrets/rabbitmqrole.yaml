# RabbitMQRole (secrets.obco.dev/v1alpha1)
# RabbitMQRole manages a role of a RabbitMQ secrets engine at `<mount>/roles/<name>`: the tags and virtual host
# permissions of the dynamic users issued from `<mount>/creds/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, mountPath.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#rabbitmqrole
# Curated example: examples/secrets/rabbitmqrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: RabbitMQRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: example
  name: example
  openbaoNamespace: example
  tags:
  - example
  vhostTopics:
    example:
      example:
        read: example
        write: example
  vhosts:
    example:
      configure: example
      read: example
      write: example
