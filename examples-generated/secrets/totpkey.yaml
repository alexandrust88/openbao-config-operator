apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TOTPKey
metadata:
  name: example
  namespace: openbao-config
spec:
  accountName: example
  algorithm: SHA1
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  digits: 6
  driftDetection: Enabled
  driftInterval: 1h
  generate:
    exported: true
    keySize: 1
    qrSize: 1
    writeSecretRef:
      name: totpkey-write-secret-ref
  issuer: https://openbao.example.com:8200
  managementPolicy: Manage
  mountPath: totp
  name: example
  namespace: example
  period: 1h
  skew: 1
