# TOTPKey (secrets.openbaoconfig.io/v1alpha1)
# TOTPKey manages a key of a TOTP secrets engine at `<mount>/keys/<name>`, either generated by OpenBao or imported
# from a Secret.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#totpkey
# Curated example: examples/secrets/totpkey.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TOTPKey
metadata:
  name: example
  namespace: openbao-config
spec:
  accountName: example
  algorithm: SHA1
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  digits: 6
  driftDetection: Enabled
  driftInterval: 1h
  generate:
    exported: true
    keySize: 1
    qrSize: 1
    writeSecretRef:
      name: totpkey-write-secret-ref
  issuer: https://openbao.example.com:8200
  managementPolicy: Manage
  mountPath: totp
  name: example
  namespace: example
  period: 1h
  skew: 1
