# PKIAutoTidy (secrets.openbaoconfig.io/v1alpha1)
# PKIAutoTidy sets the periodic tidy configuration of a PKI secrets engine at `<mount>/config/auto-tidy`, which
# removes expired certificates, issuers and ACME data on a schedule.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#pkiautotidy
# Curated example: examples/secrets/pkiautotidy.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIAutoTidy
metadata:
  name: example
  namespace: openbao-config
spec:
  acmeAccountSafetyBuffer: 1h
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  enabled: true
  intervalDuration: 1h
  issuerSafetyBuffer: 1h
  maintainStoredCertificateCounts: true
  managementPolicy: Manage
  mountPath: pki
  namespace: example
  pageSize: 5
  pauseDuration: 1h
  publishStoredCertificateCountMetrics: true
  revokedSafetyBuffer: 1h
  safetyBuffer: 1h
  tidyACME: true
  tidyCertStore: true
  tidyExpiredIssuers: true
  tidyInvalidCerts: true
  tidyMoveLegacyCABundle: true
  tidyRevokedCertIssuerAssociations: true
  tidyRevokedCerts: true
