apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIAutoTidy
metadata:
  name: example
  namespace: openbao-config
spec:
  acmeAccountSafetyBuffer: 1h
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  enabled: true
  intervalDuration: 1h
  issuerSafetyBuffer: 1h
  maintainStoredCertificateCounts: true
  managementPolicy: Manage
  mountPath: pki
  namespace: example
  pageSize: 5
  pauseDuration: 1h
  publishStoredCertificateCountMetrics: true
  revokedSafetyBuffer: 1h
  safetyBuffer: 1h
  tidyACME: true
  tidyCertStore: true
  tidyExpiredIssuers: true
  tidyInvalidCerts: true
  tidyMoveLegacyCABundle: true
  tidyRevokedCertIssuerAssociations: true
  tidyRevokedCerts: true
