apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: AzureSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  clientIDSecretRef:
    key: value
    name: azuresecretsconfig-client-id-secret-ref
  clientSecretSecretRef:
    key: value
    name: azuresecretsconfig-client-secret-secret-ref
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  environment: AzurePublicCloud
  managementPolicy: Manage
  mountPath: azure
  namespace: example
  passwordPolicy: default
  rootPasswordTTL: 1h
  subscriptionID: example
  tenantID: example
---
apiVersion: v1
kind: Secret
metadata:
  name: azuresecretsconfig-client-id-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: azuresecretsconfig-client-secret-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
