# QuaySecretsStaticRole (secrets.obco.dev/v1alpha1)
# QuaySecretsStaticRole manages a static role of a Quay secrets plugin mount (external plugin) at
# `<mount>/static-roles/<name>`: one long-lived robot account whose token is served at `<mount>/static-creds/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, namespaceName.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#quaysecretsstaticrole
# Curated example: examples/secrets/quaysecretsstaticrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: QuaySecretsStaticRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  createRepositories: true
  creationPolicy: Create
  defaultPermission: admin
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: quay
  name: example
  namespaceName: example
  namespaceType: organization
  openbaoNamespace: example
  repositories:
    example: admin
  teams:
    example: admin
