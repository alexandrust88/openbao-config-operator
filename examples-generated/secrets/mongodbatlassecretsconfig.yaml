# MongoDBAtlasSecretsConfig (secrets.obco.dev/v1alpha1)
# MongoDBAtlasSecretsConfig sets the programmatic API key of a MongoDB Atlas secrets plugin mount (external plugin) at
# `<mount>/config`, which OpenBao uses to create short-lived Atlas API keys.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef,
# privateKeySecretRef, publicKey.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#mongodbatlassecretsconfig
# Curated example: examples/secrets/mongodbatlassecretsconfig.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: MongoDBAtlasSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: mongodbatlas
  openbaoNamespace: example
  privateKeySecretRef:
    key: value
    name: mongodbatlassecretsconfig-private-key-secret-ref
  publicKey: |
    -----BEGIN PUBLIC KEY-----
    ZmFrZS1ub3QtYS1rZXk=
    -----END PUBLIC KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodbatlassecretsconfig-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
