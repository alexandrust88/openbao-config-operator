apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: MongoDBAtlasSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: mongodbatlas
  namespace: example
  privateKeySecretRef:
    key: value
    name: mongodbatlassecretsconfig-private-key-secret-ref
  publicKey: |
    -----BEGIN PUBLIC KEY-----
    ZmFrZS1ub3QtYS1rZXk=
    -----END PUBLIC KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodbatlassecretsconfig-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
