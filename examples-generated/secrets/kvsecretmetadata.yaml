# KVSecretMetadata (secrets.openbaoconfig.io/v1alpha1)
# KVSecretMetadata sets the per-secret metadata of one KV version 2 secret at `<mount>/metadata/<path>`: version
# retention, check-and-set and custom metadata.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, mountPath, path.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#kvsecretmetadata
# Curated example: examples/secrets/kvsecretmetadata.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KVSecretMetadata
metadata:
  name: example
  namespace: openbao-config
spec:
  casRequired: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  customMetadata:
    example: example
  deleteVersionAfter: 1
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxVersions: 1
  metadataCASRequired: true
  mountPath: example
  namespace: example
  path: example
