apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: MongoDBAtlasSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  cidrBlocks:
  - 10.0.0.0/8
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  ipAddresses:
  - https://openbao.example.com:8200
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: mongodbatlas
  name: example
  namespace: example
  organizationID: example
  projectID: example
  projectRoles:
  - example
  roles:
  - example
  ttl: 1h
