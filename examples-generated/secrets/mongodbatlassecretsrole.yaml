# MongoDBAtlasSecretsRole (secrets.openbaoconfig.io/v1alpha1)
# MongoDBAtlasSecretsRole manages a role of a MongoDB Atlas secrets plugin mount (external plugin) at
# `<mount>/roles/<name>`: the Atlas roles and access list of the programmatic API keys issued from
# `<mount>/creds/<name>`.
