# GitHubSecretsConfig (secrets.obco.dev/v1alpha1)
# GitHubSecretsConfig sets the GitHub App of a GitHub secrets plugin mount (external plugin) at `<mount>/config`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: appID, connectionRef,
# privateKeySecretRef.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#githubsecretsconfig
# Curated example: examples/secrets/githubsecretsconfig.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: GitHubSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  appID: 1
  baseURL: https://openbao.example.com:8200
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  excludeRepositoryMetadata: true
  managementPolicy: Manage
  mountPath: github
  openbaoNamespace: example
  privateKeySecretRef:
    key: value
    name: githubsecretsconfig-private-key-secret-ref
---
apiVersion: v1
kind: Secret
metadata:
  name: githubsecretsconfig-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
