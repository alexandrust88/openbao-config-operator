apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: GitHubSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  appID: 1
  baseURL: https://openbao.example.com:8200
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  excludeRepositoryMetadata: true
  managementPolicy: Manage
  mountPath: github
  namespace: example
  privateKeySecretRef:
    key: value
    name: githubsecretsconfig-private-key-secret-ref
---
apiVersion: v1
kind: Secret
metadata:
  name: githubsecretsconfig-private-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
