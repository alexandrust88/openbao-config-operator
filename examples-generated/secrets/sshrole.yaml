# SSHRole (secrets.obco.dev/v1alpha1)
# SSHRole manages a role of an SSH secrets engine at `<mount>/roles/<name>`: a ca role signs SSH user or host
# certificates with the SSHCA, an otp role issues one-time SSH passwords.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, keyType.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#sshrole
# Curated example: examples/secrets/sshrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: SSHRole
metadata:
  name: example
  namespace: openbao-config
spec:
  algorithmSigner: default
  allowBareDomains: true
  allowCommasInIdentityTemplates: true
  allowEmptyPrincipals: true
  allowHostCertificates: true
  allowSubdomains: true
  allowUserCertificates: true
  allowUserKeyIDs: true
  allowWildcardsInIdentityTemplates: true
  allowedCriticalOptions:
  - example
  allowedDomains:
  - example
  allowedDomainsTemplate: true
  allowedExtensions:
  - example
  allowedUserKeyLengths:
    example:
    - 1
  allowedUsers:
  - example
  allowedUsersTemplate: true
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  defaultCriticalOptions:
    example: example
  defaultExtensions:
    example: example
  defaultExtensionsTemplate: true
  defaultUser: example
  defaultUserTemplate: true
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  issuerRef: example
  keyIDFormat: example
  keyType: ca
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: ssh
  name: example
  notBeforeDuration: 1h
  openbaoNamespace: example
  ttl: 1h
