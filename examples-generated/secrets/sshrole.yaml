apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHRole
metadata:
  name: example
  namespace: openbao-config
spec:
  algorithmSigner: default
  allowBareDomains: true
  allowCommasInIdentityTemplates: true
  allowEmptyPrincipals: true
  allowHostCertificates: true
  allowSubdomains: true
  allowUserCertificates: true
  allowUserKeyIDs: true
  allowWildcardsInIdentityTemplates: true
  allowedCriticalOptions:
  - example
  allowedDomains:
  - example
  allowedDomainsTemplate: true
  allowedExtensions:
  - example
  allowedUserKeyLengths:
    example:
    - 1
  allowedUsers:
  - example
  allowedUsersTemplate: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  defaultCriticalOptions:
    example: example
  defaultExtensions:
    example: example
  defaultExtensionsTemplate: true
  defaultUser: example
  defaultUserTemplate: true
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  issuerRef: example
  keyIDFormat: example
  keyType: ca
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: ssh
  name: example
  namespace: example
  notBeforeDuration: 1h
  ttl: 1h
