# GCPImpersonatedAccount (secrets.obco.dev/v1alpha1)
# GCPImpersonatedAccount manages an impersonated account of a GCP secrets engine (external plugin) at
# `<mount>/impersonated-account/<name>`: OpenBao issues access tokens by impersonating an existing service account,
# without keys.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, serviceAccountEmail, tokenScopes.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#gcpimpersonatedaccount
# Curated example: examples/secrets/gcpimpersonatedaccount.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: GCPImpersonatedAccount
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: gcp
  name: example
  openbaoNamespace: example
  serviceAccountEmail: user@example.com
  tokenScopes:
  - example
  ttl: 1h
