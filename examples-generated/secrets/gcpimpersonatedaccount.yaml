apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: GCPImpersonatedAccount
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: gcp
  name: example
  namespace: example
  serviceAccountEmail: user@example.com
  tokenScopes:
  - example
  ttl: 1h
