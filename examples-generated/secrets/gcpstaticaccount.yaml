# GCPStaticAccount (secrets.obco.dev/v1alpha1)
# GCPStaticAccount manages a static account of a GCP secrets engine (external plugin) at
# `<mount>/static-account/<name>`, which issues access tokens or keys for an existing service account instead of
# creating one.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, serviceAccountEmail.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#gcpstaticaccount
# Curated example: examples/secrets/gcpstaticaccount.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: GCPStaticAccount
metadata:
  name: example
  namespace: openbao-config
spec:
  bindings:
  - resource: example
    roles:
    - example
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: gcp
  name: example
  openbaoNamespace: example
  secretType: access_token
  serviceAccountEmail: user@example.com
  tokenScopes:
  - example
