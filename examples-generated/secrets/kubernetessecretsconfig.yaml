# KubernetesSecretsConfig (secrets.openbaoconfig.io/v1alpha1)
# KubernetesSecretsConfig sets the configuration of a Kubernetes secrets engine at `<mount>/config`: the cluster in
# which OpenBao creates service accounts, tokens and role bindings for KubernetesSecretsRole credentials.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef, mountPath.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#kubernetessecretsconfig
# Curated example: examples/secrets/kubernetessecretsconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  disableLocalCAJWT: true
  driftDetection: Enabled
  driftInterval: 1h
  kubernetesCACert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  kubernetesHost: https://openbao.example.com:8200
  managementPolicy: Manage
  mountPath: example
  namespace: example
  serviceAccountJWTSecretRef:
    key: value
    name: kubernetessecretsconfig-service-account-jwt-secret-ref
---
apiVersion: v1
kind: Secret
metadata:
  name: kubernetessecretsconfig-service-account-jwt-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
