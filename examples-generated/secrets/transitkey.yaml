# TransitKey (secrets.obco.dev/v1alpha1)
# TransitKey manages a named key of a transit secrets engine at `<mount>/keys/<name>`, for encryption as a service,
# signing or HMAC; its key material never leaves OpenBao unless exportable.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#transitkey
# Curated example: examples/secrets/transitkey.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKey
metadata:
  name: example
  namespace: openbao-config
spec:
  allowPlaintextBackup: true
  autoRotatePeriod: 1h
  connectionRef:
    kind: BaoConnection
    name: openbao
  convergentEncryption: true
  creationPolicy: Create
  deletionAllowed: true
  deletionPolicy: Orphan
  derived: true
  driftDetection: Enabled
  driftInterval: 1h
  exportable: true
  keySize: 32
  managementPolicy: Manage
  minDecryptionVersion: 1
  minEncryptionVersion: 1
  mountPath: transit
  name: example
  openbaoNamespace: example
  rotateNonce: example
  type: hmac
