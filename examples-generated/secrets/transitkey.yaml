apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TransitKey
metadata:
  name: example
  namespace: openbao-config
spec:
  allowPlaintextBackup: true
  autoRotatePeriod: 1h
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  convergentEncryption: true
  creationPolicy: Create
  deletionAllowed: true
  deletionPolicy: Orphan
  derived: true
  driftDetection: Enabled
  driftInterval: 1h
  exportable: true
  keySize: 32
  managementPolicy: Manage
  minDecryptionVersion: 1
  minEncryptionVersion: 1
  mountPath: transit
  name: example
  namespace: example
  rotateNonce: example
  type: hmac
