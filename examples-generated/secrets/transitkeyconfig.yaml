# TransitKeyConfig (secrets.obco.dev/v1alpha1)
# TransitKeyConfig sets the mount-wide key configuration of a Transit secrets engine at `<mount>/config/keys`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, mountPath.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#transitkeyconfig
# Curated example: examples/secrets/transitkeyconfig.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKeyConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  disableUpsert: true
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: example
  openbaoNamespace: example
