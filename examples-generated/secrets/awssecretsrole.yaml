# AWSSecretsRole (secrets.obco.dev/v1alpha1)
# AWSSecretsRole manages a role of an AWS secrets engine (external plugin) at `<mount>/roles/<name>`: the kind of AWS
# credential issued from `<mount>/creds/<name>` and the IAM policies it carries.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, credentialType.
#
# Reference: https://docs.obco.dev/reference/api/secrets/#awssecretsrole
# Curated example: examples/secrets/awssecretsrole.yaml
apiVersion: secrets.obco.dev/v1alpha1
kind: AWSSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  credentialType: iam_user
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  externalID: example
  iamGroups:
  - example
  iamTags:
    example: example
  managementPolicy: Manage
  mfaSerialNumber: example
  mountPath: aws
  name: example
  openbaoNamespace: example
  permissionsBoundaryARN: arn:aws:iam::123456789012:policy/example
  policyARNs:
  - default
  policyDocument: default
  sessionTags:
    example: example
  userPath: /
