apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: AWSSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  credentialType: iam_user
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  externalID: example
  iamGroups:
  - example
  iamTags:
    example: example
  managementPolicy: Manage
  mfaSerialNumber: example
  mountPath: aws
  name: example
  namespace: example
  permissionsBoundaryARN: arn:aws:iam::123456789012:policy/example
  policyARNs:
  - default
  policyDocument: default
  sessionTags:
    example: example
  userPath: /
