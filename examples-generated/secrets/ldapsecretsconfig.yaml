# LDAPSecretsConfig (secrets.openbaoconfig.io/v1alpha1)
# LDAPSecretsConfig sets the directory connection of an LDAP secrets plugin mount (external plugin) at
# `<mount>/config`: where the directory is and the account OpenBao binds as to manage passwords.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: bindDN, bindPassSecretRef,
# connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#ldapsecretsconfig
# Curated example: examples/secrets/ldapsecretsconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  bindDN: cn=example,dc=example,dc=com
  bindPassSecretRef:
    key: value
    name: ldapsecretsconfig-bind-pass-secret-ref
  certificate: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  clientTLSCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  clientTLSKeySecretRef:
    key: value
    name: ldapsecretsconfig-client-tls-key-secret-ref
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  connectionTimeout: 1h
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  insecureTLS: true
  managementPolicy: Manage
  mountPath: ldap
  namespace: example
  passwordPolicy: default
  requestTimeout: 1h
  schema: openldap
  skipStaticRoleImportRotation: true
  startTLS: true
  tlsMaxVersion: tls10
  tlsMinVersion: tls10
  upnDomain: example
  url: https://openbao.example.com:8200
  userAttr: example
  userDN: cn=example,dc=example,dc=com
---
apiVersion: v1
kind: Secret
metadata:
  name: ldapsecretsconfig-bind-pass-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: ldapsecretsconfig-client-tls-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
