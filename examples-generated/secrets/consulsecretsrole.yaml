apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: ConsulSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  consulNamespace: example
  consulPolicies:
  - default
  consulRoles:
  - example
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  local: true
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: consul
  name: example
  namespace: example
  nodeIdentities:
  - example
  partition: example
  serviceIdentities:
  - example
  ttl: 1h
