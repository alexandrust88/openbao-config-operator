# ConsulSecretsRole (secrets.openbaoconfig.io/v1alpha1)
# ConsulSecretsRole manages a role of a Consul secrets engine (external plugin) at `<mount>/roles/<name>`: the
# policies, roles and identities of the Consul ACL tokens issued from `<mount>/creds/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#consulsecretsrole
# Curated example: examples/secrets/consulsecretsrole.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: ConsulSecretsRole
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  consulNamespace: example
  consulPolicies:
  - default
  consulRoles:
  - example
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  local: true
  managementPolicy: Manage
  maxTTL: 1h
  mountPath: consul
  name: example
  namespace: example
  nodeIdentities:
  - example
  partition: example
  serviceIdentities:
  - example
  ttl: 1h
