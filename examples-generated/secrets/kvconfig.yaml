# KVConfig (secrets.openbaoconfig.io/v1alpha1)
# KVConfig sets the engine-wide configuration of a KV version 2 secrets engine at `<mount>/config`: version retention
# and check-and-set enforcement.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, mountPath.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#kvconfig
# Curated example: examples/secrets/kvconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KVConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  casRequired: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deleteVersionAfter: 1
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxVersions: 1
  metadataCASRequired: true
  mountPath: example
  namespace: example
