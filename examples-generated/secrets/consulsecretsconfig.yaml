# ConsulSecretsConfig (secrets.openbaoconfig.io/v1alpha1)
# ConsulSecretsConfig sets the access configuration of a Consul secrets engine (external plugin) at
# `<mount>/config/access`: the Consul address and the management token OpenBao uses to create ACL tokens.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: address, connectionRef,
# tokenSecretRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/secrets/#consulsecretsconfig
# Curated example: examples/secrets/consulsecretsconfig.yaml
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: ConsulSecretsConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  address: https://openbao.example.com:8200
  caCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  clientCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  clientKeySecretRef:
    key: value
    name: consulsecretsconfig-client-key-secret-ref
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: consul
  namespace: example
  scheme: http
  tokenSecretRef:
    key: value
    name: consulsecretsconfig-token-secret-ref
---
apiVersion: v1
kind: Secret
metadata:
  name: consulsecretsconfig-client-key-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: consulsecretsconfig-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
