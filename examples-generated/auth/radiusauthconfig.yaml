# RADIUSAuthConfig (auth.obco.dev/v1alpha1)
# RADIUSAuthConfig manages the configuration of an OpenBao RADIUS auth method at auth/<mountPath>/config.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef, host,
# secretSecretRef.
#
# Reference: https://docs.obco.dev/reference/api/auth/#radiusauthconfig
# Curated example: examples/auth/radiusauthconfig.yaml
apiVersion: auth.obco.dev/v1alpha1
kind: RADIUSAuthConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  dialTimeout: 1h
  driftDetection: Enabled
  driftInterval: 1h
  host: https://openbao.example.com:8200
  managementPolicy: Manage
  mountPath: radius
  nasIdentifier: example
  nasPort: 1
  openbaoNamespace: example
  policyRefs:
  - name: example
  port: 1
  readTimeout: 1h
  secretSecretRef:
    key: value
    name: radiusauthconfig-secret-secret-ref
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
  unregisteredUserPolicies:
  - default
---
apiVersion: v1
kind: Secret
metadata:
  name: radiusauthconfig-secret-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
