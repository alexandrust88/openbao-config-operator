# CertAuthCRL (auth.openbaoconfig.io/v1alpha1)
# CertAuthCRL installs a certificate revocation list on a TLS certificate auth method at auth/<mountPath>/crls/<name>,
# either as a fetched URL or as embedded PEM data.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/auth/#certauthcrl
# Curated example: examples/auth/certauthcrl.yaml
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: CertAuthCRL
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  crl: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: cert
  name: example
  namespace: example
