  managementPolicy: Manage
  mountPath: approle
  name: example
  openbaoNamespace: example
  policyRefs:
  - name: example
  roleID: example
  secretIDBoundCIDRs:
  - 10.0.0.0/8
  secretIDNumUses: 1
  secretIDTTL: 1h
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
