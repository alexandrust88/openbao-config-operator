# OktaAuthGroup (auth.openbaoconfig.io/v1alpha1)
# OktaAuthGroup manages the policy mapping of an Okta group in an OpenBao Okta auth method at
# auth/<mountPath>/groups/<name>.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/auth/#oktaauthgroup
# Curated example: examples/auth/oktaauthgroup.yaml
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: OktaAuthGroup
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: okta
  name: example
  namespace: example
  policies:
  - default
