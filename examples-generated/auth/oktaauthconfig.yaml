# OktaAuthConfig (auth.obco.dev/v1alpha1)
# OktaAuthConfig manages the configuration of an OpenBao Okta auth method at auth/<mountPath>/config.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef, orgName.
#
# Reference: https://docs.obco.dev/reference/api/auth/#oktaauthconfig
# Curated example: examples/auth/oktaauthconfig.yaml
apiVersion: auth.obco.dev/v1alpha1
kind: OktaAuthConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  apiTokenSecretRef:
    key: value
    name: oktaauthconfig-api-token-secret-ref
  baseURL: https://openbao.example.com:8200
  bypassOktaMFA: true
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: okta
  openbaoNamespace: example
  orgName: example
  policyRefs:
  - name: example
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
---
apiVersion: v1
kind: Secret
metadata:
  name: oktaauthconfig-api-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
