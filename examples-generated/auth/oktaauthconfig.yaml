apiVersion: auth.openbaoconfig.io/v1alpha1
kind: OktaAuthConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  apiTokenSecretRef:
    key: value
    name: oktaauthconfig-api-token-secret-ref
  baseURL: https://openbao.example.com:8200
  bypassOktaMFA: true
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: okta
  namespace: example
  orgName: example
  policyRefs:
  - name: example
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
---
apiVersion: v1
kind: Secret
metadata:
  name: oktaauthconfig-api-token-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
