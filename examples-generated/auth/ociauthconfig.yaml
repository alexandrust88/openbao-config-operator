# OCIAuthConfig (auth.obco.dev/v1alpha1)
# OCIAuthConfig manages the configuration of an OpenBao Oracle Cloud Infrastructure (OCI) auth method at
# auth/<mountPath>/config.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, homeTenancyID.
#
# Reference: https://docs.obco.dev/reference/api/auth/#ociauthconfig
# Curated example: examples/auth/ociauthconfig.yaml
apiVersion: auth.obco.dev/v1alpha1
kind: OCIAuthConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  homeTenancyID: example
  managementPolicy: Manage
  mountPath: oci
  openbaoNamespace: example
