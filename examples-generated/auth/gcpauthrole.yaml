# GCPAuthRole (auth.openbaoconfig.io/v1alpha1)
# GCPAuthRole manages a role of an OpenBao GCP auth method at auth/<mountPath>/role/<name>.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, type.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/auth/#gcpauthrole
# Curated example: examples/auth/gcpauthrole.yaml
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: GCPAuthRole
metadata:
  name: example
  namespace: openbao-config
spec:
  addGroupAliases: true
  allowGCEInference: true
  boundProjects:
  - example
  boundServiceAccounts:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  maxJWTExp: 1h
  mountPath: gcp
  name: example
  namespace: example
  policyRefs:
  - name: example
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
  type: iam
