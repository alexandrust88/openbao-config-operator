# GitHubAuthConfig (auth.obco.dev/v1alpha1)
# GitHubAuthConfig manages the configuration of an OpenBao GitHub auth method at auth/<mountPath>/config.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, organization.
#
# Reference: https://docs.obco.dev/reference/api/auth/#githubauthconfig
# Curated example: examples/auth/githubauthconfig.yaml
apiVersion: auth.obco.dev/v1alpha1
kind: GitHubAuthConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  baseURL: https://openbao.example.com:8200
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: github
  openbaoNamespace: example
  organization: example
  organizationID: 1
  policyRefs:
  - name: example
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
