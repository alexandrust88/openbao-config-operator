apiVersion: auth.openbaoconfig.io/v1alpha1
kind: CFAuthRole
metadata:
  name: example
  namespace: openbao-config
spec:
  boundApplicationIDs:
  - example
  boundInstanceIDs:
  - example
  boundOrganizationIDs:
  - example
  boundSpaceIDs:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  disableIPMatching: true
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: cf
  name: example
  namespace: example
  policyRefs:
  - name: example
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
