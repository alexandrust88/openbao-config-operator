# AWSAuthIdentityConfig (auth.openbaoconfig.io/v1alpha1)
# AWSAuthIdentityConfig manages how an OpenBao AWS auth method builds entity alias names and token metadata, at
# auth/<mountPath>/config/identity.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/auth/#awsauthidentityconfig
# Curated example: examples/auth/awsauthidentityconfig.yaml
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: AWSAuthIdentityConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  ec2Alias: role_id
  ec2Metadata:
  - example
  iamAlias: role_id
  iamMetadata:
  - example
  managementPolicy: Manage
  mountPath: aws
  namespace: example
