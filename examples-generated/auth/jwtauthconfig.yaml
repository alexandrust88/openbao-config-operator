# JWTAuthConfig (auth.obco.dev/v1alpha1)
# JWTAuthConfig manages the configuration of an OpenBao JWT/OIDC auth method at auth/<mountPath>/config.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/auth/#jwtauthconfig
# Curated example: examples/auth/jwtauthconfig.yaml
apiVersion: auth.obco.dev/v1alpha1
kind: JWTAuthConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  boundIssuer: https://openbao.example.com:8200
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  defaultRole: example
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  jwksCAPEM: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  jwtSupportedAlgs:
  - example
  managementPolicy: Manage
  mountPath: jwt
  namespaceInState: true
  oidcClientID: example
  oidcClientSecretSecretRef:
    key: value
    name: jwtauthconfig-oidc-client-secret-secret-ref
  oidcDiscoveryCAPEM: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  oidcDiscoveryURL: https://openbao.example.com:8200
  oidcResponseMode: query
  oidcResponseTypes:
  - code
  openbaoNamespace: example
  overrideAllowedServerNames:
  - example
  providerConfig:
    provider: azure
    secretRef:
      key: value
      name: jwtauthconfig-secret-ref
    settings:
      example:
        key: value
  skipJWKSValidation: true
---
apiVersion: v1
kind: Secret
metadata:
  name: jwtauthconfig-oidc-client-secret-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: jwtauthconfig-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
