# AWSAuthCertificate (auth.obco.dev/v1alpha1)
# AWSAuthCertificate manages an AWS public certificate of an OpenBao AWS auth method at
# auth/<mountPath>/config/certificate/<name>.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: awsPublicCert, connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/auth/#awsauthcertificate
# Curated example: examples/auth/awsauthcertificate.yaml
apiVersion: auth.obco.dev/v1alpha1
kind: AWSAuthCertificate
metadata:
  name: example
  namespace: openbao-config
spec:
  awsPublicCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub3QtYS1jZXJ0aWZpY2F0ZQ==
    -----END CERTIFICATE-----
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: aws
  name: example
  openbaoNamespace: example
  type: pkcs7
