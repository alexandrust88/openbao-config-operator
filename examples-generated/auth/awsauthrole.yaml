apiVersion: auth.openbaoconfig.io/v1alpha1
kind: AWSAuthRole
metadata:
  name: example
  namespace: openbao-config
spec:
  authType: iam
  boundAMIIDs:
  - example
  boundAccountIDs:
  - example
  boundEC2InstanceIDs:
  - example
  boundIAMInstanceProfileARNs:
  - example
  boundIAMPrincipalARNs:
  - example
  boundIAMRoleARNs:
  - example
  boundRegions:
  - example
  boundSubnetIDs:
  - example
  boundVPCIDs:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  inferredAWSRegion: example
  inferredEntityType: ec2_instance
  managementPolicy: Manage
  mountPath: aws
  name: example
  namespace: example
  policyRefs:
  - name: example
  resolveAWSUniqueIDs: true
  tokenBoundCIDRs:
  - 10.0.0.0/8
  tokenExplicitMaxTTL: 1h
  tokenMaxTTL: 1h
  tokenNoDefaultPolicy: true
  tokenNumUses: 1
  tokenPeriod: 1h
  tokenPolicies:
  - default
  tokenStrictlyBindIP: true
  tokenTTL: 1h
  tokenType: default
