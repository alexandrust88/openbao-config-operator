apiVersion: auth.openbaoconfig.io/v1alpha1
kind: AppRoleSecretID
metadata:
  name: example
  namespace: openbao-config
spec:
  cidrList:
  - 10.0.0.0/8
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  metadata:
    example: example
  mountPath: example
  namespace: example
  numUses: 1
  roleName: example
  rotation:
    enabled: true
    renewBefore: 1h
  tokenBoundCIDRs:
  - 10.0.0.0/8
  ttl: 1h
  writeSecretRef:
    name: approlesecretid-write-secret-ref
