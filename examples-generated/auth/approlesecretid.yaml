# AppRoleSecretID (auth.openbaoconfig.io/v1alpha1)
# AppRoleSecretID generates a secret ID for an OpenBao AppRole role at auth/<mountPath>/role/<role>/secret-id and
# writes it, with the role ID, to a Kubernetes Secret.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, writeSecretRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/auth/#approlesecretid
# Curated example: examples/auth/approlesecretid.yaml
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: AppRoleSecretID
metadata:
  name: example
  namespace: openbao-config
spec:
  cidrList:
  - 10.0.0.0/8
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  metadata:
    example: example
  mountPath: example
  namespace: example
  numUses: 1
  roleName: example
  rotation:
    enabled: true
    renewBefore: 1h
  tokenBoundCIDRs:
  - 10.0.0.0/8
  ttl: 1h
  writeSecretRef:
    name: approlesecretid-write-secret-ref
