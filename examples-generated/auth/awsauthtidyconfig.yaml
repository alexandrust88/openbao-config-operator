# AWSAuthTidyConfig (auth.obco.dev/v1alpha1)
# AWSAuthTidyConfig manages the periodic tidy settings of an OpenBao AWS auth method, at
# auth/<mountPath>/config/tidy/identity-accesslist and auth/<mountPath>/config/tidy/roletag-denylist.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/auth/#awsauthtidyconfig
# Curated example: examples/auth/awsauthtidyconfig.yaml
apiVersion: auth.obco.dev/v1alpha1
kind: AWSAuthTidyConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  identityAccessList:
    disablePeriodicTidy: true
    safetyBuffer: 1h
  managementPolicy: Manage
  mountPath: aws
  openbaoNamespace: example
  roleTagDenyList:
    disablePeriodicTidy: true
    safetyBuffer: 1h
