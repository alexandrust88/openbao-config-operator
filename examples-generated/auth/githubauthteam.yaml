# GitHubAuthTeam (auth.openbaoconfig.io/v1alpha1)
# GitHubAuthTeam manages the policy mapping of a GitHub team in an OpenBao GitHub auth method at
# auth/<mountPath>/map/teams/<name>.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/auth/#githubauthteam
# Curated example: examples/auth/githubauthteam.yaml
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: GitHubAuthTeam
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: github
  name: example
  namespace: example
  policies:
  - default
