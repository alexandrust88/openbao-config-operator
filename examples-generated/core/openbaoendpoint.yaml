# OpenBaoEndpoint (core.openbaoconfig.io/v1alpha1)
# OpenBaoEndpoint writes any JSON payload to any OpenBao API path and keeps it in sync: the escape hatch for settings
# without a typed kind.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# The Secrets after it hold fake values for the secret references. Required spec fields: connectionRef, path.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/core/#openbaoendpoint
# Curated example: examples/core/openbaoendpoint.yaml
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoEndpoint
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  data:
    key: value
  dataSecretRef:
    key: value
    name: openbaoendpoint-data-secret-ref
  deletePath: example
  deletionPolicy: Orphan
  disableDelete: true
  disableRead: true
  driftDetection: Enabled
  driftInterval: 1h
  ignoreAbsentFields: true
  managementPolicy: Manage
  namespace: example
  path: example
  readPath: example
  writeOnlyFields:
  - example
---
apiVersion: v1
kind: Secret
metadata:
  name: openbaoendpoint-data-secret-ref
  namespace: openbao-config
stringData:
  value: fake-value-not-a-secret
type: Opaque
