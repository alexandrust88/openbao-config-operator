apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoServer
metadata:
  name: example
spec:
  address: https://openbao.example.com:8200
  allowInsecureHTTP: true
  allowedAudiences:
  - example
  allowedNamespaces:
    matchExpressions:
    - key: example
      operator: In
      values:
      - example
    matchLabels:
      example: example
  caBundle:
    secretRef:
      key: ca.crt
      name: openbaoserver-secret-ref
      namespace: openbao-config
  rateLimit:
    burst: 1
    qps: 1
  requestTimeout: 1h
---
apiVersion: v1
kind: Secret
metadata:
  name: openbaoserver-secret-ref
  namespace: openbao-config
stringData:
  ca.crt: fake-value-not-a-secret
type: Opaque
