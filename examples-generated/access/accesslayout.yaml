# AccessLayout (access.openbaoconfig.io/v1alpha1)
# AccessLayout gives people, by identity provider group, access to KV version 2 secrets (the human access model).
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: authMounts, connectionRef, paths, roles.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/access/#accesslayout
# Curated example: examples/access/accesslayout.yaml
apiVersion: access.openbaoconfig.io/v1alpha1
kind: AccessLayout
metadata:
  name: example
  namespace: openbao-config
spec:
  authMounts:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  groupAliasTemplate: '{role}'
  managementPolicy: Manage
  namespace: example
  paths:
  - metadataPath: example
    mount: example
    path: example
  roles:
  - levels:
    - level: example
      namespace: ""
    name: example
