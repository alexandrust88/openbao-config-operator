apiVersion: access.openbaoconfig.io/v1alpha1
kind: AccessGrant
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  mountPath: example
  namespace: example
  rules:
  - level: example
    metadataPath: example
    mount: example
    path: example
  subjects:
  - name: example
    namespace: example
  tokenTTL: 15m
