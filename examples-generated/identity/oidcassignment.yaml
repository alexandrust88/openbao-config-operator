# OIDCAssignment (identity.openbaoconfig.io/v1alpha1)
# OIDCAssignment manages an assignment of the OpenBao OIDC provider at `identity/oidc/assignment/<name>`: the entities
# and groups allowed to log in to the OIDCClient objects that list it in assignments.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/identity/#oidcassignment
# Curated example: examples/identity/oidcassignment.yaml
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCAssignment
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  entities:
  - entityID: example
  groups:
  - groupID: example
  managementPolicy: Manage
  name: example
  namespace: example
