# OIDCKey (identity.openbaoconfig.io/v1alpha1)
# OIDCKey manages a named key at `identity/oidc/key/<name>` that signs OpenBao identity tokens and OIDC provider
# tokens.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/identity/#oidckey
# Curated example: examples/identity/oidckey.yaml
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCKey
metadata:
  name: example
  namespace: openbao-config
spec:
  algorithm: RS256
  allowedClientIDs:
  - example
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: example
  namespace: example
  rotationPeriod: 1h
  verificationTTL: 1h
