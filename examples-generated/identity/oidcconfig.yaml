# OIDCConfig (identity.obco.dev/v1alpha1)
# OIDCConfig sets the identity token (OIDC) configuration of an OpenBao namespace at `identity/oidc/config`, a
# singleton.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef, issuer.
#
# Reference: https://docs.obco.dev/reference/api/identity/#oidcconfig
# Curated example: examples/identity/oidcconfig.yaml
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCConfig
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  issuer: https://openbao.example.com:8200
  managementPolicy: Manage
  openbaoNamespace: example
