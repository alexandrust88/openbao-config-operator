# OIDCClient (identity.obco.dev/v1alpha1)
# OIDCClient manages an application that logs users in through the OpenBao OIDC provider, at
# `identity/oidc/client/<name>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/identity/#oidcclient
# Curated example: examples/identity/oidcclient.yaml
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCClient
metadata:
  name: example
  namespace: openbao-config
spec:
  accessTokenTTL: 1h
  assignments:
  - example
  authorizationCode: true
  clientCredentials: true
  clientType: confidential
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  idTokenTTL: 1h
  key: default
  managementPolicy: Manage
  name: example
  openbaoNamespace: example
  redirectURIs:
  - https://openbao.example.com:8200
  writeSecretRef:
    name: oidcclient-write-secret-ref
