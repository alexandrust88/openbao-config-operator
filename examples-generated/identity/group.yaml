# Group (identity.openbaoconfig.io/v1alpha1)
# Group manages an OpenBao identity group at `identity/group/name/<name>`, which grants policies to its members.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://alexandrust88.github.io/openbao-config-operator/reference/api/identity/#group
# Curated example: examples/identity/group.yaml
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Group
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  metadata:
    example: example
  name: example
  namespace: example
  policies:
  - default
  type: internal
