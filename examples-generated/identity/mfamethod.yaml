# MFAMethod (identity.obco.dev/v1alpha1)
# MFAMethod manages a login MFA method (TOTP, Duo, Okta or PingID) at `identity/mfa/method/<type>/<id>`.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
# passes the CRD's OpenAPI and CEL validation, so the sample shows the shape of the kind, not a working configuration.
# Required spec fields: connectionRef.
#
# Reference: https://docs.obco.dev/reference/api/identity/#mfamethod
# Curated example: examples/identity/mfamethod.yaml
apiVersion: identity.obco.dev/v1alpha1
kind: MFAMethod
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: example
  openbaoNamespace: example
  totp:
    algorithm: SHA1
    digits: 6
    issuer: https://openbao.example.com:8200
    keySize: 1
    maxValidationAttempts: 1
    period: 1h
    qrSize: 1
    skew: 1
