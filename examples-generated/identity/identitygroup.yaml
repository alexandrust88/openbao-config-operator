# IdentityGroup (identity.obco.dev/v1alpha1)
# IdentityGroup manages an OpenBao identity group at `identity/group/name/<name>`, which grants policies to its
# members.
#
# Generated from the CRD by hack/samplegen (make samples); do not edit. Every spec field is set to a placeholder that
