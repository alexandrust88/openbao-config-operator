# Curated example: examples/identity/identitygroup.yaml
apiVersion: identity.obco.dev/v1alpha1
kind: IdentityGroup
metadata:
  name: example
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  metadata:
    example: example
  name: example
  openbaoNamespace: example
  policies:
  - default
  type: internal
