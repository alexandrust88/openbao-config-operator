# Manages any OpenBao path the typed kinds do not cover; here a KV v2 secrets engine mount.
# OpenBaoEndpoint is destructive: path and deletePath are free-form, so deletionPolicy Delete takes effect only
# with the annotation openbaoconfig.io/allow-destructive-delete: "true" (otherwise reason DeleteGuarded).
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoEndpoint
metadata:
  name: team-kv
  namespace: openbao-config
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    name: openbao
  path: sys/mounts/team-kv
  readPath: sys/mounts/team-kv/tune
  deletionPolicy: Delete
  data:
    type: kv
    options:
      version: "2"
