# The quickstart's OpenBao, declared by the platform team. BaoConnections in namespaces labelled
# obco.dev/tenant may use it, with ServiceAccount tokens for the openbao audience only. Evaluation only:
# the dev server speaks plain HTTP, which allowInsecureHTTP permits.
apiVersion: core.obco.dev/v1alpha1
kind: BaoServer
metadata:
  name: openbao
spec:
  address: http://openbao.openbao.svc:8200
  allowInsecureHTTP: true
  allowedNamespaces:
    matchLabels:
      obco.dev/tenant: "true"
  allowedAudiences:
    - openbao
