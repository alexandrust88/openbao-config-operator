# The platform team's own OpenBao namespace platform, with a KV version 2 secrets engine at secret inside it.
# spec.openbaoNamespace on the SecretsMount selects the OpenBao namespace, relative to the connection's root.
apiVersion: sys.obco.dev/v1alpha1
kind: BaoNamespace
metadata:
  name: platform
  namespace: platform
spec:
  connectionRef:
    kind: ClusterBaoConnection
    name: platform
---
apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: platform-secret
  namespace: platform
spec:
  connectionRef:
    kind: ClusterBaoConnection
    name: platform
  openbaoNamespace: platform
  path: secret
  type: kv-v2
  description: Platform team secrets
