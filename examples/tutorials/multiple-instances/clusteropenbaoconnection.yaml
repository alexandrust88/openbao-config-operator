# Logs in to the second OpenBao as the operator itself, like the connection platform does for the first one.
apiVersion: core.openbaoconfig.io/v1alpha1
kind: ClusterOpenBaoConnection
metadata:
  name: platform-2
spec:
  serverRef:
    name: openbao-2
  auth:
    kubernetes:
      role: openbao-config-operator
      injectedIdentity: {}
  allowedNamespaces:
    matchLabels:
      kubernetes.io/metadata.name: platform
