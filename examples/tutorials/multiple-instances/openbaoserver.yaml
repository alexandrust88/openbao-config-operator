# The second OpenBao. allowedNamespaces is unset, so no BaoConnection may use it: only the platform's
# ClusterBaoConnection platform-2 reaches it.
apiVersion: core.obco.dev/v1alpha1
kind: BaoServer
metadata:
  name: openbao-2
spec:
  address: http://openbao.openbao-2.svc:8200
  allowInsecureHTTP: true
