# A tenant-a attempt to write a policy in the OpenBao root namespace through the platform's ClusterOpenBaoConnection.
# The connection admits only the Kubernetes namespace platform, so the resource stays not Ready with reason
# ConnectionDenied and nothing is written.
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: reach-root
  namespace: tenant-a
spec:
  connectionRef:
    kind: ClusterOpenBaoConnection
    name: platform
  name: tenant-a-in-root
  policy: |
    path "sys/*" {
      capabilities = ["read"]
    }
