apiVersion: sys.openbaoconfig.io/v1alpha1
kind: PasswordPolicy
metadata:
  name: alpha-application-passwords
  namespace: obco-lab
spec:
  connectionRef:
    name: lab-openbao
  namespace: lab-alpha
  deletionPolicy: Orphan
  name: application-passwords
  policy: |
    length = 32
    rule "charset" {
      charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
      min-chars = 32
    }
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: RandomSecret
metadata:
  name: alpha-application-password
  namespace: obco-lab
spec:
  connectionRef:
    name: lab-openbao
  namespace: lab-alpha
  deletionPolicy: Orphan
  creationPolicy: CreateOrAdopt
  mountPath: kv
  path: app/generated
  kvVersion: 2
  key: password
  passwordPolicyName: application-passwords
  refreshNonce: initial
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: generated-application
  namespace: obco-lab-alpha
spec:
  refreshInterval: 5s
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: generated-application
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: app/generated
        property: password
