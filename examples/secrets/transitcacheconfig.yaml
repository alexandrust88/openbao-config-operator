# Bound the Transit cache to 100 entries; use size 0 for an unlimited cache.
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitCacheConfig
metadata:
  name: obco-transit-cache
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: transit
  size: 100
