apiVersion: v1
kind: Secret
metadata:
  name: quay-token
type: Opaque
stringData:
  token: fake-quay-oauth-token
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: QuaySecretsConfig
metadata:
  name: quay
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: quay
  url: https://quay.example.org
  tokenSecretRef:
    name: quay-token
    key: token
  caCertificate: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1xdWF5LWNh
    -----END CERTIFICATE-----
  disableSSLVerification: false
