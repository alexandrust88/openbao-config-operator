apiVersion: v1
kind: Secret
metadata:
  name: ldap-bind
type: Opaque
stringData:
  password: fake-bind-password
  tls.key: fake-ldap-client-key-pem
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsConfig
metadata:
  name: ldap
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: ldap
  bindDN: cn=openbao,ou=services,dc=example,dc=org
  bindPassSecretRef:
    name: ldap-bind
    key: password
  url: ldaps://ldap1.example.org,ldaps://ldap2.example.org
  userDN: ou=people,dc=example,dc=org
  userAttr: uid
  upnDomain: example.org
  certificate: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1sZGFwLWNh
    -----END CERTIFICATE-----
  clientTLSCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1sZGFwLWNsaWVudC1jZXJ0
    -----END CERTIFICATE-----
  clientTLSKeySecretRef:
    name: ldap-bind
    key: tls.key
  insecureTLS: false
  startTLS: false
  tlsMinVersion: tls12
  tlsMaxVersion: tls13
  connectionTimeout: 30s
  requestTimeout: 1m30s
  passwordPolicy: ldap-passwords
  schema: openldap
  skipStaticRoleImportRotation: true
