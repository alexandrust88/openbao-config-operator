# CEL policy for certificate issuance on the default pki mount.
apiVersion: secrets.obco.dev/v1alpha1
kind: PKICELRole
metadata:
  name: strict-cn
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: pki
  celProgram:
    expression: "success ? output : err"
    variables:
      - name: require_ip_sans
        expression: size(request.ip_sans) > 0
      - name: success
        expression: request.common_name == 'example.com' && require_ip_sans
      - name: cert
        expression: 'CertTemplate{Subject: PKIX.Name{CommonName: request.common_name, Country: ["ZW", "US"]}}'
      - name: output
        expression: "ValidationOutput{template: cert}"
      - name: err
        expression: "'Request should have atleast 1 IP SAN.'"
