# Generates an EC P-384 root CA issuer inside OpenBao on the obco-pki-root mount.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: obco-root-2026
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: obco-pki-root
  name: obco-root-2026
  type: root
  key:
    source: internal
    name: obco-root-2026-key
    type: ec
    bits: 384
  certificate:
    commonName: OBCO Sandbox Root CA 2026
    altNames:
      - root-ca.openbao-config.example.com
      - pki@openbao-config.example.com
    ipSANs:
      - 192.0.2.10
    uriSANs:
      - spiffe://openbao-config.example.com/ca/root
    otherSANs:
      - 1.3.6.1.4.1.311.20.2.3;UTF8:root-ca@openbao-config.example.com
    excludeCNFromSANs: true
    ou:
      - Platform
    organization:
      - OBCO Sandbox
    country:
      - DE
    locality:
      - Berlin
    province:
      - Berlin
    streetAddress:
      - Example Street 1
    postalCode:
      - "10115"
    serialNumber: obco-root-2026
    ttl: 87600h
    notBeforeDuration: 30s
    maxPathLength: 1
    permittedDNSDomains:
      - openbao-config.example.com
    signatureBits: 384
    usePSS: false
  leafNotAfterBehavior: err
  usage:
    - issuing-certificates
    - crl-signing
    - ocsp-signing
  manualChain:
    - obco-root-2026
  revocationSignatureAlgorithm: ECDSAWithSHA384
  issuingCertificates:
    - https://openbao.openbao-config.example.com/v1/openbao-config/obco-pki-root/issuer/obco-root-2026/der
  crlDistributionPoints:
    - https://openbao.openbao-config.example.com/v1/openbao-config/obco-pki-root/issuer/obco-root-2026/crl/der
  ocspServers:
    - https://openbao.openbao-config.example.com/v1/openbao-config/obco-pki-root/ocsp
  enableAIAURLTemplating: false
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: obco-int-2026
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  deletionPolicy: Orphan
  mountPath: obco-pki-int
  type: intermediate
  key:
    source: exported
    name: obco-int-2026-key
    type: ec
    bits: 256
    privateKeyFormat: pkcs8
  certificate:
    commonName: OBCO Sandbox Intermediate CA 2026
    organization:
      - OBCO Sandbox
    notAfter: "2031-01-01T00:00:00Z"
    maxPathLength: 0
    permittedDNSDomains:
      - openbao-config.example.com
    addBasicConstraints: false
  signer:
    issuerRef:
      name: obco-root-2026
  writeSecretRef:
    name: obco-int-2026-private-key
  leafNotAfterBehavior: truncate
  usage:
    - issuing-certificates
    - crl-signing
  enableAIAURLTemplating: true
  issuingCertificates:
    - "{{cluster_aia_path}}/issuer/{{issuer_id}}/der"
  crlDistributionPoints:
    - "{{cluster_aia_path}}/issuer/{{issuer_id}}/crl/der"
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: obco-int-2026b
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: obco-pki-int
  type: intermediate
  key:
    source: existing
    existing:
      keyRef:
        name: obco-int-key
  certificate:
    commonName: OBCO Sandbox Intermediate CA 2026b
    ttl: 43800h
  signer:
    mountPath: obco-pki-root
    issuerName: obco-root-2026
