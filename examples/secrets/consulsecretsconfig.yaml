apiVersion: v1
kind: Secret
metadata:
  name: obco-consul
  namespace: openbao-config
type: Opaque
stringData:
  token: 00000000-fake-consul-token-not-real
  tls.key: fake-consul-client-key-not-real
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: ConsulSecretsConfig
metadata:
  name: obco-consul
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: consul
  address: consul.openbao-config.svc:8501
  scheme: https
  tokenSecretRef:
    name: obco-consul
    key: token
  caCert: |
    -----BEGIN CERTIFICATE-----
    RkFLRS1DQS1DRVJUSUZJQ0FURS1OT1QtUkVBTA==
    -----END CERTIFICATE-----
  clientCert: |
    -----BEGIN CERTIFICATE-----
    RkFLRS1DTElFTlQtQ0VSVElGSUNBVEUtTk9ULVJFQUw=
    -----END CERTIFICATE-----
  clientKeySecretRef:
    name: obco-consul
    key: tls.key
