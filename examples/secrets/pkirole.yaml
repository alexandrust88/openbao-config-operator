# A certificate role on the intermediate CA mount that issues 24-hour certificates for subdomains of
# openbao-config.example.com, including a domain templated from the requester's entity metadata.
apiVersion: secrets.obco.dev/v1alpha1
kind: PKIRole
metadata:
  name: obco-web
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: obco-pki-int
  name: obco-web
  issuer:
    issuerRef:
      name: obco-int-2026
  ttl: 24h
  maxTTL: 720h
  allowLocalhost: false
  allowedDomains:
    - openbao-config.example.com
    - "{{identity.entity.metadata.team}}.openbao-config.example.com"
  allowedDomainsTemplate: true
  allowGlobsInIdentityTemplates: false
  allowBareDomains: false
  allowSubdomains: true
  allowGlobDomains: false
  allowWildcardCertificates: false
  allowAnyName: false
  enforceHostnames: true
  allowIPSANs: true
  allowedIPSANsCIDR:
    - 10.0.0.0/8
  allowedURISANs:
    - spiffe://openbao-config.example.com/*
  allowedURISANsTemplate: false
  allowedOtherSANs:
    - 1.3.6.1.4.1.311.20.2.3;UTF8:*@openbao-config.example.com
  allowedSerialNumbers:
    - obco-*
  allowedUserIDs:
    - "*"
  serverFlag: true
  clientFlag: true
  codeSigningFlag: false
  emailProtectionFlag: false
  keyType: ec
  keyBits: 256
  signatureBits: 256
  usePSS: false
  keyUsage:
    - DigitalSignature
    - KeyAgreement
  extKeyUsage:
    - ServerAuth
    - ClientAuth
  extKeyUsageOIDs:
    - 1.3.6.1.5.5.7.3.1
  useCSRCommonName: true
  useCSRSANs: true
  ou:
    - Platform
  organization:
    - OBCO Sandbox
  country:
    - DE
  locality:
    - Berlin
  province:
    - Berlin
  streetAddress:
    - Example Street 1
  postalCode:
    - "10115"
  generateLease: false
  noStore: false
  requireCN: true
  cnValidations:
    - hostname
  policyIdentifiers:
    - 1.3.6.1.4.1.44947.1.1.1
  basicConstraintsValidForNonCA: false
  notBeforeDuration: 30s
  notBefore: "2026-01-01T00:00:00Z"
  notBeforeBound: permit
  notAfter: "2030-01-01T00:00:00Z"
  notAfterBound: ttl-limited
---
apiVersion: secrets.obco.dev/v1alpha1
kind: PKIRole
metadata:
  name: obco-acme
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: obco-pki-int
  issuer:
    issuerName: obco-int-2026
  allowedDomains:
    - acme.openbao-config.example.com
  allowSubdomains: true
  maxTTL: 2160h
