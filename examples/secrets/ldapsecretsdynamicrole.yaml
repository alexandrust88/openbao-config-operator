apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsDynamicRole
metadata:
  name: app-readers
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: ldap
  name: app-readers
  creationLDIF: |
    dn: cn={{.Username}},ou=dynamic,dc=example,dc=org
    objectClass: person
    objectClass: top
    cn: {{.Username}}
    sn: {{.Username}}
    userPassword: {{.Password}}

    dn: cn=readers,ou=groups,dc=example,dc=org
    changetype: modify
    add: member
    member: cn={{.Username}},ou=dynamic,dc=example,dc=org
  deletionLDIF: |
    dn: cn={{.Username}},ou=dynamic,dc=example,dc=org
    changetype: delete
  rollbackLDIF: |
    dn: cn={{.Username}},ou=dynamic,dc=example,dc=org
    changetype: delete
  usernameTemplate: 'v_{{.RoleName}}_{{random 10}}'
  defaultTTL: 1h
  maxTTL: 24h
