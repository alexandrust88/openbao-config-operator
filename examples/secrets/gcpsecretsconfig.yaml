apiVersion: v1
kind: Secret
metadata:
  name: obco-gcp-sa
  namespace: openbao-config
type: Opaque
stringData:
  credentials.json: '{"type":"service_account","project_id":"example-project","private_key":"fake-not-real","client_email":"openbao@example-project.iam.gserviceaccount.com"}'
---
apiVersion: secrets.obco.dev/v1alpha1
kind: GCPSecretsConfig
metadata:
  name: obco-gcp
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: gcp
  credentialsSecretRef:
    name: obco-gcp-sa
    key: credentials.json
  ttl: 1h
  maxTTL: 24h
