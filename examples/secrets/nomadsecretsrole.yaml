apiVersion: secrets.obco.dev/v1alpha1
kind: NomadSecretsRole
metadata:
  name: deployer
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: nomad
  name: deployer
  type: client
  global: true
  policies:
    - deploy-jobs
    - read-nodes
