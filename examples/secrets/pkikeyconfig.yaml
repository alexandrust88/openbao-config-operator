# Default signing key for the pki mount; the config path cannot be deleted.
apiVersion: secrets.obco.dev/v1alpha1
kind: PKIKeyConfig
metadata:
  name: pki-default-key
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: pki
  defaultKey: example-key
---
apiVersion: secrets.obco.dev/v1alpha1
kind: PKIKey
metadata:
  name: example-key
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: pki
  name: example-key
  type: internal
  keyType: ec
  keyBits: 256
