# Generates a session key once, stores it in KV and copies it to a Kubernetes Secret; changing refreshNonce
# regenerates it. The second resource generates a password from a PasswordPolicy instead.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: RandomSecret
metadata:
  name: obco-app-session-key
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: secret
  path: obco/app-random
  kvVersion: 2
  key: session-key
  generator:
    length: 48
    charset: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_
  refreshNonce: "2026-11-14"
  writeSecretRef:
    name: obco-app-session-key
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: RandomSecret
metadata:
  name: obco-app-admin-password
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: secret
  path: obco/app-admin
  kvVersion: 2
  key: admin-password
  passwordPolicyName: db-passwords
  refreshNonce: "1"
  writeSecretRef:
    name: obco-app-admin-password
