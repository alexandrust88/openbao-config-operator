apiVersion: v1
kind: Secret
metadata:
  name: obco-azure-sp
  namespace: openbao-config
type: Opaque
stringData:
  client-id: 11111111-1111-1111-1111-111111111111
  client-secret: fake-azure-client-secret-not-real
---
apiVersion: secrets.obco.dev/v1alpha1
kind: AzureSecretsConfig
metadata:
  name: obco-azure
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: azure
  subscriptionID: 00000000-0000-0000-0000-000000000001
  tenantID: 00000000-0000-0000-0000-000000000002
  clientIDSecretRef:
    name: obco-azure-sp
    key: client-id
  clientSecretSecretRef:
    name: obco-azure-sp
    key: client-secret
  environment: AzurePublicCloud
  passwordPolicy: obco-azure-sp
  rootPasswordTTL: 4380h
