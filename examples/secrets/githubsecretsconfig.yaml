apiVersion: v1
kind: Secret
metadata:
  name: github-app-key
type: Opaque
stringData:
  private-key.pem: fake-github-app-rsa-key-pem
---
apiVersion: secrets.obco.dev/v1alpha1
kind: GitHubSecretsConfig
metadata:
  name: github
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: github
  appID: 123456
  privateKeySecretRef:
    name: github-app-key
    key: private-key.pem
  baseURL: https://github.example.com/api/v3
  excludeRepositoryMetadata: true
