apiVersion: secrets.obco.dev/v1alpha1
kind: AWSSecretsRole
metadata:
  name: obco-aws-deploy
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: aws
  name: deploy
  credentialType: assumed_role
  roleARNs:
    - arn:aws:iam::123456789012:role/obco-deploy
  policyARNs:
    - arn:aws:iam::aws:policy/ReadOnlyAccess
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {"Effect": "Allow", "Action": ["s3:ListBucket", "s3:GetObject"], "Resource": "arn:aws:s3:::obco-artifacts/*"}
      ]
    }
  iamGroups:
    - obco-readers
  sessionTags:
    team: platform
    env: sandbox
  externalID: openbao-config-external-id
  defaultSTSTTL: 15m
  maxSTSTTL: 1h
---
apiVersion: secrets.obco.dev/v1alpha1
kind: AWSSecretsRole
metadata:
  name: obco-aws-ci-user
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  mountPath: aws
  name: ci-user
  credentialType: iam_user
  policyARNs:
    - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
  iamTags:
    team: platform
    managed-by: openbao
  userPath: /obco/
  permissionsBoundaryARN: arn:aws:iam::123456789012:policy/obco-boundary
  mfaSerialNumber: arn:aws:iam::123456789012:mfa/obco-ci
