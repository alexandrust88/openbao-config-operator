apiVersion: secrets.obco.dev/v1alpha1
kind: GCPImpersonatedAccount
metadata:
  name: obco-gcp-ci-runner
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: gcp
  name: ci-runner
  serviceAccountEmail: ci-runner@example-project.iam.gserviceaccount.com
  tokenScopes:
    - https://www.googleapis.com/auth/cloud-platform
  ttl: 1h
