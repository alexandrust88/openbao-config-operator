# Keeps ten versions of every secret on the secret mount and deletes versions older than 32 days.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KVConfig
metadata:
  name: obco-secret-config
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: secret
  maxVersions: 10
  casRequired: false
  metadataCASRequired: false
  deleteVersionAfter: 768h
