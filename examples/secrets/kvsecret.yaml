apiVersion: v1
kind: Secret
metadata:
  name: obco-app-db
  namespace: openbao-config
type: Opaque
stringData:
  username: app
  password: fake-db-password-not-real
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-app-api
  namespace: openbao-config
type: Opaque
stringData:
  token: fake-api-token-not-real
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KVSecret
metadata:
  name: obco-app
  namespace: openbao-config
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: secret
  path: obco/app
  kvVersion: 2
  dataFrom:
    - secretRef:
        name: obco-app-db
  data:
    api-token:
      secretKeyRef:
        name: obco-app-api
        key: token
