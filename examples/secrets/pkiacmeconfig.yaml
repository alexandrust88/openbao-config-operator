apiVersion: secrets.obco.dev/v1alpha1
kind: PKIACMEConfig
metadata:
  name: obco-pki-int
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: obco-pki-int
  enabled: true
  allowedIssuers:
    - obco-int-2026
  allowedRoles:
    - obco-acme
  allowRoleExtKeyUsage: false
  defaultDirectoryPolicy: role:obco-acme
  dnsResolver: ""
  eabPolicy: not-required
