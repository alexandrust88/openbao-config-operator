apiVersion: v1
kind: Secret
metadata:
  name: obco-rabbitmq-admin
  namespace: openbao-config
type: Opaque
stringData:
  password: fake-rabbitmq-password-not-real
---
apiVersion: secrets.obco.dev/v1alpha1
kind: RabbitMQConfig
metadata:
  name: obco-rabbitmq
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: rabbitmq
  connectionURI: http://rabbitmq.openbao-config.svc:15672
  username: openbao-admin
  passwordSecretRef:
    name: obco-rabbitmq-admin
    key: password
  verifyConnection: true
  passwordPolicy: obco-rabbitmq
  usernameTemplate: '{{ printf "obco-%s-%s" (.RoleName | truncate 16) (random 8) }}'
  lease:
    ttl: 1h
    maxTTL: 24h
