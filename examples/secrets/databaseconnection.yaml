apiVersion: v1
kind: Secret
metadata:
  name: obco-db-root
  namespace: openbao-config
type: Opaque
stringData:
  password: fake-root-password-not-real
  private-key: fake-private-key-not-real
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-db-tls
  namespace: openbao-config
type: Opaque
stringData:
  client.pem: fake-client-certificate-and-key-not-real
  bundle.pem: fake-pem-bundle-not-real
  issue.json: '{"certificate":"fake-not-real","private_key":"fake-not-real","issuing_ca":"fake-not-real"}'
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: obco-postgres
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: database
  name: postgres
  pluginName: postgresql-database-plugin
  verifyConnection: true
  allowedRoles:
    - obco-app-ro
    - obco-app-static
  rootRotationStatements:
    - ALTER USER "{{name}}" WITH PASSWORD '{{password}}';
  passwordPolicy: obco-db
  passwordSecretRef:
    name: obco-db-root
    key: password
  rotateRootOnCreate: true
  postgresql:
    connectionURL: postgresql://{{username}}:{{password}}@postgres.openbao-config.svc:5432/app?sslmode=require
    username: openbao-root
    maxOpenConnections: 8
    maxIdleConnections: 4
    maxConnectionLifetime: 5m
    usernameTemplate: '{{ printf "v-%s-%s" (.RoleName | truncate 16) (random 8) }}'
    disableEscaping: false
    passwordAuthentication: scram-sha-256
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: obco-mysql
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: database
  pluginName: mysql-database-plugin
  verifyConnection: false
  allowedRoles:
    - '*'
  passwordSecretRef:
    name: obco-db-root
    key: password
  mysql:
    connectionURL: '{{username}}:{{password}}@tcp(mysql.openbao-config.svc:3306)/'
    username: openbao-root
    maxOpenConnections: 4
    maxIdleConnections: 2
    maxConnectionLifetime: 1m
    usernameTemplate: '{{ .RoleName | truncate 10 }}-{{ random 6 }}'
    tlsCA: |
      -----BEGIN CERTIFICATE-----
      ZmFrZS1jYS1ub3QtcmVhbA==
      -----END CERTIFICATE-----
    tlsCertificateKeySecretRef:
      name: obco-db-tls
      key: client.pem
    tlsServerName: mysql.openbao-config.svc
    tlsSkipVerify: false
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: obco-cassandra
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: database
  pluginName: cassandra-database-plugin
  verifyConnection: false
  allowedRoles:
    - obco-cassandra
  passwordSecretRef:
    name: obco-db-root
    key: password
  cassandra:
    hosts:
      - cassandra-0.cassandra.openbao-config.svc
      - cassandra-1.cassandra.openbao-config.svc
    port: 9042
    protocolVersion: 4
    username: cassandra
    tls: true
    insecureTLS: false
    tlsServerName: cassandra.openbao-config.svc
    tlsMinVersion: tls12
    pemBundleSecretRef:
      name: obco-db-tls
      key: bundle.pem
    skipVerification: false
    connectTimeout: 5s
    socketKeepAlive: 30s
    consistency: LOCAL_QUORUM
    localDatacenter: dc1
    usernameTemplate: '{{ .RoleName }}_{{ random 8 }}'
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: obco-influxdb
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: database
  pluginName: influxdb-database-plugin
  verifyConnection: false
  allowedRoles:
    - obco-influx
  passwordSecretRef:
    name: obco-db-root
    key: password
  influxdb:
    host: influxdb.openbao-config.svc
    port: 8086
    username: admin
    tls: true
    insecureTLS: false
    tlsMinVersion: tls12
    pemJSONSecretRef:
      name: obco-db-tls
      key: issue.json
    connectTimeout: 5s
    usernameTemplate: '{{ .RoleName }}_{{ random 8 }}'
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: obco-valkey
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: database
  pluginName: valkey-database-plugin
  verifyConnection: false
  allowedRoles:
    - obco-cache
  passwordSecretRef:
    name: obco-db-root
    key: password
  valkey:
    host: valkey.openbao-config.svc
    port: 6379
    username: default
    tls: true
    insecureTLS: false
    caCert: |
      -----BEGIN CERTIFICATE-----
      ZmFrZS1jYS1ub3QtcmVhbA==
      -----END CERTIFICATE-----
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: obco-redis-url
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: database
  pluginName: redis-database-plugin
  verifyConnection: false
  valkey:
    connectionURL: rediss://redis.openbao-config.svc:6379
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: obco-snowflake
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: database
  pluginName: snowflake-database-plugin
  pluginVersion: v0.13.0
  verifyConnection: false
  allowedRoles:
    - obco-analytics
  privateKeySecretRef:
    name: obco-db-root
    key: private-key
  pluginConfig:
    connection_url: '{{username}}@obco-account/analytics'
    username: OPENBAO_ROOT
    max_open_connections: "4"
