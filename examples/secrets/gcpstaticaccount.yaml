apiVersion: secrets.obco.dev/v1alpha1
kind: GCPStaticAccount
metadata:
  name: obco-gcp-ci-deployer
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: gcp
  name: ci-deployer
  secretType: access_token
  serviceAccountEmail: ci-deployer@example-project.iam.gserviceaccount.com
  bindings:
    - resource: //storage.googleapis.com/projects/_/buckets/obco-artifacts
      roles:
        - roles/storage.objectViewer
  tokenScopes:
    - https://www.googleapis.com/auth/cloud-platform
