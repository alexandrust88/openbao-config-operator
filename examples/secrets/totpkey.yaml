apiVersion: secrets.obco.dev/v1alpha1
kind: TOTPKey
metadata:
  name: obco-alice
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: totp
  name: obco-alice
  generate:
    keySize: 20
    exported: true
    qrSize: 200
    writeSecretRef:
      name: obco-alice-otpauth
  issuer: Example
  accountName: alice@example.com
  period: 30s
  algorithm: SHA256
  digits: 8
  skew: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-bob-totp
  namespace: openbao-config
type: Opaque
stringData:
  key: FAKEFAKEFAKEFAKE
  url: otpauth://totp/Example:carol@example.com?secret=FAKEFAKEFAKEFAKE&issuer=Example&period=30&digits=6&algorithm=SHA1
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TOTPKey
metadata:
  name: obco-bob
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  mountPath: totp
  keySecretRef:
    name: obco-bob-totp
    key: key
  issuer: Example
  accountName: bob@example.com
  period: 60s
  algorithm: SHA1
  digits: 6
  skew: 0
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TOTPKey
metadata:
  name: obco-carol
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  mountPath: totp
  urlSecretRef:
    name: obco-bob-totp
    key: url
  skew: 1
