apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: obco-app-sa
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: kubernetes
  name: obco-app-sa
  allowedKubernetesNamespaces:
    - openbao-config
  tokenDefaultTTL: 1h
  tokenMaxTTL: 4h
  tokenDefaultAudiences:
    - https://kubernetes.default.svc
  serviceAccountName: obco-app
  kubernetesRoleType: Role
  nameTemplate: '{{ printf "obco-%s-%s" (.RoleName | truncate 16) (random 8) | lowercase }}'
  extraLabels:
    app.kubernetes.io/managed-by: openbao
  extraAnnotations:
    obco.example/owner: platform
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: obco-app-generated
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: kubernetes
  allowedKubernetesNamespaceSelector: '{"matchLabels":{"obco.example/tenant":"sandbox"}}'
  kubernetesRoleType: ClusterRole
  generatedRoleRules: |
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: obco-app-bound
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: kubernetes
  allowedKubernetesNamespaces:
    - openbao-config
  kubernetesRoleName: obco-app-reader
