apiVersion: secrets.obco.dev/v1alpha1
kind: GCPRoleset
metadata:
  name: obco-gcp-viewer
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: gcp
  name: viewer
  secretType: access_token
  project: example-project
  bindings:
    - resource: //cloudresourcemanager.googleapis.com/projects/example-project
      roles:
        - roles/viewer
        - roles/browser
    - resource: projects/example-project/topics/obco-events
      roles:
        - roles/pubsub.publisher
  tokenScopes:
    - https://www.googleapis.com/auth/cloud-platform
