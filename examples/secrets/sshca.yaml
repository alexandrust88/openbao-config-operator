apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHCA
metadata:
  name: obco-ssh-ca
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: ssh
  keyType: ecdsa-sha2-nistp384
  keyBits: 384
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-ssh-ca-imported
  namespace: openbao-config
type: Opaque
stringData:
  private-key: fake-ssh-ca-private-key-not-real
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHCA
metadata:
  name: obco-ssh-ca-imported
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  mountPath: ssh-imported
  publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGZha2UtcHVibGljLWtleS1ub3QtcmVhbC0wMDAw obco-fake
  privateKeySecretRef:
    name: obco-ssh-ca-imported
    key: private-key
