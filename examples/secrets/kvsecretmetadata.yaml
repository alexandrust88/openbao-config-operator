# Per-secret KV version 2 metadata for team/app on the secret mount.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KVSecretMetadata
metadata:
  name: team-app
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: secret
  path: team/app
  maxVersions: 5
  customMetadata:
    owner: team