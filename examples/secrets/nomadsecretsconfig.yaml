apiVersion: v1
kind: Secret
metadata:
  name: nomad-access
type: Opaque
stringData:
  token: 00000000-0000-0000-0000-000000000000
  client.key: fake-nomad-client-key-pem
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: NomadSecretsConfig
metadata:
  name: nomad
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: nomad
  address: https://nomad.example.org:4646
  tokenSecretRef:
    name: nomad-access
    key: token
  maxTokenNameLength: 64
  caCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub21hZC1jYQ==
    -----END CERTIFICATE-----
  clientCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1ub21hZC1jbGllbnQtY2VydA==
    -----END CERTIFICATE-----
  clientKeySecretRef:
    name: nomad-access
    key: client.key
  ttl: 1h
  maxTTL: 24h
