apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: QuaySecretsStaticRole
metadata:
  name: mirror-pull
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: quay
  name: mirror-pull
  namespaceName: platform
  namespaceType: organization
  createRepositories: false
  defaultPermission: read
  teams:
    readers: member
  repositories:
    platform/mirror: read
