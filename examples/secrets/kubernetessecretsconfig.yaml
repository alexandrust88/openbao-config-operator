apiVersion: v1
kind: Secret
metadata:
  name: obco-k8s-secrets-sa
  namespace: openbao-config
type: Opaque
stringData:
  token: fake.service-account.jwt-not-real
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsConfig
metadata:
  name: obco-kubernetes
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: kubernetes
  kubernetesHost: https://kubernetes.default.svc:443
  kubernetesCACert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1jYS1ub3QtcmVhbA==
    -----END CERTIFICATE-----
  serviceAccountJWTSecretRef:
    name: obco-k8s-secrets-sa
    key: token
  disableLocalCAJWT: true
