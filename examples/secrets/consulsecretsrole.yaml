apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: ConsulSecretsRole
metadata:
  name: obco-consul-app
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: consul
  name: app
  consulPolicies:
    - obco-read-kv
  consulRoles:
    - obco-ops
  serviceIdentities:
    - obco-web:dc1,dc2
  nodeIdentities:
    - obco-node-1:dc1
  consulNamespace: obco
  partition: default
  local: true
  ttl: 1h
  maxTTL: 24h
