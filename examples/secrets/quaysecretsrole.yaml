apiVersion: secrets.obco.dev/v1alpha1
kind: QuaySecretsRole
metadata:
  name: ci-push
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: quay
  name: ci-push
  namespaceName: platform
  namespaceType: organization
  createRepositories: true
  defaultPermission: read
  teams:
    builders: member
  repositories:
    platform/operator: write
    platform/charts: admin
  ttl: 1h
  maxTTL: 24h
