apiVersion: v1
kind: Secret
metadata:
  name: terraform-token
type: Opaque
stringData:
  token: fake.atlasv1.terraform-api-token
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TerraformCloudSecretsConfig
metadata:
  name: terraform
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: terraform
  address: https://tfe.example.org
  basePath: /api/v2/
  tokenSecretRef:
    name: terraform-token
    key: token
  explicitMaxTTL: 8760h
