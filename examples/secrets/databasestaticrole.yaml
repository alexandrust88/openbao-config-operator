apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseStaticRole
metadata:
  name: obco-app-static
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: database
  name: obco-app-static
  dbName: postgres
  username: obco_app
  rotationPeriod: 24h
  rotationStatements:
    - ALTER USER "{{name}}" WITH PASSWORD '{{password}}';
  credentialType: password
  credentialConfig:
    password_policy: obco-db
