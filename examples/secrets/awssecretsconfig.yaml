apiVersion: v1
kind: Secret
metadata:
  name: obco-aws-root
  namespace: openbao-config
type: Opaque
stringData:
  access-key-id: AKIAFAKEEXAMPLE00001
  secret-access-key: fake-aws-secret-access-key-not-real
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: AWSSecretsConfig
metadata:
  name: obco-aws
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: aws
  accessKeySecretRef:
    name: obco-aws-root
    key: access-key-id
  secretKeySecretRef:
    name: obco-aws-root
    key: secret-access-key
  region: eu-central-1
  iamEndpoint: https://iam.amazonaws.com
  stsEndpoint: https://sts.eu-central-1.amazonaws.com
  maxRetries: 3
  usernameTemplate: '{{ printf "obco-%s-%s" (unix_time) (random 20) | truncate 64 }}'
  lease: 30m
  leaseMax: 12h
