apiVersion: secrets.obco.dev/v1alpha1
kind: GitHubSecretsRole
metadata:
  name: ci-read-contents
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: github
  name: ci-read-contents
  installationID: 7654321
  organizationName: example-org
  repositories:
    - platform-config
    - platform-charts
  repositoryIDs:
    - 101
    - 202
  permissions:
    contents: read
    metadata: read
    pull_requests: write
  skipInaccessibleRepositories: false
