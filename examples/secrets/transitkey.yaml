# An AES-256-GCM transit key for application encryption that rotates every 30 days, plus an HMAC key.
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKey
metadata:
  name: obco-app-encryption
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: transit
  name: obco-app
  type: aes256-gcm96
  derived: true
  convergentEncryption: true
  exportable: true
  allowPlaintextBackup: true
  autoRotatePeriod: 720h
  minDecryptionVersion: 1
  minEncryptionVersion: 0
  deletionAllowed: false
  rotateNonce: "2026-11-14"
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKey
metadata:
  name: obco-app-hmac
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  mountPath: transit
  type: hmac
  keySize: 64
