# A dynamic role that creates a read-only PostgreSQL user per request, valid for an hour, and drops it when the lease
# ends.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseRole
metadata:
  name: obco-app-ro
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: database
  name: obco-app-ro
  dbName: postgres
  credentialType: password
  credentialConfig:
    password_policy: obco-db
  defaultTTL: 1h
  maxTTL: 24h
  creationStatements:
    - CREATE ROLE "{{name}}" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';
    - GRANT SELECT ON ALL TABLES IN SCHEMA public TO "{{name}}";
  revocationStatements:
    - REVOKE ALL ON ALL TABLES IN SCHEMA public FROM "{{name}}";
    - DROP ROLE IF EXISTS "{{name}}";
  rollbackStatements:
    - DROP ROLE IF EXISTS "{{name}}";
  renewStatements:
    - ALTER ROLE "{{name}}" VALID UNTIL '{{expiration}}';
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-db-client-ca
  namespace: openbao-config
type: Opaque
stringData:
  key: fake-ca-private-key-not-real
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseRole
metadata:
  name: obco-app-cert
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: database
  name: obco-app-cert
  dbName: postgres
  credentialType: client_certificate
  credentialConfig:
    ca_cert: fake-ca-certificate-not-real
    common_name_template: "{{.DisplayName}}_{{.RoleName}}"
    key_type: ec
    key_bits: "256"
    signature_bits: "256"
  caPrivateKeySecretRef:
    name: obco-db-client-ca
    key: key
  defaultTTL: 1h
  maxTTL: 24h
  creationStatements:
    - CREATE ROLE "{{name}}" WITH LOGIN;
  revocationStatements:
    - DROP ROLE IF EXISTS "{{name}}";
