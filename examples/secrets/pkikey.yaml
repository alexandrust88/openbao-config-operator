apiVersion: secrets.obco.dev/v1alpha1
kind: PKIKey
metadata:
  name: obco-int-key
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: obco-pki-int
  name: obco-int-key
  type: internal
  keyType: ec
  keyBits: 256
---
apiVersion: secrets.obco.dev/v1alpha1
kind: PKIKey
metadata:
  name: obco-exported-key
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: obco-pki-int
  type: exported
  keyType: rsa
  keyBits: 4096
  writeSecretRef:
    name: obco-exported-key-private
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-imported-key
  namespace: openbao-config
type: Opaque
stringData:
  key.pem: fake-pem-private-key-not-real
---
apiVersion: secrets.obco.dev/v1alpha1
kind: PKIKey
metadata:
  name: obco-imported-key
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: obco-pki-int
  type: import
  pemBundleSecretRef:
    name: obco-imported-key
    key: key.pem
