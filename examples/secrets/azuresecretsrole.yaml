apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: AzureSecretsRole
metadata:
  name: obco-azure-reader
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: azure
  name: reader
  azureRoles:
    - roleName: Reader
      scope: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/openbao-config
    - roleID: /subscriptions/00000000-0000-0000-0000-000000000001/providers/Microsoft.Authorization/roleDefinitions/acdd72a7-3385-48ef-bd42-f606fba81ae7
      scope: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/obco-shared
  azureGroups:
    - groupName: obco-readers
    - groupName: obco-auditors
      objectID: 22222222-2222-2222-2222-222222222222
  persistApp: false
  ttl: 1h
  maxTTL: 24h
  explicitMaxTTL: 720h
  permanentlyDelete: true
  signInAudience: AzureADMyOrg
  tags:
    - team:platform
    - env:sandbox
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: AzureSecretsRole
metadata:
  name: obco-azure-existing-app
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  mountPath: azure
  name: existing-app
  applicationObjectID: 33333333-3333-3333-3333-333333333333
  ttl: 1h
  maxTTL: 8h
