apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: LDAPSecretsStaticRole
metadata:
  name: backup-service
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: ldap
  name: backup-service
  username: svc-backup
  dn: cn=svc-backup,ou=services,dc=example,dc=org
  rotationPeriod: 24h
  skipImportRotation: false
