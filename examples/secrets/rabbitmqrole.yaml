apiVersion: secrets.obco.dev/v1alpha1
kind: RabbitMQRole
metadata:
  name: obco-app
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: rabbitmq
  name: obco-app
  tags:
    - management
  vhosts:
    /:
      configure: ^obco\.
      write: ^obco\.
      read: .*
    obco:
      configure: ""
      write: .*
      read: .*
  vhostTopics:
    /:
      amq.topic:
        write: ^obco\.
        read: .*
