# Mount-wide transit key defaults on the transit mount.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TransitKeyConfig
metadata:
  name: obco-transit-keys
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: transit
  disableUpsert: false