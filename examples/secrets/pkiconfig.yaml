apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIConfig
metadata:
  name: obco-pki-int
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: obco-pki-int
  cluster:
    path: https://openbao.openbao-config.example.com/v1/openbao-config/obco-pki-int
    aiaPath: http://openbao.openbao-config.example.com/v1/openbao-config/obco-pki-int
  urls:
    issuingCertificates:
      - "{{cluster_aia_path}}/issuer/{{issuer_id}}/der"
    crlDistributionPoints:
      - "{{cluster_aia_path}}/issuer/{{issuer_id}}/crl/der"
    deltaCRLDistributionPoints:
      - "{{cluster_aia_path}}/issuer/{{issuer_id}}/crl/delta/der"
    ocspServers:
      - "{{cluster_path}}/ocsp"
    enableTemplating: true
  crl:
    expiry: 72h
    disable: false
    ocspDisable: false
    ocspExpiry: 12h
    autoRebuild: true
    autoRebuildGracePeriod: 12h
    enableDelta: true
    deltaRebuildInterval: 15m
    allowExpiredCertRevocation: false
  issuers:
    default:
      issuerRef:
        name: obco-int-2026
    defaultFollowsLatestIssuer: false
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIConfig
metadata:
  name: obco-pki-root
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: obco-pki-root
  issuers:
    default:
      issuerName: obco-root-2026
