apiVersion: secrets.obco.dev/v1alpha1
kind: PKIAutoTidy
metadata:
  name: obco-pki-int
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: obco-pki-int
  enabled: true
  intervalDuration: 12h
  tidyCertStore: true
  tidyRevokedCerts: true
  tidyInvalidCerts: false
  tidyRevokedCertIssuerAssociations: true
  tidyExpiredIssuers: true
  tidyMoveLegacyCABundle: false
  tidyACME: true
  safetyBuffer: 72h
  revokedSafetyBuffer: 72h
  issuerSafetyBuffer: 8760h
  acmeAccountSafetyBuffer: 720h
  pageSize: 1000
  pauseDuration: 0s
  maintainStoredCertificateCounts: true
  publishStoredCertificateCountMetrics: true
