apiVersion: v1
kind: Secret
metadata:
  name: atlas-api-key
type: Opaque
stringData:
  private-key: fake-atlas-private-key
---
apiVersion: secrets.obco.dev/v1alpha1
kind: MongoDBAtlasSecretsConfig
metadata:
  name: mongodbatlas
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: mongodbatlas
  publicKey: fakepubkey
  privateKeySecretRef:
    name: atlas-api-key
    key: private-key
