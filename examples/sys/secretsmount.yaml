# Enables a KV version 2 secrets engine at team-a/kv, plus a Nomad engine (external plugin) at nomad. With
# deletionPolicy Orphan the mount and its data stay in OpenBao when the resource is deleted.
apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: obco-kv
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  path: team-a/kv
  type: kv
  description: Key-value secrets of team a
  local: false
  sealWrap: false
  externalEntropyAccess: false
  forceNoCache: false
  pluginVersion: ""
  options:
    version: "2"
  defaultLeaseTTL: 768h
  maxLeaseTTL: 768h
  listingVisibility: hidden
  auditNonHMACRequestKeys:
    - path
  auditNonHMACResponseKeys:
    - version
  passthroughRequestHeaders:
    - X-Request-Id
  allowedResponseHeaders:
    - X-Request-Id
---
apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: obco-nomad
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  path: nomad
  type: nomad
  pluginRef:
    name: obco-nomad-secrets-plugin
  description: Nomad tokens through the external plugin registered by the Plugin obco-nomad-secrets-plugin
