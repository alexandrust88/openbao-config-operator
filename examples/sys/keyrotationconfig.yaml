apiVersion: sys.obco.dev/v1alpha1
kind: KeyRotationConfig
metadata:
  name: obco-key-rotation
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  enabled: true
  maxOperations: 1000000000
  interval: 720h
