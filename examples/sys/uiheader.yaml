apiVersion: sys.obco.dev/v1alpha1
kind: UIHeader
metadata:
  name: obco-permissions-policy
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: Permissions-Policy
  values:
    - camera=()
    - microphone=()
