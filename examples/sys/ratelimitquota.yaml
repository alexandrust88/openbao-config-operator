apiVersion: sys.openbaoconfig.io/v1alpha1
kind: RateLimitQuota
metadata:
  name: obco-kv-limit
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 1h
  managementPolicy: Manage
  name: openbao-config-approle-ci
  path: openbao-config/auth/approle-ci
  role: ci
  rate: "50"
  interval: 1s
  blockInterval: 30s
  inheritable: false
