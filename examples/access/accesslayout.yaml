# Gives people access by identity provider group: per organization, developers can write and leads own the org
# paths, while in the prod namespace developers only read and leads write.
apiVersion: access.obco.dev/v1alpha1
kind: AccessLayout
metadata:
  name: platform-teams
  namespace: openbao-config
  annotations:
    obco.dev/allow-disruptive-update: "false"
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 15m
  managementPolicy: Manage
  authMounts:
    - oidc
  organizations:
    - acme
    - globex
  groupAliasTemplate: "{org}_{role}"
  paths:
    - mount: orgs
      path: "{org}/+/*"
      metadataPath: "{org}/*"
  roles:
    - name: developer
      levels:
        - openbaoNamespace: ""
          level: write
        - openbaoNamespace: prod
          level: read
    - name: lead
      levels:
        - openbaoNamespace: ""
          level: owner
        - openbaoNamespace: prod
          level: write
