apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: live-params
    literals:
      - kubernetesNamespace=openbao-live
      - openbaoAddress=https://openbao.example.com:8200
      - caConfigMap=openbao-ca
      - caKey=ca.crt
      - audience=openbao-config-operator
      - rootAuthMountPath=kubernetes
      - rootAuthRole=openbao-config-operator-root
      - rootServiceAccount=openbao-config-operator-root
      - tenantNamespace=team-a
      - tenantAuthRole=openbao-config-operator-team-a
      - tenantServiceAccount=openbao-config-operator-team-a
      - childAuthMountPath=kubernetes
      - childAuthRole=openbao-config-operator
      - childServiceAccount=openbao-config-operator-team-a
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
