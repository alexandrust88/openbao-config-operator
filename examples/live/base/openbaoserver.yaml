apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoServer
metadata:
  name: openbao-server
spec:
  address: https://openbao.example.com:8200
  caBundle:
    configMapRef:
      name: openbao-ca
      namespace: openbao-live
      key: ca.crt
  allowedNamespaces:
    matchLabels:
      kubernetes.io/metadata.name: openbao-live
  allowedAudiences:
    - openbao-config-operator
  rateLimit:
    qps: 50
    burst: 100
  requestTimeout: 30s
