apiVersion: core.obco.dev/v1alpha1
kind: BaoServer
metadata:
  name: openbao-server
spec:
  address: https://openbao.example.com:8200
  caBundle:
    configMapRef:
      name: openbao-ca
      namespace: openbao-live
      key: ca.crt
  allowedNamespaces:
    matchLabels:
      kubernetes.io/metadata.name: openbao-live
  allowedAudiences:
    - openbao-config-operator
  rateLimit:
    qps: 50
    burst: 100
  # Full overlays generate RSA-8192 keys; allow for CPU contention on shared runners.
  requestTimeout: 3m
