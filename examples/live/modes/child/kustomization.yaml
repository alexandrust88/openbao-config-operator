apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - connections.yaml
replacements:
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.childAuthMountPath
    targets:
      - select:
          group: core.obco.dev
          kind: (Cluster)?BaoConnection
        fieldPaths:
          - spec.auth.kubernetes.mountPath
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.childAuthRole
    targets:
      - select:
          group: core.obco.dev
          kind: (Cluster)?BaoConnection
        fieldPaths:
          - spec.auth.kubernetes.role
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.childServiceAccount
    targets:
      - select:
          group: core.obco.dev
          kind: (Cluster)?BaoConnection
        fieldPaths:
          - spec.auth.kubernetes.serviceAccountRef.name
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.tenantNamespace
    targets:
      - select:
          group: core.obco.dev
          kind: (Cluster)?BaoConnection
        fieldPaths:
          - spec.openbaoNamespace
