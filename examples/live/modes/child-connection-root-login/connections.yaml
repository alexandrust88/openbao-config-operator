apiVersion: core.obco.dev/v1alpha1
kind: BaoConnection
metadata:
  name: openbao
spec:
  serverRef:
    name: openbao-server
  openbaoNamespace: team-a
  openbaoAuthNamespace: ""
  auth:
    kubernetes:
      mountPath: kubernetes
      role: openbao-config-operator
      serviceAccountRef:
        name: openbao-config-operator
      audiences:
        - openbao-config-operator
---
apiVersion: core.obco.dev/v1alpha1
kind: ClusterBaoConnection
metadata:
  name: openbao-cluster
spec:
  serverRef:
    name: openbao-server
  openbaoNamespace: team-a
  openbaoAuthNamespace: ""
  allowedNamespaces:
    matchLabels:
      kubernetes.io/metadata.name: openbao-live
  auth:
    kubernetes:
      mountPath: kubernetes
      role: openbao-config-operator
      serviceAccountRef:
        name: openbao-config-operator
        namespace: openbao-live
      audiences:
        - openbao-config-operator
