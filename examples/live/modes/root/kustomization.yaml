apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - connections.yaml
replacements:
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.rootAuthMountPath
    targets:
      - select:
          group: core.openbaoconfig.io
          kind: (Cluster)?OpenBaoConnection
        fieldPaths:
          - spec.auth.kubernetes.mountPath
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.rootAuthRole
    targets:
      - select:
          group: core.openbaoconfig.io
          kind: (Cluster)?OpenBaoConnection
        fieldPaths:
          - spec.auth.kubernetes.role
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.rootServiceAccount
    targets:
      - select:
          group: core.openbaoconfig.io
          kind: (Cluster)?OpenBaoConnection
        fieldPaths:
          - spec.auth.kubernetes.serviceAccountRef.name
