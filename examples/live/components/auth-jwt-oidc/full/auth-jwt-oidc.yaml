apiVersion: auth.obco.dev/v1alpha1
kind: JWTAuthConfig
metadata:
  name: jwt-oidc-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: jwt-oidc
  oidcDiscoveryURL: https://accounts.google.com
  oidcDiscoveryCAPEM: |
    -----BEGIN CERTIFICATE-----
    MIIBhTCCASqgAwIBAgIJAOQljLXsiNReMAoGCCqGSM49BAMCMDUxGDAWBgNVBAMM
    D2xpdmUga2l0IFRMUyBDQTEZMBcGA1UECgwQb3BlbmJhbyBsaXZlIGtpdDAeFw0y
    NjExMTQwOTQyMjVaFw0zNjExMTEwOTQyMjVaMDUxGDAWBgNVBAMMD2xpdmUga2l0
    IFRMUyBDQTEZMBcGA1UECgwQb3BlbmJhbyBsaXZlIGtpdDBZMBMGByqGSM49AgEG
    CCqGSM49AwEHA0IABA8rM2hh5PZmeyvUvkYeuAlDQq/gU1M0v0CiW41QoP/UKHc+
    ZxDa1mCQR5PRSsethpagIveH8ebpPqwIens3Vh2jIzAhMA8GA1UdEwEB/wQFMAMB
    Af8wDgYDVR0PAQH/BAQDAgEGMAoGCCqGSM49BAMCA0kAMEYCIQDIOC+VfDcGyiga
    yRz1DaItADfmeXNcV1L8PNH8wXBPzQIhAObjv9jMzlb0dYt4hpsLH+4a6f7hpgad
    v1q4Vtq6ZO61
    -----END CERTIFICATE-----
  overrideAllowedServerNames:
    - accounts.google.com
  skipJWKSValidation: true
  oidcClientID: openbao-live-kit.apps.googleusercontent.com
  oidcClientSecretSecretRef:
    name: live-auth-jwt-oidc
    key: client-secret
  oidcResponseMode: form_post
  oidcResponseTypes:
    - code
    - id_token
  boundIssuer: https://accounts.google.com
  defaultRole: jwt-oidc-user
  namespaceInState: true
  providerConfig:
    provider: gsuite
    settings:
      gsuite_admin_impersonate: openbao-admin@example.com
      fetch_groups: true
      fetch_user_info: true
      groups_recurse_max_depth: 5
      user_custom_schemas: Education,Preferences
      domain: example.com
    secretRef:
      name: live-auth-jwt-oidc
      key: provider-config
---
