apiVersion: auth.obco.dev/v1alpha1
kind: JWTAuthRole
metadata:
  name: jwt-ci
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: jwt
  name: jwt-ci
  roleType: jwt
  userClaim: sub
  userClaimJSONPointer: false
  boundAudiences:
    - openbao
  boundSubject: project_path:platform/deploy:ref_type:branch:ref:main
  boundClaimsType: glob
  boundClaims:
    namespace_path:
      - platform
      - platform/*
  claimMappings:
    project_path: project
    ref: ref
  groupsClaim: groups
  clockSkewLeeway: 60
  expirationLeeway: 30s
  notBeforeLeeway: 30s
  tokenPoliciesTemplateClaims: false
  verboseOIDCLogging: false
  policyRefs:
    - name: jwt-ci-read
  tokenPolicies:
    - default
  tokenTTL: 30m
  tokenMaxTTL: 4h
  tokenExplicitMaxTTL: 8h
  tokenPeriod: 0s
  tokenNumUses: 0
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 127.0.0.1/32
  tokenType: service
---
apiVersion: auth.obco.dev/v1alpha1
kind: JWTAuthRole
metadata:
  name: jwt-oidc-user
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: jwt-oidc
  name: jwt-oidc-user
  roleType: oidc
  userClaim: email
  groupsClaim: groups
  boundAudiences:
    - openbao-live-kit.apps.googleusercontent.com
  allowedRedirectURIs:
    - https://openbao.example.com:8200/ui/vault/auth/oidc/oidc/callback
    - http://localhost:8250/oidc/callback
  callbackMode: client
  pollInterval: 5
  maxAge: 1h
  oauth2Metadata:
    - id_token
  oidcScopes:
    - profile
    - email
  oidcDisableConfirmation: false
  verboseOIDCLogging: false
  policyRefs:
    - name: jwt-ci-read
  tokenTTL: 1h
  tokenMaxTTL: 8h
  tokenType: default
---
apiVersion: auth.obco.dev/v1alpha1
kind: JWTCELRole
metadata:
  name: jwt-cel
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: jwt
  name: jwt-cel
  boundAudiences:
    - openbao
  clockSkewLeeway: 60
  expirationLeeway: 30s
  notBeforeLeeway: 30s
  message: only pipelines of the platform group may log in
  celProgram:
    variables:
      - name: project
        expression: 'has(claims.project_path) ? claims.project_path : ""'
      - name: on_main
        expression: 'has(claims.ref) && claims.ref == "main"'
    expression: 'project.startsWith("platform/") && on_main'
---
