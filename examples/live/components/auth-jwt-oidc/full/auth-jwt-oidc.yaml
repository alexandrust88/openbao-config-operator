apiVersion: sys.obco.dev/v1alpha1
kind: ACLPolicy
metadata:
  name: jwt-ci-read
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: jwt-ci-read
  policy: |
    path "+/data/ci/*" {
      capabilities = ["read"]
    }
  casRequired: false
  allowWildcardsInIdentityTemplates: false
  allowSlashesInIdentityTemplates: false
