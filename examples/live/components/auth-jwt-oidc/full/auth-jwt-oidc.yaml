apiVersion: sys.obco.dev/v1alpha1
kind: AuthMount
metadata:
  name: jwt
  annotations:
    obco.dev/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: jwt
  type: jwt
  description: JWT logins of CI pipelines, verified with a pinned public key
  local: false
  sealWrap: false
  externalEntropyAccess: false
  forceNoCache: false
  pluginVersion: ""
  options: {}
  defaultLeaseTTL: 1h
  maxLeaseTTL: 24h
  listingVisibility: hidden
  auditNonHMACRequestKeys:
    - role
  auditNonHMACResponseKeys:
    - lease_duration
  passthroughRequestHeaders:
    - X-Request-Id
  allowedResponseHeaders:
    - X-Request-Id
  tokenType: default-service
---
