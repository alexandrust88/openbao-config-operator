apiVersion: sys.openbaoconfig.io/v1alpha1
kind: AuthMount
metadata:
  name: userpass
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: userpass
  type: userpass
  description: Break-glass user logins
  local: false
  sealWrap: false
  externalEntropyAccess: false
  forceNoCache: false
  pluginVersion: ""
  options: {}
  defaultLeaseTTL: 1h
  maxLeaseTTL: 24h
  listingVisibility: hidden
  auditNonHMACRequestKeys:
    - role
  auditNonHMACResponseKeys:
    - lease_duration
  passthroughRequestHeaders:
    - X-Request-Id
  allowedResponseHeaders:
    - X-Request-Id
  tokenType: default-service
  userLockout:
    threshold: 5
    duration: 15m
    counterResetDuration: 10m
    disable: false
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: AuthMount
metadata:
  name: cert
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: cert
  type: cert
  description: TLS client certificate logins of devices
  local: false
  sealWrap: false
  externalEntropyAccess: false
  forceNoCache: false
  pluginVersion: ""
  options: {}
  defaultLeaseTTL: 1h
  maxLeaseTTL: 24h
  listingVisibility: hidden
  auditNonHMACRequestKeys:
    - role
  auditNonHMACResponseKeys:
    - lease_duration
  passthroughRequestHeaders:
    - X-Request-Id
  allowedResponseHeaders:
    - X-Request-Id
  tokenType: default-service
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: userpass-read
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: userpass-read
  policy: |
    path "+/data/breakglass/*" {
      capabilities = ["read"]
    }
  casRequired: false
  allowWildcardsInIdentityTemplates: false
  allowSlashesInIdentityTemplates: false
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: cert-device-read
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: cert-device-read
  policy: |
    path "+/data/devices/*" {
      capabilities = ["read"]
    }
  casRequired: false
  allowWildcardsInIdentityTemplates: false
  allowSlashesInIdentityTemplates: false
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: UserpassUser
metadata:
  name: userpass-alice
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: userpass
  name: userpass-alice
  passwordSecretRef:
    name: live-auth-userpass
    key: password
  policyRefs:
    - name: userpass-read
  tokenPolicies:
    - default
  tokenTTL: 30m
  tokenMaxTTL: 4h
  tokenExplicitMaxTTL: 8h
  tokenPeriod: 0s
  tokenNumUses: 0
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 127.0.0.1/32
  tokenType: service
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: UserpassUser
metadata:
  name: userpass-bob
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: userpass
  name: userpass-bob
  passwordHashSecretRef:
    name: live-auth-userpass
    key: password-hash
  tokenPolicies:
    - userpass-read
  tokenTTL: 15m
  tokenMaxTTL: 1h
  tokenType: batch
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: CertAuthConfig
metadata:
  name: cert-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: cert
  disableBinding: false
  enableIdentityAliasMetadata: true
  ocspCacheSize: 1000
---
