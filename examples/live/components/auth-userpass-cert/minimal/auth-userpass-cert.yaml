apiVersion: sys.obco.dev/v1alpha1
kind: AuthMount
metadata:
  name: userpass
spec:
  connectionRef:
    name: openbao
  type: userpass
---
apiVersion: auth.obco.dev/v1alpha1
kind: UserpassUser
metadata:
  name: userpass-alice
spec:
  connectionRef:
    name: openbao
  mountPath: userpass
  passwordSecretRef:
    name: live-auth-userpass
    key: password
---
apiVersion: sys.obco.dev/v1alpha1
kind: AuthMount
metadata:
  name: cert
spec:
  connectionRef:
    name: openbao
  type: cert
