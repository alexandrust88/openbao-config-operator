  name: db-app-cert
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: db
  name: db-app-cert
  dbName: db-postgres
  credentialType: client_certificate
  credentialConfig:
    # OpenBao requires the certificate of the caPrivateKeySecretRef key; the kind e2e sets the ca.crt of that Secret.
    ca_cert: |
      -----BEGIN CERTIFICATE-----
      MIIC4jCCAcqgAwIBAgIJANbfbgYUrgDnMA0GCSqGSIb3DQEBCwUAMB4xHDAaBgNV
