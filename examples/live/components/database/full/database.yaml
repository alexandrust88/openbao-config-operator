apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: db-cassandra
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: db
  name: db-cassandra
  pluginName: cassandra-database-plugin
  verifyConnection: false
  allowedRoles:
    - "*"
  passwordSecretRef:
    name: live-db-root
    key: password
  cassandra:
    hosts:
      - cassandra-0.example.invalid
      - cassandra-1.example.invalid
    port: 9042
    protocolVersion: 4
    username: cassandra
    tls: true
    insecureTLS: false
    tlsServerName: cassandra.example.invalid
    tlsMinVersion: tls12
    pemBundleSecretRef:
      name: live-db-tls
      key: client.pem
    skipVerification: false
    connectTimeout: 5s
    socketKeepAlive: 30s
    consistency: LOCAL_QUORUM
    localDatacenter: dc1
    usernameTemplate: '{{ .RoleName }}_{{ random 8 }}'
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
