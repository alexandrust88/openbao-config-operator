    common_name_template: "{{.DisplayName}}_{{.RoleName}}"
    key_type: ec
    key_bits: "256"
    signature_bits: "256"
  caPrivateKeySecretRef:
    name: live-db-client-ca
    key: key
  defaultTTL: 1h
  maxTTL: 24h
  creationStatements:
    - CREATE ROLE "{{name}}" WITH LOGIN;
  revocationStatements:
    - DROP ROLE IF EXISTS "{{name}}";
---
# OpenBao validates the generator settings on write; issuing needs a plugin with key-pair users, such as Snowflake.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseRole
metadata:
  name: db-app-rsa
spec:
  connectionRef:
    kind: ClusterOpenBaoConnection
    name: openbao-cluster
  mountPath: db
  dbName: db-postgres
  credentialType: rsa_private_key
  credentialConfig:
    key_bits: "2048"
    format: pkcs8
  creationStatements:
    - CREATE ROLE "{{name}}" WITH LOGIN;
---
