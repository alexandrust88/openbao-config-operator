apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: db
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: db
  type: database
  description: Database credentials for the live kit
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: PasswordPolicy
metadata:
  name: db-passwords
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: db-passwords
  policy: |
    length = 32
    rule "charset" {
      charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
      min-chars = 1
    }
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: db-postgres
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: db
  name: db-postgres
  pluginName: postgresql-database-plugin
  verifyConnection: true
  allowedRoles:
    - db-app-ro
    - db-app-cert
    - db-app-rsa
    - db-app-static
    - db-app-static-cert
  rootRotationStatements:
    - ALTER USER "{{name}}" WITH PASSWORD '{{password}}';
  passwordPolicy: db-passwords
  passwordSecretRef:
    name: live-db-root
    key: password
  rotateRootOnCreate: false
  postgresql:
    connectionURL: postgresql://{{username}}:{{password}}@postgres.postgres.svc:5432/app?sslmode=disable
    username: openbao
    maxOpenConnections: 8
    maxIdleConnections: 4
    maxConnectionLifetime: 5m
    usernameTemplate: '{{ printf "v-%s-%s" (.RoleName | truncate 16) (random 8) }}'
    disableEscaping: false
    passwordAuthentication: scram-sha-256
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: DatabaseConnection
metadata:
  name: db-postgres-password
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  mountPath: db
  pluginName: postgresql-database-plugin
  passwordSecretRef:
    name: live-db-root
    key: password
  postgresql:
    connectionURL: postgresql://{{username}}:{{password}}@postgres.postgres.svc:5432/app?sslmode=disable
    username: openbao
    passwordAuthentication: password
---
