apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIRole
metadata:
  name: pki-web
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: pki-int
  name: pki-web
  issuer:
    issuerRef:
      name: pki-int-ca
  ttl: 24h
  maxTTL: 720h
  allowLocalhost: false
  allowedDomains:
    - openbao.example.com
    - "{{identity.entity.metadata.team}}.openbao.example.com"
  allowedDomainsTemplate: true
  allowGlobsInIdentityTemplates: false
  allowBareDomains: false
  allowSubdomains: true
  allowGlobDomains: false
  allowWildcardCertificates: false
  allowAnyName: false
  enforceHostnames: true
  allowIPSANs: true
  allowedIPSANsCIDR:
    - 10.0.0.0/8
  allowedURISANs:
    - spiffe://openbao.example.com/*
  allowedURISANsTemplate: false
  allowedOtherSANs:
    - 1.3.6.1.4.1.311.20.2.3;UTF8:*@openbao.example.com
  allowedSerialNumbers:
    - live-*
  allowedUserIDs:
    - "*"
  serverFlag: true
  clientFlag: true
  codeSigningFlag: false
  emailProtectionFlag: false
  keyType: ec
  keyBits: 256
  signatureBits: 256
  usePSS: false
  keyUsage:
    - DigitalSignature
    - KeyAgreement
  extKeyUsage:
    - ServerAuth
    - ClientAuth
  extKeyUsageOIDs:
    - 1.3.6.1.5.5.7.3.1
  useCSRCommonName: true
  useCSRSANs: true
  ou:
    - Platform
  organization:
    - Live Kit
  country:
    - DE
  locality:
    - Berlin
  province:
    - Berlin
  streetAddress:
    - Example Street 1
  postalCode:
    - "10115"
  generateLease: false
  noStore: false
  requireCN: true
  cnValidations:
    - hostname
  policyIdentifiers:
    - 1.3.6.1.4.1.44947.1.1.1
  basicConstraintsValidForNonCA: false
  notBeforeDuration: 30s
  notBefore: "2026-01-01T00:00:00Z"
  notBeforeBound: permit
  notAfter: "2030-01-01T00:00:00Z"
  notAfterBound: ttl-limited
---
