  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: pki-root
  type: pki
  description: Root CA of the live kit
  defaultLeaseTTL: 8760h
  maxLeaseTTL: 87600h
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: pki-int
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: pki-int
  type: pki
  description: Intermediate CA of the live kit, with the headers ACME needs
  defaultLeaseTTL: 720h
  maxLeaseTTL: 43800h
  allowedResponseHeaders:
    - Last-Modified
    - Location
    - Replay-Nonce
    - Link
  passthroughRequestHeaders:
    - If-Modified-Since
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: pki-root-ca
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: pki-root
  name: pki-root-ca
  type: root
  key:
    source: internal
    name: pki-root-ca-key
    type: ec
    bits: 384
  certificate:
    commonName: Live Kit Root CA
    altNames:
      - root-ca.openbao.example.com
      - pki@openbao.example.com
    ipSANs:
      - 192.0.2.10
    uriSANs:
      - spiffe://openbao.example.com/ca/root
    otherSANs:
      - 1.3.6.1.4.1.311.20.2.3;UTF8:root-ca@openbao.example.com
    excludeCNFromSANs: true
    ou:
      - Platform
    organization:
      - Live Kit
    country:
      - DE
    locality:
      - Berlin
    province:
      - Berlin
    streetAddress:
      - Example Street 1
    postalCode:
      - "10115"
    serialNumber: live-kit-root-ca
    ttl: 87600h
    notBeforeDuration: 30s
    maxPathLength: 1
    permittedDNSDomains:
      - openbao.example.com
    signatureBits: 384
    usePSS: false
  leafNotAfterBehavior: err
  usage:
    - issuing-certificates
    - crl-signing
    - ocsp-signing
  manualChain:
    - pki-root-ca
  revocationSignatureAlgorithm: ECDSAWithSHA384
  issuingCertificates:
    - https://openbao.example.com:8200/v1/pki-root/issuer/pki-root-ca/der
  crlDistributionPoints:
    - https://openbao.example.com:8200/v1/pki-root/issuer/pki-root-ca/crl/der
  ocspServers:
    - https://openbao.example.com:8200/v1/pki-root/ocsp
  enableAIAURLTemplating: false
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: PKIIssuer
metadata:
  name: pki-int-ca
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: pki-int
  name: pki-int-ca
  type: intermediate
  key:
    source: exported
    name: pki-int-ca-key
    type: ec
    bits: 256
    privateKeyFormat: pkcs8
  certificate:
    commonName: Live Kit Intermediate CA
    organization:
      - Live Kit
    notAfter: "2035-01-01T00:00:00Z"
    maxPathLength: 0
    permittedDNSDomains:
      - openbao.example.com
    addBasicConstraints: true
  signer:
    issuerRef:
      name: pki-root-ca
  writeSecretRef:
    name: pki-int-ca
  leafNotAfterBehavior: truncate
  usage:
    - issuing-certificates
    - crl-signing
  enableAIAURLTemplating: true
  issuingCertificates:
    - "{{cluster_aia_path}}/issuer/{{issuer_id}}/der"
  crlDistributionPoints:
    - "{{cluster_aia_path}}/issuer/{{issuer_id}}/crl/der"
  ocspServers:
    - "{{cluster_path}}/ocsp"
---
