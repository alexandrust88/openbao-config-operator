apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - connection-auth.yaml
replacements:
  - source:
      kind: ConfigMap
      name: live-params
      fieldPath: data.kubernetesNamespace
    targets:
      - select:
          kind: BaoServer
          name: conn-server-dev
        fieldPaths:
          - spec.allowedNamespaces.matchExpressions.0.values.0
      - select:
          kind: BaoServer
          name: conn-server-secret-ca
        fieldPaths:
          - spec.caBundle.secretRef.namespace
          - spec.allowedNamespaces.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: ClusterBaoConnection
          name: conn-cluster-approle
        fieldPaths:
          - spec.allowedNamespaces.matchExpressions.0.values.0
          - spec.auth.appRole.roleIDSecretRef.namespace
          - spec.auth.appRole.secretIDSecretRef.namespace
      - select:
          kind: ClusterBaoConnection
          name: conn-cluster-jwt-sa
        fieldPaths:
          - spec.allowedNamespaces.matchLabels.[kubernetes.io/metadata.name]
          - spec.auth.jwt.serviceAccountRef.namespace
      - select:
          kind: ClusterBaoConnection
          name: conn-cluster-jwt-injected
        fieldPaths:
          - spec.allowedNamespaces.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: ClusterBaoConnection
          name: conn-cluster-k8s-injected
        fieldPaths:
          - spec.allowedNamespaces.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: ClusterBaoConnection
          name: conn-cluster-token-file
        fieldPaths:
          - spec.allowedNamespaces.matchLabels.[kubernetes.io/metadata.name]
      - select:
          kind: ClusterBaoConnection
          name: conn-cluster-token-secret
        fieldPaths:
          - spec.allowedNamespaces.matchLabels.[kubernetes.io/metadata.name]
          - spec.auth.token.secretRef.namespace
