apiVersion: core.obco.dev/v1alpha1
kind: BaoConnection
metadata:
  name: conn-approle
spec:
  serverRef:
    name: openbao-server
  auth:
    appRole:
      roleIDSecretRef:
        name: live-connection-auth-approle
        key: role-id
      secretIDSecretRef:
        name: live-connection-auth-approle
        key: secret-id
---
apiVersion: sys.obco.dev/v1alpha1
kind: ACLPolicy
metadata:
  name: conn-approle-reader
spec:
  connectionRef:
    name: conn-approle
  policy: |
    path "+/data/connection-auth/*" {
      capabilities = ["read"]
    }
