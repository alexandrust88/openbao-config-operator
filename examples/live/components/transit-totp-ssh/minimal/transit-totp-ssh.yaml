apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: transit
spec:
  connectionRef:
    name: openbao
  type: transit
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKey
metadata:
  name: transit-app
spec:
  connectionRef:
    name: openbao
  mountPath: transit
---
apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: totp
spec:
  connectionRef:
    name: openbao
  type: totp
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TOTPKey
metadata:
  name: totp-alice
spec:
  connectionRef:
    name: openbao
  mountPath: totp
  issuer: Example
  accountName: alice@example.com
  generate:
    writeSecretRef:
      name: totp-alice
---
apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: ssh
spec:
  connectionRef:
    name: openbao
  type: ssh
---
apiVersion: secrets.obco.dev/v1alpha1
kind: SSHCA
metadata:
  name: ssh-ca
spec:
  connectionRef:
    name: openbao
  mountPath: ssh
---
apiVersion: secrets.obco.dev/v1alpha1
kind: SSHRole
metadata:
  name: ssh-users
spec:
  connectionRef:
    name: openbao
  mountPath: ssh
  keyType: ca
  allowUserCertificates: true
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitCacheConfig
metadata:
  name: transit-cache
spec:
  connectionRef:
    name: openbao
  creationPolicy: CreateOrAdopt
  mountPath: transit
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKeyConfig
metadata:
  name: transit-key-config
spec:
  connectionRef:
    name: openbao
  creationPolicy: CreateOrAdopt
  mountPath: transit
