apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: transit
  annotations:
    obco.dev/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: transit
  type: transit
  description: Encryption as a service for the live kit
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKey
metadata:
  name: transit-orders
  annotations:
    obco.dev/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: transit
  name: transit-orders
  type: aes256-gcm96
  derived: true
  convergentEncryption: true
  exportable: true
  allowPlaintextBackup: true
  autoRotatePeriod: 720h
  minDecryptionVersion: 1
  minEncryptionVersion: 0
  deletionAllowed: true
  rotateNonce: "2026-11-14"
---
apiVersion: secrets.obco.dev/v1alpha1
kind: TransitKey
metadata:
