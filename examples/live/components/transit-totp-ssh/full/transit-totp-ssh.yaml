metadata:
  name: ssh-otp
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: ssh
  name: ssh-otp
  keyType: otp
  defaultUser: ubuntu
  allowedUsers:
    - ubuntu
  cidrList:
    - 10.20.0.0/16
  excludeCIDRList:
    - 10.20.0.0/24
  port: 2222
