apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: transit
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: transit
  type: transit
  description: Encryption as a service for the live kit
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TransitKey
metadata:
  name: transit-orders
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: transit
  name: transit-orders
  type: aes256-gcm96
  derived: true
  convergentEncryption: true
  exportable: true
  allowPlaintextBackup: true
  autoRotatePeriod: 720h
  minDecryptionVersion: 1
  minEncryptionVersion: 0
  deletionAllowed: true
  rotateNonce: "2026-11-14"
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TransitKey
metadata:
  name: transit-webhook
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: transit
  name: transit-webhook
  type: hmac
  keySize: 64
  deletionAllowed: true
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: totp
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: totp
  type: totp
  description: One-time passwords for the live kit
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TOTPKey
metadata:
  name: totp-alice
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: totp
  name: totp-alice
  generate:
    keySize: 20
    exported: true
    qrSize: 200
    writeSecretRef:
      name: totp-alice
  issuer: Example
  accountName: alice@example.com
  period: 30s
  algorithm: SHA256
  digits: 8
  skew: 1
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: TOTPKey
metadata:
  name: totp-bob
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: totp
  name: totp-bob
  keySecretRef:
    name: live-totp-bob
    key: key
  issuer: Example
  accountName: bob@example.com
  period: 60s
  algorithm: SHA1
  digits: 6
  skew: 0
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: ssh
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: ssh
  type: ssh
  description: SSH certificates for the live kit
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: ssh-import
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: ssh-import
  type: ssh
  description: SSH certificates signed by an imported CA key
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHCA
metadata:
  name: ssh-ca
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: ssh
  keyType: ecdsa-sha2-nistp384
  keyBits: 384
---
# publicKey is a placeholder: in a real import it is the public half of the private key in the Secret.
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHCA
metadata:
  name: ssh-ca-import
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: ssh-import
  publicKey: ssh-rsa  live-kit-ssh-ca
  privateKeySecretRef:
    name: live-ssh-ca
    key: private-key
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHRole
metadata:
  name: ssh-users
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: ssh
  name: ssh-users
  keyType: ca
  defaultUser: ubuntu
  defaultUserTemplate: false
  allowedUsers:
    - ubuntu
    - "{{identity.entity.name}}"
  allowedUsersTemplate: true
  allowedDomains:
    - example.com
  allowedDomainsTemplate: false
  ttl: 30m
  maxTTL: 8h
  allowedCriticalOptions:
    - force-command
  allowedExtensions:
    - permit-pty
    - permit-port-forwarding
  defaultCriticalOptions:
    force-command: /usr/bin/true
  defaultExtensions:
    permit-pty: ""
  defaultExtensionsTemplate: false
  allowUserCertificates: true
  allowHostCertificates: true
  allowBareDomains: false
  allowSubdomains: true
  allowUserKeyIDs: false
  allowEmptyPrincipals: false
  allowCommasInIdentityTemplates: false
  allowWildcardsInIdentityTemplates: false
  keyIDFormat: "{{role_name}}-{{token_display_name}}"
  allowedUserKeyLengths:
    rsa:
      - 3072
      - 4096
    ed25519:
      - 256
  algorithmSigner: default
  notBeforeDuration: 30s
  issuerRef: default
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: SSHRole
metadata:
  name: ssh-otp
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: ssh
  name: ssh-otp
  keyType: otp
  defaultUser: ubuntu
  allowedUsers:
    - ubuntu
  cidrList:
    - 10.20.0.0/16
  excludeCIDRList:
    - 10.20.0.0/24
  port: 2222
