apiVersion: secrets.obco.dev/v1alpha1
kind: TOTPKey
metadata:
  name: totp-alice
  annotations:
    obco.dev/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: totp
  name: totp-alice
  generate:
    keySize: 20
    exported: true
    qrSize: 200
