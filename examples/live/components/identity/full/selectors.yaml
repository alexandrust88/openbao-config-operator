# Selector labels carry the referent's own name, so the overlay's namePrefix renames label and selector together
# and a selector never matches the objects of another overlay in the same Kubernetes namespace.
nameReference:
  - kind: AuthMount
    fieldSpecs:
      - path: metadata/labels/livekit-select
        kind: AuthMount
      - path: spec/mountSelector/matchLabels/livekit-select
        kind: IdentityEntityAlias
      - path: spec/mountSelector/matchLabels/livekit-select
        kind: IdentityGroupAlias
      - path: spec/authMounts/mountSelector/matchLabels/livekit-select
        kind: MFALoginEnforcement
  - kind: IdentityEntity
    fieldSpecs:
      - path: metadata/labels/livekit-select
        kind: IdentityEntity
      - path: spec/entitySelector/matchLabels/livekit-select
        kind: IdentityEntityAlias
      - path: spec/entitySelector/matchLabels/livekit-select
        kind: IdentityGroupMembership
      - path: spec/entities/entitySelector/matchLabels/livekit-select
        kind: MFALoginEnforcement
  - kind: IdentityGroup
    fieldSpecs:
      - path: metadata/labels/livekit-select
        kind: IdentityGroup
      - path: spec/groupSelector/matchLabels/livekit-select
        kind: IdentityGroupAlias
      - path: spec/groupSelector/matchLabels/livekit-select
        kind: IdentityGroupMembership
      - path: spec/memberGroupSelector/matchLabels/livekit-select
        kind: IdentityGroupMembership
      - path: spec/groups/groupSelector/matchLabels/livekit-select
        kind: MFALoginEnforcement
  - kind: MFAMethod
    fieldSpecs:
      - path: metadata/labels/livekit-select
        kind: MFAMethod
      - path: spec/mfaMethods/methodSelector/matchLabels/livekit-select
        kind: MFALoginEnforcement
