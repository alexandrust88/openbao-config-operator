apiVersion: identity.openbaoconfig.io/v1alpha1
kind: MFAMethod
metadata:
  name: id-totp
  labels:
    livekit-select: id-totp
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: id-totp
  totp:
    issuer: OpenBao live kit
    period: 30s
    digits: 6
    algorithm: SHA256
    keySize: 20
    skew: 1
    qrSize: 200
    maxValidationAttempts: 5
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: MFAMethod
metadata:
  name: id-duo
  labels:
    livekit-select: id-duo
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: id-duo
  duo:
    apiHostname: api-1a2b3c4d.duosecurity.com
    integrationKeySecretRef:
      name: live-identity-duo
      key: integration-key
    secretKeySecretRef:
      name: live-identity-duo
      key: secret-key
    pushInfo: from=openbao&env=live-kit
    usePasscode: true
    usernameFormat: "{{alias.name}}@example.com"
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: MFAMethod
metadata:
  name: id-okta
  labels:
    livekit-select: id-okta
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: id-okta
  okta:
    orgName: example
    apiTokenSecretRef:
      name: live-identity-okta
      key: api-token
    baseURL: okta.com
    primaryEmail: true
    usernameFormat: "{{entity.name}}@example.com"
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: MFAMethod
metadata:
  name: id-pingid
  labels:
    livekit-select: id-pingid
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: id-pingid
  pingID:
    settingsFileSecretRef:
      name: live-identity-pingid
      key: pingid.properties
    usernameFormat: "{{alias.name}}"
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: MFALoginEnforcement
metadata:
  name: id-login-mfa
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: id-login-mfa
  mfaMethods:
    - methodRef:
        name: id-totp
    - methodName: id-duo
    - methodSelector:
        matchLabels:
          livekit-select: id-okta
  authMounts:
    - mountRef:
        name: id-userpass
    - mountPath: id-jwt
    - mountSelector:
        matchLabels:
          livekit-select: id-approle
  authMethodTypes:
    - userpass
  entities:
    - entityRef:
        name: id-alice
    - entityName: id-bob
    - entitySelector:
        matchLabels:
          livekit-select: id-carol
  groups:
    - groupRef:
        name: id-devs
    - groupName: id-oncall
    - groupSelector:
        matchLabels:
          livekit-select: id-sre
