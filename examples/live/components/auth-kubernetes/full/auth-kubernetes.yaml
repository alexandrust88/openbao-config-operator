apiVersion: sys.openbaoconfig.io/v1alpha1
kind: AuthMount
metadata:
  name: k8s
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  path: k8s
  type: kubernetes
  description: ServiceAccount logins from the workload cluster
  local: false
  sealWrap: false
  externalEntropyAccess: false
  forceNoCache: false
  pluginVersion: ""
  options: {}
  defaultLeaseTTL: 1h
  maxLeaseTTL: 24h
  listingVisibility: hidden
  auditNonHMACRequestKeys:
    - role
  auditNonHMACResponseKeys:
    - lease_duration
  passthroughRequestHeaders:
    - X-Request-Id
  allowedResponseHeaders:
    - X-Request-Id
  tokenType: default-service
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: k8s-app-read
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: k8s-app-read
  policy: |
    path "+/data/apps/{{identity.entity.aliases.${accessor:kubernetes}.metadata.service_account_namespace}}/*" {
      capabilities = ["read"]
    }
  accessorRefs:
    kubernetes:
      authMountRef:
        name: k8s
  casRequired: false
  allowWildcardsInIdentityTemplates: false
  allowSlashesInIdentityTemplates: false
---
