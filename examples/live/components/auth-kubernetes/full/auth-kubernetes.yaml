apiVersion: auth.openbaoconfig.io/v1alpha1
kind: KubernetesAuthRole
metadata:
  name: k8s-app
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: k8s
  name: k8s-app
  boundServiceAccountNames:
    - app
    - worker
  boundServiceAccountNamespaces:
    - apps
  boundServiceAccountNamespaceSelector:
    matchLabels:
      openbao.example.com/tenant: team-a
  audience: openbao
  aliasNameSource: serviceaccount_name
  policyRefs:
    - name: k8s-app-read
  tokenPolicies:
    - default
  tokenTTL: 30m
  tokenMaxTTL: 4h
  tokenExplicitMaxTTL: 8h
  tokenPeriod: 0s
  tokenNumUses: 0
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 127.0.0.1/32
  tokenType: service
