apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: k8ss-app
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: k8ss
  name: k8ss-app
  allowedKubernetesNamespaces:
    - app
  serviceAccountName: app
  kubernetesRoleType: Role
  tokenDefaultTTL: 1h
  tokenMaxTTL: 4h
  tokenDefaultAudiences:
    - https://kubernetes.default.svc
  nameTemplate: '{{ printf "live-%s-%s" (.RoleName | truncate 16) (random 8) | lowercase }}'
  extraLabels:
    app.kubernetes.io/managed-by: openbao
  extraAnnotations:
    example.com/owner: platform
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: k8ss-pod-reader
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: k8ss
  name: k8ss-pod-reader
  allowedKubernetesNamespaceSelector: '{"matchLabels":{"example.com/tenant":"team-a"}}'
  kubernetesRoleType: ClusterRole
  generatedRoleRules: |
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
---
apiVersion: secrets.openbaoconfig.io/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: k8ss-bound
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  mountPath: k8ss
  name: k8ss-bound
  allowedKubernetesNamespaces:
    - app
  kubernetesRoleName: app-reader
