apiVersion: sys.obco.dev/v1alpha1
kind: SecretsMount
metadata:
  name: k8ss
spec:
  connectionRef:
    name: openbao
  type: kubernetes
---
apiVersion: secrets.obco.dev/v1alpha1
kind: KubernetesSecretsConfig
metadata:
  name: k8ss-config
spec:
  connectionRef:
    name: openbao
  mountPath: k8ss
---
apiVersion: secrets.obco.dev/v1alpha1
kind: KubernetesSecretsRole
metadata:
  name: k8ss-app
spec:
  connectionRef:
    name: openbao
  mountPath: k8ss
  allowedKubernetesNamespaces:
    - app
  serviceAccountName: app
