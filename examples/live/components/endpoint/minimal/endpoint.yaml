apiVersion: sys.obco.dev/v1alpha1
kind: BaoNamespace
metadata:
  name: ep-space
spec:
  connectionRef:
    name: openbao
---
apiVersion: core.obco.dev/v1alpha1
kind: BaoEndpoint
metadata:
  name: ep-password-policy
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: ep-space
  path: sys/policies/password/live-kit
  data:
    policy: |
      length = 20
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyz0123456789"
      }
