apiVersion: sys.obco.dev/v1alpha1
kind: BaoNamespace
metadata:
  name: ns-team
spec:
  connectionRef:
    name: openbao
---
apiVersion: sys.obco.dev/v1alpha1
kind: ACLPolicy
metadata:
  name: ns-team-reader
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: ns-team
  policy: |
    path "+/data/*" {
      capabilities = ["read"]
    }
---
apiVersion: sys.obco.dev/v1alpha1
kind: BaoWorkflow
metadata:
  name: ns-health
spec:
  connectionRef:
    name: openbao
  workflow: |
    flow "health" {
      request "read" {
        operation = "read"
        path      = "sys/policies/acl/default"
      }
    }
