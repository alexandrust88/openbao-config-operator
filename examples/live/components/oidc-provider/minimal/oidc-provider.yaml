  connectionRef:
    name: openbao
  openbaoNamespace: oidc-ns
---
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCClient
metadata:
  name: oidc-portal
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: oidc-ns
---
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCProvider
metadata:
  name: oidc-provider
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: oidc-ns
