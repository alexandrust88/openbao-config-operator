apiVersion: sys.obco.dev/v1alpha1
kind: BaoNamespace
metadata:
  name: oidc-ns
spec:
  connectionRef:
    name: openbao
---
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCConfig
metadata:
  name: oidc-config
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: oidc-ns
  creationPolicy: CreateOrAdopt
  issuer: https://openbao.example.com:8200
---
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCKey
metadata:
  name: oidc-key
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: oidc-ns
---
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCRole
metadata:
  name: oidc-workload
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: oidc-ns
  key: oidc-key
---
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCScope
metadata:
  name: oidc-groups
  labels:
    live.obco.dev/nested: "true"
spec:
  connectionRef:
    name: openbao
  openbaoNamespace: oidc-ns
---
apiVersion: identity.obco.dev/v1alpha1
kind: OIDCAssignment
metadata:
  name: oidc-users
  labels:
    live.obco.dev/nested: "true"
