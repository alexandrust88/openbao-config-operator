apiVersion: sys.openbaoconfig.io/v1alpha1
kind: OpenBaoNamespace
metadata:
  name: oidc-ns
  annotations:
    openbaoconfig.io/allow-destructive-delete: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: oidc-ns
  customMetadata:
    purpose: oidc-provider
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCConfig
metadata:
  name: oidc-config
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  issuer: https://openbao.example.com:8200
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCKey
metadata:
  name: oidc-key
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-key
  algorithm: ES256
  rotationPeriod: 168h
  verificationTTL: 336h
  allowedClientIDs:
    - "*"
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCRole
metadata:
  name: oidc-workload
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-workload
  key: oidc-key
  clientID: oidc-workload-audience
  ttl: 1h
  template: '{"team": {{identity.entity.metadata.team}}, "groups": {{identity.entity.groups.names}}}'
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCScope
metadata:
  name: oidc-groups
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-groups
  description: Group names of the authenticated entity
  template: '{"groups": {{identity.entity.groups.names}}}'
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Entity
metadata:
  name: oidc-alice
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-alice
  policies:
    - default
  metadata:
    team: platform
  disabled: false
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Entity
metadata:
  name: oidc-bob
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-bob
  policies:
    - default
  metadata:
    team: platform
  disabled: false
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Entity
metadata:
  name: oidc-carol
  labels:
    oidc-assignment-entity: oidc-carol
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-carol
  policies:
    - default
  metadata:
    team: platform
  disabled: false
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Group
metadata:
  name: oidc-devs
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-devs
  type: internal
  policies:
    - default
  metadata:
    owner: platform
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Group
metadata:
  name: oidc-ops
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-ops
  type: internal
  policies:
    - default
  metadata:
    owner: platform
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Group
metadata:
  name: oidc-sre
  labels:
    oidc-assignment-group: oidc-sre
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-sre
  type: internal
  policies:
    - default
  metadata:
    owner: platform
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCAssignment
metadata:
  name: oidc-users
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-users
  entities:
    - entityRef:
        name: oidc-alice
    - entityName: oidc-bob
    - entitySelector:
        matchLabels:
          oidc-assignment-entity: oidc-carol
  groups:
    - groupRef:
        name: oidc-devs
    - groupName: oidc-ops
    - groupSelector:
        matchLabels:
          oidc-assignment-group: oidc-sre
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCClient
metadata:
  name: oidc-portal
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-portal
  key: oidc-key
  clientType: confidential
  redirectURIs:
    - https://portal.example.com/oidc/callback
    - http://localhost:8250/oidc/callback
  assignments:
    - oidc-users
  idTokenTTL: 30m
  accessTokenTTL: 1h
  authorizationCode: true
  clientCredentials: true
  writeSecretRef:
    name: oidc-portal
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCClient
metadata:
  name: oidc-cli
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-cli
  key: oidc-key
  clientType: public
  redirectURIs:
    - http://localhost:8250/oidc/callback
  assignments:
    - oidc-users
  idTokenTTL: 15m
  accessTokenTTL: 15m
  authorizationCode: true
  clientCredentials: false
  writeSecretRef:
    name: oidc-cli
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCClient
metadata:
  name: oidc-batch
  labels:
    oidc-provider-client: oidc-batch
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-batch
  key: oidc-key
  clientType: confidential
  redirectURIs:
    - https://batch.example.com/oidc/callback
  assignments:
    - oidc-users
  idTokenTTL: 1h
  accessTokenTTL: 1h
  authorizationCode: false
  clientCredentials: true
  writeSecretRef:
    name: oidc-batch
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCProvider
metadata:
  name: oidc-provider
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-provider
  issuer: https://openbao.example.com:8200
  allowedClients:
    - clientRef:
        name: oidc-portal
    - clientName: oidc-cli
    - clientSelector:
        matchLabels:
          oidc-provider-client: oidc-batch
  scopesSupported:
    - oidc-groups
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: OIDCProvider
metadata:
  name: oidc-open
  labels:
    live.openbaoconfig.io/nested: "true"
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  namespace: oidc-ns
  name: oidc-open
  issuer: https://openbao.example.com:8200
  allowedClients:
    - clientID: "*"
  scopesSupported:
    - oidc-groups
