apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../root/full
patches:
  - path: observe.yaml
    target:
      group: ^(sys|auth|secrets|identity)\.obco\.dev$
  - path: observe.yaml
    target:
      group: ^access\.obco\.dev$
      kind: ^(AccessGrant|AccessLayout)$
  - path: observe.yaml
    target:
      kind: BaoEndpoint
