apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../root/full
patches:
  - path: observe.yaml
    target:
      group: ^(sys|auth|secrets|identity)\.openbaoconfig\.io$
  - path: observe.yaml
    target:
      group: ^access\.openbaoconfig\.io$
      kind: ^(AccessGrant|AccessLayout)$
  - path: observe.yaml
    target:
      kind: OpenBaoEndpoint
