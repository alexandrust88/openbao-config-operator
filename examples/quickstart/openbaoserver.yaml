# Evaluation only: the dev server of openbao-dev.yaml speaks plain HTTP, which allowInsecureHTTP permits.
# A real server uses an https:// address and a caBundle, as in examples/core/baoserver.yaml.
apiVersion: core.obco.dev/v1alpha1
kind: BaoServer
metadata:
  name: quickstart
spec:
  address: http://openbao.openbao.svc:8200
  allowInsecureHTTP: true
  allowedNamespaces:
    matchLabels:
      obco.dev/tenant: "true"
  allowedAudiences:
    - openbao
