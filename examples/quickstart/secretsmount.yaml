# A KV version 2 secrets engine at quickstart-kv (the path defaults to metadata.name).
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: quickstart-kv
  namespace: quickstart
spec:
  connectionRef:
    name: openbao
  type: kv
  options:
    version: "2"
  description: Quickstart key-value secrets
