# Generates a 32-character password once, stores it under the key password of quickstart-kv/app and also in the
# Kubernetes Secret quickstart-app-password.
apiVersion: secrets.obco.dev/v1alpha1
kind: RandomSecret
metadata:
  name: quickstart-app-password
  namespace: quickstart
spec:
  connectionRef:
    name: openbao
  mountPath: quickstart-kv
  path: app
  key: password
  generator:
    length: 32
  writeSecretRef:
    name: quickstart-app-password
