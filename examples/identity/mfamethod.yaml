apiVersion: identity.obco.dev/v1alpha1
kind: MFAMethod
metadata:
  name: obco-totp
  namespace: openbao-config
  labels:
    obco.example.com/mfa: required
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  deletionPolicy: Orphan
  name: obco-totp
  totp:
    issuer: OBCO Sandbox
    period: 30s
    keySize: 20
    qrSize: 200
    algorithm: SHA256
    digits: 6
    skew: 1
    maxValidationAttempts: 5
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-duo-credentials
  namespace: openbao-config
type: Opaque
stringData:
  secret-key: fake-duo-secret-key-not-real
  integration-key: FAKEDUOINTEGRATIONKEY
---
apiVersion: identity.obco.dev/v1alpha1
kind: MFAMethod
metadata:
  name: obco-duo
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  deletionPolicy: Orphan
  name: obco-duo
  duo:
    secretKeySecretRef:
      name: obco-duo-credentials
      key: secret-key
    integrationKeySecretRef:
      name: obco-duo-credentials
      key: integration-key
    apiHostname: api-fake0000.duosecurity.com
    pushInfo: from=openbao&env=sandbox
    usePasscode: true
    usernameFormat: "{{alias.name}}"
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-okta-credentials
  namespace: openbao-config
type: Opaque
stringData:
  api-token: fake-okta-api-token-not-real
---
apiVersion: identity.obco.dev/v1alpha1
kind: MFAMethod
metadata:
  name: obco-okta
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  deletionPolicy: Orphan
  name: obco-okta
  okta:
    orgName: obco-fake
    apiTokenSecretRef:
      name: obco-okta-credentials
      key: api-token
    baseURL: oktapreview.com
    primaryEmail: true
    usernameFormat: "{{entity.name}}@obco.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: obco-pingid-settings
  namespace: openbao-config
type: Opaque
stringData:
  pingid.properties: |
    use_base64_key=ZmFrZS1rZXk=
    use_signature=true
    token=fake-token
    idp_url=https://idpxnyl3m.pingidentity.com/pingid
    org_alias=fake-org-alias
    admin_url=https://idpxnyl3m.pingidentity.com/pingid
    authenticator_url=https://authenticator.pingone.com/pingid/ppm
---
apiVersion: identity.obco.dev/v1alpha1
kind: MFAMethod
metadata:
  name: obco-pingid
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  deletionPolicy: Orphan
  name: obco-pingid
  pingID:
    settingsFileSecretRef:
      name: obco-pingid-settings
      key: pingid.properties
    usernameFormat: "{{alias.name}}"
