apiVersion: identity.obco.dev/v1alpha1
kind: IdentityEntityAlias
metadata:
  name: obco-alice-approle
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  aliasName: obco-alice-ci
  mountRef:
    name: obco-approle
  entityRef:
    name: obco-alice
  customMetadata:
    source: gitops
---
apiVersion: identity.obco.dev/v1alpha1
kind: IdentityEntityAlias
metadata:
  name: obco-bob-approle
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  aliasName: obco-bob-ci
  mountPath: approle-ci
  entityName: obco-bob
---
apiVersion: identity.obco.dev/v1alpha1
kind: IdentityEntityAlias
metadata:
  name: obco-platform-approle
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  aliasName: obco-platform-ci
  mountSelector:
    matchLabels:
      obco.example.com/auth: approle
  entitySelector:
    matchLabels:
      obco.example.com/service: platform-ci
---
apiVersion: identity.obco.dev/v1alpha1
kind: IdentityEntityAlias
metadata:
  name: obco-legacy-approle
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  aliasName: obco-legacy-ci
  mountAccessor: auth_approle_0a1b2c3d
  entityID: 6f1e3c2a-0000-4000-8000-000000000001
