apiVersion: identity.obco.dev/v1alpha1
kind: IdentityGroupAlias
metadata:
  name: obco-keycloak-admins
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  aliasName: /obco/admins
  mountPath: oidc
  groupRef:
    name: obco-keycloak-admins
---
apiVersion: identity.obco.dev/v1alpha1
kind: IdentityGroupAlias
metadata:
  name: obco-keycloak-auditors
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  aliasName: /obco/auditors
  mountRef:
    name: obco-oidc
  groupName: obco-keycloak-auditors
---
apiVersion: identity.obco.dev/v1alpha1
kind: IdentityGroupAlias
metadata:
  name: obco-keycloak-viewers
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  aliasName: /obco/viewers
  mountSelector:
    matchLabels:
      obco.example.com/auth: oidc
  groupSelector:
    matchLabels:
      obco.example.com/idp: keycloak-viewers
---
apiVersion: identity.obco.dev/v1alpha1
kind: IdentityGroupAlias
metadata:
  name: obco-keycloak-legacy
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  aliasName: /obco/legacy
  mountAccessor: auth_oidc_0a1b2c3d
  groupID: 6f1e3c2a-0000-4000-8000-000000000003
