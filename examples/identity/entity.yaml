apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Entity
metadata:
  name: obco-alice
  namespace: openbao-config
  labels:
    obco.example.com/team: platform
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  driftInterval: 30m
  managementPolicy: Manage
  name: obco-alice
  policies:
    - obco-reader
    - obco-writer
  metadata:
    team: platform
    email: alice@example.com
  disabled: false
---
apiVersion: identity.openbaoconfig.io/v1alpha1
kind: Entity
metadata:
  name: obco-bob
  namespace: openbao-config
  labels:
    obco.example.com/team: platform
spec:
  connectionRef:
    name: openbao
  policies:
    - obco-reader
