apiVersion: auth.openbaoconfig.io/v1alpha1
kind: TokenRole
metadata:
  name: app-issuer
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  name: app-issuer
  allowedPolicies:
    - app-reader
    - app-writer
  disallowedPolicies:
    - admin
  allowedPoliciesGlob:
    - app-*
  disallowedPoliciesGlob:
    - root-*
  allowedEntityAliases:
    - app-*
  orphan: false
  renewable: true
  pathSuffix: app-v1
  tokenExplicitMaxTTL: 24h
  tokenPeriod: 1h
  tokenBoundCIDRs:
    - 10.42.0.0/16
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: true
