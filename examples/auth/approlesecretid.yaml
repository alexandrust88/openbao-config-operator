apiVersion: auth.obco.dev/v1alpha1
kind: AppRoleSecretID
metadata:
  name: ci-deployer-login
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  roleRef:
    name: ci-deployer
  metadata:
    team: platform
    pipeline: deploy
  cidrList:
    - 10.42.0.0/16
  tokenBoundCIDRs:
    - 10.42.0.0/16
  ttl: 12h
  numUses: 0
  writeSecretRef:
    name: ci-deployer-approle
  rotation:
    enabled: true
    renewBefore: 33%
---
apiVersion: auth.obco.dev/v1alpha1
kind: AppRoleSecretID
metadata:
  name: ci-deployer-login-by-name
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: Create
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: approle
  roleName: ci-deployer
  ttl: 6h
  numUses: 10
  writeSecretRef:
    name: ci-deployer-approle-by-name
  rotation:
    enabled: true
    renewBefore: 2h
