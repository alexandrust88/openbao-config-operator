apiVersion: auth.obco.dev/v1alpha1
kind: KerberosAuthGroup
metadata:
  name: engineering
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: kerberos
  name: engineering
  policies:
    - engineering
    - readers
