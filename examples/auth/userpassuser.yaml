# A break-glass user whose password is read from a Secret, with short tokens bound to a CIDR, plus an auditor user.
apiVersion: v1
kind: Secret
metadata:
  name: breakglass-login
type: Opaque
stringData:
  password: not-a-real-password-change-me
  bcrypt: $2a$10$fakefakefakefakefakefuDummyHashValueForExamplesOnly000
---
apiVersion: auth.obco.dev/v1alpha1
kind: UserpassUser
metadata:
  name: breakglass
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: userpass
  name: breakglass
  passwordSecretRef:
    name: breakglass-login
    key: password
  tokenTTL: 15m
  tokenMaxTTL: 1h
  tokenExplicitMaxTTL: 1h
  tokenPeriod: 0s
  tokenPolicies:
    - breakglass
  policyRefs:
    - name: obco-team-a-reader
  tokenBoundCIDRs:
    - 10.42.0.0/16
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: true
  tokenStrictlyBindIP: false
---
apiVersion: auth.obco.dev/v1alpha1
kind: UserpassUser
metadata:
  name: auditor
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  mountPath: userpass
  name: auditor
  passwordHashSecretRef:
    name: breakglass-login
    key: bcrypt
  tokenPolicies:
    - auditor
