apiVersion: auth.obco.dev/v1alpha1
kind: AzureAuthRole
metadata:
  name: azure-vm
  namespace: openbao-config
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: azure
  name: vm
  boundServicePrincipalIDs:
    - 00000000-0000-0000-0000-000000000003
  boundGroupIDs:
    - 00000000-0000-0000-0000-000000000004
  boundLocations:
    - westeurope
  boundSubscriptionIDs:
    - 00000000-0000-0000-0000-000000000005
  boundResourceGroups:
    - rg-openbao-config
  boundScaleSets:
    - vmss-openbao-config
  tokenTTL: 1h
  tokenMaxTTL: 8h
  tokenExplicitMaxTTL: 24h
  tokenPeriod: 30m
  tokenPolicies:
    - default-login
    - app-read
  policyRefs:
    - name: obco-team-a-reader
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 192.168.10.0/24
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
