apiVersion: auth.obco.dev/v1alpha1
kind: CertAuthConfig
metadata:
  name: cert
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: cert
  disableBinding: false
  enableIdentityAliasMetadata: true
  ocspCacheSize: 200
