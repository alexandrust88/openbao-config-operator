apiVersion: v1
kind: Secret
metadata:
  name: ldap-auth-bind
type: Opaque
stringData:
  password: fake-bind-password
  tls.key: fake-ldap-client-key-not-pem
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: LDAPAuthConfig
metadata:
  name: ldap
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: ldap
  url: ldaps://ldap1.example.org,ldaps://ldap2.example.org
  bindDN: cn=openbao,ou=services,dc=example,dc=org
  bindPassSecretRef:
    name: ldap-auth-bind
    key: password
  userDN: ou=people,dc=example,dc=org
  userAttr: uid
  userFilter: '(&(objectClass=inetOrgPerson)({{.UserAttr}}={{.Username}}))'
  upnDomain: example.org
  discoverDN: false
  denyNullBind: true
  usernameAsAlias: true
  groupDN: ou=groups,dc=example,dc=org
  groupFilter: '(&(objectClass=groupOfNames)(member={{.UserDN}}))'
  groupAttr: cn
  useTokenGroups: false
  anonymousGroupSearch: false
  caseSensitiveNames: false
  certificate: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1sZGFwLWNh
    -----END CERTIFICATE-----
  clientTLSCert: |
    -----BEGIN CERTIFICATE-----
    ZmFrZS1sZGFwLWNsaWVudC1jZXJ0
    -----END CERTIFICATE-----
  clientTLSKeySecretRef:
    name: ldap-auth-bind
    key: tls.key
  startTLS: false
  insecureTLS: false
  tlsMinVersion: tls12
  tlsMaxVersion: tls13
  requestTimeout: 1m30s
  connectionTimeout: 30s
  dereferenceAliases: never
  maxPageSize: 500
  tokenTTL: 1h
  tokenMaxTTL: 4h
  tokenExplicitMaxTTL: 8h
  tokenPeriod: 30m
  tokenPolicies:
    - default-login
    - readers
  policyRefs:
    - name: obco-team-a-reader
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 192.168.10.0/24
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
