apiVersion: v1
kind: Secret
metadata:
  name: okta-api-token
type: Opaque
stringData:
  token: fake-okta-api-token
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: OktaAuthConfig
metadata:
  name: okta
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: okta
  orgName: example
  apiTokenSecretRef:
    name: okta-api-token
    key: token
  baseURL: okta.com
  bypassOktaMFA: false
  tokenTTL: 1h
  tokenMaxTTL: 4h
  tokenExplicitMaxTTL: 8h
  tokenPeriod: 30m
  tokenPolicies:
    - default-login
    - readers
  policyRefs:
    - name: obco-team-a-reader
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 192.168.10.0/24
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
