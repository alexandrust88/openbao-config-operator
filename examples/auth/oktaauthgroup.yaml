apiVersion: auth.openbaoconfig.io/v1alpha1
kind: OktaAuthGroup
metadata:
  name: okta-admins
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: okta
  name: Admins
  policies:
    - admin
