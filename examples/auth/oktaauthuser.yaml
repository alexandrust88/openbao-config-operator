apiVersion: auth.obco.dev/v1alpha1
kind: OktaAuthUser
metadata:
  name: jane
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: okta
  name: jane@example.org
  groups:
    - Admins
    - Developers
  policies:
    - personal-jane
