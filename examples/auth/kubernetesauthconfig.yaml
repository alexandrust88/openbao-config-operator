# Points the kubernetes auth mount at the cluster's API server with its CA certificate, and reads the token reviewer
# JWT from a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-auth-reviewer
type: Opaque
stringData:
  token: fake.token-reviewer.jwt-not-a-real-token
---
apiVersion: auth.obco.dev/v1alpha1
kind: KubernetesAuthConfig
metadata:
  name: kubernetes
spec:
  connectionRef:
    kind: BaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: kubernetes
  kubernetesHost: https://kubernetes.default.svc:443
  kubernetesCACert: |
    -----BEGIN CERTIFICATE-----
    RkFLRS1DQS1DRVJUSUZJQ0FURS1GT1ItRVhBTVBMRVMtT05MWQ==
    -----END CERTIFICATE-----
  tokenReviewerJWTSecretRef:
    name: kubernetes-auth-reviewer
    key: token
  pemKeys:
    - |
      -----BEGIN PUBLIC KEY-----
      RkFLRS1QVUJMSUMtS0VZLUZPUi1FWEFNUExFUy1PTkxZ
      -----END PUBLIC KEY-----
  disableLocalCAJWT: true
