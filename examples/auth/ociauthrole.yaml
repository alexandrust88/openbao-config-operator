apiVersion: auth.openbaoconfig.io/v1alpha1
kind: OCIAuthRole
metadata:
  name: oci-ops
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: oci
  name: ops
  ocidList:
    - ocid1.group.oc1..aaaaaaaafakefakefakefake
    - ocid1.dynamicgroup.oc1..aaaaaaaafakefakefakefake
  tokenTTL: 1h
  tokenMaxTTL: 8h
  tokenExplicitMaxTTL: 24h
  tokenPeriod: 30m
  tokenPolicies:
    - default-login
    - app-read
  policyRefs:
    - name: obco-team-a-reader
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 192.168.10.0/24
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
