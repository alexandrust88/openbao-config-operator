apiVersion: v1
kind: Secret
metadata:
  name: radius-shared-secret
type: Opaque
stringData:
  secret: fake-radius-shared-secret
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: RADIUSAuthConfig
metadata:
  name: radius
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Orphan
  driftDetection: Enabled
  mountPath: radius
  host: radius.example.org
  port: 1812
  secretSecretRef:
    name: radius-shared-secret
    key: secret
  unregisteredUserPolicies:
    - guest
  dialTimeout: 10s
  readTimeout: 15s
  nasPort: 10
  nasIdentifier: openbao
  tokenTTL: 1h
  tokenMaxTTL: 4h
  tokenExplicitMaxTTL: 8h
  tokenPeriod: 30m
  tokenPolicies:
    - default-login
    - readers
  policyRefs:
    - name: obco-team-a-reader
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 192.168.10.0/24
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
