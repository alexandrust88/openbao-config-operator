apiVersion: auth.openbaoconfig.io/v1alpha1
kind: CFAuthRole
metadata:
  name: cf-app
  namespace: openbao-config
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbao
  creationPolicy: CreateOrAdopt
  deletionPolicy: Delete
  driftDetection: Enabled
  mountPath: cf
  name: app
  boundApplicationIDs:
    - 00000000-0000-0000-0000-00000000000a
  boundSpaceIDs:
    - 00000000-0000-0000-0000-00000000000b
  boundOrganizationIDs:
    - 00000000-0000-0000-0000-00000000000c
  boundInstanceIDs:
    - 00000000-0000-0000-0000-00000000000d
  disableIPMatching: false
  tokenTTL: 1h
  tokenMaxTTL: 8h
  tokenExplicitMaxTTL: 24h
  tokenPeriod: 30m
  tokenPolicies:
    - default-login
    - app-read
  policyRefs:
    - name: obco-team-a-reader
  tokenBoundCIDRs:
    - 10.0.0.0/8
    - 192.168.10.0/24
  tokenNumUses: 0
  tokenType: service
  tokenNoDefaultPolicy: false
  tokenStrictlyBindIP: false
