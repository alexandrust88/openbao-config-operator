# Every ServiceAccount named "app" in team-a or team-b gets its own folder apps/sa/<namespace>/<name>/.
# Replace auth_kubernetes_1a2b3c4d with the accessor of the auth mount:
#   kubectl get authmount kubernetes -n openbao-config -o jsonpath='{.status.id}'
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: sa-own-folder
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  policy: |
    path "apps/data/sa/{{identity.entity.aliases.auth_kubernetes_1a2b3c4d.metadata.service_account_namespace}}/{{identity.entity.aliases.auth_kubernetes_1a2b3c4d.metadata.service_account_name}}/*" {
      capabilities = ["create", "read", "update"]
    }
    path "apps/metadata/sa/{{identity.entity.aliases.auth_kubernetes_1a2b3c4d.metadata.service_account_namespace}}/{{identity.entity.aliases.auth_kubernetes_1a2b3c4d.metadata.service_account_name}}/*" {
      capabilities = ["read", "list"]
    }
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: KubernetesAuthRole
metadata:
  name: apps
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  mountPath: kubernetes
  boundServiceAccountNames:
    - app
  boundServiceAccountNamespaces:
    - team-a
    - team-b
  tokenTTL: 15m
  tokenPolicies:
    - sa-own-folder
    - entity-own-folder
    - group-folder
