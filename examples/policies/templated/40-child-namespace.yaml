# Templated policies in the child OpenBao namespace "team". Objects reach the child namespace in two ways:
# through a connection based in it (openbao-team), or through the root connection with spec.namespace.
# The accessor is the one of the Kubernetes auth mount inside "team", not the root one:
#   kubectl get authmount team-kubernetes -n openbao-config -o jsonpath='{.status.id}'
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: OpenBaoNamespace
metadata:
  name: team
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
---
apiVersion: core.openbaoconfig.io/v1alpha1
kind: OpenBaoConnection
metadata:
  name: openbao-team
  namespace: openbao-config
spec:
  serverRef:
    name: openbao
  namespace: team
  authNamespace: ""
  auth:
    kubernetes:
      role: openbao-config-operator
      serviceAccountRef:
        name: openbao-config-operator
      audiences:
        - openbao
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: AuthMount
metadata:
  name: team-kubernetes
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao-team
  path: kubernetes
  type: kubernetes
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: SecretsMount
metadata:
  name: team-apps
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao-team
  path: apps
  type: kv-v2
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: KubernetesAuthConfig
metadata:
  name: team-kubernetes
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao-team
  mountPath: kubernetes
  kubernetesHost: https://kubernetes.default.svc
  kubernetesCACert: |
    -----BEGIN CERTIFICATE-----
    REPLACE-WITH-THE-CLUSTER-CA
    -----END CERTIFICATE-----
  tokenReviewerJWTSecretRef:
    name: openbao-token-reviewer
    key: token
  disableLocalCAJWT: true
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: team-sa-own-folder
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao-team
  name: sa-own-folder
  policy: |
    path "apps/data/sa/{{identity.entity.aliases.auth_kubernetes_5e6f7a8b.metadata.service_account_namespace}}/{{identity.entity.aliases.auth_kubernetes_5e6f7a8b.metadata.service_account_name}}/*" {
      capabilities = ["create", "read", "update"]
    }
---
apiVersion: sys.openbaoconfig.io/v1alpha1
kind: Policy
metadata:
  name: team-entity-id-folder
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao
  namespace: team
  name: entity-id-folder
  policy: |
    path "apps/data/entity-id/{{identity.entity.id}}/*" {
      capabilities = ["create", "read", "update"]
    }
---
apiVersion: auth.openbaoconfig.io/v1alpha1
kind: KubernetesAuthRole
metadata:
  name: team-apps
  namespace: openbao-config
spec:
  connectionRef:
    name: openbao-team
  mountPath: kubernetes
  name: apps
  boundServiceAccountNames:
    - app
  boundServiceAccountNamespaces:
    - team-a
    - team-b
  tokenTTL: 15m
  tokenPolicies:
    - sa-own-folder
    - entity-id-folder
