---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: accessgrants.access.obco.dev
spec:
  group: access.obco.dev
  names:
    categories:
    - obco
    - obco-access
    kind: AccessGrant
    listKind: AccessGrantList
    plural: accessgrants
    singular: accessgrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "AccessGrant gives Kubernetes ServiceAccounts access to KV version
          2 secrets (the machine access model). It writes one ACL policy, sys/policies/acl/grant_<namespace>_<name>,
          rendered from rules that cite AccessLevels, and one role per subject on
          a Kubernetes auth method, auth/<mount>/role/grant_<namespace>_<name>_<index>,
          that issues tokens with that policy. With the default deletionPolicy Orphan
          the policy and roles stay when the grant is deleted; with Delete they are
          removed.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t
          \ mountPath: kubernetes\n\t  subjects:\n\t    - name: app\n\t      namespace:
          payments\n\t  rules:\n\t    - mount: secret\n\t      path: payments/{sa.name}/*\n\t
          \     level: reader"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'Desired state: the auth method, the ServiceAccount subjects
              and the secret paths they get access to.'
            properties:
              authMountRef:
                description: AuthMount resource, in the same Kubernetes namespace,
                  whose Kubernetes auth method the roles are created on; it must be
                  Ready. Set exactly one of mountPath, mountAccessor and authMountRef.
                properties:
                  name:
                    description: 'Name of the referenced object, in the same namespace
                      as this resource. Example: my-app'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: BaoConnection
                    description: 'Kind of the connection: BaoConnection (in the same
                      Kubernetes namespace as this resource) or ClusterBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: BaoConnection.'
                    enum:
                    - BaoConnection
                    - ClusterBaoConnection
                    type: string
                  name:
                    description: 'Name of the BaoConnection or ClusterBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  and key holders (mounts, namespaces, KV data, audit devices, endpoints,
                  transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed
                  only while the resource carries the annotation obco.dev/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              mountAccessor:
                description: 'Accessor of the Kubernetes auth method the roles are
                  created on, as listed by sys/auth. Set exactly one of mountPath,
                  mountAccessor and authMountRef. Example: auth_kubernetes_1a2b3c4d'
                maxLength: 128
                minLength: 1
                type: string
              mountPath:
                description: 'Path of the Kubernetes auth method the roles are created
                  on, without the auth/ prefix. Set exactly one of mountPath, mountAccessor
                  and authMountRef. Example: kubernetes'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              openbaoNamespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              rules:
                description: Secret paths and the level granted on each, 1 to 8 entries,
                  rendered into the ACL policy grant_<namespace>_<name>. In a path,
                  {sa.namespace} and {sa.name} stand for the namespace and name of
                  the ServiceAccount that logged in; OpenBao fills them in per request
                  through identity templating.
                items:
                  description: 'Grants one AccessLevel on a pair of secret paths of
                    a KV version 2 mount. A path is a list of segments separated by
                    "/": a literal, "+" (exactly one segment), or one of the tokens
                    {org}, {sa.namespace} and {sa.name}; the last segment may also
                    be "*" or end with "*".'
                  properties:
                    level:
                      description: 'Name of the AccessLevel, in the same Kubernetes
                        namespace, granted on the paths. Example: reader'
                      maxLength: 253
                      minLength: 1
                      type: string
                    metadataPath:
                      description: 'Secret path below the mount that the level''s
                        metadata capabilities apply to; the policy grants them on
                        <mount>/metadata/<metadataPath>. Same syntax as path. Default:
                        the value of path. Example: apps/*'
                      maxLength: 256
                      minLength: 1
                      pattern: ^((([A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)|\+|\{org\}|\{sa\.namespace\}|\{sa\.name\})/)*(([A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)\*?|\+|\{org\}|\{sa\.namespace\}|\{sa\.name\}|\*)$
                      type: string
                    mount:
                      description: 'Path of the KV version 2 secrets engine, without
                        leading or trailing slash. Example: secret'
                      maxLength: 128
                      minLength: 1
                      pattern: ^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$
                      type: string
                    organizations:
                      description: 'Values that {org} takes in path and metadataPath;
                        the rule is rendered once per organization. Set exactly when
                        a path uses {org}. Lowercase letters, digits and "-", at most
                        40 characters. Example: [acme, globex]'
                      items:
                        maxLength: 40
                        pattern: ^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    path:
                      description: 'Secret path below the mount that the level''s
                        data capabilities apply to; the policy grants them on <mount>/data/<path>.
                        The level''s versions grant applies to the same path under
                        delete/, undelete/ and destroy/. Example: apps/{sa.namespace}/*'
                      maxLength: 256
                      minLength: 1
                      pattern: ^((([A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)|\+|\{org\}|\{sa\.namespace\}|\{sa\.name\})/)*(([A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)\*?|\+|\{org\}|\{sa\.namespace\}|\{sa\.name\}|\*)$
                      type: string
                  required:
                  - level
                  - mount
                  - path
                  type: object
                  x-kubernetes-validations:
                  - message: a rule lists organizations exactly when its path or metadataPath
                      uses {org}
                    rule: (self.path.contains('{org}') || (has(self.metadataPath)
                      && self.metadataPath.contains('{org}'))) == (has(self.organizations)
                      && size(self.organizations) > 0)
                maxItems: 8
                minItems: 1
                type: array
              subjects:
                description: ServiceAccounts that get access, 1 to 8 entries. Each
                  subject gets its own Kubernetes auth role, grant_<namespace>_<name>_<index>,
                  because OpenBao matches the names and namespaces of a role as two
                  independent lists.
                items:
                  description: A set of Kubernetes ServiceAccounts that log in with
                    one Kubernetes auth role of their own. Set exactly one of namespace
                    and namespaceSelector.
                  properties:
                    name:
                      description: 'Name of the ServiceAccount; maps to the role''s
                        `bound_service_account_names`. A leading or trailing "*" matches
                        several names. Example: app'
                      maxLength: 253
                      minLength: 1
                      pattern: ^\*?[a-z0-9.-]*\*?$
                      type: string
                    namespace:
                      description: 'Kubernetes namespace of the ServiceAccount; maps
                        to the role''s `bound_service_account_namespaces`. A leading
                        or trailing "*" matches several namespaces, which makes the
                        subject broad: every rule path must then contain {sa.namespace}.
                        Example: payments'
                      maxLength: 63
                      minLength: 1
                      pattern: ^\*?[a-z0-9-]*\*?$
                      type: string
                    namespaceSelector:
                      description: 'Selects the Kubernetes namespaces of the ServiceAccount
                        by label instead of by name; maps to the role''s `bound_service_account_namespace_selector`.
                        This makes the subject broad: every rule path must then contain
                        {sa.namespace}.'
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: 'Labels a Kubernetes namespace must carry,
                            all of them, for its ServiceAccounts to match; sent to
                            the role as the `bound_service_account_namespace_selector`
                            label selector. Example: {team: payments}'
                          maxProperties: 16
                          minProperties: 1
                          type: object
                      required:
                      - matchLabels
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of namespace and namespaceSelector
                    rule: has(self.__namespace__) != has(self.namespaceSelector)
                maxItems: 8
                minItems: 1
                type: array
              tokenTTL:
                default: 15m
                description: 'Lifetime of the tokens the roles issue, as a duration;
                  maps to the role''s `token_ttl` (sent in seconds). Default: 15m.
                  Example: 1h'
                type: string
            required:
            - connectionRef
            - rules
            - subjects
            type: object
            x-kubernetes-validations:
            - message: set exactly one of mountPath, mountAccessor and authMountRef
              rule: '(has(self.mountPath) ? 1 : 0) + (has(self.mountAccessor) ? 1
                : 0) + (has(self.authMountRef) ? 1 : 0) == 1'
            - message: a subject with a namespace glob or a namespaceSelector requires
                {sa.namespace} in every rule path and metadataPath
              rule: '!self.subjects.exists(s, has(s.namespaceSelector) || (has(s.__namespace__)
                && s.__namespace__.contains(''*''))) || self.rules.all(r, r.path.contains(''{sa.namespace}'')
                && (!has(r.metadataPath) || r.metadataPath.contains(''{sa.namespace}'')))'
            - message: openbaoNamespace is immutable
              rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) &&
                (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: 'Observed state reported by the operator: conditions, the
              role names to log in with and the owned OpenBao objects.'
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              children:
                description: 'Every OpenBao object the grant owns: its ACL policy
                  and Kubernetes auth roles. With deletionPolicy Delete, deleting
                  the grant deletes exactly these.'
                items:
                  description: One OpenBao object created and owned by this resource;
                    with deletionPolicy Delete it is removed when the resource is
                    deleted.
                  properties:
                    kind:
                      description: 'Kind of the OpenBao object: ACLPolicy (an ACL
                        policy), KubernetesAuthRole (a Kubernetes auth role) or IdentityGroup
                        (an external identity group, together with its group alias).'
                      enum:
                      - ACLPolicy
                      - KubernetesAuthRole
                      - IdentityGroup
                      type: string
                    openbaoNamespace:
                      description: 'OpenBao namespace of the object, relative to status.openbaoNamespace;
                        empty means status.openbaoNamespace itself. Example: team-a'
                      type: string
                    path:
                      description: 'OpenBao API path of the object in its namespace.
                        Example: sys/policies/acl/grant_apps_reader'
                      type: string
                  required:
                  - kind
                  - path
                  type: object
                type: array
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              openbaoNamespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              roles:
                description: 'Names of the Kubernetes auth roles, one per subject
                  in spec order. A ServiceAccount logs in with the role of its subject.
                  Example: [grant_payments_app-reader_0]'
                items:
                  type: string
                type: array
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
