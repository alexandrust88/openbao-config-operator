---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: transitkeys.secrets.openbaoconfig.io
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
    - openbao
    kind: TransitKey
    listKind: TransitKeyList
    plural: transitkeys
    singular: transitkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.latestVersion
      name: Version
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "TransitKey manages a named key of a transit secrets engine at
          `<mount>/keys/<name>`, for encryption as a service, signing or HMAC; its
          key material never leaves OpenBao unless exportable. Change rotateNonce
          to rotate it once.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name:
          openbao\n\t  mountPath: transit\n\t  name: orders\n\t  type: aes256-gcm96\n\t
          \ autoRotatePeriod: 720h"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired named key of a transit secrets engine
              at `<mountPath>/keys/<name>`. Settings fixed at creation (type, derived,
              convergentEncryption, keySize, externalKeyRef) are immutable.
            properties:
              allowPlaintextBackup:
                description: allowPlaintextBackup allows a plaintext backup of the
                  key (`allow_plaintext_backup`). Defaults to false. Once enabled
                  it cannot be disabled.
                type: boolean
              autoRotatePeriod:
                description: 'autoRotatePeriod rotates the key automatically after
                  this period (`auto_rotate_period`), a duration: 0 disables it, otherwise
                  at least `1h`; must be 0 for external-key. Defaults to 0. Example:
                  `720h`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: OpenBaoConnection
                    description: 'Kind of the connection: OpenBaoConnection (in the
                      same Kubernetes namespace as this resource) or ClusterOpenBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: OpenBaoConnection.'
                    enum:
                    - OpenBaoConnection
                    - ClusterOpenBaoConnection
                    type: string
                  name:
                    description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              convergentEncryption:
                description: convergentEncryption makes the same plaintext, context
                  and nonce produce the same ciphertext (`convergent_encryption`).
                  Requires derived. Defaults to false. Immutable.
                type: boolean
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionAllowed:
                description: deletionAllowed allows the key to be deleted in OpenBao
                  (`deletion_allowed`). Defaults to false; set automatically before
                  the key is deleted under deletionPolicy Delete.
                type: boolean
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  holders such as mounts, namespaces and KV data are removed only
                  while the resource carries the annotation openbaoconfig.io/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              derived:
                description: derived enables key derivation, so every request must
                  carry a context (`derived`). Defaults to false. Immutable.
                type: boolean
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              exportable:
                description: exportable allows every version of the key to be exported
                  (`exportable`). Defaults to false. Once enabled it cannot be disabled.
                type: boolean
              externalKeyRef:
                description: 'externalKeyRef names the external key as `<config name>:<key
                  name>` (`external_key_ref`), required for and only allowed with
                  type external-key. Immutable. Example: `hsm:orders-key`.'
                maxLength: 256
                type: string
              keySize:
                description: 'keySize is the key size in bytes for hmac and external-key
                  keys only (`key_size`). 32-512. Immutable. Example: `32`.'
                format: int32
                maximum: 512
                minimum: 32
                type: integer
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              minDecryptionVersion:
                description: minDecryptionVersion is the oldest key version allowed
                  to decrypt or verify (`min_decryption_version`). Minimum 1. Defaults
                  to 1.
                format: int32
                minimum: 1
                type: integer
              minEncryptionVersion:
                description: minEncryptionVersion is the oldest key version allowed
                  to encrypt or sign (`min_encryption_version`); 0 means the latest
                  version. Must be 0 or at least minDecryptionVersion. Defaults to
                  0.
                format: int32
                minimum: 0
                type: integer
              mountPath:
                default: transit
                description: 'mountPath is the path of the transit secrets engine
                  mount. Defaults to `transit`. Immutable. Example: `transit`.'
                maxLength: 128
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              name:
                description: 'name is the key name in OpenBao. Defaults to metadata.name.
                  Immutable. Example: `orders`.'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+$
                type: string
              namespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              rotateNonce:
                description: 'rotateNonce rotates the key once (`<mountPath>/keys/<name>/rotate`)
                  each time it changes to a new value. The first value seen when the
                  key is created or adopted does not rotate it. Up to 63 characters.
                  Example: `2026-q4`.'
                maxLength: 63
                type: string
              type:
                default: aes256-gcm96
                description: 'type is the key algorithm (`type`), fixed at creation.
                  Allowed: aes128-gcm96, aes256-gcm96, chacha20-poly1305, xchacha20-poly1305,
                  ecdsa-p256, ecdsa-p384, ecdsa-p521, ed25519, rsa-2048, rsa-3072,
                  rsa-4096, mldsa-44, mldsa-65, mldsa-87, hmac, external-key. Defaults
                  to aes256-gcm96. Immutable.'
                enum:
                - aes128-gcm96
                - aes256-gcm96
                - chacha20-poly1305
                - xchacha20-poly1305
                - ecdsa-p256
                - ecdsa-p384
                - ecdsa-p521
                - ed25519
                - rsa-2048
                - rsa-3072
                - rsa-4096
                - mldsa-44
                - mldsa-65
                - mldsa-87
                - hmac
                - external-key
                type: string
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: name is immutable
              rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name
                == oldSelf.name)
            - message: type is immutable
              rule: has(self.type) == has(oldSelf.type) && (!has(self.type) || self.type
                == oldSelf.type)
            - message: derived is immutable
              rule: has(self.derived) == has(oldSelf.derived) && (!has(self.derived)
                || self.derived == oldSelf.derived)
            - message: convergentEncryption is immutable
              rule: has(self.convergentEncryption) == has(oldSelf.convergentEncryption)
                && (!has(self.convergentEncryption) || self.convergentEncryption ==
                oldSelf.convergentEncryption)
            - message: keySize is immutable
              rule: has(self.keySize) == has(oldSelf.keySize) && (!has(self.keySize)
                || self.keySize == oldSelf.keySize)
            - message: externalKeyRef is immutable
              rule: has(self.externalKeyRef) == has(oldSelf.externalKeyRef) && (!has(self.externalKeyRef)
                || self.externalKeyRef == oldSelf.externalKeyRef)
            - message: exportable cannot be disabled once enabled
              rule: '!has(oldSelf.exportable) || !oldSelf.exportable || (has(self.exportable)
                && self.exportable)'
            - message: allowPlaintextBackup cannot be disabled once enabled
              rule: '!has(oldSelf.allowPlaintextBackup) || !oldSelf.allowPlaintextBackup
                || (has(self.allowPlaintextBackup) && self.allowPlaintextBackup)'
            - message: convergentEncryption requires derived
              rule: '!has(self.convergentEncryption) || !self.convergentEncryption
                || (has(self.derived) && self.derived)'
            - message: keySize applies only to hmac and external-key keys
              rule: '!has(self.keySize) || self.type == ''hmac'' || self.type == ''external-key'''
            - message: externalKeyRef is required for, and only allowed with, type
                external-key
              rule: (self.type == 'external-key') == has(self.externalKeyRef)
            - message: autoRotatePeriod must be 0 or at least 1h, and 0 for external-key
                keys
              rule: '!has(self.autoRotatePeriod) || duration(self.autoRotatePeriod)
                == duration(''0s'') || (self.type != ''external-key'' && duration(self.autoRotatePeriod)
                >= duration(''1h''))'
            - message: minEncryptionVersion must be 0 or at least minDecryptionVersion
              rule: '!has(self.minEncryptionVersion) || !has(self.minDecryptionVersion)
                || self.minEncryptionVersion == 0 || self.minEncryptionVersion >=
                self.minDecryptionVersion'
            - message: namespace is immutable
              rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__)
                || self.__namespace__ == oldSelf.__namespace__)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: status is the observed state of the transit key.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              latestVersion:
                description: latestVersion is the latest version of the key.
                format: int64
                type: integer
              namespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotatedNonce:
                description: rotatedNonce is the last spec.rotateNonce that was applied.
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
