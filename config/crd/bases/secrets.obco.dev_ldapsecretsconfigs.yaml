---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ldapsecretsconfigs.secrets.obco.dev
spec:
  group: secrets.obco.dev
  names:
    categories:
    - obco
    - obco-secrets
    kind: LDAPSecretsConfig
    listKind: LDAPSecretsConfigList
    plural: ldapsecretsconfigs
    singular: ldapsecretsconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "LDAPSecretsConfig sets the directory connection of an LDAP secrets
          plugin mount (external plugin) at `<mount>/config`: where the directory
          is and the account OpenBao binds as to manage passwords. A singleton per
          mount; it is never deleted.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t
          \   name: openbao\n\t  mountPath: ldap\n\t  url: ldaps://ldap.example.com\n\t
          \ bindDN: cn=openbao,ou=services,dc=example,dc=com\n\t  bindPassSecretRef:
          {name: ldap-bind, key: password}\n\t  schema: openldap"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired directory connection of the LDAP secrets
              plugin at `<mountPath>/config`. The bind password is written whenever
              any field or the Secret changes, which overwrites a password changed
              by rotate-root; rotate the Secret instead of calling rotate-root on
              a mount this resource manages. deletionPolicy must be Orphan.
            properties:
              bindDN:
                description: 'bindDN is the distinguished name OpenBao binds as to
                  manage passwords (`binddn`). Example: `cn=openbao,ou=services,dc=example,dc=com`.'
                maxLength: 1024
                minLength: 1
                type: string
              bindPassSecretRef:
                description: 'bindPassSecretRef selects the Secret key holding the
                  password of bindDN (`bindpass`). Read from a Secret key; never stored
                  in status. Write-only. Example: `{name: ldap-bind, key: password}`.'
                properties:
                  key:
                    description: 'Key in the Secret''s data whose value is used. Example:
                      password'
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: 'Name of the Kubernetes Secret, in the same namespace
                      as this resource. Example: openbao-credentials'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              certificate:
                description: 'certificate is the PEM CA certificate that verifies
                  the directory''s TLS certificate (`certificate`). Example: `-----BEGIN
                  CERTIFICATE-----...`.'
                maxLength: 65536
                type: string
              clientTLSCert:
                description: 'clientTLSCert is the PEM client certificate presented
                  to the directory (`client_tls_cert`); set together with clientTLSKeySecretRef.
                  OpenBao does not return it on read, so a change in OpenBao is not
                  detected. Example: `-----BEGIN CERTIFICATE-----...`.'
                maxLength: 65536
                type: string
              clientTLSKeySecretRef:
                description: 'clientTLSKeySecretRef selects the Secret key holding
                  the PEM key of clientTLSCert (`client_tls_key`). Read from a Secret
                  key; never stored in status. Write-only. Example: `{name: ldap-client,
                  key: tls.key}`.'
                properties:
                  key:
                    description: 'Key in the Secret''s data whose value is used. Example:
                      password'
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: 'Name of the Kubernetes Secret, in the same namespace
                      as this resource. Example: openbao-credentials'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: BaoConnection
                    description: 'Kind of the connection: BaoConnection (in the same
                      Kubernetes namespace as this resource) or ClusterBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: BaoConnection.'
                    enum:
                    - BaoConnection
                    - ClusterBaoConnection
                    type: string
                  name:
                    description: 'Name of the BaoConnection or ClusterBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              connectionTimeout:
                description: 'connectionTimeout is how long to wait for a connection
                  before trying the next URL (`connection_timeout`), a duration. Defaults
                  to `30s`. Example: `10s`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  and key holders (mounts, namespaces, KV data, audit devices, endpoints,
                  transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed
                  only while the resource carries the annotation obco.dev/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              insecureTLS:
                description: insecureTLS skips verification of the directory's TLS
                  certificate (`insecure_tls`); not for production. Defaults to false.
                type: boolean
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              mountPath:
                default: ldap
                description: 'mountPath is the path the LDAP secrets plugin is mounted
                  at. Defaults to `ldap`. Immutable. Example: `ldap`.'
                maxLength: 256
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              openbaoNamespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              passwordPolicy:
                description: 'passwordPolicy is the OpenBao password policy that generates
                  passwords (`password_policy`). Empty uses the plugin default. Example:
                  `ldap`.'
                maxLength: 128
                type: string
              requestTimeout:
                description: 'requestTimeout is how long to wait for a response to
                  a directory request (`request_timeout`), a duration. Defaults to
                  `90s`. Example: `30s`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              schema:
                description: 'schema is the directory type (`schema`). Allowed: openldap,
                  racf, ad. Defaults to openldap.'
                enum:
                - openldap
                - racf
                - ad
                type: string
              skipStaticRoleImportRotation:
                description: 'skipStaticRoleImportRotation is the default for new
                  static roles: do not rotate the password when the role is created
                  (`skip_static_role_import_rotation`). Defaults to false.'
                type: boolean
              startTLS:
                description: startTLS issues a STARTTLS command after connecting over
                  plain LDAP (`starttls`). Defaults to false.
                type: boolean
              tlsMaxVersion:
                description: 'tlsMaxVersion is the maximum TLS version accepted from
                  the directory (`tls_max_version`); not lower than tlsMinVersion.
                  Allowed: tls10, tls11, tls12, tls13. Defaults to tls12.'
                enum:
                - tls10
                - tls11
                - tls12
                - tls13
                type: string
              tlsMinVersion:
                description: 'tlsMinVersion is the minimum TLS version accepted from
                  the directory (`tls_min_version`). Allowed: tls10, tls11, tls12,
                  tls13. Defaults to tls12.'
                enum:
                - tls10
                - tls11
                - tls12
                - tls13
                type: string
              upnDomain:
                description: 'upnDomain is the userPrincipalName domain, so users
                  can be found as `<name>@<upnDomain>` (`upndomain`). Example: `example.com`.'
                maxLength: 256
                type: string
              url:
                description: 'url is the directory URL in lower case (`url`); separate
                  several URLs with commas, tried in order. Defaults to `ldap://127.0.0.1`.
                  Example: `ldaps://ldap.example.com`.'
                maxLength: 2048
                type: string
                x-kubernetes-validations:
                - message: 'url must not contain credentials (user:password@ or token@):
                    use the secret reference fields'
                  rule: '!self.matches(''://[^/?#]*@'')'
              userAttr:
                description: 'userAttr is the attribute that holds the user name (`userattr`),
                  such as cn, uid or userPrincipalName. Defaults to the schema''s
                  attribute (cn for openldap). Example: `uid`.'
                maxLength: 256
                type: string
              userDN:
                description: 'userDN is the base DN under which user entries are searched
                  (`userdn`). Example: `ou=users,dc=example,dc=com`.'
                maxLength: 1024
                type: string
            required:
            - bindDN
            - bindPassSecretRef
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: 'deletionPolicy must be Orphan: the plugin configuration is
                kept when the resource is deleted'
              rule: '!has(self.deletionPolicy) || self.deletionPolicy == ''Orphan'''
            - message: set clientTLSCert and clientTLSKeySecretRef together
              rule: has(self.clientTLSCert) == has(self.clientTLSKeySecretRef)
            - message: 'url must be lowercase: OpenBao stores it lowercased'
              rule: '!has(self.url) || self.url == self.url.lowerAscii()'
            - message: tlsMaxVersion must not be lower than tlsMinVersion; both default
                to tls12
              rule: '(has(self.tlsMaxVersion) ? self.tlsMaxVersion : ''tls12'') >=
                (has(self.tlsMinVersion) ? self.tlsMinVersion : ''tls12'')'
            - message: openbaoNamespace is immutable
              rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) &&
                (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: status is the observed state of the LDAP secrets plugin configuration.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              openbaoNamespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
