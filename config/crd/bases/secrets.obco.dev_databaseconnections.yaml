---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: databaseconnections.secrets.obco.dev
spec:
  group: secrets.obco.dev
  names:
    categories:
    - obco
    - obco-secrets
    kind: DatabaseConnection
    listKind: DatabaseConnectionList
    plural: databaseconnections
    shortNames:
    - baodbc
    singular: databaseconnection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pluginName
      name: Plugin
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "DatabaseConnection manages a connection of a database secrets
          engine at `<mount>/config/<name>`: the plugin, the root credentials (from
          a Secret) and the roles allowed to use it. DatabaseRole and DatabaseStaticRole
          objects issue credentials through it.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t
          \   name: openbao\n\t  mountPath: database\n\t  name: billing-postgres\n\t
          \ pluginName: postgresql-database-plugin\n\t  allowedRoles: [billing-app]\n\t
          \ passwordSecretRef: {name: pg-root, key: password}\n\t  postgresql:\n\t
          \   connectionURL: postgresql://{{username}}:{{password}}@pg:5432/billing\n\t
          \   username: openbao"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired connection of a database secrets engine
              at `<mountPath>/config/<name>`. At most one plugin section matching
              pluginName may be set; pluginConfig carries settings of any other plugin
              or extra settings of a builtin one. An omitted allowedRoles, rootRotationStatements
              or passwordPolicy is reset to its default. OpenBao merges connection
              settings on update, so a setting removed from the spec keeps its last
              value until the connection is created again.
            properties:
              allowedRoles:
                description: 'allowedRoles lists the roles that may use this connection
                  (`allowed_roles`); `*` allows every role, empty allows none. Up
                  to 256. Example: `[billing-app, billing-migrations]`.'
                items:
                  maxLength: 128
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              cassandra:
                description: cassandra holds the settings of cassandra-database-plugin.
                properties:
                  connectTimeout:
                    description: 'connectTimeout is the timeout for connecting to
                      the database (`connect_timeout`), a duration. Example: `5s`.'
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  consistency:
                    description: 'consistency is the consistency level for statements
                      (`consistency`). Example: `LOCAL_QUORUM`.'
                    maxLength: 32
                    type: string
                  hosts:
                    description: 'hosts are the Cassandra hosts to connect to (`hosts`,
                      comma-joined). 1-64. Example: `[cassandra-0.db.svc, cassandra-1.db.svc]`.'
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 64
                    minItems: 1
                    type: array
                  insecureTLS:
                    description: insecureTLS skips verification of the database server
                      certificate (`insecure_tls`). Defaults to false.
                    type: boolean
                  localDatacenter:
                    description: 'localDatacenter makes the driver prefer hosts of
                      this datacenter (`local_datacenter`). Example: `dc1`.'
                    maxLength: 128
                    type: string
                  pemBundleSecretRef:
                    description: 'pemBundleSecretRef selects the Secret key holding
                      a PEM bundle with the client certificate, its private key and
                      the CA chain (`pem_bundle`). Read from a Secret key; never stored
                      in status. Write-only. Example: `{name: cassandra-client, key:
                      bundle.pem}`.'
                    properties:
                      key:
                        description: 'Key in the Secret''s data whose value is used.
                          Example: password'
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: 'Name of the Kubernetes Secret, in the same namespace
                          as this resource. Example: openbao-credentials'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  pemJSONSecretRef:
                    description: 'pemJSONSecretRef selects the Secret key holding
                      the JSON output of an OpenBao PKI issue call (`pem_json`), as
                      an alternative to pemBundleSecretRef. Read from a Secret key;
                      never stored in status. Write-only. Example: `{name: cassandra-client,
                      key: issue.json}`.'
                    properties:
                      key:
                        description: 'Key in the Secret''s data whose value is used.
                          Example: password'
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: 'Name of the Kubernetes Secret, in the same namespace
                          as this resource. Example: openbao-credentials'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  port:
                    description: port is the native protocol port (`port`). 1-65535.
                      Defaults to 9042.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  protocolVersion:
                    description: 'protocolVersion is the CQL protocol version (`protocol_version`).
                      Defaults to 2. Example: `4`.'
                    format: int32
                    minimum: 1
                    type: integer
                  skipVerification:
                    description: skipVerification skips the consistency check of the
                      root credentials on connect (`skip_verification`). Defaults
                      to false.
                    type: boolean
                  socketKeepAlive:
                    description: 'socketKeepAlive is the keep-alive period of connections
                      (`socket_keep_alive`), a duration. Example: `30s`.'
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  tls:
                    description: tls enables TLS to the database (`tls`). Defaults
                      to false.
                    type: boolean
                  tlsMinVersion:
                    description: 'tlsMinVersion is the minimum TLS version (`tls_min_version`).
                      Allowed: tls10, tls11, tls12, tls13. Defaults to tls12.'
                    enum:
                    - tls10
                    - tls11
                    - tls12
                    - tls13
                    type: string
                  tlsServerName:
                    description: 'tlsServerName overrides the server name used to
                      verify the Cassandra server certificate (`tls_server_name`).
                      Example: `cassandra.db.svc`.'
                    maxLength: 253
                    type: string
                  username:
                    description: 'username is the root user (`username`). Example:
                      `openbao`.'
                    maxLength: 256
                    type: string
                  usernameTemplate:
                    description: 'usernameTemplate is the template for the names of
                      generated users (`username_template`). Empty uses the plugin
                      default. Example: `{{.RoleName}}_{{random 8}}`.'
                    maxLength: 1024
                    type: string
                required:
                - hosts
                type: object
                x-kubernetes-validations:
                - message: set at most one of pemBundleSecretRef and pemJSONSecretRef
                  rule: '!(has(self.pemBundleSecretRef) && has(self.pemJSONSecretRef))'
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: BaoConnection
                    description: 'Kind of the connection: BaoConnection (in the same
                      Kubernetes namespace as this resource) or ClusterBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: BaoConnection.'
                    enum:
                    - BaoConnection
                    - ClusterBaoConnection
                    type: string
                  name:
                    description: 'Name of the BaoConnection or ClusterBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  and key holders (mounts, namespaces, KV data, audit devices, endpoints,
                  transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed
                  only while the resource carries the annotation obco.dev/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              influxdb:
                description: influxdb holds the settings of influxdb-database-plugin.
                properties:
                  connectTimeout:
                    description: 'connectTimeout is the timeout for connecting to
                      the database (`connect_timeout`), a duration. Example: `5s`.'
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  host:
                    description: 'host is the InfluxDB host (`host`). Example: `influxdb.monitoring.svc`.'
                    maxLength: 253
                    minLength: 1
                    type: string
                  insecureTLS:
                    description: insecureTLS skips verification of the database server
                      certificate (`insecure_tls`). Defaults to false.
                    type: boolean
                  pemBundleSecretRef:
                    description: 'pemBundleSecretRef selects the Secret key holding
                      a PEM bundle with the client certificate, its private key and
                      the CA chain (`pem_bundle`). Read from a Secret key; never stored
                      in status. Write-only. Example: `{name: cassandra-client, key:
                      bundle.pem}`.'
                    properties:
                      key:
                        description: 'Key in the Secret''s data whose value is used.
                          Example: password'
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: 'Name of the Kubernetes Secret, in the same namespace
                          as this resource. Example: openbao-credentials'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  pemJSONSecretRef:
                    description: 'pemJSONSecretRef selects the Secret key holding
                      the JSON output of an OpenBao PKI issue call (`pem_json`), as
                      an alternative to pemBundleSecretRef. Read from a Secret key;
                      never stored in status. Write-only. Example: `{name: cassandra-client,
                      key: issue.json}`.'
                    properties:
                      key:
                        description: 'Key in the Secret''s data whose value is used.
                          Example: password'
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: 'Name of the Kubernetes Secret, in the same namespace
                          as this resource. Example: openbao-credentials'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  port:
                    description: port is the InfluxDB port (`port`). 1-65535. Defaults
                      to 8086.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  tls:
                    description: tls enables TLS to the database (`tls`). Defaults
                      to false.
                    type: boolean
                  tlsMinVersion:
                    description: 'tlsMinVersion is the minimum TLS version (`tls_min_version`).
                      Allowed: tls10, tls11, tls12, tls13. Defaults to tls12.'
                    enum:
                    - tls10
                    - tls11
                    - tls12
                    - tls13
                    type: string
                  username:
                    description: 'username is the root user (`username`). Example:
                      `openbao`.'
                    maxLength: 256
                    minLength: 1
                    type: string
                  usernameTemplate:
                    description: 'usernameTemplate is the template for the names of
                      generated users (`username_template`). Empty uses the plugin
                      default. Example: `{{.RoleName}}_{{random 8}}`.'
                    maxLength: 1024
                    type: string
                required:
                - host
                - username
                type: object
                x-kubernetes-validations:
                - message: set at most one of pemBundleSecretRef and pemJSONSecretRef
                  rule: '!(has(self.pemBundleSecretRef) && has(self.pemJSONSecretRef))'
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              mountPath:
                description: 'mountPath is the path of the database secrets engine
                  mount, without leading or trailing slashes. Immutable. Example:
                  `database`.'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              mysql:
                description: mysql holds the settings of the mysql, mysql-aurora,
                  mysql-rds and mysql-legacy database plugins.
                properties:
                  connectionURL:
                    description: 'connectionURL is the connection string (`connection_url`).
                      Use the `{{username}}` and `{{password}}` templates instead
                      of literal credentials so the root password can be rotated.
                      Example: `postgresql://{{username}}:{{password}}@pg.db.svc:5432/billing`.'
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'connectionURL must not contain a literal password:
                        use the {{password}} template and passwordSecretRef'
                      rule: '!self.matches(''^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#@:]*:[^/?#@]*@'')
                        || self.matches(''^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#@:]*:[{][{]password[}][}]@'')'
                  maxConnectionLifetime:
                    description: 'maxConnectionLifetime is the maximum time a connection
                      may be reused (`max_connection_lifetime`), a duration. 0 means
                      no limit. Example: `30s`.'
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  maxIdleConnections:
                    description: maxIdleConnections is the maximum number of idle
                      connections to the database (`max_idle_connections`). 0 means
                      maxOpenConnections. Defaults to 0.
                    format: int32
                    minimum: 0
                    type: integer
                  maxOpenConnections:
                    description: maxOpenConnections is the maximum number of open
                      connections to the database (`max_open_connections`). Defaults
                      to 4.
                    format: int32
                    minimum: 0
                    type: integer
                  tlsCA:
                    description: 'tlsCA is the PEM-encoded CA certificate that verifies
                      the MySQL server (`tls_ca`). Example: `-----BEGIN CERTIFICATE-----...`.'
                    maxLength: 65536
                    type: string
                  tlsCertificateKeySecretRef:
                    description: 'tlsCertificateKeySecretRef selects the Secret key
                      holding the PEM-encoded client certificate and private key (`tls_certificate_key`).
                      Read from a Secret key; never stored in status. Write-only.
                      Example: `{name: mysql-client, key: tls.pem}`.'
                    properties:
                      key:
                        description: 'Key in the Secret''s data whose value is used.
                          Example: password'
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: 'Name of the Kubernetes Secret, in the same namespace
                          as this resource. Example: openbao-credentials'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  tlsServerName:
                    description: 'tlsServerName overrides the server name used to
                      verify the MySQL server certificate (`tls_server_name`). Example:
                      `mysql.db.svc`.'
                    maxLength: 253
                    type: string
                  tlsSkipVerify:
                    description: tlsSkipVerify disables verification of the MySQL
                      server certificate (`tls_skip_verify`). Defaults to false.
                    type: boolean
                  username:
                    description: 'username is the root user substituted for `{{username}}`
                      (`username`). Example: `openbao`.'
                    maxLength: 256
                    type: string
                  usernameTemplate:
                    description: 'usernameTemplate is the template for the names of
                      generated users (`username_template`). Empty uses the plugin
                      default. Example: `{{.RoleName}}-{{random 8}}`.'
                    maxLength: 1024
                    type: string
                required:
                - connectionURL
                type: object
              name:
                description: 'name is the connection name in OpenBao. Defaults to
                  metadata.name. Immutable. Example: `billing-postgres`.'
                maxLength: 128
                minLength: 1
                pattern: ^\w([\w.-]*\w)?$
                type: string
              openbaoNamespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              passwordPolicy:
                description: 'passwordPolicy is the OpenBao password policy that generates
                  passwords for this connection (`password_policy`). Empty uses the
                  plugin default. Example: `postgres`.'
                maxLength: 128
                type: string
              passwordSecretRef:
                description: 'passwordSecretRef selects the Secret key holding the
                  root password (`password`). Read from a Secret key; never stored
                  in status. Write-only: OpenBao never returns it; a change of the
                  Secret is written again. Example: `{name: pg-root, key: password}`.'
                properties:
                  key:
                    description: 'Key in the Secret''s data whose value is used. Example:
                      password'
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: 'Name of the Kubernetes Secret, in the same namespace
                      as this resource. Example: openbao-credentials'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              pluginConfig:
                additionalProperties:
                  type: string
                description: 'pluginConfig holds further connection settings by their
                  OpenBao parameter name, for plugins without a section above. Values
                  are sent as strings and must not be secret; top-level fields and
                  secret material are rejected. Up to 64. Example: `{connection_url:
                  "snowflake://{{username}}:{{password}}@acct/db"}`.'
                maxProperties: 64
                type: object
              pluginName:
                description: 'pluginName is the database plugin (`plugin_name`): a
                  builtin plugin or one registered in the plugin catalog. Immutable.
                  Example: `postgresql-database-plugin`.'
                maxLength: 128
                minLength: 1
                type: string
              pluginVersion:
                description: 'pluginVersion pins a version of a catalog plugin (`plugin_version`),
                  in the canonical form OpenBao stores. Leave it empty for builtin
                  plugins. Example: `v1.2.0`.'
                maxLength: 64
                pattern: ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$
                type: string
              postgresql:
                description: postgresql holds the settings of postgresql-database-plugin.
                properties:
                  connectionURL:
                    description: 'connectionURL is the connection string (`connection_url`).
                      Use the `{{username}}` and `{{password}}` templates instead
                      of literal credentials so the root password can be rotated.
                      Example: `postgresql://{{username}}:{{password}}@pg.db.svc:5432/billing`.'
                    maxLength: 2048
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: 'connectionURL must not contain a literal password:
                        use the {{password}} template and passwordSecretRef'
                      rule: '!self.matches(''^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#@:]*:[^/?#@]*@'')
                        || self.matches(''^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#@:]*:[{][{]password[}][}]@'')'
                  disableEscaping:
                    description: disableEscaping turns off URL escaping of the username
                      and password in the connection URL (`disable_escaping`). Defaults
                      to false.
                    type: boolean
                  maxConnectionLifetime:
                    description: 'maxConnectionLifetime is the maximum time a connection
                      may be reused (`max_connection_lifetime`), a duration. 0 means
                      no limit. Example: `30s`.'
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  maxIdleConnections:
                    description: maxIdleConnections is the maximum number of idle
                      connections to the database (`max_idle_connections`). 0 means
                      maxOpenConnections. Defaults to 0.
                    format: int32
                    minimum: 0
                    type: integer
                  maxOpenConnections:
                    description: maxOpenConnections is the maximum number of open
                      connections to the database (`max_open_connections`). Defaults
                      to 4.
                    format: int32
                    minimum: 0
                    type: integer
                  passwordAuthentication:
                    description: 'passwordAuthentication is how passwords are sent
                      to the PostgreSQL server (`password_authentication`). Allowed:
                      password, scram-sha-256. Defaults to password.'
                    enum:
                    - password
                    - scram-sha-256
                    type: string
                  username:
                    description: 'username is the root user substituted for `{{username}}`
                      (`username`). Example: `openbao`.'
                    maxLength: 256
                    type: string
                  usernameTemplate:
                    description: 'usernameTemplate is the template for the names of
                      generated users (`username_template`). Empty uses the plugin
                      default. Example: `{{.RoleName}}-{{random 8}}`.'
                    maxLength: 1024
                    type: string
                required:
                - connectionURL
                type: object
              privateKeySecretRef:
                description: 'privateKeySecretRef selects the Secret key holding the
                  root private key, for plugins that authenticate with a key pair
                  (`private_key`). Read from a Secret key; never stored in status.
                  Write-only. Example: `{name: snowflake-root, key: rsa_key.p8}`.'
                properties:
                  key:
                    description: 'Key in the Secret''s data whose value is used. Example:
                      password'
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: 'Name of the Kubernetes Secret, in the same namespace
                      as this resource. Example: openbao-credentials'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              rootRotationStatements:
                description: 'rootRotationStatements are the database statements run
                  to rotate the root credentials (`root_rotation_statements`). Empty
                  uses the plugin default. Up to 64. Example: `["ALTER USER \"{{name}}\"
                  WITH PASSWORD ''{{password}}'';"]`.'
                items:
                  maxLength: 4096
                  type: string
                maxItems: 64
                type: array
              rotateRootOnCreate:
                description: 'rotateRootOnCreate rotates the root credentials once
                  (`<mountPath>/rotate-root/<name>`), right after the connection is
                  created, so only OpenBao knows them. The password or private key
                  in the Secret is then stale: it is sent only when the connection
                  is created again. Requires passwordSecretRef or privateKeySecretRef.
                  Defaults to false.'
                type: boolean
              valkey:
                description: valkey holds the settings of valkey-database-plugin and
                  redis-database-plugin.
                properties:
                  caCert:
                    description: 'caCert is the PEM-encoded CA certificate that verifies
                      the server (`ca_cert`). Example: `-----BEGIN CERTIFICATE-----...`.'
                    maxLength: 65536
                    type: string
                  connectionURL:
                    description: 'connectionURL is the server URL (`connection_url`);
                      it excludes host, port and username. Example: `valkeys://valkey.cache.svc:6379`.'
                    maxLength: 2048
                    type: string
                    x-kubernetes-validations:
                    - message: 'connectionURL must not contain a literal password:
                        use the {{password}} template and passwordSecretRef'
                      rule: '!self.matches(''^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#@:]*:[^/?#@]*@'')
                        || self.matches(''^([A-Za-z][A-Za-z0-9+.-]*://)?[^/?#@:]*:[{][{]password[}][}]@'')'
                  host:
                    description: 'host is the server host (`host`). Example: `valkey.cache.svc`.'
                    maxLength: 253
                    type: string
                  insecureTLS:
                    description: insecureTLS skips verification of the server certificate
                      (`insecure_tls`). Defaults to false.
                    type: boolean
                  port:
                    description: 'port is the server port (`port`). 1-65535. Example:
                      `6379`.'
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  tls:
                    description: tls enables TLS (`tls`); it requires caCert. Defaults
                      to false.
                    type: boolean
                  username:
                    description: 'username is the root user (`username`). Example:
