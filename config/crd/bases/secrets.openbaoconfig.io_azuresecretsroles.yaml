apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: azuresecretsroles.secrets.openbaoconfig.io
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
    - openbao
    kind: AzureSecretsRole
    listKind: AzureSecretsRoleList
    plural: azuresecretsroles
    singular: azuresecretsrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "AzureSecretsRole manages a role of an Azure secrets engine (external
          plugin) at `<mount>/roles/<name>`: the role assignments and groups of the
          service principals issued from `<mount>/creds/<name>`, or an existing application
          to add credentials to.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name:
          openbao\n\t  mountPath: azure\n\t  name: billing-reader\n\t  azureRoles:\n\t
          \   - roleName: Reader\n\t      scope: /subscriptions/11111111-2222-3333-4444-555555555555"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired role of an Azure secrets engine at `<mountPath>/roles/<name>`.
              Set azureRoles, azureGroups or applicationObjectID.
            properties:
              applicationObjectID:
                description: 'applicationObjectID is the object ID of an existing
                  application (`application_object_id`); credentials are then added
                  to it instead of creating dynamic service principals. Example: `aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee`.'
                maxLength: 64
                type: string
              azureGroups:
                description: 'azureGroups are the Microsoft Entra groups the dynamic
                  service principals join (`azure_groups`, written as JSON). Example:
                  `[{groupName: billing-readers}]`.'
                items:
                  description: A Microsoft Entra group the generated service principal
                    joins.
                  properties:
                    groupName:
                      description: 'groupName is the display name of the group (`group_name`).
                        Example: `billing-readers`.'
                      maxLength: 256
                      minLength: 1
                      type: string
                    objectID:
                      description: 'objectID is the object ID of the group (`object_id`);
                        OpenBao looks it up from groupName when empty. Example: `aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee`.'
                      maxLength: 64
                      type: string
                  required:
                  - groupName
                  type: object
                maxItems: 32
                type: array
              azureRoles:
                description: 'azureRoles are the Azure role assignments of the dynamic
                  service principals (`azure_roles`, written as JSON). Example: `[{roleName:
                  Reader, scope: /subscriptions/<id>}]`.'
                items:
                  description: An Azure role assigned at a scope to the generated
                    service principal. Set roleName or roleID.
                  properties:
                    roleID:
                      description: 'roleID is the full ID of the Azure role definition
                        (`role_id`), under `/subscriptions/<id>/providers/Microsoft.Authorization/roleDefinitions/`.
                        Example: `/subscriptions/<id>/providers/.../roleDefinitions/<guid>`.'
                      maxLength: 512
                      type: string
                    roleName:
                      description: 'roleName is the name of the Azure role (`role_name`).
                        Example: `Reader`.'
                      maxLength: 256
                      type: string
                    scope:
                      description: 'scope is the Azure scope of the assignment (`scope`).
                        Example: `/subscriptions/<id>/resourceGroups/billing`.'
                      maxLength: 1024
                      minLength: 1
                      type: string
                  required:
                  - scope
                  type: object
                  x-kubernetes-validations:
                  - message: set roleName or roleID
                    rule: has(self.roleName) || has(self.roleID)
                maxItems: 32
                type: array
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: OpenBaoConnection
                    description: 'Kind of the connection: OpenBaoConnection (in the
                      same Kubernetes namespace as this resource) or ClusterOpenBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: OpenBaoConnection.'
                    enum:
                    - OpenBaoConnection
                    - ClusterOpenBaoConnection
                    type: string
                  name:
                    description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  and key holders (mounts, namespaces, KV data, audit devices, endpoints,
                  transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed
                  only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              explicitMaxTTL:
                description: 'explicitMaxTTL is the hard limit on the lifetime of
                  generated credentials and dynamic service principals (`explicit_max_ttl`),
                  a duration; a lease is not renewed past it. Example: `720h`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              maxTTL:
                description: 'maxTTL is the maximum lease duration of generated credentials
                  (`max_ttl`), a duration. Defaults to the mount''s max lease TTL.
                  Example: `24h`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              mountPath:
                default: azure
                description: 'mountPath is the path of the Azure secrets engine mount.
                  Defaults to `azure`. Immutable. Example: `azure`.'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              name:
                description: 'name is the role name in OpenBao. Defaults to metadata.name.
                  Immutable. Example: `billing-reader`.'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_.-]+$
                type: string
              namespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              permanentlyDelete:
                description: permanentlyDelete deletes generated applications and
                  service principals permanently when their lease ends (`permanently_delete`),
                  instead of moving them to the Entra recycle bin. Defaults to false.
                type: boolean
              persistApp:
                description: persistApp keeps the generated application and service
                  principal for the lifetime of the role (`persist_app`). Defaults
                  to false.
                type: boolean
              signInAudience:
                description: 'signInAudience restricts which account types may sign
                  in to the generated application (`sign_in_audience`). Allowed: AzureADMyOrg,
                  AzureADMultipleOrgs, AzureADandPersonalMicrosoftAccount, PersonalMicrosoftAccount.'
                enum:
                - AzureADMyOrg
                - AzureADMultipleOrgs
                - AzureADandPersonalMicrosoftAccount
                - PersonalMicrosoftAccount
                type: string
              tags:
                description: 'tags are Azure tags attached to the generated application
                  (`tags`). Example: `[team:billing]`.'
                items:
                  maxLength: 512
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: set
              ttl:
                description: 'ttl is the default lease duration of generated credentials
                  (`ttl`), a duration. Defaults to the mount''s default lease TTL.
                  Example: `1h`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: name is immutable
              rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name
                == oldSelf.name)
            - message: set azureRoles, azureGroups or applicationObjectID
              rule: has(self.azureRoles) || has(self.azureGroups) || has(self.applicationObjectID)
            - message: namespace is immutable
              rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__)
                || self.__namespace__ == oldSelf.__namespace__)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: status is the observed state of the Azure secrets role.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              namespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
