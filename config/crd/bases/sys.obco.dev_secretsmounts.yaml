---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: secretsmounts.sys.obco.dev
spec:
  group: sys.obco.dev
  names:
    categories:
    - obco
    - obco-sys
    kind: SecretsMount
    listKind: SecretsMountList
    plural: secretsmounts
    shortNames:
    - baosm
    singular: secretsmount
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "SecretsMount enables and tunes an OpenBao secrets engine at
          sys/mounts/<path>, such as a KV, PKI, transit or database engine. Create
          it before the secrets kinds that configure the engine. status.id holds the
          mount accessor. The default deletionPolicy Orphan keeps the mount; Delete
          disables it and destroys all its data.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t
          \   name: openbao\n\t  type: kv-v2\n\t  path: secret\n\t  description: Team
          A application secrets\n\t  maxLeaseTTL: 24h"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Desired state of the secrets engine mount.
            properties:
              allowedResponseHeaders:
                description: 'HTTP response headers the plugin backend is allowed
                  to set. Maps to `allowed_response_headers`; order does not matter.
                  Example: ["Location"]'
                items:
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              auditNonHMACRequestKeys:
                description: 'Request keys that audit devices log in plain text instead
                  of HMAC-hashed. Maps to `audit_non_hmac_request_keys`; order does
                  not matter. Example: ["role"]'
                items:
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              auditNonHMACResponseKeys:
                description: 'Response keys that audit devices log in plain text instead
                  of HMAC-hashed. Maps to `audit_non_hmac_response_keys`; order does
                  not matter. Example: ["lease_duration"]'
                items:
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: BaoConnection
                    description: 'Kind of the connection: BaoConnection (in the same
                      Kubernetes namespace as this resource) or ClusterBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: BaoConnection.'
                    enum:
                    - BaoConnection
                    - ClusterBaoConnection
                    type: string
                  name:
                    description: 'Name of the BaoConnection or ClusterBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              defaultLeaseTTL:
                description: 'Default lifetime of leases and tokens issued through
                  this mount, as a duration; 0s uses the system default. Maps to `default_lease_ttl`.
                  Must not exceed maxLeaseTTL. Example: 1h'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  and key holders (mounts, namespaces, KV data, audit devices, endpoints,
                  transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed
                  only while the resource carries the annotation obco.dev/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: 'Human-readable description shown in the mount table.
                  Maps to `description`. Example: Team A secrets'
                maxLength: 1024
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              externalEntropyAccess:
                description: 'Gives the mount access to the server''s external entropy
                  source. Maps to `external_entropy_access`. Default: false. Immutable:
                  it cannot be added, changed or removed after creation.'
                type: boolean
              forceNoCache:
                description: 'Disables caching of the mount''s storage reads. Maps
                  to `force_no_cache`. Default: false. Immutable: it cannot be added,
                  changed or removed after creation.'
                type: boolean
              listingVisibility:
                description: 'Whether the mount appears in the unauthenticated mount
                  listing of the UI. Maps to `listing_visibility`. Allowed values:
                  unauth (listed), hidden (not listed). Default: unset, which is not
                  listed.'
                enum:
                - unauth
                - hidden
                type: string
              local:
                description: 'Marks the mount as local to this server cluster. Maps
                  to `local`. Default: false. Immutable: it cannot be added, changed
                  or removed after creation.'
                type: boolean
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              maxLeaseTTL:
                description: 'Maximum lifetime of leases and tokens issued through
                  this mount, as a duration; 0s uses the system maximum. Maps to `max_lease_ttl`.
                  Example: 24h'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              openbaoNamespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              options:
                additionalProperties:
                  description: 'Value of one plugin-specific mount option, as a string.
                    Example: "2"'
                  maxLength: 1024
                  type: string
                description: 'Plugin-specific mount options as string key/value pairs,
                  sent when the mount is enabled. Maps to `options`. Example: {"version":
                  "2"} for a KV version 2 engine.'
                maxProperties: 32
                type: object
              passthroughRequestHeaders:
                description: 'HTTP request headers passed through to the plugin backend.
                  Maps to `passthrough_request_headers`; order does not matter. Example:
                  ["X-Request-Id"]'
                items:
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              path:
                description: 'Path the secrets engine is enabled at, without slashes
                  at either end. Default: metadata.name. Immutable: it cannot be added,
                  changed or removed after creation. Example: secret'
                maxLength: 256
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              pluginRef:
                description: 'Plugin in this namespace that registers the external
                  plugin this mount runs. The mount waits until the Plugin is Ready,
                  takes its version when pluginVersion is unset, and requires type
                  to be the Plugin''s catalog name. Immutable. Example: {name: openbao-plugin-auth-ldap}'
                properties:
                  name:
                    description: 'Name of the referenced object, in the same namespace
                      as this resource. Example: my-app'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              pluginVersion:
                description: 'Plugin version the mount runs, for a registered versioned
                  plugin; empty uses the built-in or unversioned plugin. Maps to `plugin_version`.
                  Example: v0.20.0'
                maxLength: 128
                type: string
              sealWrap:
                description: 'Enables seal wrapping of the mount''s storage. Maps
                  to `seal_wrap`. Default: false. Immutable: it cannot be added, changed
                  or removed after creation.'
                type: boolean
              type:
                description: 'Secrets engine type: a built-in engine such as kv, kv-v2,
                  pki, transit or database, or the name of a registered plugin. Maps
                  to `type`; kv-v1 and kv-v2 are written as type kv with options version
                  1 or 2, so do not also set options.version. Immutable; a KV version
                  2 mount cannot go back to version 1. Example: kv-v2'
                maxLength: 128
                minLength: 1
                type: string
            required:
            - connectionRef
            - type
            type: object
            x-kubernetes-validations:
            - message: path is immutable
              rule: has(self.path) == has(oldSelf.path) && (!has(self.path) || self.path
                == oldSelf.path)
            - message: type is immutable
              rule: self.type == oldSelf.type
            - message: a KV version 2 mount cannot be downgraded to version 1
              rule: '!has(oldSelf.options) || !(''version'' in oldSelf.options) ||
                oldSelf.options[''version''] != ''2'' || (has(self.options) && ''version''
                in self.options && self.options[''version''] == ''2'')'
            - message: set the KV version through type kv-v1/kv-v2 or options.version,
                not both
              rule: '!(self.type in [''kv-v1'', ''kv-v2'']) || !has(self.options)
                || !(''version'' in self.options)'
            - message: local is immutable
              rule: has(self.local) == has(oldSelf.local) && (!has(self.local) ||
                self.local == oldSelf.local)
            - message: sealWrap is immutable
              rule: has(self.sealWrap) == has(oldSelf.sealWrap) && (!has(self.sealWrap)
                || self.sealWrap == oldSelf.sealWrap)
            - message: externalEntropyAccess is immutable
              rule: has(self.externalEntropyAccess) == has(oldSelf.externalEntropyAccess)
                && (!has(self.externalEntropyAccess) || self.externalEntropyAccess
                == oldSelf.externalEntropyAccess)
            - message: forceNoCache is immutable
              rule: has(self.forceNoCache) == has(oldSelf.forceNoCache) && (!has(self.forceNoCache)
                || self.forceNoCache == oldSelf.forceNoCache)
            - message: pluginRef is immutable
              rule: has(self.pluginRef) == has(oldSelf.pluginRef) && (!has(self.pluginRef)
                || self.pluginRef == oldSelf.pluginRef)
            - message: defaultLeaseTTL must not exceed maxLeaseTTL
              rule: '!has(self.defaultLeaseTTL) || !has(self.maxLeaseTTL) || duration(self.maxLeaseTTL)
                == duration(''0s'') || duration(self.defaultLeaseTTL) <= duration(self.maxLeaseTTL)'
            - message: openbaoNamespace is immutable
              rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) &&
                (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: Observed state reported by the operator; id holds the mount
              accessor.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              openbaoNamespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
