---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: gcpauthconfigs.auth.openbaoconfig.io
spec:
  group: auth.openbaoconfig.io
  names:
    categories:
    - openbao
    kind: GCPAuthConfig
    listKind: GCPAuthConfigList
    plural: gcpauthconfigs
    singular: gcpauthconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "GCPAuthConfig manages the configuration of an OpenBao GCP auth
          method at auth/<mountPath>/config. Use it to set the Google credentials
          and alias/metadata settings that GCP iam and gce logins use. Needs the gcp
          auth plugin registered and enabled at auth/<mountPath>; there is one config
          per mount and it is never deleted.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t
          \   name: openbao\n\t  mountPath: gcp\n\t  credentialsSecretRef:\n\t    name:
          gcp-auth-sa\n\t    key: credentials.json\n\t  iamAlias: unique_id"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Desired state of the GCP auth method configuration, written
              to auth/<mountPath>/config. deletionPolicy must be Orphan because the
              config has no delete operation.
            properties:
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: OpenBaoConnection
                    description: 'Kind of the connection: OpenBaoConnection (in the
                      same Kubernetes namespace as this resource) or ClusterOpenBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: OpenBaoConnection.'
                    enum:
                    - OpenBaoConnection
                    - ClusterOpenBaoConnection
                    type: string
                  name:
                    description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              credentialsSecretRef:
                description: 'Secret key holding the JSON key file of the Google service
                  account OpenBao uses to verify logins. Read from this Secret key;
                  the value is never stored in status, is write-only in OpenBao and
                  is tracked by a hash, so a change of the Secret is written again.
                  Unset makes OpenBao use the application default credentials of its
                  environment. Maps to `credentials`. Example: {name: gcp-auth-sa,
                  key: credentials.json}'
                properties:
                  key:
                    description: 'Key in the Secret''s data whose value is used. Example:
                      password'
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: 'Name of the Kubernetes Secret, in the same namespace
                      as this resource. Example: openbao-credentials'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              customEndpoint:
                description: 'Overrides for the Google API endpoints OpenBao calls,
                  for example for Private Google Access. Unset uses the public endpoints.
                  Maps to `custom_endpoint`. Example: {api: "https://www.googleapis.com",
                  iam: "https://iam.googleapis.com"}'
                properties:
                  api:
                    description: 'Replacement for the Google API endpoint https://www.googleapis.com.
                      Maps to `custom_endpoint.api`. Example: https://private.googleapis.com'
                    maxLength: 2048
                    type: string
                  compute:
                    description: 'Replacement for the Compute Engine endpoint https://compute.googleapis.com.
                      Maps to `custom_endpoint.compute`. Example: https://compute-private.example.com:443'
                    maxLength: 2048
                    type: string
                  crm:
                    description: 'Replacement for the Cloud Resource Manager endpoint
                      https://cloudresourcemanager.googleapis.com. Maps to `custom_endpoint.crm`.
                      Example: https://crm-private.example.com:443'
                    maxLength: 2048
                    type: string
                  iam:
                    description: 'Replacement for the IAM endpoint https://iam.googleapis.com.
                      Maps to `custom_endpoint.iam`. Example: https://iam-private.example.com:443'
                    maxLength: 2048
                    type: string
                type: object
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  holders such as mounts, namespaces and KV data are removed only
                  while the resource carries the annotation openbaoconfig.io/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              gceAlias:
                description: 'Value used as the entity alias name of gce logins: role_id
                  (the role''s unique ID) or instance_id (the instance''s unique ID).
                  OpenBao defaults to role_id. Maps to `gce_alias`. Example: instance_id'
                enum:
                - role_id
                - instance_id
                type: string
              gceMetadata:
                description: 'Instance metadata fields added to tokens and audit logs
                  from gce logins, listed explicitly (the value default is rejected
                  because OpenBao reads it back expanded). Unset keeps the server''s
                  value, which starts as the plugin''s default set. Maps to `gce_metadata`.
                  Example: [instance_name, project_id, zone]'
                items:
                  maxLength: 512
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: list the metadata fields explicitly instead of default,
                    which OpenBao reads back as the expanded list
                  rule: '!self.exists(m, m == ''default'')'
              iamAlias:
                description: 'Value used as the entity alias name of iam logins: role_id
                  (the role''s unique ID) or unique_id (the service account''s unique
                  ID). OpenBao defaults to role_id. Maps to `iam_alias`. Example:
                  unique_id'
                enum:
                - role_id
                - unique_id
                type: string
              iamMetadata:
                description: 'Metadata fields added to tokens and audit logs from
                  iam logins, listed explicitly (the value default is rejected because
                  OpenBao reads it back expanded). Unset keeps the server''s value,
                  which starts as the plugin''s default set. Maps to `iam_metadata`.
                  Example: [project_id, role, service_account_email]'
                items:
                  maxLength: 512
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: list the metadata fields explicitly instead of default,
                    which OpenBao reads back as the expanded list
                  rule: '!self.exists(m, m == ''default'')'
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              mountPath:
                default: gcp
                description: 'Path of the GCP auth method, without the auth/ prefix.
                  Defaults to gcp. Immutable. Example: gcp/prod'
                maxLength: 128
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              namespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: 'deletionPolicy must be Orphan: an auth method config has no
                delete operation'
              rule: '!has(self.deletionPolicy) || self.deletionPolicy == ''Orphan'''
            - message: namespace is immutable
              rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__)
                || self.__namespace__ == oldSelf.__namespace__)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: Observed state of the GCP auth method configuration, written
              by the operator.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              namespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
