---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cfauthroles.auth.obco.dev
spec:
  group: auth.obco.dev
  names:
    categories:
    - obco
    - obco-auth
    kind: CFAuthRole
    listKind: CFAuthRoleList
    plural: cfauthroles
    singular: cfauthrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "CFAuthRole manages a role of an OpenBao Cloud Foundry auth method
          at auth/<mountPath>/roles/<name>. Use it to let Cloud Foundry application
          instances log in with their instance identity certificate and receive tokens
          with the listed policies. Needs the cf auth plugin registered and enabled
          at auth/<mountPath>.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name:
          openbao\n\t  boundSpaceIDs: [3d2eba6b-ef19-44d5-91dd-1975b0db5cc9]\n\t  boundApplicationIDs:
          [2c6dbe0c-7d9d-4c2c-a3b5-0e7b0c4c4d1e]\n\t  tokenPolicies: [app-read]\n\t
          \ tokenTTL: 1h"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Desired state of a Cloud Foundry auth role, written to auth/<mountPath>/roles/<name>.
              Every bound list that is set must match the login; unset lists do not
              restrict.
            properties:
              boundApplicationIDs:
                description: 'Cloud Foundry application GUIDs allowed to log in. Unset
                  allows any application. Maps to `bound_application_ids`. Example:
                  [2c6dbe0c-7d9d-4c2c-a3b5-0e7b0c4c4d1e]'
                items:
                  maxLength: 512
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              boundInstanceIDs:
                description: 'Application instance GUIDs allowed to log in. Unset
                  allows any instance. Maps to `bound_instance_ids`. Example: [8a3c9f2e-1b4d-4e5f-9a6b-7c8d9e0f1a2b]'
                items:
                  maxLength: 512
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              boundOrganizationIDs:
                description: 'Cloud Foundry organization GUIDs whose applications
                  may log in. Unset allows any organization. Maps to `bound_organization_ids`.
                  Example: [34a878d0-c2f9-4521-ba73-a9f664e82c7b]'
                items:
                  maxLength: 512
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              boundSpaceIDs:
                description: 'Cloud Foundry space GUIDs whose applications may log
                  in. Unset allows any space. Maps to `bound_space_ids`. Example:
                  [3d2eba6b-ef19-44d5-91dd-1975b0db5cc9]'
                items:
                  maxLength: 512
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: BaoConnection
                    description: 'Kind of the connection: BaoConnection (in the same
                      Kubernetes namespace as this resource) or ClusterBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: BaoConnection.'
                    enum:
                    - BaoConnection
                    - ClusterBaoConnection
                    type: string
                  name:
                    description: 'Name of the BaoConnection or ClusterBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  and key holders (mounts, namespaces, KV data, audit devices, endpoints,
                  transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed
                  only while the resource carries the annotation obco.dev/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              disableIPMatching:
                description: 'When true, OpenBao skips the check that the login comes
                  from the IP address in the instance identity certificate; use it
                  when logins pass through a proxy. Defaults to false. Maps to `disable_ip_matching`.
                  Example: true'
                type: boolean
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              mountPath:
                default: cf
                description: 'Path of the Cloud Foundry auth method, without the auth/
                  prefix. Defaults to cf. Immutable. Example: cf/prod'
                maxLength: 128
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              name:
                description: 'Name of the role in OpenBao, used in the login request.
                  Defaults to metadata.name. Immutable. Example: payments-app'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_]([A-Za-z0-9_.-]*[A-Za-z0-9_])?$
                type: string
              openbaoNamespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              policyRefs:
                description: 'ACLPolicy resources in this Kubernetes namespace whose
                  OpenBao policy names are added to tokenPolicies. The role waits
                  until each ACLPolicy is Ready; each ACLPolicy must use the same
                  connectionRef and namespace as the role. Example: [{name: app-read}]'
                items:
                  description: Reference by name to an object in the same Kubernetes
                    namespace as this resource.
                  properties:
                    name:
                      description: 'Name of the referenced object, in the same namespace
                        as this resource. Example: my-app'
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              tokenBoundCIDRs:
                description: 'Client CIDR blocks or IP addresses allowed to use issued
                  tokens. Unset allows any address. Maps to `token_bound_cidrs`. Example:
                  [10.0.0.0/8, 192.168.1.10]'
                items:
                  maxLength: 64
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: tokenBoundCIDRs entries must be CIDR blocks or IP addresses
                  rule: self.all(c, isCIDR(c) || isIP(c))
              tokenExplicitMaxTTL:
                description: 'Hard cap on the lifetime of issued tokens that renewals
                  cannot extend, as a duration. Unset or 0 means no explicit cap.
                  Maps to `token_explicit_max_ttl`. Example: 24h'
                type: string
              tokenMaxTTL:
                description: 'Maximum lifetime of issued tokens including renewals,
                  as a duration. Unset or 0 uses the mount or system max TTL. Maps
                  to `token_max_ttl`. Example: 8h'
                type: string
              tokenNoDefaultPolicy:
                description: 'When true, the default policy is not attached to issued
                  tokens; only the listed policies apply. Defaults to false. Maps
                  to `token_no_default_policy`. Example: true'
                type: boolean
              tokenNumUses:
                description: 'Maximum number of requests an issued token may make;
                  0 or unset means unlimited. Maps to `token_num_uses`. Example: 10'
                format: int32
                minimum: 0
                type: integer
              tokenPeriod:
                description: 'Makes issued tokens periodic: they never expire as long
                  as they are renewed within this duration, and each renewal resets
                  the TTL to it. Unset or 0 means not periodic. Maps to `token_period`.
                  Example: 1h'
                type: string
              tokenPolicies:
                description: 'OpenBao policy names attached to issued tokens, in addition
                  to the default policy and the policies from policyRefs. Maps to
                  `token_policies`. Example: [app-read, app-write]'
                items:
                  maxLength: 128
                  minLength: 1
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              tokenStrictlyBindIP:
                description: 'When true, issued tokens can only be used from the IP
                  address of the client that logged in. Built-in auth methods only:
                  an external plugin built on an older OpenBao SDK ignores it and
                  never returns it. Defaults to false. Maps to `token_strictly_bind_ip`.
                  Example: true'
                type: boolean
              tokenTTL:
                description: 'Initial lifetime of issued tokens, as a duration. Unset
                  or 0 uses the mount or system default TTL; must not exceed tokenMaxTTL.
                  Maps to `token_ttl`. Example: 1h'
                type: string
              tokenType:
                description: 'Type of token to issue. One of default (the mount''s
                  default, normally service), service (renewable, can create child
                  tokens) or batch (lightweight, not renewable). Maps to `token_type`.
                  Example: service'
                enum:
                - default
                - service
                - batch
                type: string
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: name is immutable
              rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name
                == oldSelf.name)
            - message: tokenTTL must not exceed tokenMaxTTL
              rule: '!has(self.tokenTTL) || !has(self.tokenMaxTTL) || duration(self.tokenTTL)
                <= duration(self.tokenMaxTTL)'
            - message: openbaoNamespace is immutable
              rule: has(self.openbaoNamespace) == has(oldSelf.openbaoNamespace) &&
                (!has(self.openbaoNamespace) || self.openbaoNamespace == oldSelf.openbaoNamespace)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: Observed state of the role, written by the operator.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              openbaoNamespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
