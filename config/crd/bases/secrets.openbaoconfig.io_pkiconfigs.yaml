---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pkiconfigs.secrets.openbaoconfig.io
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
    - openbao
    kind: PKIConfig
    listKind: PKIConfigList
    plural: pkiconfigs
    singular: pkiconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "PKIConfig sets the mount-wide configuration of a PKI secrets
          engine: AIA URLs (`config/urls`), CRL (`config/crl`), cluster address (`config/cluster`)
          and default issuer (`config/issuers`). Use one per mount; it is never deleted.\n\nExample:\n\n\tspec:\n\t
          \ connectionRef:\n\t    name: openbao\n\t  mountPath: pki-int\n\t  urls:\n\t
          \   issuingCertificates: [https://openbao.example.com/v1/pki-int/ca]\n\t
          \   crlDistributionPoints: [https://openbao.example.com/v1/pki-int/crl]\n\t
          \ issuers:\n\t    default: {issuerName: int-2026}"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'spec is the desired mount-wide configuration of a PKI secrets
              engine: AIA URLs, CRL, cluster address and the default issuer. Every
              field of urls and crl is managed: an unset field or section is returned
              to its OpenBao default. The cluster fields and issuers are managed only
              when set, because OpenBao cannot clear a cluster path and the default
              issuer has no default to return to. Set at least one section. deletionPolicy
              must be Orphan.'
            properties:
              cluster:
                description: cluster is the cluster-local address configuration (`<mountPath>/config/cluster`).
                properties:
                  aiaPath:
                    description: 'aiaPath is the URL of this mount used in AIA fields
                      (`aia_path`); it may be a non-TLS URL. Example: `http://pki.example.com/v1/pki-int`.'
                    maxLength: 1024
                    pattern: ^[A-Za-z][A-Za-z0-9+.-]*://[^/]+.*$
                    type: string
                  path:
                    description: 'path is the URL of this mount on this cluster (`path`).
                      Example: `https://openbao.example.com/v1/pki-int`.'
                    maxLength: 1024
                    pattern: ^[A-Za-z][A-Za-z0-9+.-]*://[^/]+.*$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set path or aiaPath
                  rule: has(self.path) || has(self.aiaPath)
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: OpenBaoConnection
                    description: 'Kind of the connection: OpenBaoConnection (in the
                      same Kubernetes namespace as this resource) or ClusterOpenBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: OpenBaoConnection.'
                    enum:
                    - OpenBaoConnection
                    - ClusterOpenBaoConnection
                    type: string
                  name:
                    description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              crl:
                description: crl is the revocation configuration (`<mountPath>/config/crl`).
                properties:
                  allowExpiredCertRevocation:
                    description: allowExpiredCertRevocation allows revoking certificates
                      that have already expired (`allow_expired_cert_revocation`).
                      Defaults to false.
                    type: boolean
                  autoRebuild:
                    description: autoRebuild rebuilds the CRL before it expires instead
                      of on every revocation (`auto_rebuild`). Defaults to false.
                    type: boolean
                  autoRebuildGracePeriod:
                    description: autoRebuildGracePeriod is how long before expiry
                      an automatic rebuild runs (`auto_rebuild_grace_period`), a duration
                      shorter than expiry. Defaults to `12h`.
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  deltaRebuildInterval:
                    description: deltaRebuildInterval is how often delta CRLs are
                      rebuilt (`delta_rebuild_interval`), a duration shorter than
                      expiry. Defaults to `15m`.
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  disable:
                    description: disable turns off CRL building (`disable`). Defaults
                      to false.
                    type: boolean
                  enableDelta:
                    description: enableDelta builds delta CRLs between full rebuilds
                      (`enable_delta`); requires autoRebuild. Defaults to false.
                    type: boolean
                  expiry:
                    description: 'expiry is the validity of a generated CRL (`expiry`),
                      a duration. Defaults to `72h`. Example: `48h`.'
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                  ocspDisable:
                    description: ocspDisable turns off the OCSP responder (`ocsp_disable`).
                      Defaults to false.
                    type: boolean
                  ocspExpiry:
                    description: ocspExpiry is the validity of OCSP responses (`ocsp_expiry`),
                      a duration; `0s` means no expiry. Defaults to `12h`.
                    pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                    type: string
                type: object
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  holders such as mounts, namespaces and KV data are removed only
                  while the resource carries the annotation openbaoconfig.io/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              issuers:
                description: issuers selects the default issuer (`<mountPath>/config/issuers`).
                properties:
                  default:
                    description: 'default selects the issuer used by requests that
                      do not name one (`default`). Example: `{issuerName: int-2026}`.'
                    properties:
                      issuerName:
                        description: 'issuerName is the name or ID of the issuer in
                          OpenBao. Example: `int-2026`.'
                        maxLength: 128
                        minLength: 1
                        type: string
                      issuerRef:
                        description: 'issuerRef names a PKIIssuer in the same namespace
                          and PKI mount; it must be Ready. Example: `{name: int-2026}`.'
                        properties:
                          name:
                            description: 'Name of the referenced object, in the same
                              namespace as this resource. Example: my-app'
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: set exactly one of issuerName and issuerRef
                      rule: has(self.issuerName) != has(self.issuerRef)
                  defaultFollowsLatestIssuer:
                    description: defaultFollowsLatestIssuer moves the default to every
                      newly generated or imported issuer (`default_follows_latest_issuer`).
                      Defaults to false.
                    type: boolean
                required:
                - default
                type: object
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              mountPath:
                default: pki
                description: 'mountPath is the path of the PKI secrets engine mount.
                  Defaults to `pki`. Immutable. Example: `pki-int`.'
                maxLength: 128
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              namespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              urls:
                description: urls is the mount-wide AIA configuration (`<mountPath>/config/urls`).
                properties:
                  crlDistributionPoints:
                    description: 'crlDistributionPoints are the URLs where the CRL
                      can be fetched (`crl_distribution_points`). Up to 16. Example:
                      `[https://openbao.example.com/v1/pki-int/crl]`.'
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  deltaCRLDistributionPoints:
                    description: deltaCRLDistributionPoints are the URLs where the
                      delta CRL can be fetched (`delta_crl_distribution_points`).
                      Up to 16.
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  enableTemplating:
                    description: enableTemplating allows `{{cluster_path}}`, `{{cluster_aia_path}}`
                      and `{{issuer_id}}` in the URLs (`enable_templating`); the cluster
                      section must then be set. Defaults to false.
                    type: boolean
                  issuingCertificates:
                    description: 'issuingCertificates are the URLs where the issuing
                      CA certificate can be fetched (`issuing_certificates`). Up to
                      16. Example: `[https://openbao.example.com/v1/pki-int/ca]`.'
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  ocspServers:
                    description: 'ocspServers are the URLs of the OCSP responders
                      (`ocsp_servers`). Up to 16. Example: `[https://openbao.example.com/v1/pki-int/ocsp]`.'
                    items:
                      maxLength: 1024
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: set at least one of urls, crl, cluster and issuers
              rule: has(self.urls) || has(self.crl) || has(self.cluster) || has(self.issuers)
            - message: the PKI mount configuration cannot be deleted; deletionPolicy
                must be Orphan
              rule: '!has(self.deletionPolicy) || self.deletionPolicy == ''Orphan'''
            - message: namespace is immutable
              rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__)
                || self.__namespace__ == oldSelf.__namespace__)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: status is the observed state of the PKI mount configuration.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              namespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
