    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "AccessLevel is a named, reusable set of ACL capabilities on
          KV version 2 secret data and metadata, such as reader, writer or owner.
          It writes nothing to OpenBao by itself: AccessGrant rules and AccessLayout
          roles in the same Kubernetes namespace cite it by name and render it into
          their policies. The openbaoconfig.io/in-use finalizer keeps it while anything
          cites it.\n\nExample:\n\n\tspec:\n\t  data: [read, list]\n\t  metadata:
          [read, list]\n\t  versions: false"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'Desired state: the capabilities this level grants wherever
              it is cited.'
            properties:
              data:
                description: 'ACL capabilities granted on secret data, the policy
                  path <mount>/data/<path>. Allowed: create, read, update, patch,
                  delete, list. Example: [read, list]'
                items:
                  description: 'An OpenBao ACL policy capability: create, read, update,
                    patch, delete or list.'
                  enum:
                  - create
                  - read
                  - update
                  - patch
                  - delete
                  - list
                  type: string
                maxItems: 6
                type: array
                x-kubernetes-list-type: set
              metadata:
                description: 'ACL capabilities granted on secret metadata, the policy
                  path <mount>/metadata/<metadataPath> (listing keys and reading versions
                  need list and read here). Allowed: create, read, update, patch,
                  delete, list. Example: [list]'
                items:
                  description: 'An OpenBao ACL policy capability: create, read, update,
                    patch, delete or list.'
                  enum:
                  - create
                  - read
                  - update
                  - patch
                  - delete
                  - list
                  type: string
                maxItems: 6
                type: array
                x-kubernetes-list-type: set
              versions:
                description: 'When true, also grants update on <mount>/delete/<path>,
                  <mount>/undelete/<path> and <mount>/destroy/<path>, which soft-delete,
                  restore and permanently destroy individual secret versions. Default:
                  false. At least one of data, metadata and versions must be set.
                  Example: true'
                type: boolean
            type: object
            x-kubernetes-validations:
            - message: set at least one of data, metadata and versions
              rule: (has(self.data) && size(self.data) > 0) || (has(self.metadata)
                && size(self.metadata) > 0) || (has(self.versions) && self.versions)
          status:
            description: 'Observed state reported by the operator: conditions and
              the resources that cite this level.'
            properties:
              acquired:
