---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusteropenbaoconnections.core.openbaoconfig.io
spec:
  group: core.openbaoconfig.io
  names:
    categories:
    - openbao
    kind: ClusterOpenBaoConnection
    listKind: ClusterOpenBaoConnectionList
    plural: clusteropenbaoconnections
    singular: clusteropenbaoconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.serverRef.name
      name: Server
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "ClusterOpenBaoConnection is a cluster-scoped login to an OpenBaoServer
          owned by the platform team, usable by resources in every namespace its allowedNamespaces
          selects (spec.connectionRef.kind: ClusterOpenBaoConnection). Unlike OpenBaoConnection
          it may log in as the operator itself (injected identity or a token file).
          It writes nothing to OpenBao: the operator logs in once, caches and renews
          the token, and reports Ready when login and auth/token/lookup-self succeed.\n\nExample:\n\n\tspec:\n\t
          \ serverRef:\n\t    name: openbao\n\t  auth:\n\t    kubernetes:\n\t      role:
          openbao-config-operator\n\t      injectedIdentity:\n\t        tokenPath:
          /var/run/secrets/openbao/token\n\t  allowedNamespaces:\n\t    matchLabels:\n\t
          \     openbao.io/platform: \"true\""
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'Desired state of the connection: which server, which OpenBao
              namespace, how to log in and which Kubernetes namespaces may use it.'
            properties:
              allowedNamespaces:
                description: 'Label selector over Kubernetes namespaces whose resources
                  may reference this connection; a resource in any other namespace
                  gets reason ConnectionDenied. Unset allows no namespace; an empty
                  selector ({}) allows every namespace. Example: {matchLabels: {openbao.io/platform:
                  "true"}}'
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              auth:
                description: 'How the operator logs in to OpenBao for this connection:
                  set exactly one of token, kubernetes, appRole and jwt. Every reference
                  names its Kubernetes namespace.'
                properties:
                  appRole:
                    description: Log in to an OpenBao approle auth mount (auth/<mountPath>/login)
                      with a role ID and secret ID read from Secrets.
                    properties:
                      mountPath:
                        default: approle
                        description: 'Path of the approle auth mount, without the
                          auth/ prefix. Default: approle. Example: approle'
                        maxLength: 128
                        pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                        type: string
                      roleIDSecretRef:
                        description: Secret key that holds the AppRole role ID (the
                          login `role_id` parameter). Read at each login; never stored
                          in status.
                        properties:
                          key:
                            description: 'Key in the Secret''s data whose value is
                              used. Example: secret-id'
                            minLength: 1
                            type: string
                          name:
                            description: 'Name of the Secret. Example: openbao-operator-approle'
                            minLength: 1
                            type: string
                          namespace:
                            description: 'Kubernetes namespace of the Secret. Example:
                              openbao-operator'
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                      secretIDSecretRef:
                        description: Secret key that holds the AppRole secret ID (the
                          login `secret_id` parameter). Read at each login, so rotation
                          needs no restart; never stored in status.
                        properties:
                          key:
                            description: 'Key in the Secret''s data whose value is
                              used. Example: secret-id'
                            minLength: 1
                            type: string
                          name:
                            description: 'Name of the Secret. Example: openbao-operator-approle'
                            minLength: 1
                            type: string
                          namespace:
                            description: 'Kubernetes namespace of the Secret. Example:
                              openbao-operator'
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    required:
                    - roleIDSecretRef
                    - secretIDSecretRef
                    type: object
                  jwt:
                    description: 'Log in to an OpenBao jwt auth mount (auth/<mountPath>/login)
                      with a ServiceAccount token: a named ServiceAccount''s short-lived
                      token, or the operator''s own injected token.'
                    properties:
                      audiences:
                        description: 'Audiences of the token requested for serviceAccountRef,
                          required with it and only allowed with it; they must match
                          the jwt role''s bound_audiences. An audience the Kubernetes
                          API server accepts is refused. At most 16 entries. Example:
                          ["openbao"]'
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 16
                        type: array
                      injectedIdentity:
                        description: Present the operator's own ServiceAccount token
                          from a file in its pod. When neither serviceAccountRef nor
                          injectedIdentity is set, injectedIdentity with the default
                          tokenPath is used. Mutually exclusive with serviceAccountRef.
                        properties:
                          tokenPath:
                            default: /var/run/secrets/openbao/token
                            description: 'Path of a projected ServiceAccount token
                              file with a dedicated audience in the operator pod,
                              so the token sent to OpenBao is not valid against the
                              Kubernetes API server. The automounted token directory
                              (/var/run/secrets/kubernetes.io/serviceaccount/) is
                              refused. Default: /var/run/secrets/openbao/token, where
                              the chart mounts a token with audience openbao-config-operator.'
                            maxLength: 512
                            pattern: ^(/[^/]+)+$
                            type: string
                            x-kubernetes-validations:
                            - message: the automounted ServiceAccount token is a Kubernetes
                                API credential and is never sent to OpenBao
                              rule: '!(self + ''/'').startsWith(''/var/run/secrets/kubernetes.io/serviceaccount/'')'
                        type: object
                      mountPath:
                        default: jwt
                        description: 'Path of the jwt auth mount, without the auth/
                          prefix. Default: jwt. Example: jwt'
                        maxLength: 128
                        pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                        type: string
                      role:
                        description: 'Name of the OpenBao jwt auth role to log in
                          with (the login `role` parameter). Example: openbao-config-operator'
                        minLength: 1
                        type: string
                      serviceAccountRef:
                        description: ServiceAccount, in any namespace, whose short-lived
                          token (TokenRequest) is presented as the JWT. Mutually exclusive
                          with injectedIdentity.
                        properties:
                          name:
                            description: 'Name of the object. Example: openbao-config-operator'
                            minLength: 1
                            type: string
                          namespace:
                            description: 'Kubernetes namespace of the object. Example:
                              openbao-operator'
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - role
                    type: object
                    x-kubernetes-validations:
                    - message: 'audiences require serviceAccountRef: an injected identity
                        token gets its audience from its projected volume'
                      rule: has(self.serviceAccountRef) || !has(self.audiences)
                    - message: 'serviceAccountRef requires audiences: a token without
                        them is valid against the Kubernetes API server'
                      rule: '!has(self.serviceAccountRef) || (has(self.audiences)
                        && size(self.audiences) > 0)'
                    - message: at most one of the fields in [serviceAccountRef injectedIdentity]
                        may be set
                      rule: '[has(self.serviceAccountRef),has(self.injectedIdentity)].filter(x,x==true).size()
                        <= 1'
                  kubernetes:
                    description: 'Log in to an OpenBao kubernetes auth mount (auth/<mountPath>/login)
                      with a ServiceAccount token: a named ServiceAccount''s short-lived
                      token, or the operator''s own injected token.'
                    properties:
                      audiences:
                        description: 'Audiences of the token requested for serviceAccountRef,
                          required with it and only allowed with it; they must match
                          the OpenBao role''s audience. An audience the Kubernetes
                          API server accepts is refused. At most 16 entries. Example:
                          ["openbao"]'
                        items:
                          maxLength: 256
                          minLength: 1
                          type: string
                        maxItems: 16
                        type: array
                      injectedIdentity:
                        description: Present the operator's own ServiceAccount token
                          from a file in its pod. When neither serviceAccountRef nor
                          injectedIdentity is set, injectedIdentity with the default
                          tokenPath is used. Mutually exclusive with serviceAccountRef.
                        properties:
                          tokenPath:
                            default: /var/run/secrets/openbao/token
                            description: 'Path of a projected ServiceAccount token
                              file with a dedicated audience in the operator pod,
                              so the token sent to OpenBao is not valid against the
                              Kubernetes API server. The automounted token directory
                              (/var/run/secrets/kubernetes.io/serviceaccount/) is
                              refused. Default: /var/run/secrets/openbao/token, where
                              the chart mounts a token with audience openbao-config-operator.'
                            maxLength: 512
                            pattern: ^(/[^/]+)+$
                            type: string
                            x-kubernetes-validations:
                            - message: the automounted ServiceAccount token is a Kubernetes
                                API credential and is never sent to OpenBao
                              rule: '!(self + ''/'').startsWith(''/var/run/secrets/kubernetes.io/serviceaccount/'')'
                        type: object
                      mountPath:
                        default: kubernetes
                        description: 'Path of the kubernetes auth mount, without the
                          auth/ prefix. Default: kubernetes. Example: kubernetes'
                        maxLength: 128
                        pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                        type: string
                      role:
                        description: 'Name of the OpenBao kubernetes auth role to
                          log in with (the login `role` parameter). Example: openbao-config-operator'
                        minLength: 1
                        type: string
                      serviceAccountRef:
                        description: ServiceAccount, in any namespace, whose short-lived
                          token (TokenRequest) is presented. Mutually exclusive with
                          injectedIdentity.
                        properties:
                          name:
                            description: 'Name of the object. Example: openbao-config-operator'
                            minLength: 1
                            type: string
                          namespace:
                            description: 'Kubernetes namespace of the object. Example:
                              openbao-operator'
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    required:
                    - role
                    type: object
                    x-kubernetes-validations:
                    - message: 'audiences require serviceAccountRef: an injected identity
                        token gets its audience from its projected volume'
                      rule: has(self.serviceAccountRef) || !has(self.audiences)
                    - message: 'serviceAccountRef requires audiences: a token without
                        them is valid against the Kubernetes API server'
                      rule: '!has(self.serviceAccountRef) || (has(self.audiences)
                        && size(self.audiences) > 0)'
                    - message: at most one of the fields in [serviceAccountRef injectedIdentity]
                        may be set
                      rule: '[has(self.serviceAccountRef),has(self.injectedIdentity)].filter(x,x==true).size()
                        <= 1'
                  token:
                    description: Use an existing OpenBao token from a Secret or a
                      file in the operator pod. Prefer kubernetes or jwt, which need
                      no long-lived credential.
                    properties:
                      filesystem:
                        description: Read the token from a file in the operator pod,
                          such as an OpenBao agent sink, at every login. A missing
                          file sets reason CredentialsNotFound. Mutually exclusive
                          with secretRef.
                        properties:
                          path:
                            description: 'Absolute path of the token file inside the
                              operator pod; never in the automounted ServiceAccount
                              token directory. Example: /var/run/openbao/token'
                            maxLength: 512
                            pattern: ^(/[^/]+)+$
                            type: string
                            x-kubernetes-validations:
                            - message: the automounted ServiceAccount token is a Kubernetes
                                API credential and is never sent to OpenBao
                              rule: '!(self + ''/'').startsWith(''/var/run/secrets/kubernetes.io/serviceaccount/'')'
                        required:
                        - path
                        type: object
                      secretRef:
                        description: Secret key that holds the OpenBao token. Read
                          at each login, so rotation needs no restart; never stored
                          in status. Mutually exclusive with filesystem.
                        properties:
                          key:
                            description: 'Key in the Secret''s data whose value is
                              used. Example: secret-id'
                            minLength: 1
                            type: string
                          name:
                            description: 'Name of the Secret. Example: openbao-operator-approle'
                            minLength: 1
                            type: string
                          namespace:
                            description: 'Kubernetes namespace of the Secret. Example:
                              openbao-operator'
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        - namespace
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of the fields in [secretRef filesystem]
                        must be set
                      rule: '[has(self.secretRef),has(self.filesystem)].filter(x,x==true).size()
                        == 1'
                type: object
                x-kubernetes-validations:
                - message: set exactly one of token, kubernetes, appRole and jwt
                  rule: '[has(self.token), has(self.kubernetes), has(self.appRole),
                    has(self.jwt)].filter(x, x).size() == 1'
              authNamespace:
                description: 'Absolute OpenBao namespace that holds the auth mount
                  used to log in. Unset: log in in the connection''s namespace. "":
                  log in at the root namespace and operate in the child namespace
                  set by namespace. Example: team-a'
                maxLength: 256
                pattern: ^$|^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              namespace:
                description: 'Base OpenBao namespace for every request made through
                  this connection; a resource''s own namespace field is relative to
                  it. Empty means the root namespace. Example: team-a'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              serverRef:
                description: OpenBaoServer to connect to; it supplies the address,
                  CA bundle and limits, and must allow this connection's namespace
                  and token audiences.
                properties:
                  name:
                    description: 'Name of the cluster-scoped OpenBaoServer. Example:
                      openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - auth
            - serverRef
            type: object
          status:
            description: 'Observed state of the connection: server health copied from
              the OpenBaoServer and the login result.'
            properties:
              authenticated:
                description: True when the last login and token lookup (auth/token/lookup-self)
                  succeeded.
                type: boolean
              conditions:
                description: 'Current state as conditions: Ready is True when the
                  server is Ready and login succeeded; otherwise the reason is, for
                  example, ServerNotReady, Sealed, Unreachable, AuthenticationFailed,
                  CredentialsNotFound or ConnectionDenied.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastProbeTime:
                description: When a check last changed this status; checks (about
                  every minute) that find nothing new do not update it.
                format: date-time
                type: string
              observedGeneration:
                description: The metadata.generation of this connection that the operator
                  last checked.
                format: int64
                type: integer
              sealed:
                description: True when the server is sealed or not initialized, copied
                  from the OpenBaoServer status.
                type: boolean
              standby:
                description: True when the probed node is a standby, copied from the
                  OpenBaoServer status.
                type: boolean
              version:
                description: 'OpenBao version, copied from the OpenBaoServer status.
                  Example: 2.7.2'
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
