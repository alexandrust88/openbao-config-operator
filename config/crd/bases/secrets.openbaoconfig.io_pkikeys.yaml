---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pkikeys.secrets.openbaoconfig.io
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
    - openbao
    kind: PKIKey
    listKind: PKIKeyList
    plural: pkikeys
    singular: pkikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "PKIKey manages a private key of a PKI secrets engine at `<mount>/key/<name>`,
          generated in OpenBao, backed by an external key, or imported from a Secret.
          Use it to create a CA key before its issuer, or to keep a key across issuer
          renewals.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t
          \ mountPath: pki-int\n\t  name: int-2026\n\t  type: internal\n\t  keyType:
          ec\n\t  keyBits: 384"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired private key of a PKI secrets engine,
              at `<mountPath>/key/<name>`. The key is generated or imported once;
              afterwards only its name is reconciled. Issuers reference it through
              PKIIssuer key.existing.
            properties:
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: OpenBaoConnection
                    description: 'Kind of the connection: OpenBaoConnection (in the
                      same Kubernetes namespace as this resource) or ClusterOpenBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: OpenBaoConnection.'
                    enum:
                    - OpenBaoConnection
                    - ClusterOpenBaoConnection
                    type: string
                  name:
                    description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  and key holders (mounts, namespaces, KV data, audit devices, endpoints,
                  transit, PKI, SSH CA and TOTP keys, MFA methods, entities) are removed
                  only while the resource carries the annotation openbaoconfig.io/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              externalKeyRef:
                description: 'externalKeyRef is the OpenBao external key used with
                  type kms (`external_key_ref`). Required with kms and allowed only
                  there. Immutable. Example: `hsm-pki-key`.'
                maxLength: 512
                minLength: 1
                type: string
              keyBits:
                description: 'keyBits is the size of a generated key (`key_bits`):
                  2048, 3072, 4096 or 8192 for rsa; 224, 256, 384 or 521 for ec; 44,
                  65 or 87 for mldsa; unused for ed25519. Defaults to 2048 for rsa
                  and 256 for ec. Immutable. Example: `384`.'
                enum:
                - 44
                - 65
                - 87
                - 224
                - 256
                - 384
                - 521
                - 2048
                - 3072
                - 4096
                - 8192
                format: int32
                type: integer
              keyType:
                description: 'keyType is the algorithm of a generated key (`key_type`),
                  type internal or exported only. Defaults to rsa. Immutable. Example:
                  `ec`.'
                enum:
                - rsa
                - ec
                - ed25519
                - mldsa
                type: string
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              mountPath:
                default: pki
                description: 'mountPath is the path of the PKI secrets engine mount.
                  Defaults to `pki`. Immutable. Example: `pki-int`.'
                maxLength: 128
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              name:
                description: 'name is the key name in OpenBao (`key_name`). Defaults
                  to metadata.name; `default` is reserved. Immutable. Example: `int-2026`.'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_]([A-Za-z0-9_.-]*[A-Za-z0-9_])?$
                type: string
              namespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              pemBundleSecretRef:
                description: 'pemBundleSecretRef selects a Secret key holding the
                  PEM private key to import with type import (`pem_bundle`). Read
                  from a Secret key; never stored in status. Sent only when the key
                  is created; keep the Secret while the resource exists. Example:
                  `{name: int-ca-key, key: tls.key}`.'
                properties:
                  key:
                    description: 'Key in the Secret''s data whose value is used. Example:
                      password'
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: 'Name of the Kubernetes Secret, in the same namespace
                      as this resource. Example: openbao-credentials'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              type:
                default: internal
                description: 'type is how the key is created: `internal` (generated,
                  never leaves OpenBao), `exported` (generated and written once to
                  writeSecretRef), `kms` (backed by an OpenBao external key) or `import`
                  (read from pemBundleSecretRef). Defaults to internal. Immutable.'
                enum:
                - internal
                - exported
                - kms
                - import
                type: string
              writeSecretRef:
                description: 'writeSecretRef names the Secret that receives the private
                  key once, with type exported; required there and allowed only there.
                  The Secret is owned by this resource and holds the keys `private_key`
                  and `key_type`; never stored in status. Example: `{name: int-ca-key}`.'
                properties:
                  name:
                    description: 'Name of the referenced object, in the same namespace
                      as this resource. Example: my-app'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: name is immutable
              rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name
                == oldSelf.name)
            - message: type is immutable
              rule: self.type == oldSelf.type
            - message: keyType is immutable
              rule: has(self.keyType) == has(oldSelf.keyType) && (!has(self.keyType)
                || self.keyType == oldSelf.keyType)
            - message: keyBits is immutable
              rule: has(self.keyBits) == has(oldSelf.keyBits) && (!has(self.keyBits)
                || self.keyBits == oldSelf.keyBits)
            - message: externalKeyRef is immutable
              rule: has(self.externalKeyRef) == has(oldSelf.externalKeyRef) && (!has(self.externalKeyRef)
                || self.externalKeyRef == oldSelf.externalKeyRef)
            - message: keyType and keyBits apply only to type internal or exported
              rule: (self.type == 'internal' || self.type == 'exported') || (!has(self.keyType)
                && !has(self.keyBits))
            - message: externalKeyRef is required with type kms and allowed only there
              rule: (self.type == 'kms') == has(self.externalKeyRef)
            - message: pemBundleSecretRef is required with type import and allowed
                only there
              rule: (self.type == 'import') == has(self.pemBundleSecretRef)
            - message: writeSecretRef is required with type exported and allowed only
                there
              rule: (self.type == 'exported') == has(self.writeSecretRef)
            - message: default is a reserved key name
              rule: self.?name.orValue('') != 'default'
            - message: namespace is immutable
              rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__)
                || self.__namespace__ == oldSelf.__namespace__)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: status is the observed state of the PKI key; `id` holds the
              OpenBao key ID.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              namespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
