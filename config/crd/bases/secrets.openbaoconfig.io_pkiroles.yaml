---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: pkiroles.secrets.openbaoconfig.io
spec:
  group: secrets.openbaoconfig.io
  names:
    categories:
    - openbao
    kind: PKIRole
    listKind: PKIRoleList
    plural: pkiroles
    singular: pkirole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "PKIRole manages a certificate role of a PKI secrets engine at
          `<mount>/roles/<name>`: which names, key types, lifetimes and usages certificates
          issued or signed through it (`<mount>/issue/<name>`, `<mount>/sign/<name>`)
          may have.\n\nExample:\n\n\tspec:\n\t  connectionRef:\n\t    name: openbao\n\t
          \ mountPath: pki-int\n\t  name: web-server\n\t  allowedDomains: [example.com]\n\t
          \ allowSubdomains: true\n\t  maxTTL: 2160h"
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'spec is the desired role of a PKI secrets engine at `<mountPath>/roles/<name>`:
              the policy for certificates that clients issue or sign through it (cert-manager,
              ACME or the issue and sign endpoints). Fields left unset take the OpenBao
              default.'
            properties:
              allowAnyName:
                description: allowAnyName allows any common name and DNS SAN (`allow_any_name`).
                  Defaults to false.
                type: boolean
              allowBareDomains:
                description: allowBareDomains allows certificates for the allowed
                  domains themselves (`allow_bare_domains`). Defaults to false.
                type: boolean
              allowGlobDomains:
                description: allowGlobDomains treats allowedDomains entries as glob
                  patterns (`allow_glob_domains`). Defaults to false.
                type: boolean
              allowGlobsInIdentityTemplates:
                description: allowGlobsInIdentityTemplates evaluates glob patterns
                  inside rendered identity templates (`allow_globs_in_identity_templates`).
                  Defaults to false.
                type: boolean
              allowIPSANs:
                description: allowIPSANs allows IP subject alternative names (`allow_ip_sans`).
                  Defaults to true.
                type: boolean
              allowLocalhost:
                description: allowLocalhost allows localhost and localdomain as names
                  (`allow_localhost`). Defaults to true.
                type: boolean
              allowSubdomains:
                description: allowSubdomains allows certificates for subdomains of
                  the allowed domains (`allow_subdomains`). Defaults to false.
                type: boolean
              allowWildcardCertificates:
                description: allowWildcardCertificates allows wildcard names such
                  as `*.example.com` (`allow_wildcard_certificates`). Defaults to
                  true.
                type: boolean
              allowedDomains:
                description: 'allowedDomains are the domains certificates may be issued
                  for (`allowed_domains`), interpreted by the allow flags below. Example:
                  `[example.com]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              allowedDomainsTemplate:
                description: allowedDomainsTemplate allows identity templates in allowedDomains
                  (`allowed_domains_template`). Defaults to false.
                type: boolean
              allowedIPSANsCIDR:
                description: 'allowedIPSANsCIDR limits IP subject alternative names
                  to these networks (`allowed_ip_sans_cidr`), in canonical form (10.0.0.0/8,
                  not 10.1.2.3/8). Example: `[10.0.0.0/8]`.'
                items:
                  maxLength: 64
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: entries must be canonical CIDRs
                  rule: self.all(c, isCIDR(c) && cidr(c) == cidr(c).masked())
              allowedOtherSANs:
                description: 'allowedOtherSANs are the custom subject alternative
                  names allowed, in the form `<oid>;<type>:<value>` (`allowed_other_sans`);
                  `*` allows any. Example: `["1.3.6.1.4.1.311.20.2.3;UTF8:*"]`.'
                items:
                  maxLength: 512
                  pattern: ^[^,]+$
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              allowedSerialNumbers:
                description: 'allowedSerialNumbers are the subject serialNumber values
                  allowed (`allowed_serial_numbers`); globs are supported. Example:
                  `["DEV-*"]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              allowedURISANs:
                description: 'allowedURISANs are the URI subject alternative names
                  allowed (`allowed_uri_sans`); globs are supported. Example: `["spiffe://example.com/*"]`.'
                items:
                  maxLength: 512
                  pattern: ^[^,]+$
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              allowedURISANsTemplate:
                description: allowedURISANsTemplate allows identity templates in allowedURISANs
                  (`allowed_uri_sans_template`). Defaults to false.
                type: boolean
              allowedUserIDs:
                description: 'allowedUserIDs are the subject UID values allowed (`allowed_user_ids`);
                  globs are supported. Example: `[alice]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              basicConstraintsValidForNonCA:
                description: basicConstraintsValidForNonCA marks the basic constraints
                  extension valid on non-CA certificates (`basic_constraints_valid_for_non_ca`).
                  Defaults to false.
                type: boolean
              clientFlag:
                description: clientFlag adds the client authentication extended key
                  usage (`client_flag`). Defaults to true.
                type: boolean
              cnValidations:
                description: 'cnValidations lists the checks applied to the common
                  name (`cn_validations`): email, hostname, or disabled alone. Defaults
                  to email and hostname. Example: `[hostname]`.'
                items:
                  enum:
                  - email
                  - hostname
                  - disabled
                  type: string
                maxItems: 2
                type: array
                x-kubernetes-list-type: set
              codeSigningFlag:
                description: codeSigningFlag adds the code signing extended key usage
                  (`code_signing_flag`). Defaults to false.
                type: boolean
              connectionRef:
                description: Connection used to reach and log in to OpenBao. Immutable.
                properties:
                  kind:
                    default: OpenBaoConnection
                    description: 'Kind of the connection: OpenBaoConnection (in the
                      same Kubernetes namespace as this resource) or ClusterOpenBaoConnection
                      (cluster-scoped; its allowedNamespaces must select this namespace).
                      Default: OpenBaoConnection.'
                    enum:
                    - OpenBaoConnection
                    - ClusterOpenBaoConnection
                    type: string
                  name:
                    description: 'Name of the OpenBaoConnection or ClusterOpenBaoConnection.
                      Example: openbao'
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              country:
                description: 'country is the country of issued certificates (`country`).
                  Example: `[DE]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              creationPolicy:
                default: Create
                description: 'How an object that already exists in OpenBao, and is
                  not yet owned by this resource, is treated. Create (default): create
                  the object; an existing one is refused with reason Conflict. Adopt:
                  take over an existing object and never create one. CreateOrAdopt:
                  create it, or take over an existing one. Settings that always exist
                  in OpenBao (configuration singletons) need Adopt or CreateOrAdopt.'
                enum:
                - Create
                - Adopt
                - CreateOrAdopt
                type: string
              deletionPolicy:
                default: Orphan
                description: 'What happens in OpenBao when this resource is deleted.
                  Orphan (default): the OpenBao object stays. Delete: the object is
                  removed (a configuration singleton is reset to its defaults); data
                  holders such as mounts, namespaces and KV data are removed only
                  while the resource carries the annotation openbaoconfig.io/allow-destructive-delete:
                  "true". Kinds whose OpenBao object cannot be deleted reject Delete.'
                enum:
                - Delete
                - Orphan
                type: string
              driftDetection:
                default: Enabled
                description: 'Whether OpenBao is re-read periodically to detect and
                  repair out-of-band changes. Enabled (default): re-read every driftInterval.
                  Disabled: write only when the spec or a referenced Secret changes.'
                enum:
                - Enabled
                - Disabled
                type: string
              driftInterval:
                description: 'How often OpenBao is re-read for drift, as a duration
                  of at least 30s. Default: the operator''s interval for the kind
                  (15m for kinds that grant access such as policies, auth mounts and
                  roles, 1h for the rest), with jitter. Example: 30m'
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: driftInterval must be at least 30s
                  rule: duration(self) >= duration('30s')
              emailProtectionFlag:
                description: emailProtectionFlag adds the email protection extended
                  key usage (`email_protection_flag`). Defaults to false.
                type: boolean
              enforceHostnames:
                description: enforceHostnames requires names to be valid hostnames
                  (`enforce_hostnames`). Defaults to true.
                type: boolean
              extKeyUsage:
                description: 'extKeyUsage lists additional extended key usages (`ext_key_usage`).
                  Example: `[TimeStamping]`.'
                items:
                  enum:
                  - ServerAuth
                  - ClientAuth
                  - CodeSigning
                  - EmailProtection
                  - IPSECEndSystem
                  - IPSECTunnel
                  - IPSECUser
                  - TimeStamping
                  - OCSPSigning
                  - MicrosoftServerGatedCrypto
                  - NetscapeServerGatedCrypto
                  - MicrosoftCommercialCodeSigning
                  - MicrosoftKernelCodeSigning
                  - Any
                  type: string
                maxItems: 14
                type: array
                x-kubernetes-list-type: set
              extKeyUsageOIDs:
                description: 'extKeyUsageOIDs lists additional extended key usages
                  as OIDs (`ext_key_usage_oids`). Example: `["1.3.6.1.5.5.7.3.8"]`.'
                items:
                  maxLength: 128
                  pattern: ^[0-9]+(\.[0-9]+)+$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              generateLease:
                description: generateLease attaches a lease to issued certificates
                  so they are revoked when the lease ends (`generate_lease`); requires
                  noStore unset. Defaults to false.
                type: boolean
              issuer:
                description: 'issuer selects the issuer that signs certificates of
                  this role (`issuer_ref`). Defaults to the mount''s default issuer.
                  Example: `{issuerRef: {name: int-2026}}`.'
                properties:
                  issuerName:
                    description: 'issuerName is the name or ID of the issuer in OpenBao.
                      Example: `int-2026`.'
                    maxLength: 128
                    minLength: 1
                    type: string
                  issuerRef:
                    description: 'issuerRef names a PKIIssuer in the same namespace
                      and PKI mount; it must be Ready. Example: `{name: int-2026}`.'
                    properties:
                      name:
                        description: 'Name of the referenced object, in the same namespace
                          as this resource. Example: my-app'
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of issuerName and issuerRef
                  rule: has(self.issuerName) != has(self.issuerRef)
              keyBits:
                description: 'keyBits is the key size required of the certificate
                  key (`key_bits`): 2048, 3072, 4096 or 8192 for rsa; 224, 256, 384
                  or 521 for ec; 44, 65 or 87 for mldsa. Not for ed25519 or any. Defaults
                  to 2048 for rsa, 256 for ec and 44 for mldsa.'
                enum:
                - 44
                - 65
                - 87
                - 224
                - 256
                - 384
                - 521
                - 2048
                - 3072
                - 4096
                - 8192
                format: int32
                type: integer
              keyType:
                description: 'keyType is the algorithm required of the certificate
                  key (`key_type`); `any` accepts every type. Allowed: rsa, ec, ed25519,
                  mldsa, any. Defaults to rsa.'
                enum:
                - rsa
                - ec
                - ed25519
                - mldsa
                - any
                type: string
              keyUsage:
                description: 'keyUsage lists the key usages of issued certificates
                  (`key_usage`). Defaults to DigitalSignature, KeyAgreement and KeyEncipherment.
                  Example: `[DigitalSignature, KeyEncipherment]`.'
                items:
                  enum:
                  - DigitalSignature
                  - ContentCommitment
                  - KeyEncipherment
                  - DataEncipherment
                  - KeyAgreement
                  - CertSign
                  - CRLSign
                  - EncipherOnly
                  - DecipherOnly
                  type: string
                maxItems: 9
                type: array
                x-kubernetes-list-type: set
              locality:
                description: 'locality is the locality (city) of issued certificates
                  (`locality`). Example: `[Berlin]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              managementPolicy:
                default: Manage
                description: 'Whether the operator writes to OpenBao. Manage (default):
                  converge OpenBao to the spec, create and delete as the policies
                  say. Observe: only read the object and report drift in the conditions;
                  never write or delete.'
                enum:
                - Manage
                - Observe
                type: string
              maxTTL:
                description: 'maxTTL is the longest validity period a request may
                  ask for (`max_ttl`), a duration. Defaults to the mount''s max lease
                  TTL. Example: `2160h`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              mountPath:
                default: pki
                description: 'mountPath is the path of the PKI secrets engine mount.
                  Defaults to `pki`. Immutable. Example: `pki-int`.'
                maxLength: 128
                pattern: ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$
                type: string
              name:
                description: 'name is the role name in OpenBao. Defaults to metadata.name.
                  Immutable. Example: `web-server`.'
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_]([A-Za-z0-9_.-]*[A-Za-z0-9_])?$
                type: string
              namespace:
                description: 'OpenBao namespace of the object, relative to the connection''s
                  base namespace; empty means the connection namespace itself. Segments
                  are separated by "/", without leading or trailing slash. Immutable:
                  it cannot be added, changed or removed after creation. Example:
                  team-a/apps'
                maxLength: 256
                pattern: ^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
                type: string
              noStore:
                description: noStore skips storing issued certificates (`no_store`),
                  which then cannot be listed or revoked by serial. Defaults to false.
                type: boolean
              notAfter:
                description: 'notAfter sets a fixed expiry on issued certificates,
                  as a UTC timestamp (`not_after`). Example: `2027-01-01T00:00:00Z`.'
                pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
                type: string
              notAfterBound:
                description: 'notAfterBound controls whether requests may set not_after
                  (`not_after_bound`): `permit`, `ttl-limited`, `forbid`, or a UTC
                  timestamp no certificate may exceed. Defaults to permit. Example:
                  `ttl-limited`.'
                pattern: ^(permit|ttl-limited|forbid|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)$
                type: string
              notBefore:
                description: 'notBefore sets a fixed not-before time on issued certificates,
                  as a UTC timestamp (`not_before`). Example: `2026-01-01T00:00:00Z`.'
                pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
                type: string
              notBeforeBound:
                description: 'notBeforeBound controls whether requests may set not_before
                  (`not_before_bound`): `permit`, `duration` (only through not_before_duration)
                  or `forbid`. Defaults to permit.'
                enum:
                - permit
                - duration
                - forbid
                type: string
              notBeforeDuration:
                description: notBeforeDuration backdates issued certificates (`not_before_duration`),
                  a duration. Defaults to `30s`.
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              organization:
                description: 'organization is the organization of issued certificates
                  (`organization`). Example: `[Example Corp]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              ou:
                description: 'ou is the organizational unit of issued certificates
                  (`ou`). Example: `[Platform]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              policyIdentifiers:
                description: 'policyIdentifiers are certificate policy OIDs added
                  to issued certificates (`policy_identifiers`). Example: `["1.3.6.1.4.1.44947.1.1.1"]`.'
                items:
                  maxLength: 128
                  pattern: ^[0-9]+(\.[0-9]+)+$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: set
              postalCode:
                description: 'postalCode is the postal code of issued certificates
                  (`postal_code`). Example: `["10115"]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              province:
                description: 'province is the province (state) of issued certificates
                  (`province`). Example: `[Berlin]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              requireCN:
                description: requireCN rejects requests without a common name (`require_cn`).
                  Defaults to true.
                type: boolean
              serverFlag:
                description: serverFlag adds the server authentication extended key
                  usage (`server_flag`). Defaults to true.
                type: boolean
              signatureBits:
                description: 'signatureBits selects the signature hash (`signature_bits`).
                  Allowed: 256, 384, 512. Unset lets OpenBao pick one from the issuer
                  key.'
                enum:
                - 256
                - 384
                - 512
                format: int32
                type: integer
              streetAddress:
                description: 'streetAddress is the street address of issued certificates
                  (`street_address`). Example: `[Main Street 1]`.'
                items:
                  maxLength: 256
                  pattern: ^[^,]+$
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: set
              ttl:
                description: 'ttl is the default validity period of issued certificates
                  (`ttl`), a duration. Must not exceed maxTTL. Defaults to the mount''s
                  default lease TTL. Example: `720h`.'
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+)$
                type: string
              useCSRCommonName:
                description: useCSRCommonName takes the common name from the CSR when
                  signing (`use_csr_common_name`). Defaults to true.
                type: boolean
              useCSRSANs:
                description: useCSRSANs takes the subject alternative names from the
                  CSR when signing (`use_csr_sans`). Defaults to true.
                type: boolean
              usePSS:
                description: usePSS signs with RSASSA-PSS when the issuer key is rsa
                  (`use_pss`). Defaults to false.
                type: boolean
            required:
            - connectionRef
            type: object
            x-kubernetes-validations:
            - message: mountPath is immutable
              rule: has(self.mountPath) == has(oldSelf.mountPath) && (!has(self.mountPath)
                || self.mountPath == oldSelf.mountPath)
            - message: name is immutable
              rule: has(self.name) == has(oldSelf.name) && (!has(self.name) || self.name
                == oldSelf.name)
            - message: ttl must not exceed maxTTL
              rule: '!has(self.ttl) || !has(self.maxTTL) || duration(self.maxTTL)
                == duration(''0s'') || duration(self.ttl) <= duration(self.maxTTL)'
            - message: keyBits must be 2048, 3072, 4096 or 8192 for keyType rsa (the
                default), 224, 256, 384 or 521 for ec, 44, 65 or 87 for mldsa, and
                is not allowed for ed25519 or any
              rule: '!has(self.keyBits) || (self.?keyType.orValue(''rsa'') == ''rsa''
                ? self.keyBits in [2048, 3072, 4096, 8192] : self.?keyType.orValue(''rsa'')
                == ''ec'' ? self.keyBits in [224, 256, 384, 521] : self.?keyType.orValue(''rsa'')
                == ''mldsa'' && self.keyBits in [44, 65, 87])'
            - message: generateLease requires the certificate to be stored; unset
                noStore
              rule: '!(self.?generateLease.orValue(false) && self.?noStore.orValue(false))'
            - message: namespace is immutable
              rule: has(self.__namespace__) == has(oldSelf.__namespace__) && (!has(self.__namespace__)
                || self.__namespace__ == oldSelf.__namespace__)
            - message: connectionRef is immutable
              rule: self.connectionRef == oldSelf.connectionRef
          status:
            description: status is the observed state of the PKI role.
            properties:
              acquired:
                description: 'How the operator came to own the object: Created (it
                  created it) or Adopted (it took over an existing one). Empty until
                  owned.'
                type: string
              conditions:
                description: 'Current state as conditions: Ready (the OpenBao object
                  matches the spec) and Synced (the last reconcile succeeded), each
                  with a reason such as Available, Drifted, Conflict, ConnectionNotReady
                  or PermissionDenied, and the generation it describes.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: 'Identifier OpenBao generated for the object (an entity,
                  group or alias ID, or a mount accessor), for kinds that have one;
                  other resources reference it. Example: 6c9f3e0a-1b2c-4d5e-8f90-123456789abc'
                type: string
              namespace:
                description: 'Absolute OpenBao namespace the object was written in;
                  empty means the root namespace. If it later differs from the spec,
                  reconciling stops with reason NamespaceChanged. Example: team-a/apps'
                type: string
              observedGeneration:
                description: The metadata.generation of this resource that the operator
                  last reconciled.
                format: int64
                type: integer
              path:
                description: 'Full OpenBao API path of the object, including its namespace,
                  as last written; deletion uses it even after the spec changed. Example:
                  team-a/sys/policies/acl/app-read'
                type: string
              rotationNonce:
                description: Value of the resource's rotation nonce when one-time
                  inputs, such as a root credential that OpenBao rotates afterwards,
                  were last sent; changing the nonce in the spec sends them again.
                type: string
              serverID:
                description: 'Cluster ID of the OpenBao server the object was acquired
                  on. If the connection later reaches another server, reconciling
                  stops with reason ServerChanged and nothing is written or deleted.
                  Example: 80f7de92-c12e-e960-4754-255c32fc6b53'
                type: string
              writeOnlyHash:
                description: Keyed hash (HMAC-SHA256) of the write-only inputs, such
                  as passwords read from Secrets; a change forces a write. It never
                  contains or reveals the values.
                type: string
            type: object
        required:
        - spec
        type: object
