    app.kubernetes.io/name: openbao-config-operator
    app.kubernetes.io/managed-by: kustomize
  name: policy-sample
spec:
  connectionRef:
    kind: OpenBaoConnection
    name: openbaoconnection-sample
  policy: |
    path "secret/data/sample/*" {
      capabilities = ["read"]
    }
