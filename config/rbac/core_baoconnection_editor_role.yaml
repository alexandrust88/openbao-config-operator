# This rule is not used by the project openbao-config-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the core.obco.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: openbao-config-operator
    app.kubernetes.io/managed-by: kustomize
  name: core-baoconnection-editor-role
rules:
- apiGroups:
  - core.obco.dev
  resources:
  - baoconnections
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.obco.dev
  resources:
  - baoconnections/status
  verbs:
  - get
