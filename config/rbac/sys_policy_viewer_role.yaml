# This rule is not used by the project openbao-config-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to sys.openbaoconfig.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: openbao-config-operator
    app.kubernetes.io/managed-by: kustomize
  name: sys-policy-viewer-role
rules:
- apiGroups:
  - sys.openbaoconfig.io
  resources:
  - policies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sys.openbaoconfig.io
  resources:
  - policies/status
  verbs:
  - get
