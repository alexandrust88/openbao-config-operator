# This rule is not used by the project openbao-config-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions over core.openbaoconfig.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: openbao-config-operator
    app.kubernetes.io/managed-by: kustomize
  name: core-clusteropenbaoconnection-admin-role
rules:
- apiGroups:
  - core.openbaoconfig.io
  resources:
  - clusteropenbaoconnections
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.openbaoconfig.io
  resources:
  - clusteropenbaoconnections/status
  verbs:
  - get
